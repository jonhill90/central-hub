# Ported from hosts/ansible/roles/k8s_secrets/templates/store.yaml.j2 (role k8s_secrets).
# The namespace the store reads from. Only cluster admins write here: seed each Secret by hand from
# the password manager, named <app>-<field> so the move to a vault later maps one to one (RB-0012).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sourceNamespace }}
  annotations:
    # The Secrets seeded by hand live here; deleting the namespace would lose them.
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The store's own identity; ESO won't use its own service account for this provider, by design.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-{{ .Values.storeName }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: store-{{ .Values.storeName }}-read
  namespace: {{ .Values.sourceNamespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: store-{{ .Values.storeName }}-read
  namespace: {{ .Values.sourceNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: store-{{ .Values.storeName }}-read
subjects:
  - kind: ServiceAccount
    name: store-{{ .Values.storeName }}
    namespace: {{ .Release.Namespace }}
---
# The only object that names a backend. Swapping the backend replaces this object; every
# ExternalSecret and every app Secret keeps its name (RB-0012 exit path).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.sourceNamespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: store-{{ .Values.storeName }}
          namespace: {{ .Release.Namespace }}
