# Ported unchanged from hosts/ansible/roles/k8s_jellyfin/templates/jellyfin.yaml.j2, so Argo CD's
# first diff against the running objects is empty. Recreate, because a ReadWriteOnce volume on one
# node can't be held by two pods while a rolling update runs.
{{- $v := .Values }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    # Deleting the namespace would delete the claims in it.
    argocd.argoproj.io/sync-options: Delete=false
{{- range $claim := list (dict "suffix" "config" "size" $v.storage.configSize) (dict "suffix" "media" "size" $v.storage.mediaSize) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $v.name }}-{{ $claim.suffix }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Never delete the data, even if the Application or this chart goes away.
    argocd.argoproj.io/sync-options: Delete=false
    helm.sh/resource-policy: keep
spec:
  {{- with $v.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $claim.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: jellyfin}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: jellyfin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jellyfin}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $v.uid }}
        runAsGroup: {{ $v.uid }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: jellyfin
          image: {{ $v.image }}
          ports:
            - {name: http, containerPort: {{ $v.port }}}
          startupProbe:
            httpGet: {path: {{ $v.healthPath }}, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: {{ $v.healthPath }}, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: {{ $v.healthPath }}, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: {{ $v.resources.requests.cpu }}, memory: {{ $v.resources.requests.memory }}}
            limits: {memory: {{ $v.resources.limits.memory }}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cache, mountPath: /cache}
            - {name: media, mountPath: /media}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: {{ $v.name }}-config}
        - name: media
          persistentVolumeClaim: {claimName: {{ $v.name }}-media}
        - name: cache
          emptyDir: {sizeLimit: {{ $v.storage.cacheLimit }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: jellyfin}
  ports:
    - {name: http, port: {{ $v.port }}, targetPort: http}
