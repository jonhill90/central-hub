# Ported from hosts/ansible/roles/k8s_app_route/templates/route.yaml.j2: TLS ends at the shared
# Gateway's https listener; plain http for the same name gets a 301 to https.
{{- $v := .Values }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ include "jellyfin.host" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $v.name }}
          port: {{ $v.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: http
  hostnames:
    - {{ include "jellyfin.host" . }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
