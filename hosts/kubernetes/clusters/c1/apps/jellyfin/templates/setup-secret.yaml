{{- if .Values.setup.enabled }}
# The admin password, made once inside the cluster by External Secrets (generator Password) and
# never changed after (refreshPolicy CreatedOnce). Letters and digits only, so it is safe in JSON
# and on any login form. To read it: see docs/runbooks/jellyfin.md, "Sign in".
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.name }}-admin
  namespace: {{ .Release.Namespace }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.name }}-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: {{ .Values.setup.adminUser | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.name }}-admin
{{- end }}
