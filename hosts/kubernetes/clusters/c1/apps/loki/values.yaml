# Loki on c1, monolithic, logs on a 20Gi claim from the default StorageClass. The same values the
# Ansible role k8s_observability gave Helm (vars/main.yml, k8s_observability_loki_values), with its
# defaults filled in: retention 168h, volume 20Gi, no StorageClass named.
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: "2026-10-27"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config: {retention_period: 168h}
  compactor: {retention_enabled: true, delete_request_store: filesystem}
singleBinary:
  replicas: 1
  persistence: {enabled: true, size: 20Gi}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
# Monolithic only: the other targets at 0, and none of the extras a small lab doesn't need.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
