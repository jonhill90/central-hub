# Ported from hosts/ansible/roles/k8s_gateway/templates/gateway.yaml.j2. The node firewall ports
# for the listeners stay with Ansible (k8s_gateway, tag gateway): they are the machines.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    # The certificate's Secret lives here; deleting the namespace would take HTTPS down.
    argocd.argoproj.io/sync-options: Delete=false
---
# One shared Gateway for the cluster's web apps. HTTP on 80, and with https HTTPS on 443 with the
# wildcard certificate. Its address comes from Cilium LB IPAM, pinned with spec.addresses.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.className }}
  addresses:
    - type: IPAddress
      value: {{ required "address: set by the root Application (k8s_gitops_source_gateway_address)" .Values.address }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.{{ include "gateway.domain" . }}"
      allowedRoutes:
        namespaces:
          from: All
{{- if .Values.https }}
    # TLS ends here (mode Terminate) with the certificate Secret next to the Gateway.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.{{ include "gateway.domain" . }}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- if .Values.shortNames }}
    # Short aliases <app>.<zone> (STD-0001 rule 5). A listener hostname *.<zone> is a suffix match
    # (Gateway API, Listener.hostname), so a route attaches here with its short name only; each
    # long name keeps the listener above, the more specific one.
    - name: http-short
      protocol: HTTP
      port: 80
      hostname: "*.{{ .Values.zone }}"
      allowedRoutes:
        namespaces:
          from: All
{{- if .Values.https }}
    - name: https-short
      protocol: HTTPS
      port: 443
      hostname: "*.{{ .Values.zone }}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
