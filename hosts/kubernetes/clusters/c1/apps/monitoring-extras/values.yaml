# What c1 watches beyond kube-prometheus-stack's built-in rules and dashboards. Prometheus reads
# every ServiceMonitor and rule in the cluster (kube-prometheus-stack values, *NilUsesHelmValues
# false), and Grafana's sidecar loads every ConfigMap labelled grafana_dashboard: "1".
# Alertmanager is off until a receiver is picked, so firing alerts show in Grafana (Alerting) and
# in Prometheus's Alerts page only.

argocd:
  namespace: argocd   # where Argo CD runs (role k8s_gitops)

# The data disk every volume lives on (role k8s_storage, k8s_storage_mount).
dataMount: /var/lib/c1-data
dataFreeWarnRatio: 0.15
