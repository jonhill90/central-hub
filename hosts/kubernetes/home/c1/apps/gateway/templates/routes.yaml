# Ported from hosts/ansible/roles/k8s_app_route/templates/route.yaml.j2: TLS ends at the Gateway's
# https listener; plain http for the same name gets a 301 to https. With https off (a cluster with
# no certificate), the route serves on the http listeners and there is no redirect.
{{- $section := ternary "https" "http" (eq (toString .Values.https) "true") }}
{{- range $name, $r := .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $r.namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: {{ $section }}
{{- if $.Values.shortNames }}
    - name: {{ $.Values.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: {{ $section }}-short
{{- end }}
  hostnames:
    - {{ $name }}.{{ include "gateway.domain" $ }}
{{- if $.Values.shortNames }}
    - {{ $name }}.{{ $.Values.zone }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $r.service }}
          port: {{ $r.port }}
{{- if eq $section "https" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-redirect
  namespace: {{ $r.namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: http
{{- if $.Values.shortNames }}
    - name: {{ $.Values.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: http-short
{{- end }}
  hostnames:
    - {{ $name }}.{{ include "gateway.domain" $ }}
{{- if $.Values.shortNames }}
    - {{ $name }}.{{ $.Values.zone }}
{{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
