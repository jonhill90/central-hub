# The shared Gateway and the routes of apps whose own charts make none. The same inputs as the
# Ansible roles k8s_gateway and k8s_app_route. Two values are private and come only from the root
# Application, which Ansible sets from the inventory (CLAUDE.md rule 4):
zone: ""      # the DNS zone; names are <app>.apps.c1.prod.<zone>
address: ""   # the Gateway's address from Cilium LB IPAM (STD-0002 VLAN 10 .224/27)

name: apps
className: cilium
appsDomain: apps.c1.prod
# HTTPS on 443 with the wildcard certificate cert-manager issues into tlsSecret (k8s_certs). The
# HTTP listener on 80 stays; each route below redirects it to HTTPS.
https: true
tlsSecret: apps-tls
# Short aliases <app>.<zone> (STD-0001 rule 5): listeners http-short and https-short for *.<zone>,
# and each route below also answers on <key>.<zone>. Same as k8s_gateway_short_names.
shortNames: true
# The dev-only measurement (MEASURE-1, root value openbaoMeasure): true lets ListenerSets in namespace
# openbao attach to this Gateway (spec.allowedListeners), for the measurement's passthrough listener.
openbaoMeasure: false

# One HTTPRoute (https) plus a redirect route (http) per entry: <key>.apps.c1.prod.<zone>, and
# <key>.<zone> with shortNames on, to the Service. Same shape as role k8s_app_route.
routes:
  grafana: {namespace: monitoring, service: kube-prometheus-stack-grafana, port: 80}
  ntfy: {namespace: alerts, service: ntfy, port: 80}

# The name check (templates/name-check.yaml): every half hour, at :15 and :45, a pod in this namespace
# opens https://<app>.<zone>/ and https://<app>.apps.c1.prod.<zone>/ through this Gateway, checks
# the certificate against the lab CA in tlsSecret's ca.crt, and prints one line per name. An agent
# reads it with the read-only account (c1-read logs -n gateway job/<newest name-check job>), so the
# names are proven from inside c1 with no browser and no route from the agent box to prod's 443.
nameCheck:
  enabled: true
  schedule: "15,45 * * * *"
  # The apps on the shared Gateway, by route key, whether this chart or the app's own chart makes the route.
  apps: [grafana, argocd, sso, jellyfin, ntfy]
  image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
