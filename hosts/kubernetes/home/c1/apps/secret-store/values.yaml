# The one store every ExternalSecret names, and the locked namespace it reads from. The same inputs
# as the Ansible role k8s_secrets (defaults/main.yml). The Secrets in the source namespace are
# seeded by hand; none are in git.
storeName: c1
sourceNamespace: secret-source
# The secrets store, OpenBao inside the cluster (D-0058), dev's cluster first. The root chart passes
# true from its openbaoInCluster (switchParameters); false, as on c1, renders no `openbao` store.
openbao:
  inCluster: false
  # OpenBao's Service in namespace openbao (the openbao app); TLS from that namespace's own CA,
  # read from the server certificate's Secret (the openbao-store app).
  address: https://openbao.openbao.svc:8200
  caSecret: openbao-tls
  caNamespace: openbao
  # OpenBao's Kubernetes login and its role for External Secrets (D-0058 rule 5).
  authPath: kubernetes
  role: eso
  # One non-secret test value the store side writes, read by one ExternalSecret to prove the store
  # syncs (D-0038 Confirmation 2). Every other ExternalSecret keeps naming store `c1` until then.
  checkKey: c1/check
