# What c1 watches beyond kube-prometheus-stack's built-in rules and dashboards. Prometheus reads
# every ServiceMonitor and rule in the cluster (kube-prometheus-stack values, *NilUsesHelmValues
# false), and Grafana's sidecar loads every ConfigMap labelled grafana_dashboard: "1".
# Alertmanager sends firing alerts to ntfy (app alerts).

argocd:
  namespace: argocd   # where Argo CD runs (role k8s_gitops)

certManager:
  namespace: cert-manager   # where cert-manager runs (app cert-manager)
  # A renewal is overdue this many seconds after cert-manager's planned renewal time. Let's
  # Encrypt certificates renew 30 days before expiry, so 2 days late still leaves 28.
  renewalOverdueSeconds: 172800

# Alertmanager's ntfy token (pick 171): the store and the source Secret's name in secret-source.
ntfy:
  store: c1
  alertmanagerTokenSource: ntfy-alertmanager-token

# Healthchecks.io ping URL for c1's heartbeat (pick 213): the store and the source Secret's name
# in secret-source.
heartbeat:
  store: c1
  pingUrlSource: healthchecks-ping-url

# The data disk every volume lives on (role k8s_storage, k8s_storage_mount).
dataMount: /var/lib/c1-data
dataFreeWarnRatio: 0.15
