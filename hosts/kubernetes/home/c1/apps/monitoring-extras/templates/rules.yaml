# c1's own alerts: the things a person notices only when an app stops working.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: c1-lab
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: c1-gitops
      rules:
        - alert: C1ArgoAppNotSynced
          expr: max by (name) (argocd_app_info{sync_status!="Synced"}) == 1
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Argo CD Application {{ "{{" }} $labels.name {{ "}}" }} has not matched git for 30 minutes"
            runbook: docs/runbooks/README.md (the component's move-*-to-argo-cd.md)
        - alert: C1ArgoAppUnhealthy
          expr: max by (name, health_status) (argocd_app_info{health_status!~"Healthy|Progressing"}) == 1
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: "Argo CD Application {{ "{{" }} $labels.name {{ "}}" }} is {{ "{{" }} $labels.health_status {{ "}}" }}"
        - alert: C1ArgoCDNotScraped
          expr: absent(up{namespace="{{ .Values.argocd.namespace }}", service="argocd-metrics"} == 1)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Prometheus can't read Argo CD's metrics, so the two alerts above can't fire
    - name: c1-alerting
      rules:
        - alert: C1AlertsNotDelivered
          expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[15m]) > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Alertmanager could not deliver alerts to ntfy; check the alerts app (runbook get-c1-alerts-on-your-phone.md)
    # Certificates for app names (pick 78): the Cloudflare token may be limited to the home's
    # public address, so a changed address shows up here as renewals that stop.
    - name: c1-certificates
      rules:
        - alert: C1CertificateRenewalOverdue
          expr: |
            time() - max by (exported_namespace, name) (certmanager_certificate_renewal_timestamp_seconds)
              > {{ .Values.certManager.renewalOverdueSeconds }}
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "Certificate {{ "{{" }} $labels.exported_namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} should have renewed more than 2 days ago; check its CertificateRequest and the Cloudflare token's address limit"
            runbook: docs/runbooks/issue-c1-app-certificate.md
        - alert: C1CertificateNotReady
          expr: max by (exported_namespace, name) (certmanager_certificate_ready_status{condition!="True"}) == 1
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "Certificate {{ "{{" }} $labels.exported_namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} has not been Ready for an hour"
        - alert: C1CertManagerNotScraped
          expr: absent(up{namespace="{{ .Values.certManager.namespace }}", service="cert-manager"} == 1)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Prometheus can't read cert-manager's metrics, so the two certificate alerts above can't fire
    - name: c1-storage
      rules:
        - alert: C1DataDiskFillingUp
          expr: |
            node_filesystem_avail_bytes{mountpoint="{{ .Values.dataMount }}"}
              / node_filesystem_size_bytes{mountpoint="{{ .Values.dataMount }}"} < {{ .Values.dataFreeWarnRatio }}
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "The data disk on {{ "{{" }} $labels.instance {{ "}}" }} has less than {{ mulf .Values.dataFreeWarnRatio 100 }}% free; every volume lives there"
    - name: c1-apps
      rules:
        - alert: C1JellyfinDown
          expr: kube_deployment_status_replicas_available{namespace="{{ .Values.jellyfin.namespace }}", deployment="jellyfin"} < 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Jellyfin has no ready pod
{{- if .Values.jellyfin.metrics }}
        - alert: C1JellyfinNotScraped
          expr: absent(up{namespace="{{ .Values.jellyfin.namespace }}", container="jellyfin"} == 1)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Prometheus can't read Jellyfin's /metrics; check that the setup Job turned EnableMetrics on
            runbook: docs/runbooks/move-jellyfin-to-argo-cd.md
        - alert: C1JellyfinErrors
          expr: sum(rate(http_requests_received_total{namespace="{{ .Values.jellyfin.namespace }}", code=~"5.."}[15m])) > {{ .Values.jellyfin.errorRatePerSecond }}
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Jellyfin has answered with server errors (5xx) for 15 minutes
            runbook: docs/runbooks/move-jellyfin-to-argo-cd.md
{{- end }}
        - alert: C1LokiDown
          expr: kube_statefulset_status_replicas_ready{namespace="logging", statefulset="loki"} < 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Loki has no ready pod, so new logs are being lost
        - alert: C1PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[30m]) > 5
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} restarted more than 5 times in 30 minutes"
{{- if eq (toString .Values.openbao.inCluster) "true" }}
    # OpenBao inside the cluster (D-0058). Its readiness check is `bao status`, which fails while it is
    # sealed, and a sealed pod also loses the openbao-active label the scrape selects, so "not ready"
    # and "not scraped" are how a seal shows up; the seal gauge covers a scraped pod that is sealed.
    - name: c1-openbao
      rules:
        - alert: C1OpenBaoNotReady
          expr: kube_statefulset_status_replicas_ready{namespace="{{ .Values.openbao.namespace }}", statefulset="openbao"} < 1
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: OpenBao has no ready pod for 10 minutes, so it is sealed or down and apps can't read their secrets
            runbook: docs/runbooks/set-up-the-secrets-store.md
        - alert: C1OpenBaoSealed
          expr: max(vault_core_unsealed{namespace="{{ .Values.openbao.namespace }}"}) < 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: OpenBao answers but is sealed
            runbook: docs/runbooks/set-up-the-secrets-store.md
        - alert: C1OpenBaoNotScraped
          expr: absent(up{namespace="{{ .Values.openbao.namespace }}", service="openbao-active"} == 1)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Prometheus can't read OpenBao's metrics, so the seal and audit alerts can't fire
        - alert: C1OpenBaoAuditFailing
          expr: increase(vault_audit_log_request_failure{namespace="{{ .Values.openbao.namespace }}"}[15m]) > 0
          labels: {severity: critical}
          annotations:
            summary: OpenBao failed to write its audit log; it refuses requests it can't audit
        - alert: C1OpenBaoSnapshotStale
          expr: |
            time() - max(kube_cronjob_status_last_successful_time{namespace="{{ .Values.openbao.namespace }}", cronjob="openbao-snapshot"})
              > {{ .Values.openbao.snapshotStaleSeconds }}
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "OpenBao's hourly snapshot has not succeeded for more than {{ div .Values.openbao.snapshotStaleSeconds 3600 }} hours"
            runbook: docs/runbooks/set-up-the-secrets-store.md
{{- end }}
