# What OpenBao's own chart (the openbao app) lacks, made one wave before it (D-0058; DESIGN
# section 2). Made only where the root value openbaoInCluster is true: dev's cluster first.

# The node that holds the seal key's folder, private (CLAUDE.md rule 4): the root chart passes it
# from its root value openbaoSealNode. Empty: no PersistentVolume is made, so the claim stays
# Pending and OpenBao's pod waits; nothing starts without its key.
sealNode: ""
# The lab DNS zone, private, from the root Application. Used only with measure (below).
zone: ""
# The dev-only measurement (MEASURE-1, root value openbaoMeasure): true adds openbao-pass.<zone>, the
# passthrough route's host, to the store's certificate, so the box can check it by name.
measure: false
# The store's name as the agent box reaches it (root value openbaoStoreHost, from
# k8s_gitops_source_openbao_store_host), private. Set: templates/box-path.yaml gives the box its
# path through Gateway apps, a TLS passthrough listener for this name on 443 to OpenBao's Service,
# and the store's certificate carries the name, so TLS ends at OpenBao and the box checks the store's
# own CA. Empty: no path.
boxHost: ""
# The store's admin address (root value openbaoAdminAddress, from k8s_gitops_source_openbao_admin_address),
# private: one address of c1's load-balancer pool, not its first or last. Set: templates/admin-path.yaml
# gives the box a path on which OpenBao sees the box's own address, so the admin AppRole's /32 binding
# passes: a LoadBalancer Service on it, announced from the seal node only, and a NetworkPolicy for
# boxCidr. It needs sealNode and boxCidr. Empty: no admin path. openbao-store does not prune, so
# emptying it later leaves the three objects until they are deleted.
adminAddress: ""
# The agent box's address as a /32 (root value openbaoBoxCidr), private: the one source the admin path's
# NetworkPolicy lets in. Used only with adminAddress.
boxCidr: ""
# The shared Gateway the box path attaches to (apps/gateway).
gateway:
  name: apps
  namespace: gateway
# The seal key's folder on that node (D-0058 rule 3). The agent box's node play writes the key there
# (owner uid 100, group 1000, mode 0400, as OpenBao's pod runs), and nothing else: the admin
# AppRole's IDs stay in the box's keys folder (D-0038 rule 6). The folder is outside what c1's nightly backup copies (role k8s_backup copies only
# /var/lib/c1-data/local-path, where OpenBao's data volume is, and /var/lib/central-hub/identity-postgres),
# so c1's nightly backup never holds the key with the data (D-0038 rule 4). Proxmox's nightly backup
# of the node VMs does hold both (D-0058, Consequences).
sealPath: /var/lib/central-hub/openbao-seal
sealSize: 1Mi
# Which kv/<env>/snapshot-mark the snapshot login may read (DESIGN section 6): the root chart passes the cluster's env
# label (openbaoMarkEnv), dev or prod; dev when unset.
markEnv: dev
# The hourly Raft snapshot (D-0058 rule 6; DESIGN section 6): a CronJob in this namespace that signs
# in with OpenBao's Kubernetes login, role snapshot, and keeps the newest `keep` snapshots on a claim
# of its own. It skips, and exits 0, while the store holds no snapshot mark, so it never snapshots a
# store that has only self-initialized. The box's hourly off-site pull is separate (pick 237).
snapshot:
  schedule: "17 * * * *"
  keep: 48
  size: 2Gi
  storageClass: local-path
  # OpenBao's own image, for its `bao` CLI; the same version the openbao app runs (v2.7.2), by digest.
  image: quay.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
  address: https://openbao.openbao.svc:8200
