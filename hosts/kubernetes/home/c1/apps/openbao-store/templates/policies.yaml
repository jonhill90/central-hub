# The policy files OpenBao's first start reads (self-init, apps/openbao/values.yaml), mounted
# read-only at /openbao/userconfig/openbao-policies/. Self-init runs only once, so a later change
# goes through the agent box's admin login.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-policies
  namespace: {{ .Release.Namespace }}
data:
  admin.hcl: |
{{ .Files.Get "policies/admin.hcl" | indent 4 }}
  eso-c1.hcl: |
{{ .Files.Get "policies/eso-c1.hcl" | indent 4 }}
  snapshot.hcl: |
{{ tpl (.Files.Get "policies/snapshot.hcl") . | indent 4 }}
  bootstrap.hcl: |
{{ .Files.Get "policies/bootstrap.hcl" | indent 4 }}
---
# The account the box mints one short token for, once, to hand the admin login over (policy
# bootstrap). No pod runs as it, and it mounts no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-bootstrap
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
