{{- /*
TLS on OpenBao's listener from the namespace's own CA, made by cert-manager: a self-signed Issuer
signs the CA, the CA Issuer signs the server certificate. Secret openbao-tls carries tls.crt,
tls.key and ca.crt; OpenBao reads the first two and ESO checks the listener against ca.crt (the
secret-store app's caProvider). The agent box checks its path through the Gateway against ca.crt too
(templates/box-path.yaml; `openbao-prod ca` copies it to the box).
*/ -}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-selfsigned
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: openbao-ca
  secretName: openbao-ca
  duration: 87600h    # 10 years: only this namespace's server certificate trusts it
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: openbao-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-ca
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: openbao-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: openbao-tls
  duration: 2160h       # 90 days, renewed 30 days before; OpenBao reads the new files on reload
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    # The Service ESO calls, and the pods' own names on the chart's headless Service.
    - openbao
    - openbao.{{ .Release.Namespace }}
    - openbao.{{ .Release.Namespace }}.svc
    - openbao-active.{{ .Release.Namespace }}.svc
    - "*.openbao-internal"
    - "*.openbao-internal.{{ .Release.Namespace }}.svc"
    {{- if eq (toString .Values.measure) "true" }}
    # The measurement's passthrough host (MEASURE-1, dev only): TLS on that route ends here.
    - openbao-pass.{{ required "zone: set by the root Application (k8s_gitops_source_zone)" .Values.zone }}
    {{- end }}
    {{- with .Values.boxHost }}
    # The agent box's path through the Gateway (templates/box-path.yaml): TLS on it ends here.
    - {{ . }}
    {{- end }}
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: openbao-ca
    kind: Issuer
