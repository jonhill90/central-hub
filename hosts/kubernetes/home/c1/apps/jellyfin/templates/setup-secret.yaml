# Always rendered, also when setup.enabled is false (the CronJob is then only suspended): the Application does not prune, so objects
# that an earlier render made would stay as extras and leave it OutOfSync.
# The admin password. With adminSecret.store openbao (plan step 8a) an ExternalSecret reads it from OpenBao, c1/jellyfin-admin key
# password, the value `openbao-prod adopt` took from the running cluster; otherwise it is made once inside the cluster by External
# Secrets (generator Password below) and never changed after (refreshPolicy CreatedOnce). The generator is rendered in both cases,
# since the Application does not prune and the object would stay as an extra. Letters and digits only, so it is safe in JSON
# and on any login form. To read it: see docs/runbooks/jellyfin.md, "Sign in".
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.name }}-admin
  namespace: {{ .Release.Namespace }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
{{- if eq .Values.adminSecret.store "openbao" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ .Values.name }}-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: {{ .Values.setup.adminUser | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  # Store openbao reads key c1/<name>: policy eso-c1 reads kv/data/c1/* only (apps/openbao-store/policies/eso-c1.hcl).
  data:
    - secretKey: password
      remoteRef: {key: c1/{{ .Values.name }}-admin, property: password}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.name }}-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: {{ .Values.setup.adminUser | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.name }}-admin
{{- end }}
