# Ported unchanged from hosts/ansible/roles/k8s_jellyfin/templates/jellyfin.yaml.j2, so Argo CD's
# first diff against the running objects is empty. Recreate, because a ReadWriteOnce volume on one
# node can't be held by two pods while a rolling update runs.
{{- $v := .Values }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    # Deleting the namespace would delete the claims in it.
    argocd.argoproj.io/sync-options: Delete=false
{{- range $claim := list (dict "suffix" "config" "size" $v.storage.configSize) (dict "suffix" "media" "size" $v.storage.mediaSize) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $v.name }}-{{ $claim.suffix }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Never delete the data, even if the Application or this chart goes away.
    argocd.argoproj.io/sync-options: Delete=false
    helm.sh/resource-policy: keep
spec:
  {{- with $v.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $claim.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: jellyfin}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: jellyfin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jellyfin}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $v.uid }}
        runAsGroup: {{ $v.uid }}
        seccompProfile: {type: RuntimeDefault}
      {{- if $v.sso.enabled }}
      initContainers:
        # Installs the SSO plugin into /config/plugins (pinned version, sha256 checked) and builds
        # the CA bundle Jellyfin trusts: the public bundle plus the lab root. Safe to run again.
        - name: sso-plugin
          image: {{ $v.sso.initImage }}
          command: [/bin/sh, -c]
          args:
            - |
{{ .Files.Get "files/install-sso-plugin.sh" | indent 14 }}
          env:
            - {name: PLUGIN_VERSION, value: {{ $v.sso.plugin.version | quote }}}
            - {name: PLUGIN_URL, value: {{ $v.sso.plugin.url | quote }}}
            - {name: PLUGIN_SHA256, value: {{ $v.sso.plugin.sha256 | quote }}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: tls, mountPath: /tls}
            - {name: lab-root-ca, mountPath: /lab-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      {{- end }}
      containers:
        - name: jellyfin
          image: {{ $v.image }}
          {{- if $v.sso.enabled }}
          env:
            - {name: SSL_CERT_FILE, value: /tls/ca-bundle.crt}
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $v.port }}}
          startupProbe:
            httpGet: {path: {{ $v.healthPath }}, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: {{ $v.healthPath }}, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: {{ $v.healthPath }}, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: {{ $v.resources.requests.cpu }}, memory: {{ $v.resources.requests.memory }}}
            limits: {memory: {{ $v.resources.limits.memory }}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cache, mountPath: /cache}
            - {name: media, mountPath: /media}
            {{- if $v.sso.enabled }}
            - {name: tls, mountPath: /tls, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: {{ $v.name }}-config}
        - name: media
          persistentVolumeClaim: {claimName: {{ $v.name }}-media}
        - name: cache
          emptyDir: {sizeLimit: {{ $v.storage.cacheLimit }}}
        {{- if $v.sso.enabled }}
        - name: tls
          emptyDir: {sizeLimit: 2Mi}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: lab-root-ca
          secret:
            {{- if $v.sso.labRoot.certificate }}
            secretName: {{ $v.sso.labRoot.secretName }}
            items: [{key: {{ $v.sso.labRoot.key }}, path: lab-root-ca.pem}]
            {{- else }}
            secretName: {{ $v.name }}-lab-root-ca
            {{- end }}
            optional: true
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: jellyfin}
  ports:
    - {name: http, port: {{ $v.port }}, targetPort: http}
