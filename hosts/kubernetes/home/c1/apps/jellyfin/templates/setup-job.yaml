{{- if .Values.setup.enabled }}
{{- $s := .Values.setup }}
# Runs Jellyfin's first-run wizard through its startup API after each sync (Argo CD PostSync hook).
# Once the wizard is done the script stops at its first check and changes nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: jellyfin-setup}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: setup
          image: {{ $s.image }}
          command: [/bin/sh, -c]
          args:
            - |
{{ .Files.Get "files/setup.sh" | indent 14 }}
          env:
            - {name: BASE, value: "http://{{ .Values.name }}.{{ .Release.Namespace }}.svc:{{ .Values.port }}"}
            - {name: SERVER_NAME, value: {{ $s.serverName | quote }}}
            - {name: UI_CULTURE, value: {{ $s.uiCulture | quote }}}
            - {name: COUNTRY, value: {{ $s.metadataCountryCode | quote }}}
            - {name: LANGUAGE, value: {{ $s.metadataLanguage | quote }}}
            - {name: LIBRARY_NAME, value: {{ $s.library.name | quote }}}
            - {name: LIBRARY_TYPE, value: {{ $s.library.collectionType | quote }}}
            - {name: LIBRARY_PATH, value: {{ $s.library.path | quote }}}
            - name: ADMIN_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.name }}-admin, key: username}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.name }}-admin, key: password}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
{{- end }}
