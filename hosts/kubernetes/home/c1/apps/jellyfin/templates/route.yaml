# Ported from hosts/ansible/roles/k8s_app_route/templates/route.yaml.j2: TLS ends at the shared
# Gateway's https listener; plain http for the same name gets a 301 to https. With gateway.https
# off (a cluster with no certificate), the route serves on the http listeners and there is no redirect.
{{- $v := .Values }}
{{- $section := ternary "https" "http" (eq (toString $v.gateway.https) "true") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: {{ $section }}
{{- if $v.gateway.shortNames }}
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: {{ $section }}-short
{{- end }}
  hostnames:
    - {{ include "jellyfin.host" . }}
{{- if $v.gateway.shortNames }}
    - {{ $v.name }}.{{ $v.zone }}
{{- end }}
  rules:
{{- if $v.metrics.enabled }}
    # /metrics stays inside the cluster (Prometheus reads the pod directly): from outside it gets a
    # redirect to /. An Exact match wins over the PathPrefix "/" below (Gateway API match precedence).
    - matches:
        - path:
            type: Exact
            value: /metrics
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $v.name }}
          port: {{ $v.port }}
{{- if eq $section "https" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: http
{{- if $v.gateway.shortNames }}
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: http-short
{{- end }}
  hostnames:
    - {{ include "jellyfin.host" . }}
{{- if $v.gateway.shortNames }}
    - {{ $v.name }}.{{ $v.zone }}
{{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
