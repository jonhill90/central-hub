# Ported from hosts/ansible/roles/k8s_app_route/templates/route.yaml.j2: TLS ends at the shared
# Gateway's https listener; plain http for the same name gets a 301 to https. With gateway.https
# off (a cluster with no certificate), the route serves on the http listeners and there is no redirect.
{{- $v := .Values }}
{{- $section := ternary "https" "http" (eq (toString $v.gateway.https) "true") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: {{ $section }}
{{- if $v.gateway.shortNames }}
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: {{ $section }}-short
{{- end }}
  hostnames:
    - {{ include "jellyfin.host" . }}
{{- if $v.gateway.shortNames }}
    - {{ $v.name }}.{{ $v.zone }}
{{- end }}
  rules:
{{- if $v.metrics.enabled }}
    # /metrics stays inside the cluster (Prometheus reads the pod directly): from outside it gets a
    # redirect to /. Jellyfin's routing ignores case, a trailing slash, percent-encoded letters and
    # dot segments, and the Gateway's Exact and PathPrefix matches do not, so this is a regular
    # expression: any path with a segment spelled "metrics" in any case, each letter either plain or
    # percent-encoded. Cilium hands it to Envoy as an RE2 full match and tries it before any
    # PathPrefix. The forms it must catch are tested in .github/hosts-check/tests/test_jellyfin_metrics_route.sh.
    - matches:
        - path:
            type: RegularExpression
            value: {{ $v.metrics.blockPath | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $v.name }}
          port: {{ $v.port }}
{{- if eq $section "https" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: http
{{- if $v.gateway.shortNames }}
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: http-short
{{- end }}
  hostnames:
    - {{ include "jellyfin.host" . }}
{{- if $v.gateway.shortNames }}
    - {{ $v.name }}.{{ $v.zone }}
{{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
