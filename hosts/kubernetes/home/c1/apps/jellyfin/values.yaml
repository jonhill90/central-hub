# Jellyfin on c1. The same objects the Ansible role k8s_jellyfin applied, plus the first-run setup
# as code (spec "Jellyfin's first-run setup as code"). Every value here is public; the zone comes
# only from the root Application's `zone` parameter (CLAUDE.md rule 4).
zone: ""

name: jellyfin

# Same image as k8s_jellyfin/defaults/main.yml: tag 12.2 (2026-10-05), multi-arch index digest.
image: docker.io/jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
uid: 1000
port: 8096
healthPath: /health

storage:
  className: ""      # empty: the cluster's default StorageClass
  configSize: 5Gi
  mediaSize: 100Gi
  cacheLimit: 8Gi

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {memory: 2Gi}

# The shared Gateway (role k8s_gateway) and the name under it: <name>.apps.c1.prod.<zone>.
gateway:
  name: apps
  namespace: gateway
  hostSuffix: apps.c1.prod
  # Also answer on the short alias <name>.<zone> (STD-0001 rule 5; the Gateway's shortNames).
  shortNames: true
  # Whether the Gateway has its HTTPS listeners (the root's gatewayHttps). Off, the route serves
  # on the http listeners and there is no redirect route.
  https: true

# First-run setup (templates/setup-*.yaml). The admin password is made once by External Secrets'
# Password generator and kept in the Secret <name>-admin (keys: username, password); nothing
# prints it. The Job runs after every sync and changes nothing once the wizard is done.
setup:
  enabled: true
  adminUser: admin
  serverName: jellyfin
  uiCulture: en-US
  metadataCountryCode: US
  metadataLanguage: en
  library:
    name: Media
    collectionType: mixed
    path: /media
  # curl 8.22.0 (2026-09-02, STD-0003: at least two weeks old), multi-arch index digest.
  image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777

# Sign-in through the lab's Keycloak (runbook set-up-lab-sign-in.md, step 5). Jellyfin has no OIDC
# of its own, so the SSO plugin is installed from a pinned, checksummed zip before Jellyfin starts
# (initContainer), and the setup Job writes the provider config through the plugin's API after each
# sync. The client and its secret (Secret media/<secretName>, key client-secret) come from the
# realm role k8s_identity; this chart only reads the secret.
sso:
  enabled: true
  provider: keycloak
  # Keycloak's name under the Gateway: <host>.<gateway.hostSuffix>.<zone>, realm lab.
  issuerHost: sso
  realm: lab
  clientId: jellyfin
  secretName: jellyfin-sso
  # Realm roles from the `roles` claim the realm lab adds to every client (realm lab: admin, viewer).
  roles: [admin, viewer]
  adminRoles: [admin]
  plugin:
    # K0lin's maintained fork of 9p4/jellyfin-plugin-sso (the original is archived and stops at
    # targetAbi 10.11). Version 5.1.1 targets Jellyfin 12.0.0.0 (its manifest and meta.json).
    version: "5.1.1"
    url: https://github.com/K0lin/jellyfin-plugin-sso/releases/download/v5.1.1/sso-authentication_5.1.1.zip
    sha256: db126b4763bda3a3754fa2103232fc03ef1bf929cfeda35f2e9af39c875233b1
  # Same image as setup.image (curl, busybox unzip, the public CA bundle).
  initImage: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
  # Keycloak's certificate comes from the lab CA (clusterissuer lab-ca). files/lab-root-ca.pem is
  # that CA's public root; the init container adds it to a copy of the public bundle and Jellyfin
  # reads the copy through SSL_CERT_FILE.
