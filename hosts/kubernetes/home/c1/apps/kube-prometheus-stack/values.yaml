# kube-prometheus-stack on c1 (Prometheus Operator, Prometheus, Grafana, kube-state-metrics,
# node-exporter). The same values k8s_observability gave Helm (k8s_observability_kps_values), with
# its defaults filled in. Grafana's root_url needs the private zone, so the root chart sets
# grafana."grafana.ini".server.root_url as a parameter (root values, zoneParameters).
# Grafana's sign-in through Keycloak is in values-sso.yaml, used when the root lists it.
# Alertmanager sends every alert to ntfy (app alerts) on topic c1-alerts, with ntfy's built-in
# Alertmanager message format, except Watchdog (always firing, by design), which goes to receiver
# `heartbeat` for Healthchecks.io (pick 213) and not to ntfy. Swapping the ntfy receiver means
# changing only `receivers` here (pick 171).
alertmanager:
  enabled: true
  # Count notifications per receiver (alertmanager_notifications_total{receiver_name="ntfy"}), so
  # the panel check and the dashboard can show that alerts reached ntfy, apart from the heartbeat's
  # webhook. Alertmanager v0.34.1 adds the label only with this flag (notify/metrics.go).
  enableFeatures: [receiver-name-in-metrics]
  config:
    route:
      receiver: ntfy
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog always fires, so it is c1's heartbeat: about every 5 minutes it pings a check on
        # Healthchecks.io, which mails the owner when the pings stop (pick 213).
        - receiver: heartbeat
          matchers: ['alertname = "Watchdog"']
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 4m
        - receiver: "null"
          matchers: ['alertname = "InfoInhibitor"']
    receivers:
      - name: "null"
      - name: heartbeat
        webhook_configs:
          # The check's ping URL, from Secret alertmanager-heartbeat (app monitoring-extras).
          - url_file: /etc/alertmanager/secrets/alertmanager-heartbeat/url
            send_resolved: false
            max_alerts: 1
      - name: ntfy
        webhook_configs:
          - url: http://ntfy.alerts.svc.cluster.local/c1-alerts?template=alertmanager
            send_resolved: true
            # Send-only token (pick 171), from Secret alertmanager-ntfy (app monitoring-extras).
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token
  alertmanagerSpec:
    secrets: [alertmanager-ntfy, alertmanager-heartbeat]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
# c1 has no kube-proxy (Cilium replaces it, D-0017). kubeadm binds the controller manager and the
# scheduler to 127.0.0.1 and etcd's metrics to 127.0.0.1:2381, so in-cluster scrapes of them fail;
# turned off until k8s_control_plane opens those ports (known gap).
kubeProxy: {enabled: false}
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
defaultRules:
  rules:
    alertmanager: false
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
  # KubeCPUOvercommit and KubeMemoryOvercommit fire when the pods' requests would not fit if the
  # largest node were lost. c1 has one worker and a tainted control plane, so losing the worker
  # always loses its pods and the two fire for good (both firing on c1, 2026-11-18 04:30 UTC:
  # requests 2.48 of 4 CPUs, 3.75 of 11.4 GiB, largest node 2 CPUs and 7.7 GiB). A pod that
  # doesn't fit stays Pending, and KubePodNotReady covers that. Turn them back on at three nodes.
  disabled:
    KubeCPUOvercommit: true
    KubeMemoryOvercommit: true
windowsMonitoring: {enabled: false}
# node-exporter reads the backups' times (role k8s_backup, c1_backup_last_success_timestamp_seconds) with its
# textfile collector, through the chart's read-only host root mount at /host/root. This list replaces the
# chart's, so it keeps the chart's two filesystem defaults (kube-prometheus-stack 92.3.1 values.yaml).
prometheus-node-exporter:
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile.directory=/host/root/var/lib/node-exporter/textfile
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 16GB
    # Read every ServiceMonitor, PodMonitor and rule in the cluster, not only this release's.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 20Gi}}
grafana:
  # One pod at a time on its volume: Grafana's database is one SQLite file.
  deploymentStrategy: {type: Recreate}
  persistence: {enabled: true, type: pvc, size: 1Gi}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 768Mi}
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
