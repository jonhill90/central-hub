# The Central Hub web app on c1 (spec 2026-11-central-hub-app-on-c1). Every value here is public.
name: central-hub-app

# The app's own repository, read anonymously over HTTPS, and the one commit to build, by its full sha
# (Activation gate items 3 and 6: no token, no image automation; a new commit is a reviewed pull request).
source:
  repoURL: https://github.com/jonhill90/central-hub-app.git
  commit: "bb3173386788b028abc6219860239768461c1215"

# One stock image builds and runs the app: it has git and npm. Node 22.21.1 on Debian bookworm, tag last
# pushed 2026-01-13 (Docker Hub tag API), multi-arch index digest. D-0054: Docker Hub by digest, no account.
image: docker.io/library/node:22.21.1-bookworm@sha256:b84d52cd45bfe261096ccbf886955d431b8b9ed01b72eaef588e8886bda09e78
uid: 1000
port: 3000

# Sign-in through Keycloak (spec 0007 of the app). The issuer, the public origins and the client secret are not here:
# the identity role (k8s_identity) makes Secrets central-hub-app-oidc and central-hub-app-sso in this namespace and the
# pod reads them as files, so this public chart names no host. Until they exist the pod is up but answers 503.
# The token and key requests go to Keycloak inside the cluster; the browser uses the public address.
#
# Sign-in is OFF until the realm has client central-hub-app and the two Secrets exist in this namespace. With it on and no
# Secrets, every page and the data API answer 503 while Argo CD still shows Healthy (the probe stays up on purpose, so a
# rebuild's apps stage can finish before its identity stage), which put the live front door dark on 2026-11-21. So the
# chart refuses mode oidc unless secretsConfirmed is true too, and CI renders both cases (.github/hosts-check/run.sh,
# "central-hub-app: sign-in guard"). Set secretsConfirmed only after reading, from the box, that the client is in the
# realm and the app's health says signIn: on or its Secrets are listed (runbook sign-in-to-the-central-hub-app-with-keycloak.md,
# "Turn it on").
auth:
  mode: "off"
  secretsConfirmed: false
  internalURL: http://sso-service.identity.svc:8080/realms/lab
  allowedGroups: lab-admins,lab-viewers
  identityNamespace: identity
  identityPort: 8080

resources:
  build:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1536Mi}
  run:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {memory: 384Mi}
workSize: 2Gi
outSize: 256Mi
