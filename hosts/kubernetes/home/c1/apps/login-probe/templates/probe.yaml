{{- $v := .Values }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
---
# Runs after each sync of this app (Argo CD PostSync hook); sync the app again to run it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $v.name }}}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: probe
          image: {{ $v.image }}
          command: [/bin/sh, -c]
          args:
            - |
{{ .Files.Get "files/probe.sh" | indent 14 }}
          env:
            - {name: KEYCLOAK, value: {{ $v.keycloak | quote }}}
            - {name: ARGOCD, value: {{ $v.argocd | quote }}}
            - {name: JELLYFIN, value: {{ $v.jellyfin | quote }}}
            - {name: REALM, value: {{ $v.realm | quote }}}
            - {name: SUFFIX, value: {{ $v.gateway.hostSuffix | quote }}}
            - {name: ZONE, value: {{ required "zone: set by the root Application" $v.zone | quote }}}
            - name: CLIENTS
              value: {{ range $c := $v.clients }}{{ $c.id }}|{{ $c.host }}|{{ $c.redirect }} {{ end }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
