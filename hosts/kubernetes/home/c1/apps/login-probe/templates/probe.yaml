{{- $v := .Values }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
---
# A CronJob, not an Argo CD hook: a PostSync hook runs only when a sync does, so it would not rerun
# when its script changes, and a failing hook fails the sync and stalls it. A failed check here fails
# one Job and leaves the app Synced. Read the newest Job's log; it ends with RESULT: PASS or FAIL.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ $v.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: {app.kubernetes.io/name: {{ $v.name }}}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: probe
              image: {{ $v.image }}
              command: [/bin/sh, -c]
              args:
                - |
{{ .Files.Get "files/probe.sh" | indent 18 }}
              env:
                - {name: KEYCLOAK, value: {{ $v.keycloak | quote }}}
                - {name: ARGOCD, value: {{ $v.argocd | quote }}}
                - {name: JELLYFIN, value: {{ $v.jellyfin | quote }}}
                - {name: REALM, value: {{ $v.realm | quote }}}
                - {name: SUFFIX, value: {{ $v.gateway.hostSuffix | quote }}}
                - {name: ZONE, value: {{ required "zone: set by the root Application" $v.zone | quote }}}
                - name: CLIENTS
                  value: {{ range $c := $v.clients }}{{ $c.id }}|{{ $c.host }}|{{ $c.redirect }} {{ end }}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
