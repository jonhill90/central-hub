# Same shape as apps/jellyfin/templates/route.yaml: TLS ends at the shared Gateway's https listener; plain http for
# the same name gets a 301 to https. With gateway.https off, the route serves on the http listeners.
{{- $v := .Values }}
{{- $section := ternary "https" "http" (eq (toString $v.gateway.https) "true") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: {{ $section }}
{{- if $v.gateway.shortNames }}
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: {{ $section }}-short
{{- end }}
  hostnames:
    - {{ include "homeassistant.host" . }}
{{- if $v.gateway.shortNames }}
    - {{ include "homeassistant.shortHost" . }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $v.name }}
          port: {{ $v.port }}
{{- if eq $section "https" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: http
{{- if $v.gateway.shortNames }}
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: http-short
{{- end }}
  hostnames:
    - {{ include "homeassistant.host" . }}
{{- if $v.gateway.shortNames }}
    - {{ include "homeassistant.shortHost" . }}
{{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
