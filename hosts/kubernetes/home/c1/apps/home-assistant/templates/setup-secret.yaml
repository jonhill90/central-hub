# The owner's password, for the onboarding Job (files/setup.sh). External Secrets makes it once inside the cluster (generator
# Password below, refreshPolicy CreatedOnce) and never changes it, whatever store the cluster's other apps use: nothing has
# to exist in OpenBao first, so a new or rebuilt cluster is never stuck waiting on a missing Secret. Letters and digits
# only, so it is safe in JSON. After the first run an agent copies the value into OpenBao and the SOPS copy
# (docs/runbooks/run-home-assistant-on-c1.md, step 5).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.name }}-owner
  namespace: {{ .Release.Namespace }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-owner
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.name }}-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: {{ .Values.setup.ownerUser | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.name }}-owner
