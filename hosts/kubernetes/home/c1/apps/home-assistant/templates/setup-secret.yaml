# The owner's password, for the onboarding Job (files/setup.sh). With adminSecret.store openbao an ExternalSecret reads it
# from OpenBao, c1/homeassistant-owner key password; otherwise External Secrets makes it once inside the cluster (generator
# Password below) and never changes it. Letters and digits only, so it is safe in JSON. Same shape as apps/jellyfin. The
# generator is rendered in both cases, since the Application does not prune. After the first run an agent copies the value
# into OpenBao and the SOPS copy with `secrets-store put-apps` (docs/runbooks/run-home-assistant-on-c1.md).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.name }}-owner
  namespace: {{ .Release.Namespace }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
{{- if eq .Values.adminSecret.store "openbao" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-owner
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ .Values.name }}-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: {{ .Values.setup.ownerUser | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef: {key: c1/{{ .Values.name }}-owner, property: password}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-owner
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.name }}-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: {{ .Values.setup.ownerUser | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.name }}-owner
{{- end }}
