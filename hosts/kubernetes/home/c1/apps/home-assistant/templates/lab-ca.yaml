{{- if and .Values.sso.enabled .Values.sso.labRoot.certificate }}
{{- /*
The lab CA's public root, for hass-oidc-auth to trust Keycloak (network.tls_ca_path). cert-manager writes the issuing
CA as ca.crt into the Secret of every certificate it signs, so this small certificate is the whole delivery: no file,
no Ansible run. The leaf itself is never used. Same as apps/jellyfin/templates/lab-ca.yaml.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.sso.labRoot.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: {{ .Values.sso.labRoot.secretName }}
  dnsNames:
    - {{ .Values.name }}.{{ .Release.Namespace }}.svc
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .Values.sso.labRoot.issuer }}
    kind: ClusterIssuer
{{- end }}
