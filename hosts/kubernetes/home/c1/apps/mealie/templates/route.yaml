# Same shape as apps/jellyfin, templates/route.yaml (and role k8s_app_route): TLS ends at the shared Gateway's
# https listener; plain http for the same name gets a 301 to https.
{{- $v := .Values }}
{{- $section := ternary "https" "http" (eq (toString $v.gateway.https) "true") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: {{ $section }}
{{- if $v.gateway.shortNames }}
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: {{ $section }}-short
{{- end }}
  hostnames:
    - {{ include "mealie.host" . }}
{{- if $v.gateway.shortNames }}
    - {{ include "mealie.shortHost" . }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $v.name }}
          port: {{ $v.port }}
{{- if eq $section "https" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}-redirect
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: http
{{- if $v.gateway.shortNames }}
    - name: {{ $v.gateway.name }}
      namespace: {{ $v.gateway.namespace }}
      sectionName: http-short
{{- end }}
  hostnames:
    - {{ include "mealie.host" . }}
{{- if $v.gateway.shortNames }}
    - {{ include "mealie.shortHost" . }}
{{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
