{{- if and .Values.sso.enabled .Values.sso.labRoot.certificate }}
{{- /*
The lab CA's public root, for Mealie to trust Keycloak's certificate. cert-manager writes the issuing CA as
ca.crt into the Secret of every certificate it signs, so this small certificate is the whole delivery (the
same as apps/jellyfin, templates/lab-ca.yaml). The leaf itself is never used.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.sso.labRoot.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: {{ .Values.sso.labRoot.secretName }}
  dnsNames:
    - {{ .Values.name }}.{{ .Release.Namespace }}.svc
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .Values.sso.labRoot.issuer }}
    kind: ClusterIssuer
{{- end }}
