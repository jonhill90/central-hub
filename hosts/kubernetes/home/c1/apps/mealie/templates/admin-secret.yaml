# The password of Mealie's first account (templates/admin-guard job). The same as apps/jellyfin, templates/setup-secret.yaml:
# with adminSecret.store openbao an ExternalSecret reads it from OpenBao, c1/mealie-admin key password; otherwise External
# Secrets makes it once inside the cluster (generator Password) and never changes it (refreshPolicy CreatedOnce). Letters and
# digits only, so it is safe in JSON and in a form. Both objects are always rendered: the Application does not prune.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.name }}-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
{{- if eq .Values.adminSecret.store "openbao" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ .Values.name }}-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  # Store openbao reads key c1/<name>: policy eso-c1 reads kv/data/c1/* only (apps/openbao-store/policies/eso-c1.hcl).
  data:
    - secretKey: password
      remoteRef: {key: c1/{{ .Values.name }}-admin, property: password}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.name }}-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.name }}-admin
{{- end }}
