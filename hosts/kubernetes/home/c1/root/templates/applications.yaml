{{- /*
One child Application per entry in .Values.apps. The chart comes from its upstream Helm repository,
and its values files from this repository (Argo CD multiple sources, `ref: values`); or, with
`local: true`, the chart itself is in this repository at appsPath/<name>/.
No resources finalizer: deleting a child Application leaves its objects on the cluster, which is the
way back to Ansible for every component (spec, "Taking over a running component").
*/ -}}
{{- range $name, $app := .Values.apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: c1
  {{- with $app.wave }}
  annotations:
    # Lower waves sync first when the root syncs: storage and CRDs before what uses them.
    argocd.argoproj.io/sync-wave: {{ . | quote }}
  {{- end }}
spec:
  project: {{ $.Values.project | default "default" }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace }}
  {{- if $app.local }}
  # A chart kept in this repository, at appsPath/<name>/ (Chart.yaml, values.yaml, templates/).
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: {{ $.Values.appsPath }}/{{ $name }}
    helm:
      releaseName: {{ $app.releaseName | default $name }}
      {{- with include "c1.parameters" (dict "app" $app "root" $) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
  {{- else }}
  sources:
    {{- if hasPrefix "oci://" $app.chart.repoURL }}
    # An OCI chart, fetched by its manifest digest (pick 141); a Helm chart in OCI is read at path ".".
    - repoURL: {{ $app.chart.repoURL }}
      path: .
      targetRevision: {{ required (printf "apps.%s.chart.digest is needed for an oci:// chart" $name) $app.chart.digest | quote }}
    {{- else }}
    - repoURL: {{ $app.chart.repoURL }}
      chart: {{ $app.chart.name }}
      targetRevision: {{ $app.chart.version | quote }}
    {{- end }}
      helm:
        releaseName: {{ $app.releaseName | default $name }}
        valueFiles:
          {{- range $file := $app.valueFiles | default (list "values.yaml") }}
          - $values/{{ $.Values.appsPath }}/{{ $name }}/{{ $file }}
          {{- end }}
        {{- with include "c1.parameters" (dict "app" $app "root" $) | trim }}
        {{- . | nindent 8 }}
        {{- end }}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.targetRevision }}
      ref: values
  {{- end }}
  {{- with $app.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  syncPolicy:
    {{- if $app.autoSync }}
    automated:
      selfHeal: true
      prune: {{ $app.prune | default false }}
    # A fresh cluster syncs every app at once, so an app whose CRDs or webhook come from another app
    # (monitoring-extras on the Prometheus Operator, jellyfin and secret-store on External Secrets)
    # fails until that app is up. Retrying with backoff lets them converge without hand syncs.
    retry:
      {{- toYaml $.Values.syncRetry | nindent 6 }}
    {{- end }}
    syncOptions:
      # Make the app's namespace when it is missing, as Ansible's Helm installs did on c1.
      - CreateNamespace=true
      {{- with $app.syncOptions }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
