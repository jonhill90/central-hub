# Inputs of the root chart. Private names are never written here (CLAUDE.md rule 4).

# The lab DNS zone. Ansible sets it as a Helm parameter on the root Application, from the private
# inventory (k8s_gitops_source_zone). Children that need a hostname get it as their own `zone`.
zone: ""
# The Gateway's address, also private and also set by Ansible (k8s_gitops_source_gateway_address);
# only the gateway app uses it.
gatewayAddress: ""

# Where the children read their values: this repository, anonymous HTTPS, no credential (D-0023).
repoURL: https://github.com/jonhill90/central-hub
targetRevision: main
appsPath: hosts/kubernetes/home/c1/apps
# The Argo CD project every child Application belongs to: AppProject `c1`, which the root chart
# makes (templates/project.yaml, Activation gate item 5). `default` puts them back.
project: c1

# What AppProject `c1` allows. Source repositories and destination namespaces come from `apps`
# (this repository, each `chart.repoURL`, each `namespace`), plus the lists below.
c1Project:
  # The pause switch (Activation gate item 5, and the cluster half of break-glass): true adds a deny
  # sync window that is always open, so Argo CD syncs no child Application, by hand or on its own,
  # until it is false again. The root Application is in project `default`, so it still syncs this.
  syncPaused: false
  # Namespaces that a chart writes to besides the `namespace` of some app. Checked against the
  # rendered charts on 2026-11-09: secret-store makes `secret-source`, where its source secret sits.
  # Not `argocd`: the child Application objects are the root's, and the root stays in `default`.
  extraNamespaces:
    - secret-source
  # Cluster-scoped kinds the charts make, and nothing else (Argo CD refuses any other). Each new
  # kind is a PR. Checked against the rendered charts on 2026-11-09.
  clusterResources:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: apiregistration.k8s.io, kind: APIService}
    - {group: storage.k8s.io, kind: StorageClass}
    - {group: external-secrets.io, kind: ClusterSecretStore}

# One entry per component, in the order they moved (spec, "Order"). Each one:
#   namespace    where the chart installs
#   chart        repoURL, name and version of the upstream Helm chart (version per STD-0003);
#                optional `oci`, an OCI copy of the same file that CI's parity check pulls instead
#   local        true: a chart kept in this repository at appsPath/<name>/ instead of `chart`
#   releaseName  the Helm release name today, so the objects keep their names (default: the key)
#   needsZone    pass `zone` to the chart as a value
#   zoneParameters  value path -> text with "{zone}" in it, passed as a Helm parameter (the zone is
#                private, so a URL that holds it can't sit in a values file)
#   valueFiles   the values files in appsPath/<name>/, in order (default: values.yaml)
#   syncOptions  Argo CD sync options, for example ServerSideApply=true for charts with large CRDs
#   ignoreDifferences  fields Argo CD leaves alone, for example a password the chart makes at random
#   wave         sync order when the root syncs, lowest first (default 0): -3 storage, -2 operators
#                and their CRDs, -1 what they serve (the secret store), 0 apps
#   autoSync     true: Argo CD syncs the app on its own, so a fresh cluster installs every app
#                from git (the owner's card, 2026-11-10 02:50 UTC). false only while an app's
#                take-over diff is checked or its live objects differ from git
#   prune        delete objects that leave git; false until one cycle runs clean
apps:
  metrics-server:
    namespace: kube-system
    chart:
      repoURL: https://kubernetes-sigs.github.io/metrics-server/
      name: metrics-server
      version: 3.14.0   # metrics-server 0.9.0, 2026-08-19; same as k8s_observability today
    autoSync: true
    prune: false
  # Volumes (spec step 2): the provisioner and the default StorageClass. The data disk itself stays
  # with Ansible (k8s_storage, tag disk).
  local-path:
    namespace: local-path-storage
    local: true
    wave: -3
    autoSync: true    # on 2026-11-10: its diff on c1 at 03:08 UTC was Argo CD's tracking only
    prune: false
  jellyfin:
    namespace: media
    local: true
    needsZone: true
    autoSync: true    # on 2026-11-10: its diff on c1 at 03:08 UTC was Argo CD's tracking only
    prune: false
  # Logs (spec step 3): two releases in namespace logging, as k8s_observability installed them.
  loki:
    namespace: logging
    chart:
      repoURL: https://grafana-community.github.io/helm-charts
      name: loki
      version: 18.15.1   # Loki 3.7.8, 2026-10-09; same as k8s_observability today
      # The same chart file, published by the same project as OCI. Only CI's parity check reads it
      # (the GitHub release download behind repoURL returned 504 for hours on 2026-11-08); the bytes
      # matched (SHA-256 bfa76744...edbe0a) on 2026-11-08. Argo CD and Ansible still use repoURL.
      oci: oci://ghcr.io/grafana-community/helm-charts/loki
    autoSync: true
    prune: false
  alloy:
    namespace: logging
    chart:
      repoURL: https://grafana.github.io/helm-charts
      name: alloy
      version: 1.13.1   # Alloy v1.20.1, 2026-10-08; same as k8s_observability today
    autoSync: true
    prune: false
  # Metrics (spec step 4). values-sso.yaml and the auth_url parameter give Grafana its sign-in
  # through Keycloak, as k8s_observability_grafana_sso does in the inventory (on for c1 since 2026-11-09).
  kube-prometheus-stack:
    namespace: monitoring
    chart:
      repoURL: https://prometheus-community.github.io/helm-charts
      name: kube-prometheus-stack
      version: 92.3.1   # Prometheus Operator v0.94.1, 2026-10-13; same as k8s_observability today
    valueFiles: [values.yaml, values-sso.yaml]
    zoneParameters:
      # Short aliases (STD-0001 rules 5 and 7), as k8s_observability_short_names.
      grafana.grafana\.ini.server.root_url: "https://grafana.{zone}/"
      grafana.grafana\.ini.auth\.generic_oauth.auth_url: "https://sso.{zone}/realms/lab/protocol/openid-connect/auth"
    # The CRDs are too large for a client-side apply's annotation.
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
    # Grafana's chart makes a new random admin password at every render; keep the one on the cluster.
    ignoreDifferences:
      - kind: Secret
        name: kube-prometheus-stack-grafana
        namespace: monitoring
        jsonPointers: [/data]
    autoSync: true    # on 2026-11-10: its diff on c1 at 03:08 UTC was the sign-in, now in valueFiles
    prune: false
  # Secrets (spec step 5): External Secrets and the one store `c1` every ExternalSecret names.
  external-secrets:
    namespace: external-secrets
    chart:
      repoURL: https://charts.external-secrets.io
      name: external-secrets
      version: 2.14.0   # 2026-10-23, the first to list Kubernetes 1.37; same as k8s_secrets today
    wave: -2
    syncOptions: [ServerSideApply=true]
    autoSync: true
    prune: false
  secret-store:
    namespace: external-secrets
    local: true
    wave: -1
    autoSync: true    # on 2026-11-10: its diff on c1 at 03:08 UTC was Argo CD's tracking only
    prune: false
  # Certificates (spec step 6): cert-manager itself. The issuers and the Gateway's certificate stay
  # with Ansible (k8s_certs, tag issue) until the lab PKI work gives them a `certs` app here.
  cert-manager:
    namespace: cert-manager
    chart:
      repoURL: https://charts.jetstack.io
      name: cert-manager
      version: v1.21.3   # security release, STD-0003 rule 2; same as k8s_certs today
    wave: -2
    syncOptions: [ServerSideApply=true]
    autoSync: true
    prune: false
  # The way in (spec step 9): Gateway `apps` and the routes of apps whose charts make none. The
  # node firewall ports stay with Ansible (k8s_gateway).
  gateway:
    namespace: gateway
    local: true
    needsZone: true
    zoneParameters:
      address: "{gatewayAddress}"
    wave: -1
    autoSync: true
    prune: false
  # c1's own alert rules, the Argo CD scrape and the lab dashboard (needs the CRDs from
  # kube-prometheus-stack, so it waits for it).
  monitoring-extras:
    namespace: monitoring
    local: true
    wave: 1
    autoSync: true
    prune: true
  # Where c1's alerts go (ntfy); Alertmanager in kube-prometheus-stack posts to it.
  alerts:
    namespace: alerts
    local: true
    needsZone: true
    autoSync: true
    prune: true

