# Inputs of the root chart. Private names are never written here (CLAUDE.md rule 4).

# The lab DNS zone. Ansible sets it as a Helm parameter on the root Application, from the private
# inventory (k8s_gitops_source_zone). Children that need a hostname get it as their own `zone`.
zone: ""
# The Gateway's address, also private and also set by Ansible (k8s_gitops_source_gateway_address);
# only the gateway app uses it.
gatewayAddress: ""
# Whether the Gateway has its HTTPS listeners. Ansible sets it to false only for a cluster with no
# certificate (k8s_gitops_source_gateway_https, from k8s_gateway_https); c1 keeps true.
gatewayHttps: true
# Whether local-path names each volume's folder <namespace>/<claim> (its chart's
# storageClass.stableFolders). Ansible sets it to true only for a cluster that asks
# (k8s_gitops_source_local_path_stable_folders): dev, which restores prod's backup before its apps
# (TASK-0240). c1 keeps false.
localPathStableFolders: false
# The secrets store, OpenBao inside the cluster (D-0058), dev's cluster first. true makes the apps
# `openbao-store` and `openbao` (their `enabledBy`) and the secret-store app's `openbao` store. Ansible
# sets it from k8s_gitops_source_openbao_in_cluster; c1 keeps false and renders as before.
openbaoInCluster: false
# The node that holds the seal key's folder (the local PersistentVolume), private, set by Ansible
# (k8s_gitops_source_openbao_seal_node). Empty: no seal volume is made, and OpenBao's pod waits.
openbaoSealNode: ""
# The agent box's address as a /32, private, set by Ansible (k8s_gitops_source_openbao_box_cidr):
# the only source the admin AppRole signs in from (D-0038 rule 6). Empty: the app's own default,
# 127.0.0.1/32, which a `kubectl port-forward` connection also matches, so it is not a lock; the
# box's hand-over refuses while it is empty (apps/openbao/values.yaml, centralHub.boxCidr).
openbaoBoxCidr: ""
# Which kv/<env>/snapshot-mark the store's snapshot login reads: the cluster's env label, set by Ansible from
# k8s_gitops_cluster_labels.env with the switch on. Empty keeps apps/openbao-store's own value (dev).
openbaoMarkEnv: ""
# The dev-only measurement of the agent box's source address through the Gateway (ADDENDUM-1 v3 step 1,
# MEASURE-1). true makes the openbao-measure app's routes and turns on OpenBao's audit of two request
# headers at its first start. Only hosts/rebuild-k8s.sh sets it, on dev with the
# in-cluster store (k8s_gitops_source_openbao_measure); c1 keeps false and renders as before.
openbaoMeasure: false
# The store's name as the agent box reaches it, private, set by Ansible (k8s_gitops_source_openbao_store_host)
# with the in-cluster store on. Set: the store's certificate carries it (apps/openbao-store, tls.yaml), and the
# box reaches the store by it on the admin address (openbaoAdminAddress).
openbaoStoreHost: ""
# The store's admin address, private, set by Ansible (k8s_gitops_source_openbao_admin_address) with the
# in-cluster store on: one address of the load-balancer pool, on which OpenBao sees the agent box's own
# address, so the admin AppRole's /32 binding passes (apps/openbao-store, admin-path.yaml). It needs
# openbaoSealNode and openbaoBoxCidr. Set it only after role k8s_control_plane's general L2 policy leaves
# out Services labelled central-hub/l2-policy, or that policy announces it from every node too.
openbaoAdminAddress: ""

# Whether the cluster has ClusterIssuer lab-ca, the lab CA that signs Keycloak's certificate (role k8s_certs,
# lab_ca.yml). true, as on c1: jellyfin gets the CA's public root from a Certificate on lab-ca
# (apps/jellyfin, templates/lab-ca.yaml). Ansible sets it to false only for a cluster without it
# (k8s_gitops_source_lab_ca_issuer): dev, which runs no `certs` stage and whose own CA, dev-ca, is made only
# after its `checks` stage, so that Certificate would wait for ever and hold the `apps` stage.
labCaIssuer: true
# Whether the cluster runs the sign-in checks (app login-probe). true, as on c1. Ansible sets it to false only
# for a cluster whose names are not its own (k8s_gitops_source_login_probe): dev, whose lab names resolve to
# prod's Gateway, so its probe would call prod's names from dev (apps/login-probe/values.yaml, hostSuffix).
loginProbe: true
# Whether Jellyfin's setup CronJob (and the admin Secret it signs in with) is made. true, as on c1. Ansible sets it
# to false only for a cluster that restores prod's volumes before the apps start (k8s_gitops_source_jellyfin_setup):
# dev. The restored Jellyfin config already holds prod's admin user and password, which the setup Job's own
# Secret, made fresh in that cluster, can't match, so every run signed in with a 401 and failed `checks`.
jellyfinSetup: true
# Whether monitoring-extras' panel-check CronJob is suspended. false, as on c1. Ansible sets it to true only for dev
# (k8s_gitops_source_panel_check_suspended): there a tick inside the run failed the Job and `checks`, because seven panels
# printed no data. Keycloak's has none before the `identity-keycloak` stage (after `apps`); the five OpenBao ones and
# Jellyfin's request rate had none for a cause not measured.
panelCheckSuspended: false

# The agent notebook's CI runner as a pod (app notebook-runner). Ansible sets it to true on prod only
# (k8s_gitops_source_notebook_runner, from the prod wrappers), so a dev cluster never registers a second
# runner under the same name. false renders nothing.
notebookRunner: false

# The shared node the share pod forwards to, <address>:<port>. Private; set by Ansible
# (k8s_gitops_source_share_target). Empty, as now: the share-pod app renders nothing.
shareTarget: ""
# Where the apps' ExternalSecrets read their values (D-0058 rules 5 and 8; plan step 8a). Empty or `c1`,
# as now: Secret <name> in namespace secret-source, through store `c1`. `openbao`: key `c1/<name>` in
# OpenBao, through store `openbao`, so it needs openbaoInCluster. Ansible sets it from
# k8s_gitops_source_app_secrets_store, and only once every value is in OpenBao and in its SOPS copy
# (docs/runbooks/set-up-the-secrets-store.md, "The apps' secrets"). The apps alerts, monitoring-extras and share-pod.
appSecretsStore: ""

# Where the children read their values: this repository, anonymous HTTPS, no credential (D-0023).
repoURL: https://github.com/jonhill90/central-hub
targetRevision: main
appsPath: hosts/kubernetes/home/c1/apps
# The Argo CD project every child Application belongs to: AppProject `c1`, which the root chart
# makes (templates/project.yaml, Activation gate item 5). `default` puts them back.
project: c1

# How an automatically synced child retries a failed sync: 15 tries, waiting 15 s, then twice as
# long each time up to 5 min, about an hour in all. Enough for a fresh cluster, where apps wait on
# another app's CRDs or webhook (RB1 run 8, 2026-11-10); an app still failing after that needs a look.
syncRetry:
  limit: 15
  backoff:
    duration: 15s
    factor: 2
    maxDuration: 5m

# What AppProject `c1` allows. Source repositories and destination namespaces come from `apps`
# (this repository, each `chart.repoURL`, each `namespace`), plus the lists below.
c1Project:
  # The pause switch (Activation gate item 5, and the cluster half of break-glass): true adds a deny
  # sync window that is always open, so Argo CD syncs no child Application, by hand or on its own,
  # until it is false again. The root Application is in project `default`, so it still syncs this.
  syncPaused: false
  # Namespaces that a chart writes to besides the `namespace` of some app. Checked against the
  # rendered charts on 2026-11-09: secret-store makes `secret-source`, where its source secret sits.
  # Not `argocd`: the child Application objects are the root's, and the root stays in `default`.
  extraNamespaces:
    - secret-source
  # Cluster-scoped kinds the charts make, and nothing else (Argo CD refuses any other). Each new
  # kind is a PR. Checked against the rendered charts on 2026-11-09.
  clusterResources:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: apiregistration.k8s.io, kind: APIService}
    - {group: storage.k8s.io, kind: StorageClass}
    - {group: external-secrets.io, kind: ClusterSecretStore}

# One entry per component, in the order they moved (spec, "Order"). Each one:
#   namespace    where the chart installs
#   chart        repoURL, name and version of the upstream Helm chart (version per STD-0003).
#                An oci:// repoURL also takes `digest`, the chart manifest's sha256: Argo CD fetches
#                that digest, never the tag, so a re-pushed tag changes nothing (pick 141); `version`
#                stays for people, and CI checks the chart at that digest has that version
#   local        true: a chart kept in this repository at appsPath/<name>/ instead of `chart`
#   releaseName  the Helm release name today, so the objects keep their names (default: the key)
#   needsZone    pass `zone` to the chart as a value
#   zoneParameters  value path -> text with "{zone}" in it, passed as a Helm parameter (the zone is
#                private, so a URL that holds it can't sit in a values file)
#   switchParameters  value path -> name of a true/false root value; the parameter "true" is passed
#                only when that root value is true, so a cluster that leaves it false renders as before
#   switchOffParameters  value path -> name of a true/false root value; the parameter "false" is passed
#                only when that root value is false, so a cluster that leaves it true renders as before
#   valueFiles   the values files in appsPath/<name>/, in order (default: values.yaml)
#   syncOptions  Argo CD sync options, for example ServerSideApply=true for charts with large CRDs
#   ignoreDifferences  fields Argo CD leaves alone, for example a password the chart makes at random
#   rootParameters  value path -> name of a root value; passed as a Helm parameter when that root
#                value is set (private values such as an address or a node name)
#   enabledBy    name of a true/false root value: the app's Application is made only when it is true
#                (dev first, D-0058); without it the app is made on every cluster
#   clusterResources  cluster-scoped kinds only this app makes, added to the project's whitelist
#                only where the app is made (with enabledBy, only where that value is true)
#   wave         sync order when the root syncs, lowest first (default 0): -3 storage, -2 operators
#                and their CRDs, -1 what they serve (the secret store), 0 apps
#   autoSync     true: Argo CD syncs the app on its own, so a fresh cluster installs every app
#                from git (the owner's card, 2026-11-10 02:50 UTC). false only while an app's
#                take-over diff is checked or its live objects differ from git
#   prune        delete objects that leave git; false until one cycle runs clean
apps:
  metrics-server:
    namespace: kube-system
    chart:
      repoURL: https://kubernetes-sigs.github.io/metrics-server/
      name: metrics-server
      version: 3.14.0   # metrics-server 0.9.0, 2026-08-19; same as k8s_observability today
    autoSync: true
    prune: false
  # Volumes (spec step 2): the provisioner and the default StorageClass. The data disk itself stays
  # with Ansible (k8s_storage, tag disk).
  local-path:
    namespace: local-path-storage
    local: true
    # Root value -> this chart's value, passed only when the root value is true.
    switchParameters:
      storageClass.stableFolders: localPathStableFolders
    wave: -3
    autoSync: true    # on 2026-11-10: its diff on c1 at 03:08 UTC was Argo CD's tracking only
    prune: false
  jellyfin:
    namespace: media
    local: true
    needsZone: true
    zoneParameters:
      gateway.https: "{gatewayHttps}"
    # No ClusterIssuer lab-ca (dev): read the lab root from its optional Secret instead, which is not there,
    # so Jellyfin's SSO setup skips (apps/jellyfin, files/setup.sh).
    # No setup CronJob on a cluster that restores prod's Jellyfin config (dev, jellyfinSetup false): the config
    # already has prod's admin password, which the fresh admin Secret there can't match.
    switchOffParameters:
      sso.labRoot.certificate: labCaIssuer
      setup.enabled: jellyfinSetup
    autoSync: true    # on 2026-11-10: its diff on c1 at 03:08 UTC was Argo CD's tracking only
    prune: false
  # Logs (spec step 3): two releases in namespace logging, as k8s_observability installed them.
  loki:
    namespace: logging
    chart:
      # The project's own OCI copy of the file on grafana-community.github.io (the chart layers'
      # SHA-256 matched, bfa76744...edbe0a, 2026-11-12).
      repoURL: oci://ghcr.io/grafana-community/helm-charts/loki
      name: loki
      version: 18.15.1   # Loki 3.7.8, 2026-10-09; same as k8s_observability today
      digest: sha256:97ac03444f2f4689a84c575e06318acf4297bbf15443b0fbd5481ab6ec476b42
    autoSync: true
    prune: false
  alloy:
    namespace: logging
    chart:
      repoURL: https://grafana.github.io/helm-charts
      name: alloy
      version: 1.13.1   # Alloy v1.20.1, 2026-10-08; same as k8s_observability today
    autoSync: true
    prune: false
  # Metrics (spec step 4). values-sso.yaml and the auth_url parameter give Grafana its sign-in
  # through Keycloak, as k8s_observability_grafana_sso does in the inventory (on for c1 since 2026-11-09).
  kube-prometheus-stack:
    namespace: monitoring
    chart:
      # The project's own OCI copy of the file on prometheus-community.github.io (the chart layers'
      # SHA-256 matched, 5c976ae9...e6bd6a, 2026-11-12).
      repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
      name: kube-prometheus-stack
      version: 92.3.1   # Prometheus Operator v0.94.1, 2026-10-13; same as k8s_observability today
      digest: sha256:bb8dae4452aefa2e1fcfd23af35c0b3f8aa070e339aa7efec32848efb6886a24
    valueFiles: [values.yaml, values-sso.yaml]
    zoneParameters:
      # Short aliases (STD-0001 rules 5 and 7), as k8s_observability_short_names.
      grafana.grafana\.ini.server.root_url: "https://grafana.{zone}/"
      grafana.grafana\.ini.auth\.generic_oauth.auth_url: "https://sso.{zone}/realms/lab/protocol/openid-connect/auth"
    # The CRDs are too large for a client-side apply's annotation.
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
    # Grafana's chart makes a new random admin password at every render; keep the one on the cluster.
    # The Deployment carries that password's checksum, so it changes at every render too, and with
    # selfHeal each sync rolled Grafana out again (a new ReplicaSet every 5 to 10 minutes on c1,
    # 2026-11-18 03:00 to 04:15 UTC). Keep the live checksum as well.
    ignoreDifferences:
      - kind: Secret
        name: kube-prometheus-stack-grafana
        namespace: monitoring
        jsonPointers: [/data]
      - group: apps
        kind: Deployment
        name: kube-prometheus-stack-grafana
        namespace: monitoring
        jsonPointers: [/spec/template/metadata/annotations/checksum~1secret]
    autoSync: true    # on 2026-11-10: its diff on c1 at 03:08 UTC was the sign-in, now in valueFiles
    prune: false
  # Secrets (spec step 5): External Secrets and the one store `c1` every ExternalSecret names.
  external-secrets:
    namespace: external-secrets
    chart:
      # The project's own OCI copy of the file on charts.external-secrets.io (the chart layers'
      # SHA-256 matched, 0a6d9e91...ee5e34, 2026-11-12).
      repoURL: oci://ghcr.io/external-secrets/charts/external-secrets
      name: external-secrets
      version: 2.14.0   # 2026-10-23, the first to list Kubernetes 1.37; same as k8s_secrets today
      digest: sha256:0e3d45f11522f2730ff55deef57bc43e0ff4aadc00bdab5557fa4d354b0c3ab7
    wave: -2
    syncOptions: [ServerSideApply=true]
    autoSync: true
    prune: false
  secret-store:
    namespace: external-secrets
    local: true
    switchParameters:
      openbao.inCluster: openbaoInCluster
    wave: -1
    autoSync: true    # on 2026-11-10: its diff on c1 at 03:08 UTC was Argo CD's tracking only
    prune: false
  # The agents' read-only account (TASK-0215, pick 216): view everything but Secrets. Its token
  # Secret is filled in by Kubernetes, so Argo CD leaves the token's fields alone.
  agent-read:
    namespace: agent-read
    local: true
    ignoreDifferences:
      - kind: Secret
        name: agent-read-token
        namespace: agent-read
        jsonPointers: [/data]
    autoSync: true
    prune: false
  # Sign-in checks from inside c1, no password (runbook set-up-lab-sign-in.md, "Prove it"): a CronJob, every
  # 10 minutes, whose newest Job log prints PASS or FAIL lines for the Keycloak clients, Argo CD and Jellyfin.
  login-probe:
    namespace: login-probe
    local: true
    enabledBy: loginProbe
    needsZone: true
    autoSync: true
    prune: false
  # A small pod with its own tailnet identity (tag:share-pod) that forwards one port to a node another
  # tailnet shares in. It holds no lab secret and no Kubernetes credential
  # (docs/runbooks/reach-the-shared-node-through-the-share-pod.md).
  share-pod:
    namespace: share-pod
    local: true
    rootParameters:
      target: shareTarget
      authKey.store: appSecretsStore
    autoSync: true
    prune: false
  # The agent notebook's CI runner (label `notebook`), one locked-down pod in place of VM 300, which stays
  # as the fallback until the pod has run the notebook's checks green on three PRs
  # (docs/runbooks/run-the-notebook-runner-on-c1.md). Prod only.
  notebook-runner:
    namespace: notebook-runner
    local: true
    enabledBy: notebookRunner
    autoSync: true
    prune: false
  # Certificates (spec step 6): cert-manager itself. The issuers and the Gateway's certificate stay
  # with Ansible (k8s_certs, tag issue) until the lab PKI work gives them a `certs` app here.
  cert-manager:
    namespace: cert-manager
    chart:
      # The project's own OCI copy of the file on charts.jetstack.io (the chart layers' SHA-256
      # matched the one k8s_certs checks, 9ec67938...373a17, 2026-11-12).
      repoURL: oci://quay.io/jetstack/charts/cert-manager
      name: cert-manager
      version: v1.21.3   # security release, STD-0003 rule 2; same as k8s_certs today
      digest: sha256:e482675aec32862d323a9218293ff7de81192337998615e4378c56498473f240
    wave: -2
    syncOptions: [ServerSideApply=true]
    autoSync: true
    prune: false
  # The way in (spec step 9): Gateway `apps` and the routes of apps whose charts make none. The
  # node firewall ports stay with Ansible (k8s_gateway).
  gateway:
    namespace: gateway
    local: true
    needsZone: true
    zoneParameters:
      address: "{gatewayAddress}"
      https: "{gatewayHttps}"
    wave: -1
    autoSync: true
    prune: false
  # c1's own alert rules, the Argo CD scrape and the lab dashboard (needs the CRDs from
  # kube-prometheus-stack, so it waits for it).
  monitoring-extras:
    namespace: monitoring
    local: true
    # The OpenBao alerts only where the store is in the cluster (D-0058).
    switchParameters:
      openbao.inCluster: openbaoInCluster
      panelCheck.suspend: panelCheckSuspended
    rootParameters:
      ntfy.store: appSecretsStore
      heartbeat.store: appSecretsStore
    wave: 1
    autoSync: true
    prune: true
  # Where c1's alerts go (ntfy); Alertmanager in kube-prometheus-stack posts to it.
  alerts:
    namespace: alerts
    local: true
    needsZone: true
    rootParameters:
      auth.store: appSecretsStore
    autoSync: true
    prune: true
  # The secrets store inside the cluster (D-0058), only where openbaoInCluster is true (dev first).
  # openbao-store: the namespace, the seal key's local volume, the TLS certificates, the policy files
  # and the bootstrap account; openbao: OpenBao's own chart, with its network limit
  # (docs/runbooks/set-up-the-secrets-store.md).
  openbao-store:
    namespace: openbao
    local: true
    enabledBy: openbaoInCluster
    rootParameters:
      sealNode: openbaoSealNode
      markEnv: openbaoMarkEnv
      boxHost: openbaoStoreHost
      adminAddress: openbaoAdminAddress
      boxCidr: openbaoBoxCidr
    # The seal key's local volume (D-0058 rule 3); no other app makes a PersistentVolume. The admin
    # path's L2 announcement policy (admin-path.yaml), only with openbaoAdminAddress.
    clusterResources:
      - {group: "", kind: PersistentVolume}
      - {group: cilium.io, kind: CiliumL2AnnouncementPolicy}
    # After cert-manager (-2): its Issuers and Certificates need cert-manager's CRDs.
    wave: -1
    autoSync: true
    prune: false
  openbao:
    namespace: openbao
    chart:
      repoURL: https://openbao.github.io/openbao-helm
      name: openbao
      version: 0.30.6   # 2026-10-27, OpenBao v2.7.2; the newest at least two weeks old (STD-0003 rule 1)
      # The chart's SHA-256 from the repository's index.yaml (D-0058 rule 1). CI (parity.py) fails if this
      # version is served with other bytes; Argo CD's own pull at sync is not checked against it.
      sha256: 76e90c2315a4922b4b0c6c63fd8a00b9f4bdf0cffda160664f8ea5762d59911c
    enabledBy: openbaoInCluster
    rootParameters:
      centralHub.boxCidr: openbaoBoxCidr
    switchParameters:
      centralHub.measure: openbaoMeasure
    # After openbao-store (-1), which makes its certificate Secret.
    wave: 0
    autoSync: true
    prune: false
  # The measurement of the agent box's source address through the Gateway (MEASURE-1), dev only.
  # It renders its objects only while openbaoMeasure is true and nothing otherwise, and it prunes, so
  # turning the value off removes them (openbao-store and openbao keep prune false).
  openbao-measure:
    namespace: openbao
    local: true
    needsZone: true
    enabledBy: openbaoInCluster
    switchParameters:
      measure: openbaoMeasure
    # After openbao (0): its routes point at OpenBao's Service.
    wave: 1
    autoSync: true
    prune: true
