---
argument_specs:
  main:
    short_description: One shared Cilium Gateway for web traffic, and its smoke test (BUILD-PATH S11)
    options:
      k8s_gateway_zone: {type: str, required: true, description: "The DNS zone. Private."}
      k8s_gateway_address: {type: str, required: true, description: "The Gateway's address, one address from the load-balancer pool. Private."}
      k8s_gateway_cluster: {type: str, default: c1, description: Cluster name in the hostname.}
      k8s_gateway_env: {type: str, default: prod, description: Environment name in the hostname.}
      k8s_gateway_name:
        type: str
        default: apps
        description: "Gateway name, also the first label of the listener hostname (*.apps.<cluster>.<env>.<zone>)."
      k8s_gateway_namespace: {type: str, default: gateway, description: Namespace the Gateway lives in.}
      k8s_gateway_class: {type: str, default: cilium, description: GatewayClass; Cilium makes `cilium` when its Gateway API controller is on.}
      k8s_gateway_firewall_zone: {type: str, default: lab, description: firewalld zone of the lab NIC on every node.}
      k8s_gateway_node_ports: {type: list, elements: str, default: [80/tcp], description: Listener ports that zone accepts.}
      k8s_gateway_smoke_name: {type: str, default: hello, description: First label of the smoke test's hostname.}
      k8s_gateway_smoke_namespace: {type: str, default: gateway-smoke, description: "Namespace of the smoke test app, deleted afterwards."}
      k8s_gateway_smoke_image: {type: str, default: "registry.k8s.io/e2e-test-images/agnhost:2.53", description: Echo app image.}
      k8s_gateway_smoke_client:
        type: str
        description: "Inventory host that calls the Gateway from outside the cluster. Default: the first host of group proxmox."
