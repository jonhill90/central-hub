---
# Derived values, not inputs.
k8s_gateway_apps_domain: "{{ k8s_gateway_name }}.{{ k8s_gateway_cluster }}.{{ k8s_gateway_env }}.{{ k8s_gateway_zone }}"
k8s_gateway_smoke_host: "{{ k8s_gateway_smoke_name }}.{{ k8s_gateway_apps_domain }}"
# The listener ports the nodes' lab zone accepts: k8s_gateway_node_ports, plus 443 with HTTPS on.
k8s_gateway_open_ports: "{{ (k8s_gateway_node_ports + (['443/tcp'] if k8s_gateway_https else [])) | unique }}"
