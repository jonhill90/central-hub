---
# BUILD-PATH S11: one shared Gateway, the cluster's way in for web traffic (Cilium Gateway API,
# the owner's yes 2026-10-26 22:47 UTC). Every input is listed here (Red Hat CoP rule); the
# private ones have no default and are listed commented out.
#
# Private, no default, set in the inventory:
# k8s_gateway_zone: <zone>        # the DNS zone; the listener takes *.apps.<cluster>.<env>.<zone>
# k8s_gateway_address: <address>  # one address from the cluster's load-balancer pool (STD-0002
#                                 # VLAN 10 .224/27), pinned so the DNS override can point at it

# Names (STD-0001 "Service names": <component>.<cluster>.<env>.<zone>, with *.apps. per cluster).
k8s_gateway_cluster: c1
k8s_gateway_env: prod
k8s_gateway_name: apps
k8s_gateway_namespace: gateway
k8s_gateway_class: cilium

# The node firewalld zone the lab NIC is in (k8s_node_firewall_zone), and the listener port that
# zone must accept for Envoy (Cilium hands Gateway traffic to Envoy on the node with TPROXY, so it
# goes through the node's input filter).
k8s_gateway_firewall_zone: lab
k8s_gateway_node_ports: [80/tcp]

# BUILD-PATH S12: an HTTPS listener on 443 for the same names, ending TLS at the Gateway with the
# wildcard certificate role k8s_certs issues into this Secret (in the Gateway's namespace). Off
# until that Secret exists (playbooks/k8s-certs.yml --tags issue); on, it also opens tcp 443 in
# the zone above. The HTTP listener on 80 stays.
k8s_gateway_https: false
k8s_gateway_tls_secret: apps-tls
# STD-0001 rule 5: short aliases <app>.<zone> for prod, next to the service names. On, the Gateway
# gets a second pair of listeners, http-short and https-short, for *.<zone>; app routes attach to
# them with their short name (k8s_app_route_short_names and the charts' shortNames). The
# certificate must name *.<zone> too (k8s_certs_short_names), and the lab DNS must answer each
# short name (docs/runbooks/set-up-short-app-names.md).
k8s_gateway_short_names: true
# Argo CD manages the Gateway from hosts/kubernetes/home/c1/apps/gateway/ (spec
# 2026-11-c1-apps-under-argo-cd, step 9). True once its Application is Synced: the role then only
# opens the node firewall ports and checks the Gateway. False keeps Ansible in charge (the way back).
k8s_gateway_by_argocd: false

# Smoke test: an echo app at <name>.apps.<cluster>.<env>.<zone>, called through the Gateway
# address from a machine outside the cluster (the Proxmox host, Ansible's jump host), then
# deleted. k8s_gateway_smoke_client defaults to the first host of the inventory group proxmox.
k8s_gateway_smoke_name: hello
k8s_gateway_smoke_namespace: gateway-smoke
k8s_gateway_smoke_image: registry.k8s.io/e2e-test-images/agnhost:2.53
k8s_gateway_smoke_client: "{{ groups['proxmox'] | first }}"
# Whether the lab's wildcard DNS override sends this cluster's names to this cluster's Gateway. True
# for c1. False in the dev inventory: a dev rebuild uses c1's names while the wildcard still points
# at prod's Gateway, so a name check there would test prod. The checks that call the Gateway by its
# address with a Host header stay on either way.
k8s_lab_dns_points_here: true
