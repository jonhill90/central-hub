---
# Needs k8s_control_plane with k8s_control_plane_gateway_api: true (the Gateway API CRDs and
# Cilium's controller), which makes GatewayClass cilium.
- name: gateway | GatewayClass accepted
  ansible.builtin.command: >-
    kubectl wait --for=condition=Accepted gatewayclass/{{ k8s_gateway_class }} --timeout=120s
  changed_when: false
  check_mode: false

# Envoy on the node takes the Gateway's traffic through TPROXY, so the node's own input filter
# sees it; the lab zone has only the Kubernetes ports open (k8s_node step 4).
- name: gateway | Listener ports in the lab zone on every node
  ansible.posix.firewalld:
    zone: "{{ k8s_gateway_firewall_zone }}"
    port: "{{ item.1 }}"
    permanent: true
    immediate: true
    state: enabled
  delegate_to: "{{ item.0 }}"
  loop: "{{ groups['k8s_nodes'] | product(k8s_gateway_open_ports) | list }}"
  loop_control:
    label: "{{ item.0 }} {{ item.1 }}"

- name: gateway | Folder for the manifests
  ansible.builtin.file: {path: /root/central-hub, state: directory, mode: "0700"}

# A listener whose Secret is missing isn't programmed, so HTTPS waits for the certificate.
- name: gateway | The certificate's Secret is there for the HTTPS listener
  ansible.builtin.command: >-
    kubectl -n {{ k8s_gateway_namespace }} get secret {{ k8s_gateway_tls_secret }} -o name
  register: k8s_gateway_tls_present
  changed_when: false
  failed_when: false
  check_mode: false
  when: k8s_gateway_https

- name: gateway | Stop if HTTPS is on without its Secret
  ansible.builtin.assert:
    that: [k8s_gateway_tls_present.rc == 0]
    fail_msg: >-
      Secret {{ k8s_gateway_namespace }}/{{ k8s_gateway_tls_secret }} doesn't exist. Issue the
      certificate first: playbooks/k8s-certs.yml --tags issue with k8s_certs_issue true.
    quiet: true
  when: k8s_gateway_https and not ansible_check_mode

- name: gateway | Gateway manifest
  ansible.builtin.template:
    src: gateway.yaml.j2
    dest: /root/central-hub/gateway.yaml
    mode: "0600"

# kubectl diff exits 0 with no difference, 1 with one, more on an error. On the first run the
# Gateway's namespace doesn't exist yet, and the diff of the Gateway in it fails with
# "namespaces ... not found" (measured); that also means "apply".
- name: gateway | Gateway differs from the cluster?
  ansible.builtin.command: kubectl diff -f /root/central-hub/gateway.yaml
  register: k8s_gateway_diff
  changed_when: false
  failed_when: k8s_gateway_diff.rc > 1 and 'namespaces' not in k8s_gateway_diff.stderr
  check_mode: false

- name: gateway | Apply the Gateway
  ansible.builtin.command: kubectl apply -f /root/central-hub/gateway.yaml
  when: k8s_gateway_diff.rc != 0
  changed_when: true

- name: gateway | Gateway programmed
  ansible.builtin.command: >-
    kubectl -n {{ k8s_gateway_namespace }} wait --for=condition=Programmed
    gateway/{{ k8s_gateway_name }} --timeout=180s
  changed_when: false
  when: not ansible_check_mode

- name: gateway | Gateway has the pinned address
  ansible.builtin.command: >-
    kubectl -n {{ k8s_gateway_namespace }} get gateway {{ k8s_gateway_name }}
    -o jsonpath={.status.addresses[*].value}
  register: k8s_gateway_status_address
  changed_when: false
  failed_when: k8s_gateway_status_address.stdout != k8s_gateway_address
  when: not ansible_check_mode
