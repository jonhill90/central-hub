---
- name: The names are not blank
  ansible.builtin.assert:
    that:
      - proxmox_cert_names | length > 0
      - proxmox_cert_names | select('match', '^\s*$') | list | length == 0
    fail_msg: proxmox_cert_names is a private value; fill it in the inventory.
    quiet: true

- name: Certificate manifest on c1
  ansible.builtin.template:
    src: certificate.yaml.j2
    dest: /root/central-hub/proxmox-cert.yaml
    mode: "0600"
  delegate_to: "{{ proxmox_cert_issuer_host }}"
  become: true

- name: Certificate differs on c1?
  ansible.builtin.command: kubectl diff -f /root/central-hub/proxmox-cert.yaml
  delegate_to: "{{ proxmox_cert_issuer_host }}"
  become: true
  register: proxmox_cert_diff
  changed_when: false
  failed_when: proxmox_cert_diff.rc > 1
  check_mode: false

- name: Apply the Certificate on c1
  ansible.builtin.command: kubectl apply -f /root/central-hub/proxmox-cert.yaml
  delegate_to: "{{ proxmox_cert_issuer_host }}"
  become: true
  when: proxmox_cert_diff.rc != 0
  changed_when: true

- name: Certificate issued by {{ proxmox_cert_issuer }}
  ansible.builtin.command: >-
    kubectl -n {{ proxmox_cert_namespace }} wait --for=condition=Ready --timeout=120s
    certificate/{{ proxmox_cert_name }}
  delegate_to: "{{ proxmox_cert_issuer_host }}"
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Read the issued Secret
  ansible.builtin.command: >-
    kubectl -n {{ proxmox_cert_namespace }} get secret {{ proxmox_cert_name }}-tls -o json
  delegate_to: "{{ proxmox_cert_issuer_host }}"
  become: true
  register: proxmox_cert_secret
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Certificate, key and root
  ansible.builtin.set_fact:
    proxmox_cert_crt: "{{ (proxmox_cert_secret.stdout | from_json).data['tls.crt'] | b64decode }}"
    proxmox_cert_key: "{{ (proxmox_cert_secret.stdout | from_json).data['tls.key'] | b64decode }}"
    proxmox_cert_root: "{{ (proxmox_cert_secret.stdout | from_json).data['ca.crt'] | b64decode }}"
  no_log: true
  when: not ansible_check_mode

- name: The lab root in the host's trust store
  ansible.builtin.copy:
    content: "{{ proxmox_cert_root }}"
    dest: "{{ proxmox_cert_root_file }}"
    mode: "0644"
  notify: Rebuild the host's trust store
  when: not ansible_check_mode

- name: The certificate the web UI serves now
  ansible.builtin.shell: >-
    set -o pipefail;
    openssl x509 -in /etc/pve/local/pveproxy-ssl.pem -noout -fingerprint -sha256 2>/dev/null || true
  args:
    executable: /bin/bash
  register: proxmox_cert_now
  changed_when: false
  check_mode: false

- name: The issued certificate's fingerprint
  ansible.builtin.command: openssl x509 -noout -fingerprint -sha256
  args:
    stdin: "{{ proxmox_cert_crt }}"
  register: proxmox_cert_new
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

# pvenode cert set writes /etc/pve/local/pveproxy-ssl.{pem,key} and restarts pveproxy. The key
# goes through a 0600 temp file, removed straight after.
- name: Set the certificate on the host
  when:
    - not ansible_check_mode
    - proxmox_cert_now.stdout | trim != proxmox_cert_new.stdout | trim
  block:
    - name: Temp folder for the certificate files
      ansible.builtin.tempfile:
        state: directory
      register: proxmox_cert_tmp

    - name: Certificate and key in the temp folder
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ proxmox_cert_tmp.path }}/{{ item.name }}"
        mode: "0600"
      loop:
        - { name: cert.pem, content: "{{ proxmox_cert_crt }}" }
        - { name: key.pem, content: "{{ proxmox_cert_key }}" }
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Pvenode cert set
      ansible.builtin.command: >-
        pvenode cert set {{ proxmox_cert_tmp.path }}/cert.pem {{ proxmox_cert_tmp.path }}/key.pem
        --force 1 --restart 1
      changed_when: true

  always:
    - name: Remove the temp folder
      ansible.builtin.file:
        path: "{{ proxmox_cert_tmp.path }}"
        state: absent
      when: proxmox_cert_tmp.path is defined

- name: Proof
  ansible.builtin.debug:
    msg: "The Proxmox web UI serves {{ proxmox_cert_new.stdout | default('(check mode)') }} for {{ proxmox_cert_names | join(', ') }}"
