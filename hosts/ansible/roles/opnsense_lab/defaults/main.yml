---
# Every input of this role is listed here (Red Hat CoP roles README L424-436). An input with no
# meaningful default is listed commented out: the role stops with an error if the inventory
# doesn't set it (the owner said yes to the CoP rule on 2026-10-26 at 00:35 UTC).
#
# Private, no default, from the secret store through the inventory:
# opnsense_api_host, opnsense_api_key, opnsense_api_secret, opnsense_home_lan_cidr,
# opnsense_dns_zone.

# REQUIRED, from the one shared VLAN file (inventories/<place>/group_vars/all/vlans.yml, the owner,
# 2026-10-26 06:08 UTC): lab_vlans, one entry per VLAN with id, name, alias, cidr.
# lab_vlans: [...]

# The trunk port inside OPNsense (net0 on vmbr1).
opnsense_lab_parent: vtnet0

# REQUIRED, set per firewall in the inventory. This firewall's settings for each VLAN in
# lab_vlans, by VLAN name. ifname is the OPNsense interface slot; bootstrap: true marks the mgmt
# VLAN, made at the console before the API can be reached, so this role leaves its VLAN and
# slot alone.
# opnsense_lab_vlan_settings:
#   prod: { ifname: opt1, dhcp: true, bootstrap: false }
#   mgmt: { ifname: lan, dhcp: false, bootstrap: true }

# REQUIRED, set per place in the inventory. The mgmt VLAN: OPNsense LAN, web GUI and API.
# opnsense_lab_mgmt_tag: <VLAN ID>

# REQUIRED, set per place in the inventory. DHCP pool host numbers (the last number of the
# address). Keep the pool below the .224/27 load-balancer reserve.
# opnsense_lab_dhcp_first: <number>
# opnsense_lab_dhcp_last: <number>

# Lab-only DNS names (Unbound host overrides), for example the cluster API. hostname is relative
# to opnsense_dns_zone, or to subdomain.<zone> when an entry sets subdomain; hostname "*" with a
# subdomain is a wildcard (the c1 Gateway's *.apps.c1.prod). address is private, so the real list
# goes in the inventory.
opnsense_lab_host_overrides: []

# App short aliases <app>.<zone> (STD-0001 rule 5) that need no private value of their own: each
# becomes an Unbound host override pointing at the c1 Gateway, k8s_gateway_address. The names are
# the apps' own (they are already public here), so they live in the role, not in the private
# inventory. Do not list the same alias in opnsense_lab_host_overrides as well: both tasks match on
# the same host and domain, so if their value or description differs, each run rewrites the record
# twice.
opnsense_lab_short_app_names:
  - hub
  - homeassistant
  - mealie
  - headlamp
  - openbao
  - vault

# Short aliases that are retired (the app was renamed): each has its Unbound host override removed, so a rename does
# not leave the old name answering. central-hub-app became hub (2026-11-21), but the owner chose on 2026-11-22 to leave
# its old override in place, so the list is empty; add central-hub-app here to remove it.
opnsense_lab_short_app_names_retired: []

# The DNS server the proof (tag dns_proof) asks. Empty means the mgmt gateway, Unbound itself; on a
# tailnet device, 100.100.100.100 proves split DNS end to end.
opnsense_lab_dns_proof_server: ""

# The API's certificate is always checked against opnsense_lab_ssl_ca_file, the lab root (pick 30);
# playbooks/tasks/opnsense-tls.yml decides it, with its one-time bootstrap switch.

# The names the agent box's rules may have (tasks/agent_box.yml). Each target takes one, and every
# name that is not a current target has its rule removed. Keep in step with the inventory's targets.
opnsense_lab_agent_box_target_names: [Proxmox API, c1 API, prod node 200 SSH, prod node 201 SSH, OPNsense API, tenant lab SSH]
# The rules' sequence numbers, in target order: ahead of the dev VLAN's own rules (10 and up), and clear of the
# management rules (5 to 7, one per other lab VLAN).
opnsense_lab_agent_box_sequences: [1, 2, 3, 4, 8, 9]

# Pass rules from named lab VMs to the c1 Gateway on 443 (tasks/app_access.yml), so a browser or a check there opens
# the apps' names. Optional and private (addresses), from the inventory; unset = no such rules, and any left from an
# earlier run are removed. Applying a change is a firewall change on the owner's tap (D-0036 rule 8).
# opnsense_lab_app_access:
#   vlan: 30                     # the sources' VLAN tag (dev)
#   gateway: <address>           # the c1 Gateway's address (Gateway gateway/apps, status.addresses)
#   sources:
#     - { name: agent box, address: <VM 258's dev address> }
#     - { name: desktop VM, address: <VM 400's dev address> }
# The names the rules may have; a name that is not a current source loses its rule.
opnsense_lab_app_access_names: [agent box, desktop VM]
# The rules' sequence numbers, in source order: ahead of the dev VLAN's own rules (90 and up with today's VLAN file)
# and clear of every other rule the role numbers; the role checks both.
opnsense_lab_app_access_sequences: [11, 12]

# Pass rules from the c1 nodes to the Proxmox host's ssh on its VNet mgmt address (tasks/backup_target.yml), so restic
# reaches its sftp target there (the owner, 2026-11-18 07:44 UTC: back up on the Proxmox host; agent pick 262).
# Optional and private (addresses), from the inventory; unset = no such rules, and any left from an earlier run are
# removed. Applying a change is a firewall change on the owner's go (D-0036 rule 8).
# opnsense_lab_backup_target:
#   vlan: 10                     # the sources' VLAN tag (prod); a source may name its own `vlan`
#   host: <address>              # the host's address on VNet mgmt (proxmox_host_mgmt_address)
#   sources:
#     - { name: prod node 200, address: <VM 200's address> }
#     - { name: prod node 201, address: <VM 201's address> }
#     - { name: dev worker, address: <dev worker's address>, vlan: 30 }   # dev's read-only restore (runbook P3)
# The names the rules may have; a name that is not a current source loses its rule.
# Sources added from outside the inventory, each {name, address, vlan} like the sources above: the agent box's firewall job puts the
# dev worker's address here from its handoff file (hosts/ansible/roles/agent_box/files/dev-worker-address.sh). They are joined to
# opnsense_lab_backup_target.sources and go through the same checks. Empty: nothing is added.
opnsense_lab_backup_target_extra_sources: []
opnsense_lab_backup_target_names: [prod node 200, prod node 201, dev worker, agent box]
# The rules' sequence numbers, in source order, clear of every other rule the role numbers; the role checks it.
opnsense_lab_backup_target_sequences: [13, 14, 17, 18]

# One pass rule from the agent box to the secrets store's admin address in prod's c1 on 443 (tasks/store_admin.yml,
# D-0062 rule 4). Optional and private (addresses), from the inventory; unset = no such rule, and one left from an
# earlier run is removed. Applying a change is a firewall change on the owner's go (D-0036 rule 8).
# opnsense_lab_store_admin:
#   vlan: 30                     # the box's VLAN tag (dev)
#   source: <address>            # VM 258's dev address
#   address: <address>           # the store's admin address (admin_address in agent_box_openbao_prod)
# The rule's sequence number: ahead of the dev VLAN's own rules (90 and up with today's VLAN file) and clear of every
# other rule the role numbers, the app access and backup target rules included; the role checks both.
opnsense_lab_store_admin_sequence: 15

# One pass rule from the agent box to the Proxmox host's web UI on 443 (tasks/proxmox_web.yml), so the scripted Proxmox
# sign-in check reaches the web UI's name. Optional and private (addresses), from the inventory; unset = no such rule, and
# one left from an earlier run is removed. Applying a change is a firewall change on the owner's go (D-0036 rule 8).
# opnsense_lab_proxmox_web:
#   vlan: 30                     # the box's VLAN tag (dev)
#   source: <address>            # VM 258's dev address
#   address: <address>           # the host's address on VNet mgmt (proxmox_host_mgmt_address)
# The rule's sequence number: ahead of the dev VLAN's own rules (90 and up with today's VLAN file) and clear of every
# other rule the role numbers; the role checks both.
opnsense_lab_proxmox_web_sequence: 16
