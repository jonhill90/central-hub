---
# Inputs of the opnsense_lab role. Ansible checks these before the role runs and stops if a
# required one is missing or has the wrong type (the owner, 2026-10-26 02:49 UTC). required: true does
# not reject an empty string, so tasks/main.yml still checks the private values are not blank.
argument_specs:
  main:
    short_description: OPNsense lab VLANs, DHCP, firewall rules and DNS override, through the OPNsense API
    options:
      # Private, from the secret store through the inventory
      opnsense_api_host:
        type: str
        required: true
        description: Address or name the OPNsense API is reached on.
      opnsense_api_key:
        type: str
        required: true
        description: OPNsense API key. Secret.
      opnsense_api_secret:
        type: str
        required: true
        description: OPNsense API secret. Secret.
      opnsense_home_lan_cidr:
        type: str
        required: true
        description: The home router's LAN range, used in the WAN and block rules.
      opnsense_dns_zone:
        type: str
        required: true
        description: DNS zone for the opnsense.<zone> host override.
      # Place values from the IP plan, set per place in the inventory
      lab_vlans:
        type: list
        elements: dict
        required: true
        description: The place's VLANs, from the one shared VLAN file group_vars/all/vlans.yml.
        options:
          id:
            type: int
            required: true
            description: VLAN ID.
          name:
            type: str
            required: true
            description: Short name, for example prod.
          alias:
            type: str
            required: true
            description: Longer name, used in rule descriptions.
          cidr:
            type: str
            required: true
            description: The VLAN's /24 range.
      opnsense_lab_vlan_settings:
        type: dict
        required: true
        description: This firewall's settings per VLAN name (ifname, dhcp, bootstrap).
      opnsense_lab_mgmt_tag:
        type: int
        required: true
        description: VLAN ID of the mgmt VLAN (OPNsense LAN, web GUI and API).
      opnsense_lab_dhcp_first:
        type: int
        required: true
        description: First host number of each DHCP pool.
      opnsense_lab_dhcp_last:
        type: int
        required: true
        description: Last host number of each DHCP pool, below the .224/27 load-balancer reserve.
      # Defaults in defaults/main.yml
      # Optional, private (addresses), through the inventory. Unset = no agent box rules.
      opnsense_lab_agent_box:
        type: dict
        required: false
        description: The agent box's own pass rules into the lab (tasks/agent_box.yml).
        options:
          source: {type: str, required: true, description: "The box's address, without a prefix."}
          vlan: {type: int, required: true, description: "The box's VLAN tag, for example 30 (dev)."}
          targets:
            type: list
            elements: dict
            required: true
            description: One rule each.
            options:
              name: {type: str, required: true, description: "Rule name; one of opnsense_lab_agent_box_target_names."}
              address: {type: str, required: true, description: "Destination address, without a prefix."}
              port: {type: int, required: true, description: Destination TCP port.}
      # Optional, private (addresses), through the inventory. Unset = no desktop RDP rule.
      opnsense_lab_desktop_rdp:
        type: dict
        required: false
        description: The one pass rule for RDP to the owner's desktop VM, on WAN (tasks/desktop.yml).
        options:
          source: {type: str, required: true, description: "The one home address the owner connects from, without a prefix (desktop_rdp_source)."}
          destination: {type: str, required: true, description: "The desktop VM's address on VNet dev, without a prefix."}
      opnsense_lab_desktop_rdp_rule_name:
        type: str
        default: "Allow owner desktop RDP (home address to desktop VM)"
        description: "The rule's name; fixed so removal finds it."
      opnsense_lab_agent_box_target_names:
        type: list
        elements: str
        default: [Proxmox API, c1 API, prod node 200 SSH, prod node 201 SSH]
        description: The names the agent box's rules may have; a name that is not a current target loses its rule.
      opnsense_lab_host_overrides:
        type: list
        elements: dict
        default: []
        description: Lab-only DNS names (Unbound host overrides), each relative to opnsense_dns_zone.
        options:
          hostname:
            type: str
            required: true
            description: Name relative to the domain, for example api.c1.prod; "*" makes a wildcard for the whole subdomain.
          subdomain:
            type: str
            description: Optional. The record's domain becomes subdomain.<zone>, for example apps.c1.prod. Required with hostname "*".
          address:
            type: str
            required: true
            description: The IPv4 address the name points at. Private.
          description:
            type: str
            required: true
            description: What the name is for.
      opnsense_lab_dns_proof_server:
        type: str
        default: ""
        description: The DNS server the proof (tag dns_proof) asks; empty means the mgmt gateway, 100.100.100.100 proves tailnet split DNS.
      opnsense_lab_parent:
        type: str
        default: vtnet0
        description: The trunk port inside OPNsense (net0 on vmbr1).
      opnsense_lab_ssl_ca_file:
        type: str
        description: The lab root's PEM file on the controller; the API's certificate must chain to it (pick 30).
