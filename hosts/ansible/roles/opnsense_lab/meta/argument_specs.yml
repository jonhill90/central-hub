---
# Inputs of the opnsense_lab role. Ansible checks these before the role runs and stops if a
# required one is missing or has the wrong type (the owner, 2026-10-26 02:49 UTC). required: true does
# not reject an empty string, so tasks/main.yml still checks the private values are not blank.
argument_specs:
  main:
    short_description: OPNsense lab VLANs, DHCP, firewall rules and DNS override, through the OPNsense API
    options:
      # Private, from the secret store through the inventory
      opnsense_api_host:
        type: str
        required: true
        description: Address or name the OPNsense API is reached on.
      opnsense_api_key:
        type: str
        required: true
        description: OPNsense API key. Secret.
      opnsense_api_secret:
        type: str
        required: true
        description: OPNsense API secret. Secret.
      opnsense_home_lan_cidr:
        type: str
        required: true
        description: The home router's LAN range, used in the WAN and block rules.
      opnsense_dns_zone:
        type: str
        required: true
        description: DNS zone for the opnsense.<zone> host override.
      # Place values from the IP plan, set per place in the inventory
      lab_vlans:
        type: list
        elements: dict
        required: true
        description: The place's VLANs, from the one shared VLAN file group_vars/all/vlans.yml.
        options:
          id:
            type: int
            required: true
            description: VLAN ID.
          name:
            type: str
            required: true
            description: Short name, for example prod.
          alias:
            type: str
            required: true
            description: Longer name, used in rule descriptions.
          cidr:
            type: str
            required: true
            description: The VLAN's /24 range.
          tailnet:
            type: bool
            required: false
            default: true
            description: >-
              False keeps the VLAN off the tailnet; this role then blocks its traffic to 100.64.0.0/10
              and needs an explicit mgmt_pass in its settings.
      opnsense_lab_vlan_settings:
        type: dict
        required: true
        description: >-
          This firewall's settings per VLAN name (ifname, dhcp, bootstrap, and optional mgmt_pass,
          default true; false stops the management VLAN's pass rule into that VLAN).
      opnsense_lab_mgmt_tag:
        type: int
        required: true
        description: VLAN ID of the mgmt VLAN (OPNsense LAN, web GUI and API).
      opnsense_lab_dhcp_first:
        type: int
        required: true
        description: First host number of each DHCP pool.
      opnsense_lab_dhcp_last:
        type: int
        required: true
        description: Last host number of each DHCP pool, below the .224/27 load-balancer reserve.
      # Defaults in defaults/main.yml
      # Optional, private (addresses), through the inventory. Unset = no agent box rules.
      opnsense_lab_agent_box:
        type: dict
        required: false
        description: The agent box's own pass rules into the lab (tasks/agent_box.yml).
        options:
          source: {type: str, required: true, description: "The box's address, without a prefix."}
          vlan: {type: int, required: true, description: "The box's VLAN tag, for example 30 (dev)."}
          targets:
            type: list
            elements: dict
            required: true
            description: One rule each.
            options:
              name: {type: str, required: true, description: "Rule name; one of opnsense_lab_agent_box_target_names."}
              address: {type: str, required: true, description: "Destination address, without a prefix."}
              port: {type: int, required: true, description: Destination TCP port.}
              prefix: {type: int, required: false, default: 32, description: "Destination prefix length; 32 is one address, 24 a whole VLAN range."}
      opnsense_lab_agent_box_target_names:
        type: list
        elements: str
        default: [Proxmox API, c1 API, prod node 200 SSH, prod node 201 SSH, OPNsense API, tenant lab SSH]
        description: The names the agent box's rules may have; a name that is not a current target loses its rule.
      opnsense_lab_agent_box_sequences:
        type: list
        elements: int
        default: [1, 2, 3, 4, 8, 9]
        description: The agent box rules' sequence numbers, in target order; below 10 and clear of the management rules.
      opnsense_lab_app_access:
        type: dict
        required: false
        description: Pass rules from named lab VMs to the c1 Gateway on tcp 443 (tasks/app_access.yml). Private.
        options:
          vlan: {type: int, required: true, description: "The sources' VLAN tag, for example 30 (dev)."}
          gateway: {type: str, required: true, description: "The c1 Gateway's IPv4 address, without a prefix."}
          sources:
            type: list
            elements: dict
            required: true
            description: One rule each, from that address only.
            options:
              name: {type: str, required: true, description: "Rule name; one of opnsense_lab_app_access_names."}
              address: {type: str, required: true, description: "The source's IPv4 address, without a prefix."}
      opnsense_lab_app_access_names:
        type: list
        elements: str
        default: [agent box, desktop VM]
        description: The names the app access rules may have; a name that is not a current source loses its rule.
      opnsense_lab_app_access_sequences:
        type: list
        elements: int
        default: [11, 12]
        description: The app access rules' sequence numbers, in source order; clear of every other rule and below the source VLAN's first rule.
      opnsense_lab_backup_target:
        type: dict
        required: false
        description: Pass rules from the c1 nodes to the Proxmox host's ssh on tcp 22, for restic's sftp target (tasks/backup_target.yml). Private.
        options:
          vlan: {type: int, required: true, description: "The sources' VLAN tag, for example 10 (prod)."}
          host: {type: str, required: true, description: "The host's IPv4 address on VNet mgmt, without a prefix."}
          sources:
            type: list
            elements: dict
            required: true
            description: One rule each, from that address only.
            options:
              name: {type: str, required: true, description: "Rule name; one of opnsense_lab_backup_target_names."}
              address: {type: str, required: true, description: "The node's IPv4 address, without a prefix."}
              vlan: {type: int, required: false, description: "This source's own VLAN tag, for example 30 (dev); the target's vlan when unset."}
      opnsense_lab_backup_target_names:
        type: list
        elements: str
        default: [prod node 200, prod node 201, dev worker, agent box]
        description: The names the backup target rules may have; a name that is not a current source loses its rule.
      opnsense_lab_backup_target_extra_sources:
        type: list
        elements: dict
        default: []
        description: >-
          Sources added from outside the inventory (the agent box's firewall job, the dev worker's handoff address), each
          {name, address, vlan}; joined to the backup target's sources and checked the same way.
      opnsense_lab_backup_target_sequences:
        type: list
        elements: int
        default: [13, 14, 17, 18]
        description: The backup target rules' sequence numbers, in source order; clear of every other rule.
      opnsense_lab_store_admin:
        type: dict
        required: false
        description: One pass rule from the agent box to the secrets store's admin address on tcp 443 (tasks/store_admin.yml, D-0062 rule 4). Private.
        options:
          vlan: {type: int, required: true, description: "The box's VLAN tag, for example 30 (dev)."}
          source: {type: str, required: true, description: "The box's IPv4 address, without a prefix."}
          address: {type: str, required: true, description: "The store's admin IPv4 address, without a prefix."}
      opnsense_lab_store_admin_sequence:
        type: int
        default: 15
        description: The store admin rule's sequence number; clear of every other rule and below the box VLAN's first rule.
      opnsense_lab_proxmox_web:
        type: dict
        required: false
        description: One pass rule from the agent box to the Proxmox host's web UI on tcp 443 (tasks/proxmox_web.yml). Private.
        options:
          vlan: {type: int, required: true, description: "The box's VLAN tag, for example 30 (dev)."}
          source: {type: str, required: true, description: "The box's IPv4 address, without a prefix."}
          address: {type: str, required: true, description: "The Proxmox host's mgmt IPv4 address, without a prefix."}
      opnsense_lab_proxmox_web_sequence:
        type: int
        default: 16
        description: The Proxmox web rule's sequence number; clear of every other rule and below the box VLAN's first rule.
      opnsense_lab_short_app_names:
        type: list
        elements: str
        default: [hub, openbao, vault]
        description: App short aliases (<app>.<zone>); each gets an Unbound host override pointing at k8s_gateway_address.
      opnsense_lab_short_app_names_retired:
        type: list
        elements: str
        default: [central-hub-app]
        description: Retired app short aliases; each has its Unbound host override removed.
      opnsense_lab_host_overrides:
        type: list
        elements: dict
        default: []
        description: Lab-only DNS names (Unbound host overrides), each relative to opnsense_dns_zone.
        options:
          hostname:
            type: str
            required: true
            description: Name relative to the domain, for example api.c1.prod; "*" makes a wildcard for the whole subdomain.
          subdomain:
            type: str
            description: Optional. The record's domain becomes subdomain.<zone>, for example apps.c1.prod. Required with hostname "*".
          address:
            type: str
            required: true
            description: The IPv4 address the name points at. Private.
          description:
            type: str
            required: true
            description: What the name is for.
      opnsense_lab_dns_proof_server:
        type: str
        default: ""
        description: The DNS server the proof (tag dns_proof) asks; empty means the mgmt gateway, 100.100.100.100 proves tailnet split DNS.
      opnsense_lab_parent:
        type: str
        default: vtnet0
        description: The trunk port inside OPNsense (net0 on vmbr1).
      opnsense_lab_ssl_ca_file:
        type: str
        description: The lab root's PEM file on the controller; the API's certificate must chain to it (pick 30).
