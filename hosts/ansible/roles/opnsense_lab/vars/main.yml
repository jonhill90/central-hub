---
# The VLANs this role works on: the shared lab_vlans (group_vars/all/vlans.yml, the one VLAN
# file) joined with this firewall's own settings per VLAN (opnsense_lab_vlan_settings).
# base = the /24's first three numbers, for example 10.1.10.
opnsense_lab_vlans: >-
  {%- set out = [] -%}
  {%- for v in lab_vlans -%}
  {%- set x = opnsense_lab_vlan_settings[v.name] -%}
  {%- set _ = out.append({'tag': v.id, 'name': v.name, 'label': v.alias, 'cidr': v.cidr,
      'base': v.cidr.split('/')[0].rsplit('.', 1)[0],
      'ifname': x.ifname, 'dhcp': x.dhcp, 'bootstrap': x.bootstrap,
      'tailnet': v.tailnet | default(true), 'mgmt_pass': x.mgmt_pass | default(true)}) -%}
  {%- endfor -%}
  {{ out }}

# The VLANs the management VLAN gets a pass rule into (tasks/rules.yml), and the VLANs kept off the
# tailnet (a block rule to 100.64.0.0/10). The management rules are numbered 5 up from this list.
opnsense_lab_mgmt_pass_vlans: "{{ opnsense_lab_vlans | rejectattr('tag', 'equalto', opnsense_lab_mgmt_tag) | selectattr('mgmt_pass') | list }}"
opnsense_lab_mgmt_no_pass_vlans: "{{ opnsense_lab_vlans | rejectattr('tag', 'equalto', opnsense_lab_mgmt_tag) | rejectattr('mgmt_pass') | list }}"
opnsense_lab_tailnet_off_vlans: "{{ opnsense_lab_vlans | rejectattr('tailnet') | list }}"

# Derived values. The gateway of each lab /24 is .1 (IP plan); the mgmt one is the firewall's
# GUI, DNS and API address.
opnsense_lab_mgmt_gateway: "{{ (opnsense_lab_vlans | selectattr('tag', 'equalto', opnsense_lab_mgmt_tag) | first).base }}.1"

# The four rules every lab VLAN gets, in this order.
opnsense_lab_rule_kinds:
  - n: 0
    text: "Block {} to home LAN"
    action: block
    protocol: any
    destination: home
    port: ""
    icmp: []
    invert: false
  - n: 1
    text: "Allow {} ping to firewall"
    action: pass
    protocol: ICMP
    destination: "(self)"
    port: ""
    icmp: [echoreq]
    invert: false
  - n: 2
    text: "Allow {} DNS to firewall"
    action: pass
    protocol: TCP/UDP
    destination: "(self)"
    port: "53"
    icmp: []
    invert: false
  - n: 3
    text: "Allow {} to internet"
    action: pass
    protocol: any
    destination: RFC1918
    port: ""
    icmp: []
    invert: true

# Every sequence number the role gives a rule (tasks/rules.yml, tasks/agent_box.yml): the four rules per lab VLAN,
# the tailnet block of each VLAN kept off the tailnet, the management passes and the agent box's targets. The app
# access rules (tasks/app_access.yml) must use none of them, and must sit below their source VLAN's first rule.
opnsense_lab_numbered_sequences: >-
  {%- set out = [] -%}
  {%- for v in opnsense_lab_vlans -%}
  {%- set i = opnsense_lab_vlans.index(v) -%}
  {%- for n in range(4) -%}{%- set _ = out.append(10 + (i * 4 + n) * 10) -%}{%- endfor -%}
  {%- if not v.tailnet -%}{%- set _ = out.append(10 + (i * 4 + 3) * 10 - 5) -%}{%- endif -%}
  {%- endfor -%}
  {%- for k in range(opnsense_lab_mgmt_pass_vlans | length) -%}{%- set _ = out.append(5 + k) -%}{%- endfor -%}
  {%- set _ = out.extend(opnsense_lab_agent_box_sequences[: (opnsense_lab_agent_box | default({})).targets | default([]) | length]) -%}
  {{ out }}
opnsense_lab_app_access_first_vlan_rule: >-
  {{ 10 + opnsense_lab_vlans.index(opnsense_lab_vlans | selectattr('tag', 'equalto', opnsense_lab_app_access.vlan) | first) * 40
  if opnsense_lab_app_access is defined else 0 }}
# An IPv4 address with no prefix (the app access inputs; ansible.utils is not installed).
opnsense_lab_ipv4_pattern: '^(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}$'
