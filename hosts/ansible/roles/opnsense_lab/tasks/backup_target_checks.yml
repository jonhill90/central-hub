---
# The backup target rules' inputs (tasks/backup_target.yml), checked before any rule is written; on its own so
# .github/hosts-check/tests/test_opnsense_backup_target.sh can run it with no firewall.
- name: Backup sources fit their sequences and have known names
  ansible.builtin.assert:
    that:
      - opnsense_lab_backup_target.host is match(opnsense_lab_ipv4_pattern)
      - opnsense_lab_backup_target.sources | length > 0
      - opnsense_lab_backup_target.sources | length <= opnsense_lab_backup_target_sequences | length
      - opnsense_lab_backup_target.sources | map(attribute='name') | unique | length == opnsense_lab_backup_target.sources | length
      - opnsense_lab_backup_target.sources | map(attribute='name') | difference(opnsense_lab_backup_target_names) | length == 0
      - >-
        opnsense_lab_backup_target.sources | map(attribute='address') | select('match', opnsense_lab_ipv4_pattern) | list | length
        == opnsense_lab_backup_target.sources | length
      - opnsense_lab_vlans | selectattr('tag', 'equalto', opnsense_lab_backup_target.vlan) | list | length == 1
      - >-
        opnsense_lab_backup_target_sequences[:opnsense_lab_backup_target.sources | length]
        | intersect(opnsense_lab_numbered_sequences
                    + opnsense_lab_app_access_sequences[:(opnsense_lab_app_access | default({})).sources | default([]) | length]
                    + ([opnsense_lab_store_admin_sequence] if opnsense_lab_store_admin is defined else []))
        | length == 0
    fail_msg: >-
      opnsense_lab_backup_target needs the host's IPv4 address, a VLAN tag in lab_vlans, and one to
      {{ opnsense_lab_backup_target_sequences | length }} sources, each an IPv4 address with its own name from
      opnsense_lab_backup_target_names ({{ opnsense_lab_backup_target_names | join(', ') }}), at sequences no other rule uses.
    quiet: true
  when: opnsense_lab_backup_target is defined
