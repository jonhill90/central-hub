---
# The backup target rules' inputs (tasks/backup_target.yml), checked before any rule is written; on its own so
# .github/hosts-check/tests/test_opnsense_backup_target.sh can run it with no firewall.
# Extra sources have nowhere to go without a backup target (the rules below run only when the target is set): refuse, so an apply that
# could not open the dev worker's rule fails and the box's wrapper writes no marker saying it did.
- name: Extra backup sources need the backup target
  ansible.builtin.assert:
    that: opnsense_lab_backup_target_extra_sources | length == 0 or opnsense_lab_backup_target is defined
    fail_msg: >-
      opnsense_lab_backup_target_extra_sources is set but opnsense_lab_backup_target is not: the extra sources have no host to reach, so no
      rule would be written. Set opnsense_lab_backup_target in the firewall inventory, or give no extra source.
    quiet: true

# Sources the agent box adds from its own state (a vars file of the firewall job: the dev worker's address, read from the box's
# handoff file) join the inventory's, so one list is checked and one list gets rules. A source of the same name already in the
# inventory is replaced, so the box's address wins and the unique-name check can't stop the job. Empty by default: nothing changes.
- name: The sources the box adds join the inventory's
  ansible.builtin.set_fact:
    opnsense_lab_backup_target: >-
      {{ opnsense_lab_backup_target
         | combine({'sources': (opnsense_lab_backup_target.sources | default([])
                               | rejectattr('name', 'in', opnsense_lab_backup_target_extra_sources | map(attribute='name') | list) | list)
                              + opnsense_lab_backup_target_extra_sources}) }}
  when:
    - opnsense_lab_backup_target is defined
    - opnsense_lab_backup_target_extra_sources | length > 0

- name: Backup sources fit their sequences and have known names
  ansible.builtin.assert:
    that:
      - opnsense_lab_backup_target.host is match(opnsense_lab_ipv4_pattern)
      - opnsense_lab_backup_target.sources | length > 0
      - opnsense_lab_backup_target.sources | length <= opnsense_lab_backup_target_sequences | length
      - opnsense_lab_backup_target.sources | map(attribute='name') | unique | length == opnsense_lab_backup_target.sources | length
      - opnsense_lab_backup_target.sources | map(attribute='name') | difference(opnsense_lab_backup_target_names) | length == 0
      - >-
        opnsense_lab_backup_target.sources | map(attribute='address') | select('match', opnsense_lab_ipv4_pattern) | list | length
        == opnsense_lab_backup_target.sources | length
      - opnsense_lab_vlans | selectattr('tag', 'equalto', opnsense_lab_backup_target.vlan) | list | length == 1
      - >-
        opnsense_lab_backup_target.sources | map(attribute='vlan', default=opnsense_lab_backup_target.vlan) | unique | list
        | difference(opnsense_lab_vlans | map(attribute='tag') | list) | length == 0
      - >-
        opnsense_lab_backup_target_sequences[:opnsense_lab_backup_target.sources | length]
        | intersect(opnsense_lab_numbered_sequences
                    + opnsense_lab_app_access_sequences[:(opnsense_lab_app_access | default({})).sources | default([]) | length]
                    + ([opnsense_lab_store_admin_sequence] if opnsense_lab_store_admin is defined else [])
                    + ([opnsense_lab_proxmox_web_sequence] if opnsense_lab_proxmox_web is defined else []))
        | length == 0
    fail_msg: >-
      opnsense_lab_backup_target needs the host's IPv4 address, a VLAN tag in lab_vlans (any source's own vlan too), and one to
      {{ opnsense_lab_backup_target_sequences | length }} sources, each an IPv4 address with its own name from
      opnsense_lab_backup_target_names ({{ opnsense_lab_backup_target_names | join(', ') }}), at sequences no other rule uses.
    quiet: true
  when: opnsense_lab_backup_target is defined
