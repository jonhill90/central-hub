---
# The store admin rule's input (tasks/store_admin.yml), checked before the rule is written; on its own so
# .github/hosts-check/tests/test_opnsense_store_admin.sh can run it with no firewall.
- name: The store admin rule's addresses, VLAN and sequence are checked
  ansible.builtin.assert:
    that:
      - opnsense_lab_store_admin.source is match(opnsense_lab_ipv4_pattern)
      - opnsense_lab_store_admin.address is match(opnsense_lab_ipv4_pattern)
      - opnsense_lab_vlans | selectattr('tag', 'equalto', opnsense_lab_store_admin.vlan) | list | length == 1
      - >-
        opnsense_lab_store_admin_sequence
        not in (opnsense_lab_numbered_sequences
                + opnsense_lab_app_access_sequences[:(opnsense_lab_app_access | default({})).sources | default([]) | length]
                + opnsense_lab_backup_target_sequences[:(opnsense_lab_backup_target | default({})).sources | default([]) | length])
      - opnsense_lab_store_admin_sequence < (opnsense_lab_store_admin_first_vlan_rule | int)
    fail_msg: >-
      opnsense_lab_store_admin needs the box's IPv4 address as source, the store's admin IPv4 address as address, and a
      VLAN tag in lab_vlans, and opnsense_lab_store_admin_sequence ({{ opnsense_lab_store_admin_sequence }}) must be a
      sequence no other rule uses, below the VLAN's own first rule.
    quiet: true
  when: opnsense_lab_store_admin is defined
