---
# meta/argument_specs.yml already stops the run when a value is missing. It accepts an empty
# string, and the inventory template has "" blanks for these five, so this check stays.
- name: Check that the private values are not blank
  ansible.builtin.assert:
    that:
      - lookup('vars', item, default='') | length > 0
    fail_msg: "{{ item }} is a private value; fill it from the secret store."
    quiet: true
  loop:
    - opnsense_api_host
    - opnsense_api_key
    - opnsense_api_secret
    - opnsense_home_lan_cidr
    - opnsense_dns_zone
  no_log: "{{ item in ['opnsense_api_key', 'opnsense_api_secret'] }}"

# "is defined" and the types are checked by meta/argument_specs.yml; it doesn't reject an empty
# list, so this stays. A VLAN with no entry in opnsense_lab_vlan_settings is held (vars/main.yml,
# opnsense_lab_held_vlans), but the management VLAN never is: every rule and the DNS need it.
- name: Check that the VLAN values are not empty and the management VLAN has settings
  ansible.builtin.assert:
    that:
      - lab_vlans | length > 0
      - opnsense_lab_vlans | selectattr('tag', 'equalto', opnsense_lab_mgmt_tag) | list | length == 1
    fail_msg: >-
      lab_vlans (group_vars/all/vlans.yml) is empty, or the management VLAN (tag {{ opnsense_lab_mgmt_tag }})
      has no entry in opnsense_lab_vlan_settings.
    quiet: true
  tags: [always]

# Always runs, so a run limited with --tags rules still stops before it would pass the management
# VLAN into a VLAN kept off the tailnet.
- name: Tenant VLAN checks
  ansible.builtin.import_tasks: tenant_checks.yml
  tags: [always]

- name: VLANs
  ansible.builtin.import_tasks: vlans.yml
  tags: [vlans]

- name: Interface assignment
  ansible.builtin.import_tasks: assign.yml
  tags: [assign]

- name: DHCP
  ansible.builtin.import_tasks: dhcp.yml
  tags: [dhcp]

- name: Lab rules
  ansible.builtin.import_tasks: rules.yml
  tags: [rules]

- name: Agent box rules
  ansible.builtin.import_tasks: agent_box.yml
  tags: [rules, agent_box]

- name: App access rules
  ansible.builtin.import_tasks: app_access.yml
  tags: [rules, app_access]

- name: DNS override
  ansible.builtin.import_tasks: dns.yml
  tags: [dns]

- name: DNS proof
  ansible.builtin.import_tasks: dns_proof.yml
  tags: [dns, dns_proof]

- name: Home LAN access on WAN
  ansible.builtin.import_tasks: wan.yml
  tags: [wan]
