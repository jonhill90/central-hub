---
# A VLAN kept off the tailnet (tailnet: false in the VLAN file) must say, in this firewall's own
# settings, whether the management VLAN may pass into it. mgmt_pass defaults to true, and a silent
# default would give a tenant VLAN the management pass the tailnet hold keeps out.
# Said once per run, whatever the tags: the VLANs in the VLAN file that this firewall leaves alone.
- name: VLANs held, not applied on this firewall
  ansible.builtin.debug:
    msg: >-
      {{ 'Held, not applied here (no entry in opnsense_lab_vlan_settings): ' ~ (opnsense_lab_held_vlans | join(', '))
      ~ '. The role makes and removes nothing for them.' }}
  when: opnsense_lab_held_vlans | length > 0

# A held VLAN (no settings) is left alone, so it is not checked here; one with settings is.
- name: Every VLAN kept off the tailnet sets mgmt_pass explicitly
  ansible.builtin.assert:
    that:
      - opnsense_lab_vlan_settings[item.name].mgmt_pass is defined
    fail_msg: >-
      VLAN {{ item.name }} has tailnet: false in the VLAN file, so opnsense_lab_vlan_settings.{{ item.name }}
      must set mgmt_pass (true or false) explicitly.
    quiet: true
  loop: "{{ lab_vlans | rejectattr('tailnet', 'undefined') | rejectattr('tailnet') | rejectattr('name', 'in', opnsense_lab_held_vlans) | list }}"
  loop_control:
    label: "VLAN {{ item.name }}"
