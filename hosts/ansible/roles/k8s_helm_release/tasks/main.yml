---
# Helm is on the first control plane already (k8s_control_plane step 9), at /usr/local/bin/helm.
- name: helm | Chart repo {{ k8s_helm_release_repo_name }}
  ansible.builtin.shell: >-
    /usr/local/bin/helm repo add {{ k8s_helm_release_repo_name }} {{ k8s_helm_release_repo_url }} --force-update
    && /usr/local/bin/helm repo update {{ k8s_helm_release_repo_name }}
  changed_when: false
  check_mode: false

- name: helm | Folder for the values files
  ansible.builtin.file: {path: "{{ k8s_helm_release_dir }}", state: directory, mode: "0700"}
  check_mode: false

- name: helm | Values for {{ k8s_helm_release_name }}
  ansible.builtin.copy:
    dest: "{{ k8s_helm_release_dir }}/{{ k8s_helm_release_name }}.yaml"
    content: "{{ k8s_helm_release_values | to_nice_yaml(indent=2) }}"
    mode: "0600"

- name: helm | The release now, {{ k8s_helm_release_name }}
  ansible.builtin.command: >-
    /usr/local/bin/helm -n {{ k8s_helm_release_namespace }} list
    --filter ^{{ k8s_helm_release_name }}$ -o json
  register: k8s_helm_release_list
  changed_when: false
  check_mode: false

# The values the release was last installed with (user-supplied only), compared as data, so key
# order and formatting don't count as a change.
- name: helm | Values the release runs with, {{ k8s_helm_release_name }}
  ansible.builtin.command: >-
    /usr/local/bin/helm -n {{ k8s_helm_release_namespace }} get values {{ k8s_helm_release_name }} -o json
  register: k8s_helm_release_running
  changed_when: false
  check_mode: false
  when: k8s_helm_release_list.stdout | from_json | length > 0

- name: helm | Install or upgrade {{ k8s_helm_release_name }}
  ansible.builtin.command: >-
    /usr/local/bin/helm upgrade --install {{ k8s_helm_release_name }}
    {{ k8s_helm_release_repo_name }}/{{ k8s_helm_release_chart }} --version {{ k8s_helm_release_version }}
    -n {{ k8s_helm_release_namespace }} --create-namespace
    -f {{ k8s_helm_release_dir }}/{{ k8s_helm_release_name }}.yaml
    --wait --timeout {{ k8s_helm_release_timeout }}
  when: >-
    (k8s_helm_release_list.stdout | from_json | length == 0)
    or (k8s_helm_release_list.stdout | from_json | first).chart != k8s_helm_release_chart ~ '-' ~ k8s_helm_release_version
    or (k8s_helm_release_list.stdout | from_json | first).status != 'deployed'
    or (k8s_helm_release_running.stdout | default('{}') | from_json) != k8s_helm_release_values
  changed_when: true
