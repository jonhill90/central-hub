---
# A box trusts the lab's SSH user CA (D-0064). It adds files and one sshd drop-in and changes nothing else: no
# authorized_keys, no AuthorizedKeysFile, PasswordAuthentication or PermitRootLogin setting, so the local keys stay
# the way in while c1 or OpenBao is down (D-0064 rule 5, D-0037 rule 2). The drop-in is checked with `sshd -t` and
# removed again if sshd refuses it. sshd is reloaded, never restarted.
- name: ssh-ca | The inputs make sense
  ansible.builtin.assert:
    that:
      - ssh_ca_trust_accounts | length > 0
      - ssh_ca_trust_accounts | select('match', '^[a-z_][a-z0-9_-]*$') | list | length == ssh_ca_trust_accounts | length
      - ssh_ca_trust_principal is match('^[A-Za-z0-9._-]+$')
      - lookup('ansible.builtin.file', ssh_ca_trust_user_ca_file) is match('^ssh-(ed25519|rsa) ')
    fail_msg: accounts are plain account names, the principal is a plain word, and the CA file holds one SSH public key
    quiet: true

# The role never writes these; if the box already sets any of them to lock keys out, stop and say so (D-0064 rule 5).
- name: ssh-ca | Read sshd's effective settings
  ansible.builtin.command: sshd -T
  register: ssh_ca_sshd_before
  changed_when: false
  check_mode: false

- name: ssh-ca | A local key login is still possible on this box
  ansible.builtin.assert:
    that:
      - "'authorizedkeysfile none' not in ssh_ca_sshd_before.stdout_lines"
      - "'pubkeyauthentication yes' in ssh_ca_sshd_before.stdout_lines"
    fail_msg: this box does not take local key logins, so the break-glass way in (D-0064 rule 5) would be gone; the role stops
    quiet: true

- name: ssh-ca | The CA public key
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', ssh_ca_trust_user_ca_file) | trim }}\n"
    dest: "{{ ssh_ca_trust_user_ca_dest }}"
    owner: "{{ ssh_ca_trust_file_owner }}"
    group: "{{ ssh_ca_trust_file_group }}"
    mode: "0644"

- name: ssh-ca | The revocation list
  ansible.builtin.copy:
    src: "{{ ssh_ca_trust_krl_file }}"
    dest: "{{ ssh_ca_trust_krl_dest }}"
    owner: "{{ ssh_ca_trust_file_owner }}"
    group: "{{ ssh_ca_trust_file_group }}"
    mode: "0644"
  when: ssh_ca_trust_krl_file | length > 0

- name: ssh-ca | An empty revocation list when none was given
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -k, -f, "{{ ssh_ca_trust_krl_dest }}"]
    creates: "{{ ssh_ca_trust_krl_dest }}"
  when: ssh_ca_trust_krl_file | length == 0

- name: ssh-ca | The principals folder
  ansible.builtin.file:
    path: "{{ ssh_ca_trust_principals_dir }}"
    state: directory
    owner: "{{ ssh_ca_trust_file_owner }}"
    group: "{{ ssh_ca_trust_file_group }}"
    mode: "0755"

- name: ssh-ca | One principals file per account
  ansible.builtin.copy:
    content: "{{ ssh_ca_trust_principal }}\n"
    dest: "{{ ssh_ca_trust_principals_dir }}/{{ item }}"
    owner: "{{ ssh_ca_trust_file_owner }}"
    group: "{{ ssh_ca_trust_file_group }}"
    mode: "0644"
  loop: "{{ ssh_ca_trust_accounts }}"

- name: ssh-ca | The host certificate
  ansible.builtin.copy:
    src: "{{ ssh_ca_trust_host_cert_file }}"
    dest: "{{ ssh_ca_trust_host_cert_dest }}"
    owner: "{{ ssh_ca_trust_file_owner }}"
    group: "{{ ssh_ca_trust_file_group }}"
    mode: "0644"
  when: ssh_ca_trust_host_cert_file | length > 0
  notify: Reload sshd

# The reload is notified by the task that changes the drop-in (a changed_when: false check can never notify), and by a
# changed host certificate, which sshd reads only at start or reload. A refused drop-in is put back as it was (its backup)
# or removed when there was none, and nothing is reloaded.
- name: ssh-ca | The sshd drop-in, checked and put back if sshd refuses it
  block:
    - name: ssh-ca | Write the drop-in
      ansible.builtin.copy:
        dest: "{{ ssh_ca_trust_dropin }}"
        content: |
          # Managed by Ansible, role ssh_ca_trust (D-0064). Do not edit by hand.
          TrustedUserCAKeys {{ ssh_ca_trust_user_ca_dest }}
          RevokedKeys {{ ssh_ca_trust_krl_dest }}
          AuthorizedPrincipalsFile {{ ssh_ca_trust_principals_dir }}/%u
          {% if ssh_ca_trust_host_cert_file | length > 0 %}
          HostCertificate {{ ssh_ca_trust_host_cert_dest }}
          {% endif %}
        owner: "{{ ssh_ca_trust_file_owner }}"
        group: "{{ ssh_ca_trust_file_group }}"
        mode: "0600"
        backup: true
      register: ssh_ca_dropin
      notify: Reload sshd
    - name: ssh-ca | sshd accepts the whole configuration
      ansible.builtin.command: sshd -t
      changed_when: false
  rescue:
    - name: ssh-ca | sshd refused it, so the earlier drop-in comes back
      ansible.builtin.copy:
        src: "{{ ssh_ca_dropin.backup_file }}"
        dest: "{{ ssh_ca_trust_dropin }}"
        remote_src: true
        mode: "0600"
      when: ssh_ca_dropin.backup_file is defined
    - name: ssh-ca | sshd refused it and there was no earlier one, so it goes
      ansible.builtin.file: {path: "{{ ssh_ca_trust_dropin }}", state: absent}
      when: ssh_ca_dropin.backup_file is not defined
    - name: ssh-ca | Stop
      ansible.builtin.fail:
        msg: sshd refused the drop-in; the earlier state is back (a failed host runs no handler, so nothing was reloaded)

- name: ssh-ca | Flush the reload now, so the check below reads the live settings
  ansible.builtin.meta: flush_handlers

- name: ssh-ca | sshd -T shows the settings in the files it would load (the live daemon is proved by the dev step, not here)
  ansible.builtin.command: sshd -T
  register: ssh_ca_sshd_after
  changed_when: false
  check_mode: false
  failed_when: >-
    ('trustedusercakeys ' ~ ssh_ca_trust_user_ca_dest) not in ssh_ca_sshd_after.stdout_lines
    or ('revokedkeys ' ~ ssh_ca_trust_krl_dest) not in ssh_ca_sshd_after.stdout_lines
