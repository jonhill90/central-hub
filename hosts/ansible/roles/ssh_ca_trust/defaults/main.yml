---
# D-0064 rules 4 to 7. Inputs that name private things (accounts, file paths) come from the inventory or -e.
ssh_ca_trust_principal: lab-admin
ssh_ca_trust_dropin: /etc/ssh/sshd_config.d/02-lab-ssh-ca.conf   # after 01-central-hub-hardening.conf, before cloud-init's 50-
ssh_ca_trust_user_ca_dest: /etc/ssh/lab-user-ca.pub
ssh_ca_trust_krl_dest: /etc/ssh/lab-user.krl
ssh_ca_trust_principals_dir: /etc/ssh/auth_principals
ssh_ca_trust_host_cert_dest: /etc/ssh/ssh_host_ed25519_key-cert.pub
ssh_ca_trust_krl_file: ""
ssh_ca_trust_host_cert_file: ""
ssh_ca_trust_remove: false   # true undoes everything this role wrote (D-0064 rule 12)
