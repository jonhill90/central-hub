---
- name: The names are not blank
  ansible.builtin.assert:
    that:
      - lab_host_cert_names | length > 0
      - lab_host_cert_names | select('match', '^\s*$') | list | length == 0
    fail_msg: The certificate's names are private values; fill them in the inventory.
    quiet: true

- name: Certificate manifest on c1
  ansible.builtin.template:
    src: certificate.yaml.j2
    dest: /root/central-hub/host-cert-{{ lab_host_cert_name }}.yaml
    mode: "0600"
  delegate_to: "{{ lab_host_cert_issuer_host }}"
  become: true

# kubectl diff fails with "namespaces ... not found" before the namespace exists, so make it first.
- name: The namespace on c1
  ansible.builtin.shell: >-
    set -o pipefail;
    kubectl get namespace {{ lab_host_cert_namespace }} -o name 2>/dev/null
    || kubectl create namespace {{ lab_host_cert_namespace }}
  args:
    executable: /bin/bash
  delegate_to: "{{ lab_host_cert_issuer_host }}"
  become: true
  register: lab_host_cert_ns
  changed_when: "'created' in lab_host_cert_ns.stdout"
  when: not ansible_check_mode

# The manifest goes in on stdin, so check mode can diff it before the file above is written.
- name: Certificate differs on c1?
  ansible.builtin.command:
    cmd: kubectl diff -f -
    stdin: "{{ lookup('ansible.builtin.template', 'certificate.yaml.j2') }}"
  delegate_to: "{{ lab_host_cert_issuer_host }}"
  become: true
  register: lab_host_cert_diff
  changed_when: false
  failed_when: >-
    lab_host_cert_diff.rc > 1 and not (ansible_check_mode and 'not found' in lab_host_cert_diff.stderr)
  check_mode: false

- name: Apply the Certificate on c1
  ansible.builtin.command: kubectl apply -f /root/central-hub/host-cert-{{ lab_host_cert_name }}.yaml
  delegate_to: "{{ lab_host_cert_issuer_host }}"
  become: true
  when: lab_host_cert_diff.rc != 0
  changed_when: true

- name: Certificate issued by {{ lab_host_cert_issuer }}
  ansible.builtin.command: >-
    kubectl -n {{ lab_host_cert_namespace }} wait --for=condition=Ready --timeout=120s
    certificate/{{ lab_host_cert_name }}
  delegate_to: "{{ lab_host_cert_issuer_host }}"
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Read the issued Secret
  ansible.builtin.command: >-
    kubectl -n {{ lab_host_cert_namespace }} get secret {{ lab_host_cert_name }}-tls -o json
  delegate_to: "{{ lab_host_cert_issuer_host }}"
  become: true
  register: lab_host_cert_secret
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Certificate, key and root as facts
  ansible.builtin.set_fact:
    lab_host_cert_crt: "{{ (lab_host_cert_secret.stdout | from_json).data['tls.crt'] | b64decode }}"
    lab_host_cert_key: "{{ (lab_host_cert_secret.stdout | from_json).data['tls.key'] | b64decode }}"
    lab_host_cert_root: "{{ (lab_host_cert_secret.stdout | from_json).data['ca.crt'] | b64decode }}"
  no_log: true
  when: not ansible_check_mode
