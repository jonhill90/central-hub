---
# An Xfce desktop with xrdp on AlmaLinux 10 (agent pick, hosts/AGENT-PICKS.md). The VM holds no lab keys
# and no agent credentials: what the owner types into it never sits beside them.
- name: desktop | The password file is named
  ansible.builtin.assert:
    that: desktop_password_file | length > 0
    fail_msg: set desktop_password_file to the controller's file for the desktop user's password
    quiet: true

- name: desktop | EPEL and CRB are on
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: desktop | CRB is enabled
  community.general.dnf_config_manager:
    name: crb
    state: enabled

- name: desktop | The desktop packages
  ansible.builtin.dnf:
    name: "{{ desktop_packages }}"
    state: present

# The password is made once on the controller, never printed, and hashed on its way to the VM.
- name: desktop | The login user, with the controller's password
  ansible.builtin.user:
    name: "{{ desktop_user }}"
    shell: /bin/bash
    password: "{{ lookup('ansible.builtin.password', desktop_password_file, chars=['ascii_letters', 'digits'], length=24) | password_hash('sha512') }}"
    update_password: on_create
  no_log: true

- name: desktop | The session xrdp starts is Xfce
  ansible.builtin.copy:
    dest: "/home/{{ desktop_user }}/.xsession"
    content: |
      exec startxfce4
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0755"

- name: desktop | xrdp is enabled and running
  ansible.builtin.systemd_service:
    name: xrdp
    enabled: true
    state: started

- name: desktop | firewalld opens the RDP port
  ansible.posix.firewalld:
    port: "{{ desktop_rdp_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
