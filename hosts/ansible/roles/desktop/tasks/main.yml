---
# A GNOME desktop with GNOME's own remote desktop (RDP) on an AlmaLinux 10 VM (agent pick, hosts/AGENT-PICKS.md,
# pick 219). Every package is from the AlmaLinux 10 base repositories: EPEL 10 has no Xfce and no xrdp
# (measured 2026-11-14), so nothing from EPEL is used. The VM holds no lab keys and no agent credentials.
# The owner sets the login and RDP password at the Proxmox console, so it passes through no agent, no
# transcript and no keys folder. RDP is reachable only from one address.
- name: desktop | The private values are set
  ansible.builtin.assert:
    that:
      - desktop_rdp_source | length > 0
      - desktop_admin_user | length > 0
    fail_msg: set desktop_rdp_source (the tailnet connector's address) and desktop_admin_user in the inventory
    quiet: true

# On a freshly booted VM the first dnf run lost a cache file mid-install on 2026-11-19 and again, on every first try,
# on 2026-11-20 ("No such file or directory: /var/cache/dnf/baseos-.../kernel-core-....rpm"), and the second run passed.
# The cause is not measured (a background dnf job or cloud-init on the new VM is the guess), so the task tries again,
# up to three times, instead of failing the whole run; the dnf module rebuilds its cache on each try.
- name: desktop | The desktop packages
  ansible.builtin.dnf:
    name: "{{ desktop_packages }}"
    state: present
  register: desktop_packages_result
  until: desktop_packages_result is succeeded
  retries: 3
  delay: 20

# No password yet: the account's password stays locked until the owner sets it at the console.
- name: desktop | The login user, password locked
  ansible.builtin.user:
    name: "{{ desktop_user }}"
    shell: /bin/bash
    password_lock: true

- name: desktop | The VM boots to the login screen
  ansible.builtin.systemd_service:
    name: gdm.service
    enabled: true

- name: desktop | The default target is graphical
  ansible.builtin.command: systemctl set-default graphical.target
  register: desktop_default_target
  changed_when: "'Created symlink' in desktop_default_target.stderr or 'Created symlink' in desktop_default_target.stdout"

# The RDP certificate is made on the VM and its key never leaves it. The daemon's own account reads it.
- name: desktop | The RDP certificate and key are made once
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:3072 -nodes -days 3650 -subj "/CN={{ ansible_facts['hostname'] }}"
      -keyout {{ desktop_rdp_tls_dir }}/rdp-tls.key -out {{ desktop_rdp_tls_dir }}/rdp-tls.crt
    creates: "{{ desktop_rdp_tls_dir }}/rdp-tls.key"

- name: desktop | The RDP key is the daemon's
  ansible.builtin.file:
    path: "{{ desktop_rdp_tls_dir }}/{{ item.name }}"
    owner: gnome-remote-desktop
    group: gnome-remote-desktop
    mode: "{{ item.mode }}"
  loop:
    - {name: rdp-tls.key, mode: "0600"}
    - {name: rdp-tls.crt, mode: "0644"}

- name: desktop | The system RDP daemon uses that certificate
  ansible.builtin.command:
    cmd: "grdctl --system rdp {{ item }}"
  loop:
    - "set-tls-cert {{ desktop_rdp_tls_dir }}/rdp-tls.crt"
    - "set-tls-key {{ desktop_rdp_tls_dir }}/rdp-tls.key"
  changed_when: true

- name: desktop | Folder for the password marker
  ansible.builtin.file:
    path: "{{ desktop_password_marker | dirname }}"
    state: directory
    mode: "0755"

- name: desktop | The console script that sets the password
  ansible.builtin.template:
    src: desktop-set-password.sh.j2
    dest: /usr/local/sbin/desktop-set-password.sh
    mode: "0700"

- name: desktop | The console asks the owner for the password once
  ansible.builtin.template:
    src: desktop-set-password.service.j2
    dest: /etc/systemd/system/desktop-set-password.service
    mode: "0644"

- name: desktop | Folder for the remote desktop's drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/gnome-remote-desktop.service.d
    state: directory
    mode: "0755"

- name: desktop | The remote desktop waits for the marker
  ansible.builtin.template:
    src: rdp-wait-for-password.conf.j2
    dest: /etc/systemd/system/gnome-remote-desktop.service.d/10-wait-for-password.conf
    mode: "0644"

- name: desktop | The path unit starts the remote desktop when the marker appears
  ansible.builtin.template:
    src: desktop-rdp.path.j2
    dest: /etc/systemd/system/desktop-rdp.path
    mode: "0644"

# Test build only: the passwords come from the box, so the console script is skipped (the marker exists). Neither
# password is on a command line (stdin) or in the log.
# Test build: the console prompt runs for real, with throwaway passwords fed in on standard input instead of typed on
# tty1, so a test build exercises the prompt's own script, its marker and its ExecStartPost, the path the owner's build
# takes. The file (0600, root, in /run) is removed by the unit's own ExecStartPost, and /run is gone at the next boot.
- name: desktop | The password marker is looked up
  ansible.builtin.stat:
    path: "{{ desktop_password_marker }}"
  register: desktop_marker

# Written only while the marker is absent: with the marker there the prompt is skipped and nothing would consume the file.
- name: desktop | Test build, the throwaway passwords are fed to the console prompt
  ansible.builtin.copy:
    dest: /run/desktop-test-passwords
    content: |
      {{ desktop_test_login_password }}
      {{ desktop_test_login_password }}
      {{ desktop_test_rdp_password }}
      {{ desktop_test_rdp_password }}
    mode: "0600"
    owner: root
    group: root
  no_log: true
  when: desktop_test_login | bool and not desktop_marker.stat.exists

- name: desktop | Folder for the console prompt's drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/desktop-set-password.service.d
    state: directory
    mode: "0755"

- name: desktop | Test build, the console prompt reads them
  ansible.builtin.copy:
    dest: /etc/systemd/system/desktop-set-password.service.d/10-test-passwords.conf
    content: |
      # Written by role desktop on a test build only: the prompt reads the box's throwaway passwords, not the console.
      # ExecStopPost also runs when ExecStart fails, so the file never outlives a run.
      [Service]
      StandardInput=file:/run/desktop-test-passwords
      ExecStartPost=/usr/bin/rm -f /run/desktop-test-passwords
      ExecStopPost=/usr/bin/rm -f /run/desktop-test-passwords
    mode: "0644"
  when: desktop_test_login | bool

# The owner's build: a VM that was a test build keeps the admin key, so a plain configure can reach it. Neither the drop-in
# nor a left-over feed file may survive onto it.
- name: desktop | Not a test build, the test drop-in and the feed file are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/desktop-set-password.service.d/10-test-passwords.conf
    - /run/desktop-test-passwords
  when: not (desktop_test_login | bool)

# A marker already there on a test build: no prompt runs, so the feed file is not left behind.
- name: desktop | The feed file is absent when the prompt will not run
  ansible.builtin.file:
    path: /run/desktop-test-passwords
    state: absent
  when: desktop_marker.stat.exists

- name: desktop | The units are enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - desktop-set-password.service
    - desktop-rdp.path
    - gnome-remote-desktop.service

# gdm and the console password prompt both want tty1 (the prompt's service sets TTYPath=/dev/tty1 and takes the getty's place;
# gdm's greeter takes vt1 and its own unit conflicts with getty@tty1). gdm therefore starts after the prompt: while the
# owner has not typed the passwords gdm waits behind the prompt, and once the marker exists the prompt is skipped and gdm
# starts at once. The system RDP daemon waits for gdm (measured 2026-11-20: gdm inactive, the daemon stuck "activating"
# and nothing on 3389 until a reboot started gdm), so the RDP service is up without a reboot.
- name: desktop | Folder for gdm's drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/gdm.service.d
    state: directory
    mode: "0755"

- name: desktop | gdm starts after the console password prompt
  ansible.builtin.copy:
    dest: /etc/systemd/system/gdm.service.d/10-after-password-prompt.conf
    content: |
      # Written by role desktop: the console password prompt owns tty1 until the owner has typed the passwords.
      [Unit]
      After=desktop-set-password.service
    mode: "0644"

# Enabling a path unit does not start it until the next boot. Started now, it starts the remote desktop the moment
# the marker exists: at once on a test build, and when the owner has typed the password otherwise. Seen on the
# 2026-11-20 test build: with the unit only enabled, 3389 refused connections until a reboot.
- name: desktop | The path unit is running
  ansible.builtin.systemd_service:
    name: desktop-rdp.path
    state: started

- name: desktop | firewalld runs
  ansible.builtin.systemd_service:
    name: firewalld.service
    enabled: true
    state: started

# The daemon answers a moment after its unit starts; the next module refuses with "firewall is not currently running"
# before that (seen on the 2026-11-20 test build, run 2).
- name: desktop | firewalld answers
  ansible.builtin.command: firewall-cmd --state
  register: desktop_firewalld_state
  until: desktop_firewalld_state.rc == 0
  retries: 15
  delay: 2
  changed_when: false

- name: desktop | firewalld accepts RDP from the connector's address only
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ desktop_rdp_source }}" port port="{{ desktop_rdp_port }}" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled

- name: desktop | firewalld also accepts RDP from the extra addresses (a test build)
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ desktop_rdp_port }}" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ desktop_rdp_extra_sources }}"
  loop_control:
    label: "extra RDP source"

# Started now, without waiting: the oneshot holds tty1 until the owner has typed the password, so a plain
# start would block this run. Nothing reboots the VM, so without this the console keeps its getty.
- name: desktop | The console prompt starts now
  ansible.builtin.systemd_service:
    name: desktop-set-password.service
    state: started
    no_block: true

# Not waited for: on the owner's build the start job queues behind the console prompt, which holds tty1 until the owner
# has typed the passwords, so a plain start would block this run. On a test build the prompt is skipped and gdm starts now.
- name: desktop | gdm is started
  ansible.builtin.systemd_service:
    name: gdm.service
    state: started
    daemon_reload: true
    no_block: true

# The proof that the desktop trusts the lab's certificates (ask 275), while an agent can still look: the run fails
# here, before the admin user's key is removed, if the system store does not verify the lab chain, or if any
# name in desktop_trust_check_names gives a TLS error or no answer. Role k8s_node_trust's handler rebuilds the
# trust store only at a flush, so the handlers run first. files/desktop-trust-check.sh prints one line per check.
- name: desktop | Handlers run, so the trust store holds the lab root before the check
  ansible.builtin.meta: flush_handlers

- name: desktop | The desktop trusts the lab's certificates
  ansible.builtin.include_tasks: trust_check.yml
  when: desktop_trust_chain_file | length > 0

# Last: the agents keep no SSH login. A later change is a rebuild from teardown.
# One task, one SSH connection: the admin key is removed and the public zone's ssh and cockpit are closed together.
# Ansible opens a new connection per task, so the key removal and the closing as two tasks could never both run:
# after the first, the next login is refused (seen on the 2026-11-14, 11-19 and 11-20 runs: the key task ended
# "Permission denied" and the closing task never ran). Nothing needs ssh or cockpit once the key is gone, and the
# default zone would otherwise accept them from any address that reaches the VM. A later change is a rebuild.
- name: desktop | The admin user's SSH keys are removed and ssh and cockpit are closed
  ansible.builtin.shell: |
    set -eu
    firewall-cmd --permanent --zone=public --remove-service=ssh --remove-service=cockpit
    firewall-cmd --zone=public --remove-service=ssh --remove-service=cockpit
    rm -f "/home/{{ desktop_admin_user }}/.ssh/authorized_keys"
  args:
    executable: /bin/bash
  changed_when: true
  when: desktop_lock_admin | bool
