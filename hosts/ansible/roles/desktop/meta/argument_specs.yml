---
argument_specs:
  main:
    short_description: A GNOME desktop with GNOME remote desktop (RDP) on an AlmaLinux 10 VM, for the owner to sign in to apps by hand
    options:
      # Private, from the inventory
      desktop_rdp_source:
        type: str
        required: true
        description: >-
          The one IPv4 address or CIDR RDP arrives from, which is the tailnet connector's own address
          (it rewrites the source). firewalld accepts the RDP port from it only. Private.
      desktop_admin_user:
        type: str
        required: true
        description: The user Ansible reaches the VM as. Its SSH keys are removed at the end of the run.
      # Defaults in defaults/main.yml
      desktop_user: {type: str, default: owner, description: "The RDP login user, without sudo."}
      desktop_packages:
        type: list
        elements: str
        default:
          - gdm
          - gnome-shell
          - gnome-session-wayland-session
          - gnome-control-center
          - nautilus
          - ptyxis
          - firefox
          - gnome-remote-desktop
          - openssl
          - firewalld
          - python3-firewall
        description: The desktop packages, all from the AlmaLinux 10 base repositories.
      desktop_rdp_tls_dir: {type: path, default: /var/lib/gnome-remote-desktop, description: "Where the RDP certificate and key are made."}
      desktop_rdp_port: {type: int, default: 3389, description: "The port the remote desktop listens on and firewalld opens for the connector's address."}
      desktop_password_marker:
        type: path
        default: /var/lib/desktop/password-set
        description: Made when the owner has set the password at the console; the remote desktop starts only after it.
      desktop_lock_admin: {type: bool, default: true, description: "Remove the admin user's SSH keys at the end of the run."}
      desktop_trust_chain_file:
        type: str
        description: >-
          The lab CA chain file on the controller (intermediate first, root last). The run fails before the admin
          key is removed unless the VM's system store verifies it. Default: role k8s_node_trust's chain file when
          that role is on, else empty, which skips the check.
      desktop_trust_bundle: {type: path, default: /etc/pki/tls/certs/ca-bundle.crt, description: "The extracted system trust store the check verifies against."}
      desktop_trust_check_zone:
        type: str
        default: ""
        description: The lab's DNS zone (private). With it, the check opens <app>.<zone> for each app in desktop_trust_check_apps.
      desktop_trust_check_reach:
        type: bool
        default: true
        description: >-
          Open the apps' names from the VM. Needs the lab firewall's pass from the desktop to the c1 Gateway on 443
          (role opnsense_lab, app access); without it every name fails as not reached, so set it false there.
      desktop_trust_check_apps:
        type: list
        elements: str
        default: [grafana, argocd, sso, jellyfin, ntfy]
        description: The apps whose short names the check opens, the same as the gateway's name check (nameCheck.apps).
      desktop_trust_check_names:
        type: list
        elements: str
        description: >-
          Names the check opens over https with the system store. Default: <app>.<desktop_trust_check_zone> for each
          app when desktop_trust_check_reach is true, or none without it or without a zone, which runs only the chain check.
