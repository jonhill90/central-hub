---
argument_specs:
  main:
    short_description: A GNOME desktop with GNOME remote desktop (RDP) on an AlmaLinux 10 VM, for the owner to sign in to apps by hand
    options:
      # Private, from the inventory
      desktop_rdp_source:
        type: str
        required: true
        description: >-
          The one IPv4 address or CIDR RDP arrives from, which is the tailnet connector's own address
          (it rewrites the source). firewalld accepts the RDP port from it only. Private.
      desktop_admin_user:
        type: str
        required: true
        description: The user Ansible reaches the VM as. Its SSH keys are removed at the end of the run.
      # Defaults in defaults/main.yml
      desktop_user: {type: str, default: owner, description: "The RDP login user, without sudo."}
      desktop_packages:
        type: list
        elements: str
        default: [gdm, gnome-shell, gnome-session-wayland-session, gnome-control-center, nautilus, ptyxis, firefox, gnome-remote-desktop, openssl, firewalld, python3-firewall]
        description: The desktop packages, all from the AlmaLinux 10 base repositories.
      desktop_rdp_tls_dir: {type: path, default: /var/lib/gnome-remote-desktop, description: "Where the RDP certificate and key are made."}
      desktop_rdp_port: {type: int, default: 3389, description: "The port the remote desktop listens on and firewalld opens for the connector's address."}
      desktop_password_marker:
        type: path
        default: /var/lib/desktop/password-set
        description: Made when the owner has set the password at the console; the remote desktop starts only after it.
      desktop_lock_admin: {type: bool, default: true, description: "Remove the admin user's SSH keys at the end of the run."}
