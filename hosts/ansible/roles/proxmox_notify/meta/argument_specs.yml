---
# Inputs of the proxmox_notify role. The check is tagged always, so it runs with any --tags.
argument_specs:
  main:
    short_description: A Proxmox notification target and matcher for errors (failed backups, fencing, system errors)
    options:
      # Optional, private, through the inventory. Unset = the matcher points at a switched-off placeholder.
      proxmox_notify_endpoint:
        type: dict
        required: false
        description: Where alerts go. Not picked yet, so no default.
        options:
          type:
            type: str
            required: true
            choices: [smtp, gotify, webhook, sendmail]
            description: Proxmox endpoint type.
          options:
            type: dict
            required: true
            description: >-
              The API's fields for that type, for example server and token for gotify. A list
              value is sent as a repeated option. Webhook body, header and secret values are base64,
              as the API expects.
      # Optional, private (holds the zone), through the inventory. Empty = unset. Builds proxmox_notify_endpoint.
      proxmox_notify_ntfy_url:
        type: str
        required: false
        description: >-
          An ntfy topic URL, for example https://ntfy.apps.c1.prod.<zone>/c1-alerts. When set, the target is a
          webhook that posts each matched notification there. Not together with proxmox_notify_endpoint.
      # Optional, secret, through the inventory. Empty = no Authorization header.
      proxmox_notify_ntfy_token:
        type: str
        required: false
        no_log: true
        description: >-
          Proxmox's send-only ntfy token (pick 171), sent as a bearer token. ntfy on c1 refuses
          anonymous posts, so set it with proxmox_notify_ntfy_url.
      proxmox_notify_ntfy_address:
        type: str
        default: ""
        description: >-
          The IPv4 address of c1's Gateway (pick 215). With proxmox_notify_ntfy_url set, the role
          keeps one marked /etc/hosts line from the URL's name to it, because the host's resolver
          doesn't know lab names; empty removes that line.
      # Defaults in defaults/main.yml
      proxmox_notify_placeholder: {type: str, default: central-hub-off, description: Name of the switched-off sendmail placeholder target.}
      proxmox_notify_target_prefix: {type: str, default: central-hub, description: The real target is named <prefix>-<type>.}
      proxmox_notify_matcher: {type: str, default: central-hub-errors, description: Matcher name.}
      proxmox_notify_severities: {type: list, elements: str, default: [error], description: Severities the matcher sends.}
      proxmox_notify_secret_keys: {type: list, elements: str, default: [password, token, secret, header], description: Option names never logged or compared.}
      proxmox_notify_ntfy_title: {type: str, description: "ntfy Title header; a Proxmox Handlebars template."}
      proxmox_notify_ntfy_body: {type: str, description: "ntfy message body; a Proxmox Handlebars template."}
      proxmox_notify_ntfy_priority: {type: str, default: high, description: ntfy Priority header.}
      proxmox_notify_ntfy_tags: {type: str, default: "warning,proxmox", description: "ntfy Tags header, comma-separated."}
