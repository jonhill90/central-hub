---
# Runbook steps 7-10. The endpoint name is api.<cluster>.<env>.<zone> (STD-0001); the zone is
# private, so k8s_control_plane_endpoint has no default.
# k8s_control_plane_endpoint: api.c1.prod.<zone>
k8s_control_plane_kubernetes_version: "1.36.5"
k8s_control_plane_pod_cidr: 10.240.0.0/16      # STD-0002 cluster 1
k8s_control_plane_service_cidr: 10.96.0.0/16   # STD-0002 cluster 1
k8s_control_plane_helm_version: v4.3.1
k8s_control_plane_cilium_version: 1.20.4
k8s_control_plane_lb_cidr: 10.1.10.224/27      # STD-0002 VLAN 10 load-balancer range
k8s_control_plane_lb_pool_name: prod
# BUILD-PATH S11. Cilium's Gateway API controller, the platform's way in for web traffic (the
# owner's yes, 2026-10-26 22:47 UTC). The CRDs are applied before the Helm upgrade turns it on.
k8s_control_plane_gateway_api: true
# The Gateway API release Cilium 1.20.4's docs name (Documentation/conf.py gateway_api_version),
# standard channel, all CRDs in one file. Published 2026-10-06, so at least two weeks old on
# 2026-10-27 (STD-0003). The project publishes no checksum; this is the file's SHA-256 as fetched
# on 2026-10-27, so a changed file stops the run.
k8s_control_plane_gateway_api_version: v1.6.3
k8s_control_plane_gateway_api_crds_sha256: 356c2b8e286a964dc20995435659ad1095386329974793af10bbfe3eff977fe5
# Runbook step 8a. Secrets encrypted at rest in etcd with secretbox, before the first real secret
# (the Cloudflare token of BUILD-PATH S12; research batch RB-0012 "Now" step 4, RB-0089 G28-G29).
# Private, no default, set in the inventory:
# k8s_control_plane_encryption_key_file: <path>  # on the controller, mode 0600: 32 random bytes,
#                                                # base64 (one line); a copy in the password manager
k8s_control_plane_encryption_dir: /etc/kubernetes/enc
k8s_control_plane_encryption_key_name: key1
# A Secret written and read back straight from etcd after the API server restarts, then deleted.
k8s_control_plane_encryption_canary: central-hub-encryption-canary
