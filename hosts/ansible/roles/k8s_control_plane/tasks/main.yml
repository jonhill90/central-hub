---
# Step 7. The endpoint name must resolve to this node (OPNsense Unbound override, BUILD-PATH S07;
# the runbook used an /etc/hosts entry).
- name: step7 | Endpoint name resolves to this node
  ansible.builtin.command: getent hosts {{ k8s_control_plane_endpoint }}
  register: k8s_cp_getent
  changed_when: false
  failed_when: ansible_default_ipv4.address not in k8s_cp_getent.stdout

# Step 8. Init
- name: step8 | Already initialised?
  ansible.builtin.stat: {path: /etc/kubernetes/admin.conf}
  register: k8s_cp_admin

- name: step8 | Pull images
  ansible.builtin.command: kubeadm config images pull --kubernetes-version v{{ k8s_control_plane_kubernetes_version }}
  when: not k8s_cp_admin.stat.exists
  changed_when: true

- name: step8 | kubeadm init
  ansible.builtin.command: >-
    kubeadm init --kubernetes-version v{{ k8s_control_plane_kubernetes_version }}
    --control-plane-endpoint {{ k8s_control_plane_endpoint }}:6443
    --pod-network-cidr {{ k8s_control_plane_pod_cidr }}
    --service-cidr {{ k8s_control_plane_service_cidr }}
    --skip-phases addon/kube-proxy
  when: not k8s_cp_admin.stat.exists
  changed_when: true

- name: step8 | root's .kube folder
  ansible.builtin.file: {path: /root/.kube, state: directory, mode: "0700"}

- name: step8 | root's kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

# Step 9. Cilium, by Helm, with its Gateway API controller (BUILD-PATH S11). Changes from the runbook: devices = the lab NIC (not tailscale0),
# no MTU override (the lab NIC has 1500; 1230 was for the tailnet's 1280), and Cilium replaces
# kube-proxy (skipped at init) so L2 announcements can hand out load-balancer addresses
# (owner's yes 2026-10-26 22:46 UTC; research/k8s-lb-addresses LEDGER B13).
- name: step9 | Helm tarball, checked against its published checksum
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ k8s_control_plane_helm_version }}-linux-amd64.tar.gz"
    dest: "/root/helm-{{ k8s_control_plane_helm_version }}-linux-amd64.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-{{ k8s_control_plane_helm_version }}-linux-amd64.tar.gz.sha256sum"
    mode: "0644"

- name: step9 | Unpack Helm
  ansible.builtin.unarchive:
    src: "/root/helm-{{ k8s_control_plane_helm_version }}-linux-amd64.tar.gz"
    dest: /root
    remote_src: true
    creates: /root/linux-amd64/helm

- name: step9 | Install Helm
  ansible.builtin.copy: {src: /root/linux-amd64/helm, dest: /usr/local/bin/helm, remote_src: true, mode: "0755"}

- name: step9 | Cilium repo
  ansible.builtin.shell: /usr/local/bin/helm repo add cilium https://helm.cilium.io/ --force-update && /usr/local/bin/helm repo update cilium
  changed_when: false

# BUILD-PATH S11. Cilium's Gateway API controller needs the Gateway API CRDs in the cluster
# before it is turned on; its GatewayClass `cilium` is made only when the CRD is there
# (values.yaml gatewayAPI.gatewayClass.create: auto). Standard channel: it holds every CRD
# Cilium 1.20 needs and the optional ones (ListenerSet, TCPRoute, UDPRoute), and nothing here
# uses an experimental field. Cilium docs: network/servicemesh/gateway-api/installation.rst.
- name: step9 | kubectl diff needs diff
  ansible.builtin.dnf: {name: diffutils, state: present}
  when: k8s_control_plane_gateway_api

- name: step9 | Gateway API CRDs, checked against the pinned checksum
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ k8s_control_plane_gateway_api_version }}/standard-install.yaml"
    dest: "/root/gateway-api-{{ k8s_control_plane_gateway_api_version }}-standard-install.yaml"
    checksum: "sha256:{{ k8s_control_plane_gateway_api_crds_sha256 }}"
    mode: "0644"
  when: k8s_control_plane_gateway_api

# kubectl diff exits 0 with no difference, 1 with one, more on an error. A read, so it runs in
# check mode too.
- name: step9 | Gateway API CRDs differ from the cluster?
  ansible.builtin.command: >-
    kubectl diff --server-side -f /root/gateway-api-{{ k8s_control_plane_gateway_api_version }}-standard-install.yaml
  register: k8s_cp_gwapi_diff
  changed_when: false
  failed_when: k8s_cp_gwapi_diff.rc > 1
  check_mode: false
  when: k8s_control_plane_gateway_api

- name: step9 | Apply the Gateway API CRDs
  ansible.builtin.command: >-
    kubectl apply --server-side -f /root/gateway-api-{{ k8s_control_plane_gateway_api_version }}-standard-install.yaml
  changed_when: true
  when: k8s_control_plane_gateway_api and k8s_cp_gwapi_diff.rc == 1

- name: step9 | Gateway API CRDs established
  ansible.builtin.command: >-
    kubectl wait --for=condition=Established --timeout=60s
    crd/gatewayclasses.gateway.networking.k8s.io crd/gateways.gateway.networking.k8s.io
    crd/httproutes.gateway.networking.k8s.io
  changed_when: false
  when: k8s_control_plane_gateway_api and not ansible_check_mode

# Every Cilium value is in vars/main.yml (k8s_cp_cilium_values), so one `helm upgrade --install`
# both installs and changes Cilium, and --reset-values keeps exactly these values (the docs'
# --reuse-values would keep values set by hand). gatewayAPI needs kubeProxyReplacement=true (set)
# and l7Proxy=true (the chart's default).
- name: step9 | Cilium values file
  ansible.builtin.copy:
    dest: /root/cilium-values.yaml
    mode: "0600"
    content: "{{ k8s_cp_cilium_values | to_nice_yaml(indent=2) }}"

- name: step9 | Cilium release now
  ansible.builtin.command: /usr/local/bin/helm -n kube-system list --filter ^cilium$ -o json
  register: k8s_cp_cilium_list
  changed_when: false
  failed_when: false
  check_mode: false

- name: step9 | Cilium values now
  ansible.builtin.command: /usr/local/bin/helm -n kube-system get values cilium -o json
  register: k8s_cp_cilium_now
  changed_when: false
  failed_when: false
  check_mode: false

# Upgrade only when the chart version or a value differs, so a re-run reports no change.
- name: step9 | Install or upgrade Cilium
  ansible.builtin.command: >-
    /usr/local/bin/helm upgrade --install cilium cilium/cilium --version {{ k8s_control_plane_cilium_version }}
    -n kube-system --reset-values -f /root/cilium-values.yaml
  when: >-
    k8s_cp_cilium_releases | map(attribute='chart') | list != ['cilium-' ~ k8s_control_plane_cilium_version]
    or k8s_cp_cilium_now.rc != 0
    or (k8s_cp_cilium_now.stdout | from_json) != k8s_cp_cilium_values
  register: k8s_cp_cilium_upgrade
  changed_when: true

# Cilium's Gateway API page restarts the operator and the agents after the upgrade that turns
# the controller on, so both pick up the new settings. Not needed after a first install.
- name: step9 | Restart the Cilium operator and agents after an upgrade
  ansible.builtin.shell: >-
    kubectl -n kube-system rollout restart deployment/cilium-operator &&
    kubectl -n kube-system rollout restart ds/cilium &&
    kubectl -n kube-system rollout status deployment/cilium-operator --timeout=300s
  when: k8s_cp_cilium_upgrade is changed and k8s_cp_cilium_releases | length > 0
  changed_when: true

- name: step9 | Cilium and CoreDNS ready
  ansible.builtin.shell: >-
    kubectl -n kube-system rollout status ds/cilium --timeout=300s &&
    kubectl -n kube-system rollout status deploy/coredns --timeout=300s
  changed_when: false

- name: step9 | Load-balancer address pool and L2 announcement policy
  ansible.builtin.shell: |
    kubectl apply -f - <<'YAML'
    apiVersion: cilium.io/v2
    kind: CiliumLoadBalancerIPPool
    metadata:
      name: {{ k8s_control_plane_lb_pool_name }}
    spec:
      blocks:
        - cidr: {{ k8s_control_plane_lb_cidr }}
    ---
    apiVersion: cilium.io/v2alpha1
    kind: CiliumL2AnnouncementPolicy
    metadata:
      name: {{ k8s_control_plane_lb_pool_name }}
    spec:
      interfaces:
        - {{ ansible_default_ipv4.interface }}
      loadBalancerIPs: true
    YAML
  register: k8s_cp_lb
  changed_when: "'created' in k8s_cp_lb.stdout or 'configured' in k8s_cp_lb.stdout"

# Step 10. With a worker in this cluster the control-plane taint stays (the runbook's single node
# removed it). The smoke test runs after the worker joins (playbooks/k8s.yml).
