---
# Derived values, not inputs: change the inputs in defaults/main.yml or the inventory instead.

# Every Cilium Helm value this role sets (runbook step 9 and its home-lab place note). The role
# compares them with `helm get values` and upgrades only when they differ. gatewayAPI.enabled
# needs kubeProxyReplacement=true and l7Proxy=true (the chart's default; Cilium 1.20 Gateway API
# prerequisites).
k8s_cp_cilium_values:
  ipam:
    mode: cluster-pool
    operator:
      clusterPoolIPv4PodCIDRList: ["{{ k8s_control_plane_pod_cidr }}"]
  devices: "{{ ansible_default_ipv4.interface }}"
  kubeProxyReplacement: true
  k8sServiceHost: "{{ k8s_control_plane_endpoint }}"
  k8sServicePort: 6443
  l2announcements:
    enabled: true
  operator:
    replicas: 1
  gatewayAPI:
    enabled: "{{ k8s_control_plane_gateway_api }}"

# The installed Cilium release, as `helm list -o json` gives it; empty before the first install
# (and in check mode before Helm is there).
k8s_cp_cilium_releases: "{{ (k8s_cp_cilium_list.stdout | default('', true) or '[]') | from_json }}"
