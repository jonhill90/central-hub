---
# BUILD-PATH S13: the GitOps engine on cluster c1. Every input is listed here (Red Hat CoP rule).
#
# The engine has no default: set it in the inventory. The owner chose argocd, with the web UI
# (D-0023); flux and argocd-core (no UI, no API server) stay as choices for the exit path.
# k8s_gitops_engine: <engine>

# Activation gate (CLAUDE.md): no cluster reads central-hub until all 7 items are true and
# recorded. The exception is c1, which may read it now (D-0027, the owner's yes of 2026-11-08 at
# 07:16 UTC). While this is false the engine runs with no source, so nothing is pulled from git.
k8s_gitops_source_enabled: false

# Where the cluster reads its desired state once the gate passes: anonymous HTTPS, the main branch,
# one folder per cluster (D-0002, D-0011 `hosts/kubernetes/<place>/<cluster>/`).
k8s_gitops_source_url: https://github.com/jonhill90/central-hub
k8s_gitops_source_branch: main
k8s_gitops_source_path: hosts/kubernetes/home/c1
k8s_gitops_source_interval: 5m

# Argo CD only: the root Application and the Helm chart it renders, which makes one child
# Application per component (spec docs/specs/2026-11-c1-apps-under-argo-cd.md). Flux reads
# k8s_gitops_source_path above instead.
k8s_gitops_root_name: c1
k8s_gitops_root_path: hosts/kubernetes/home/c1/root
# The cluster's own entry in Argo CD (Argo CD only, tag source): a cluster Secret for the local
# cluster, named after the cluster, with what the cluster is as labels (STD-0001 "Cluster labels";
# the owner's yes of 2026-11-09 01:10 UTC to keeping the name c1 and labelling what it is). It holds
# no credential: Argo CD reaches its own cluster with its own service account. ApplicationSets can
# then pick clusters by these labels.
k8s_gitops_cluster_name: c1
k8s_gitops_cluster_labels:
  place: home
  provider: proxmox
  hardware: old-pc
  env: prod
  purpose: apps
# Private, no default, needed only with the source on; the inventory template sets it to
# k8s_gateway_zone. It is passed to the root chart as its `zone` value.
# k8s_gitops_source_zone: <zone>
# Private, no default: the Gateway's address, passed to the root chart as `gatewayAddress` for the
# gateway app (spec step 9). The inventory template sets it to k8s_gateway_address. Left unset, only
# the gateway app fails to render.
# k8s_gitops_source_gateway_address: <address>
# Whether the Gateway gets its HTTPS listeners, passed to the root chart as `gatewayHttps` only when
# false. It follows k8s_gateway_https: a cluster with no certificate (a dev rebuild, which has no
# c1 CA key, D-0028) serves HTTP only, so the gateway app is not Degraded on a missing Secret.
k8s_gitops_source_gateway_https: "{{ k8s_gateway_https | default(true) }}"
# Private, no default: the shared node the share pod forwards to, as <address>:<port>, passed to the
# root chart as `shareTarget` (apps/share-pod). Left unset, the share-pod app renders nothing.
# k8s_gitops_source_share_target: <address>:<port>
# Whether local-path names each volume's folder <namespace>/<claim>, passed to the root chart as
# `localPathStableFolders` only when true. Dev turns it on, so its restore of prod's backup puts each
# folder where the claim will look (TASK-0240, agent pick 205). c1 keeps false: its StorageClass's
# parameters can't change in place.
k8s_gitops_source_local_path_stable_folders: false
# Whether the cluster has ClusterIssuer lab-ca, passed to the root chart as `labCaIssuer` only when false. Dev
# has none (no `certs` stage; its own CA is dev-ca, made after `checks`), so hosts/rebuild-k8s.sh sets it false
# on dev and jellyfin reads its lab root from the optional Secret instead. c1 keeps true.
k8s_gitops_source_lab_ca_issuer: true
# Whether the cluster runs the sign-in checks (app login-probe), passed to the root chart as `loginProbe` only
# when false. Dev's lab names resolve to prod's Gateway, so hosts/rebuild-k8s.sh sets it false on dev. c1 keeps true.
k8s_gitops_source_login_probe: true
# Whether Jellyfin's setup CronJob runs, passed to the root chart as `jellyfinSetup` only when false. Dev restores
# prod's Jellyfin config (with prod's admin password) before the apps start, so the setup Job's own, freshly made
# admin Secret can't sign in; hosts/rebuild-k8s.sh sets it false on dev. c1 keeps true.
k8s_gitops_source_jellyfin_setup: true
# Whether monitoring-extras' panel-check CronJob is suspended, passed to the root chart as `panelCheckSuspended` only
# when true. Dev's OpenBao and Keycloak panels have no data until stages after `apps` (Jellyfin's request rate printed none
# too, cause not measured), so hosts/rebuild-k8s.sh sets it
# true on dev. c1 keeps false.
k8s_gitops_source_panel_check_suspended: false
# Where the apps' ExternalSecrets read their values (D-0058 rules 5 and 8), passed to the root chart as
# `appSecretsStore` when set. Empty, as now: store c1, namespace secret-source. `openbao`: key c1/<name>
# through store openbao, which needs k8s_gitops_source_openbao_in_cluster. Set it only once each value
# is in OpenBao and its SOPS copy and `secrets-store compare` passes
# (docs/runbooks/set-up-the-secrets-store.md, "The apps' secrets").
k8s_gitops_source_app_secrets_store: ""
# The secrets store, OpenBao inside the cluster (D-0058), dev's cluster first. True passes
# `openbaoInCluster` to the root chart, which then makes the apps openbao-store and openbao and the
# secret-store app's store `openbao`. c1 keeps false: nothing changes.
k8s_gitops_source_openbao_in_cluster: false
# The agent notebook's CI runner as a pod (app notebook-runner, docs/runbooks/run-the-notebook-runner-on-c1.md).
# True passes `notebookRunner` to the root chart. Only prod's wrappers set it (openbao-prod.sh,
# rebuild-prod.sh), so a dev cluster never registers a second runner under the same name.
k8s_gitops_source_notebook_runner: false
# Private, no default, read only with the switch on: the node that holds the seal key's folder (its
# kubernetes.io/hostname label), passed as `openbaoSealNode`; and the agent box's address as a /32,
# the only source the admin AppRole signs in from, passed as `openbaoBoxCidr`. Unset, the seal
# volume is not made (OpenBao waits), and the admin binding falls back to 127.0.0.1/32, which a
# `kubectl port-forward` connection also matches, so the box's hand-over refuses until it is set.
# k8s_gitops_source_openbao_seal_node: <node name>
# k8s_gitops_source_openbao_box_cidr: <address>/32
# Private, no default, read only with the switch on: the store's admin address, one address of the
# load-balancer pool (not its first or last), passed as `openbaoAdminAddress`. The box's admin login goes
# there, so OpenBao sees the box's own address (D-0062). Set it only after role k8s_control_plane's general
# L2 policy leaves out Services labelled central-hub/l2-policy. Unset: no admin path.
# k8s_gitops_source_openbao_admin_address: <address>
# The dev-only measurement of the agent box's source address through the Gateway (MEASURE-1), read only
# with the switch above on: true passes `openbaoMeasure`. Never set in an inventory: hosts/rebuild-k8s.sh
# passes it with -e on dev, when the in-cluster store's seal key file is set.
k8s_gitops_source_openbao_measure: false

# The Argo CD web UI through the shared Gateway (tag ui), a follow-on to BUILD-PATH S12: the owner
# said (2026-10-27 03:52 UTC, relayed) the UI waits until DNS is up, with no port-forward. On, it
# serves https://<name>.apps.<cluster>.<env>.<zone>/ on Gateway `apps`'s HTTPS listener only, ends
# TLS at the Gateway (Argo CD's server.insecure: "true"), and sends plain HTTP for that name to
# HTTPS. Off (the default), a run removes the routes and puts server.insecure back to "false" if an
# earlier run set it. Argo CD only (engine argocd); it adds no git source (Activation gate).
k8s_gitops_ui_route: false
# Private, no default, needed only with the route on; the inventory template sets it to
# k8s_gateway_zone:
# k8s_gitops_ui_zone: <zone>
k8s_gitops_ui_name: argocd
k8s_gitops_ui_cluster: c1
k8s_gitops_ui_env: prod
# The shared Gateway (role k8s_gateway) and its certificate Secret (role k8s_certs).
k8s_gitops_ui_gateway_name: apps
k8s_gitops_ui_gateway_namespace: gateway
k8s_gitops_ui_tls_secret: apps-tls
# Whether the Gateway has its HTTPS listener; the inventory template sets it to k8s_gateway_https.
# The run also checks the live listener.
k8s_gitops_ui_gateway_https: false
# A second route on the HTTP listener that answers 301 to https:// for the UI's name only.
k8s_gitops_ui_https_redirect: true
# Short aliases (STD-0001 rules 5 and 7): the UI also answers on argocd.<zone> through the Gateway's
# short listeners, Argo CD builds its links with that name, and sign-in uses Keycloak at sso.<zone>
# (k8s_identity_short_names). Needs the short names in the lab DNS first.
k8s_gitops_ui_short_names: true
# The machine that proves the UI answers, by name through the lab's DNS: a node.
k8s_gitops_ui_proof_client: "{{ groups['k8s_workers'] | first }}"

# Sign-in to Argo CD through the lab's Keycloak (tag sso), with the clients role k8s_identity makes
# in realm lab (argocd, and argocd-cli for `argocd login --sso`). Needs the UI route on and Secret
# argocd/argocd-sso from k8s_identity. Off (the default), a run removes the keys an earlier run set.
# The built-in admin account stays, as the way in when Keycloak is down.
k8s_gitops_sso: false
k8s_gitops_sso_name: Lab sign-in
k8s_gitops_sso_issuer: >-
  https://sso.{{ '' if k8s_gitops_ui_short_names | bool else 'apps.' ~ k8s_gitops_ui_cluster ~ '.' ~ k8s_gitops_ui_env ~ '.'
  }}{{ k8s_gitops_ui_zone | default('') }}/realms/lab
k8s_gitops_sso_client_id: argocd
k8s_gitops_sso_cli_client_id: argocd-cli
# A PEM file on the controller with the CA that signed Keycloak's certificate, for when that is the
# lab CA (D-0028) rather than a public one: Argo CD then trusts it for this provider only (oidc.config
# rootCA). Empty: Argo CD's own trust store. A CA certificate is public, but its names may be
# private, so the file stays out of git (for example ~/.config/central-hub/lab-ca/root.crt).
k8s_gitops_sso_root_ca_file: ""
# Realm group to Argo CD role (k8s_identity_groups).
k8s_gitops_sso_group_roles:
  lab-admins: role:admin
  lab-viewers: role:readonly
# Whether the lab's wildcard DNS override sends this cluster's names to this cluster's Gateway. True
# for c1. False in the dev inventory: a dev rebuild uses c1's names while the wildcard still points
# at prod's Gateway, so a name check there would test prod. The checks that call the Gateway by its
# address with a Host header stay on either way.
k8s_lab_dns_points_here: true
