---
# BUILD-PATH S13: the GitOps engine on cluster c1. Every input is listed here (Red Hat CoP rule).
#
# The engine is the owner's choice (BL-0021), so it has no default: set it in the inventory to
# flux, argocd (with the web UI) or argocd-core (no UI, no API server).
# k8s_gitops_engine: <engine>

# Activation gate (CLAUDE.md): no cluster reads central-hub until all 7 items are true and
# recorded. The exception is c1, which may read it now (D-0027, the owner's yes of 2026-11-08 at
# 07:16 UTC). While this is false the engine runs with no source, so nothing is pulled from git.
k8s_gitops_source_enabled: false

# Where the cluster reads its desired state once the gate passes: anonymous HTTPS, the main branch,
# one folder per cluster (D-0002, D-0011 `hosts/kubernetes/clusters/<role>/`).
k8s_gitops_source_url: https://github.com/jonhill90/central-hub
k8s_gitops_source_branch: main
k8s_gitops_source_path: hosts/kubernetes/clusters/c1
k8s_gitops_source_interval: 5m

# Argo CD only: the root Application and the Helm chart it renders, which makes one child
# Application per component (spec docs/specs/2026-11-c1-apps-under-argo-cd.md). Flux reads
# k8s_gitops_source_path above instead.
k8s_gitops_root_name: c1
k8s_gitops_root_path: hosts/kubernetes/clusters/c1/root
# Private, no default, needed only with the source on; the inventory template sets it to
# k8s_gateway_zone. It is passed to the root chart as its `zone` value.
# k8s_gitops_source_zone: <zone>
# Private, no default: the Gateway's address, passed to the root chart as `gatewayAddress` for the
# gateway app (spec step 9). The inventory template sets it to k8s_gateway_address. Left unset, only
# the gateway app fails to render.
# k8s_gitops_source_gateway_address: <address>

# The Argo CD web UI through the shared Gateway (tag ui), a follow-on to BUILD-PATH S12: the owner
# said (2026-10-27 03:52 UTC, relayed) the UI waits until DNS is up, with no port-forward. On, it
# serves https://<name>.apps.<cluster>.<env>.<zone>/ on Gateway `apps`'s HTTPS listener only, ends
# TLS at the Gateway (Argo CD's server.insecure: "true"), and sends plain HTTP for that name to
# HTTPS. Off (the default), a run removes the routes and puts server.insecure back to "false" if an
# earlier run set it. Argo CD only (engine argocd); it adds no git source (Activation gate).
k8s_gitops_ui_route: false
# Private, no default, needed only with the route on; the inventory template sets it to
# k8s_gateway_zone:
# k8s_gitops_ui_zone: <zone>
k8s_gitops_ui_name: argocd
k8s_gitops_ui_cluster: c1
k8s_gitops_ui_env: prod
# The shared Gateway (role k8s_gateway) and its certificate Secret (role k8s_certs).
k8s_gitops_ui_gateway_name: apps
k8s_gitops_ui_gateway_namespace: gateway
k8s_gitops_ui_tls_secret: apps-tls
# Whether the Gateway has its HTTPS listener; the inventory template sets it to k8s_gateway_https.
# The run also checks the live listener.
k8s_gitops_ui_gateway_https: false
# A second route on the HTTP listener that answers 301 to https:// for the UI's name only.
k8s_gitops_ui_https_redirect: true
# The machine that proves the UI answers, by name through the lab's DNS: a node.
k8s_gitops_ui_proof_client: "{{ groups['k8s_workers'] | first }}"

# Sign-in to Argo CD through the lab's Keycloak (tag sso), with the clients role k8s_identity makes
# in realm lab (argocd, and argocd-cli for `argocd login --sso`). Needs the UI route on and Secret
# argocd/argocd-sso from k8s_identity. Off (the default), a run removes the keys an earlier run set.
# The built-in admin account stays, as the way in when Keycloak is down.
k8s_gitops_sso: false
k8s_gitops_sso_name: Lab sign-in
k8s_gitops_sso_issuer: "https://sso.apps.{{ k8s_gitops_ui_cluster }}.{{ k8s_gitops_ui_env }}.{{ k8s_gitops_ui_zone | default('') }}/realms/lab"
k8s_gitops_sso_client_id: argocd
k8s_gitops_sso_cli_client_id: argocd-cli
# Realm group to Argo CD role (k8s_identity_groups).
k8s_gitops_sso_group_roles:
  lab-admins: role:admin
  lab-viewers: role:readonly
