---
# Activation gate (CLAUDE.md): all 7 items true and recorded before this runs, except on c1 (D-0027).
- name: source | The zone is set
  ansible.builtin.assert:
    that: k8s_gitops_engine == 'flux' or (k8s_gitops_source_zone | default('') | length > 0)
    fail_msg: Set k8s_gitops_source_zone in the inventory (it is private, so it has no default).
    quiet: true

- name: source | Source manifest
  ansible.builtin.template:
    src: "source-{{ 'flux' if k8s_gitops_engine == 'flux' else 'argocd' }}.yaml.j2"
    dest: "{{ k8s_gitops_dir }}/source.yaml"
    mode: "0600"

# kubectl diff exits 0 with no difference, 1 with one, more on an error. In check mode the template
# task above writes nothing, so on a first run the file isn't there yet: the diff then counts as a
# difference, and check mode skips the apply anyway (found on c1, 2026-11-08).
- name: source | Source differs from the cluster?
  ansible.builtin.command: kubectl diff -f {{ k8s_gitops_dir }}/source.yaml
  register: k8s_gitops_source_diff
  changed_when: false
  failed_when: k8s_gitops_source_diff.rc > 1 and not ansible_check_mode
  check_mode: false

- name: source | Apply the source
  ansible.builtin.command: kubectl apply -f {{ k8s_gitops_dir }}/source.yaml
  when: k8s_gitops_source_diff.rc != 0
  changed_when: true
