---
argument_specs:
  main:
    short_description: >-
      The GitOps engine on c1, pinned and with no git write credential (BUILD-PATH S13, Activation gate item 4),
      and its web UI through the shared Gateway
    options:
      k8s_gitops_engine:
        type: str
        required: true
        choices: [flux, argocd, argocd-core]
        description: "The engine; no default. The owner chose argocd (D-0023)."
      k8s_gitops_source_enabled:
        type: bool
        default: false
        description: "Point the engine at central-hub. Keep false until the Activation gate passes."
      k8s_gitops_source_url: {type: str, default: "https://github.com/jonhill90/central-hub", description: Repository read over anonymous HTTPS.}
      k8s_gitops_source_branch: {type: str, default: main, description: Branch the cluster follows (D-0002).}
      k8s_gitops_source_path: {type: str, default: hosts/kubernetes/clusters/c1, description: Folder the cluster reads.}
      k8s_gitops_source_interval: {type: str, default: 5m, description: How often the engine checks git.}
      k8s_gitops_ui_route:
        type: bool
        default: false
        description: >-
          Serve the Argo CD UI at https://argocd.apps.<cluster>.<env>.<zone>/ through Gateway apps (tag ui).
          False removes the routes and sets server.insecure back.
      k8s_gitops_ui_zone: {type: str, description: "The DNS zone. Private; needed only with the route on. The inventory template sets it to k8s_gateway_zone."}
      k8s_gitops_ui_name: {type: str, default: argocd, description: First label of the UI's hostname.}
      k8s_gitops_ui_cluster: {type: str, default: c1, description: Cluster name in the hostname.}
      k8s_gitops_ui_env: {type: str, default: prod, description: Environment name in the hostname.}
      k8s_gitops_ui_gateway_name: {type: str, default: apps, description: "The shared Gateway (k8s_gateway_name), also a label of the hostname."}
      k8s_gitops_ui_gateway_namespace: {type: str, default: gateway, description: "The Gateway's namespace (k8s_gateway_namespace)."}
      k8s_gitops_ui_tls_secret:
        type: str
        default: apps-tls
        description: "The HTTPS listener's certificate Secret (k8s_gateway_tls_secret); only its name and issuer annotation are read."
      k8s_gitops_ui_gateway_https:
        type: bool
        default: false
        description: "Whether the Gateway has its HTTPS listener (k8s_gateway_https). The route needs it true."
      k8s_gitops_ui_https_redirect: {type: bool, default: true, description: "Add a route on the HTTP listener that answers 301 to https:// for the UI's name."}
      k8s_gitops_ui_proof_client:
        type: str
        description: "Inventory host that proves the UI answers by name, through the lab's DNS. Default: the first host of group k8s_workers."
      k8s_gitops_sso:
        type: bool
        default: false
        description: "Sign-in to Argo CD through Keycloak realm lab (tag sso). Needs the UI route and Secret argocd/argocd-sso."
      k8s_gitops_sso_name: {type: str, default: Lab sign-in, description: Button text on Argo CD's sign-in page.}
      k8s_gitops_sso_issuer: {type: str, description: "OIDC issuer URL. Default: realm lab on sso.apps.<cluster>.<env>.<zone>."}
      k8s_gitops_sso_client_id: {type: str, default: argocd, description: Keycloak client for the web UI.}
      k8s_gitops_sso_cli_client_id: {type: str, default: argocd-cli, description: "Public Keycloak client for argocd login --sso."}
      k8s_gitops_sso_group_roles: {type: dict, description: "Realm group to Argo CD role. Default: lab-admins admin, lab-viewers readonly."}
