---
# nginx on the Proxmox host serves the web UI on the standard ports, 443 and (as a redirect) 80, and proxies
# to pveproxy on 127.0.0.1:8006 (the owner's rule, 2026-11-14: no non-standard ports for any lab web page).
# Port 8006 stays as it is: it is the fallback and the agent box's lifeline route. The shape follows
# https://pve.proxmox.com/wiki/Web_Interface_Via_Nginx_Proxy, which was tested only to PVE 6.3, so the
# proof tasks check the current version.
#
# Private, no default, from the inventory: the DNS names the proxy answers to. They must be the names in
# proxmox_cert_names (the certificate role's input), so the served certificate matches.
# proxmox_nginx_server_names: [<name>, ...]
proxmox_nginx_server_names: "{{ proxmox_cert_names | default([]) }}"

# nginx from Debian's own repositories (trixie), at this exact version: the newest in trixie-security when it
# was read, 2026-11-14. nginx-common must match, so both are pinned.
proxmox_nginx_version: "1.26.3-3+deb13u10"

# The certificate and key the web UI serves: pvenode cert set writes them into the cluster file system
# (role proxmox_cert). nginx's master process reads them as root.
proxmox_nginx_cert: /etc/pve/local/pveproxy-ssl.pem
proxmox_nginx_key: /etc/pve/local/pveproxy-ssl.key
# Where pveproxy listens (it answers on all addresses; the proxy reaches it on loopback).
proxmox_nginx_upstream: https://127.0.0.1:8006
# The HTTP statuses the proof accepts for the front page and for an unauthenticated API call.
proxmox_nginx_proof_front_ok: [200]
proxmox_nginx_proof_api_ok: [401]
# The CA bundle the proof uses: Debian's, which holds the lab root after role proxmox_cert.
proxmox_nginx_ca_bundle: /etc/ssl/certs/ca-certificates.crt
