---
# The notebook's self-hosted CI runner (docs/runbooks/set-up-the-ci-runner.md). The runner and its
# jobs run as an unprivileged user with no sudo; the VM holds no lab keys. Registration happens
# once, with a one-hour token the agent box's ci-runner wrapper mints; after that the runner keeps
# its own credential in its home. The runner never updates itself: the pin in defaults is what runs
# (owner's answer, 2026-11-12, hosts/AGENT-PICKS.md pick 208).

- name: Check the hostname against STD-0001 (at most 15 characters, a-z and 0-9, starts with a letter)
  ansible.builtin.assert:
    that: ci_runner_hostname is match('^[a-z][a-z0-9]{10,14}$')
    fail_msg: "{{ ci_runner_hostname }} is not a STD-0001 hostname."
    quiet: true
  tags: [hostname]

- name: The runner's OS hostname
  ansible.builtin.hostname:
    name: "{{ ci_runner_hostname }}"
  tags: [hostname]

# Same reason as the agent_box role: a Proxmox rename must not look like a new cloud-init instance.
- name: Keep the hostname, and the first boot's keys, across renames and reboots (cloud-init)
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-keep-hostname.cfg
    content: |
      # Managed by the ci_runner role (central-hub hosts/ansible): keep the STD-0001 hostname,
      # and never treat a Proxmox rename as a new instance.
      preserve_hostname: true
      manual_cache_clean: true
    owner: root
    group: root
    mode: "0644"
  tags: [hostname]

- name: What the runner and the notebook's jobs need
  ansible.builtin.package:
    name: "{{ ci_runner_packages }}"
    state: present
  tags: [runner]

- name: Runner user, unprivileged, no sudo
  ansible.builtin.user:
    name: "{{ ci_runner_user }}"
    system: true
    shell: /bin/bash
    home: "{{ ci_runner_home }}"
    create_home: true
    groups: ""
    append: false
  tags: [runner]

- name: Runner folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ci_runner_user }}"
    group: "{{ ci_runner_user }}"
    mode: "0750"
  loop:
    - "{{ ci_runner_home }}"
    - "{{ ci_runner_home }}/downloads"
    - "{{ ci_runner_home }}/runner"
  register: ci_runner_dirs
  tags: [runner]

- name: Download the runner, checked against its SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ ci_runner_version }}/actions-runner-linux-x64-{{ ci_runner_version }}.tar.gz"
    dest: "{{ ci_runner_home }}/downloads/actions-runner-linux-x64-{{ ci_runner_version }}.tar.gz"
    checksum: "sha256:{{ ci_runner_sha256 }}"
    owner: "{{ ci_runner_user }}"
    group: "{{ ci_runner_user }}"
    mode: "0640"
  when: not (ansible_check_mode and ci_runner_dirs is changed)
  tags: [runner]

# The runner doesn't update itself (registered with --disableupdate below), so the pin is the
# version that runs: a newer pin is unpacked over the old files, which keeps the registration
# (.runner, .credentials) because the tarball holds no such files. A runner that is already newer
# than the pin (it updated itself before self-update was turned off) is left as it is until the
# pin catches up; the agent box's weekly `ci-runner bump` opens that PR.
- name: Which runner version is installed?
  ansible.builtin.command: "{{ ci_runner_home }}/runner/bin/Runner.Listener --version"
  register: ci_runner_installed
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [runner]

- name: Note the installed and pinned versions
  ansible.builtin.set_fact:
    ci_runner_installed_version: "{{ ci_runner_installed.stdout | default('') | trim if ci_runner_installed.rc == 0 else '' }}"
  tags: [runner]

- name: Say so when the installed runner is newer than the pin
  ansible.builtin.debug:
    msg: >-
      The runner is {{ ci_runner_installed_version }}, newer than the pin {{ ci_runner_version }};
      it stays as it is. Merge the bump PR (`ci-runner bump` opens it) so the pin catches up.
  when:
    - ci_runner_installed_version | length > 0
    - ci_runner_installed_version is version(ci_runner_version, '>')
  tags: [runner]

- name: Stop the runner before its files change
  ansible.builtin.systemd_service:
    name: github-runner
    state: stopped
  when:
    - not ansible_check_mode
    - ci_runner_installed_version | length > 0
    - ci_runner_installed_version is version(ci_runner_version, '<')
  notify: Restart the runner
  tags: [runner]

- name: Unpack the pinned runner (first install, or a newer pin)
  ansible.builtin.unarchive:
    src: "{{ ci_runner_home }}/downloads/actions-runner-linux-x64-{{ ci_runner_version }}.tar.gz"
    dest: "{{ ci_runner_home }}/runner"
    remote_src: true
    owner: "{{ ci_runner_user }}"
    group: "{{ ci_runner_user }}"
  when:
    - not (ansible_check_mode and ci_runner_dirs is changed)
    - ci_runner_installed_version | length == 0 or ci_runner_installed_version is version(ci_runner_version, '<')
  notify: Restart the runner
  tags: [runner]

- name: Is the runner registered already?
  ansible.builtin.stat:
    path: "{{ ci_runner_home }}/runner/.runner"
  register: ci_runner_registered
  tags: [runner]

- name: Read the runner's registration
  ansible.builtin.slurp:
    src: "{{ ci_runner_home }}/runner/.runner"
  register: ci_runner_settings
  when: ci_runner_registered.stat.exists
  tags: [runner]

# Self-update is set at registration only (`config.sh --disableupdate`, which the runner keeps in
# .runner), so a runner registered without it is registered again: its local registration files go,
# and config.sh --replace takes over the same runner name on GitHub. That needs a fresh token, which
# the ci-runner wrapper mints on every configure run.
- name: Does the registration keep self-update off?
  ansible.builtin.set_fact:
    ci_runner_update_off: >-
      {{ ci_runner_registered.stat.exists and
         ((ci_runner_settings.content | b64decode | regex_replace('^\ufeff', '') | from_json).disableUpdate | default(false) | bool) }}
  tags: [runner]

- name: Stop the runner before its registration goes
  ansible.builtin.systemd_service:
    name: github-runner
    state: stopped
  when:
    - ci_runner_registered.stat.exists
    - not ci_runner_update_off
    - ci_runner_registration_token | length > 0
    - not ansible_check_mode
  notify: Restart the runner
  tags: [runner]

- name: Drop a registration that lets the runner update itself
  ansible.builtin.file:
    path: "{{ ci_runner_home }}/runner/{{ item }}"
    state: absent
  loop: "{{ ci_runner_registration_files }}"
  when:
    - ci_runner_registered.stat.exists
    - not ci_runner_update_off
    - ci_runner_registration_token | length > 0
    - not ansible_check_mode
  tags: [runner]

- name: Say so when self-update is still on and there is no token to register again
  ansible.builtin.debug:
    msg: >-
      The runner was registered with self-update on, and there is no registration token to
      register it again without. Run `ci-runner configure` on the agent box, which mints one.
  when:
    - ci_runner_registered.stat.exists
    - not ci_runner_update_off
    - ci_runner_registration_token | length == 0
  tags: [runner]

# Always run: a skipped task would still overwrite the registered variable.
- name: Look again for a registration
  ansible.builtin.stat:
    path: "{{ ci_runner_home }}/runner/.runner"
  register: ci_runner_registered
  tags: [runner]

# config.sh refuses with "already configured" when any trace of an earlier registration is left in
# the runner's folder, not only .runner (a run that stopped half way, or the runner's own
# *_migrated markers). With no .runner and a fresh token, clear every one before registering;
# config.sh --replace takes over the same name on GitHub.
- name: Clear what an earlier registration left behind
  ansible.builtin.file:
    path: "{{ ci_runner_home }}/runner/{{ item }}"
    state: absent
  loop: "{{ ci_runner_registration_files }}"
  when:
    - not ci_runner_registered.stat.exists
    - ci_runner_registration_token | length > 0
    - not ansible_check_mode
  tags: [runner]

- name: A registration token is needed the first time
  ansible.builtin.assert:
    that: ci_runner_registration_token | length > 0
    fail_msg: "The runner isn't registered yet. Run it through the agent box's ci-runner wrapper, which mints a one-hour registration token."
    quiet: true
  when: not ci_runner_registered.stat.exists and not ansible_check_mode
  tags: [runner]

- name: Register the runner with the repository, once
  ansible.builtin.command:
    argv:
      - ./config.sh
      - --unattended
      - --url
      - "{{ ci_runner_repo_url }}"
      - --token
      - "{{ ci_runner_registration_token }}"
      - --name
      - "{{ ci_runner_hostname }}"
      - --labels
      - "{{ ci_runner_labels | join(',') }}"
      - --work
      - _work
      - --replace
      - --disableupdate
    chdir: "{{ ci_runner_home }}/runner"
    creates: "{{ ci_runner_home }}/runner/.runner"
  become: true
  become_user: "{{ ci_runner_user }}"
  register: ci_runner_config
  # The token is in the arguments, so the result stays hidden; the next task shows config.sh's own
  # output with the token masked, which is what tells a refused token from a network or file fault.
  no_log: true
  failed_when: false
  when: not ansible_check_mode
  notify: Restart the runner
  tags: [runner]

- name: Why the registration failed (config.sh's last lines, the token masked)
  ansible.builtin.fail:
    msg: >-
      config.sh exited {{ ci_runner_config.rc }}. The runner is not registered; run `ci-runner configure`
      again once the cause is fixed (it mints a new token). Its last lines:
      {{ (((ci_runner_config.stdout_lines | default([])) + (ci_runner_config.stderr_lines | default([])))
         | map('replace', ci_runner_registration_token, '***') | select | list)[-40:] }}
  when:
    - not ansible_check_mode
    - ci_runner_config.rc is defined
    - ci_runner_config.rc != 0
  tags: [runner]

- name: Runner service
  ansible.builtin.template:
    src: github-runner.service.j2
    dest: /etc/systemd/system/github-runner.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the runner
  tags: [runner]

- name: Runner on at boot
  ansible.builtin.systemd_service:
    name: github-runner
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags: [runner]

# --- Proofs ----------------------------------------------------------------------------------

- name: Proofs
  tags: [verify]
  when: not ansible_check_mode
  block:
    - name: Proof, the runner service is running
      ansible.builtin.systemd_service:
        name: github-runner
      register: ci_runner_active

    - name: Why the runner service is not running
      when: ci_runner_active.status.ActiveState != "active"
      block:
        # The agent box can't log in to the VM, so the play brings back what systemd and SELinux
        # said: the service's last log lines, and any denials from the last ten minutes.
        - name: The service's log and SELinux denials
          ansible.builtin.shell: |
            journalctl -u github-runner -n 15 --no-pager
            echo '--- SELinux denials (ausearch) ---'
            ausearch -m AVC,USER_AVC,SELINUX_ERR -ts recent -i 2>&1
          register: ci_runner_why
          changed_when: false
          failed_when: false

        - name: Stop, the runner service is not running
          ansible.builtin.fail:
            msg: >-
              github-runner is {{ ci_runner_active.status.ActiveState }}
              ({{ ci_runner_active.status.SubState }}), last exit status
              {{ ci_runner_active.status.ExecMainStatus }}.
              {{ ci_runner_why.stdout_lines | join(' | ') }}

    - name: Proof, the runner user has no sudo
      ansible.builtin.command: sudo -l -U {{ ci_runner_user }}
      register: ci_runner_sudo
      changed_when: false
      failed_when: "'is not allowed to run sudo' not in ci_runner_sudo.stdout"
