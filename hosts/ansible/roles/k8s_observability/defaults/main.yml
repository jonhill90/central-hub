---
# BUILD-PATH S15 (BL-0020): metrics and logs on cluster c1. Agent picks, listed in
# hosts/AGENT-PICKS.md; research in Research 01-notes/01r-research/0092-c1-observability/ (RB-0092). Every input is
# listed here (Red Hat CoP rule).
#
# Metrics: kube-prometheus-stack (Prometheus Operator, Prometheus, Grafana, kube-state-metrics,
# node-exporter). Logs: Loki in monolithic mode, fed by one Alloy pod that reads pod logs through
# the Kubernetes API. Plus metrics-server, so `kubectl top` works.
#
# Versions: the newest release at least two weeks old on 2026-10-27 (STD-0003 rule 1), measured
# from each chart repository's index.yaml.
k8s_observability_metrics_server_version: 3.14.0   # metrics-server 0.9.0, 2026-08-19
k8s_observability_kps_version: 92.3.1              # Prometheus Operator v0.94.1, 2026-10-13
k8s_observability_loki_version: 18.15.1            # Loki 3.7.8, 2026-10-09 (grafana-community)
k8s_observability_alloy_version: 1.13.1            # Alloy v1.20.1, 2026-10-08

# Argo CD manages metrics-server from hosts/kubernetes/clusters/c1/ (spec 2026-11-c1-apps-under-argo-cd,
# step 1). Set true in the inventory once its Application is Synced; the role then stops installing
# it. False keeps Ansible in charge, which is also the way back.
k8s_observability_metrics_server_by_argocd: false
# The same switch for logs (Loki and Alloy, apps loki and alloy) and for metrics
# (kube-prometheus-stack): true once their Applications are Synced (spec steps 3 and 4).
k8s_observability_logs_by_argocd: false
k8s_observability_metrics_by_argocd: false

# node-exporter listens on each node's own address (host network). Prometheus runs on the worker,
# so the control plane's lab zone must accept its scrape; the lab zone has only the Kubernetes ports
# open (k8s_node step 4). Measured 2026-10-28: without this, the control plane's target is down
# with "no route to host". Same zone as k8s_node_firewall_zone.
k8s_observability_firewall_zone: lab
k8s_observability_node_ports: [9100/tcp]

# Namespaces, named by job so a tool can be swapped without renaming them.
k8s_observability_metrics_namespace: monitoring
k8s_observability_logs_namespace: logging

# Volumes. Prometheus, Loki and Grafana keep their data on claims from the cluster's StorageClass
# (role k8s_storage, BUILD-PATH S17): folders on the worker's data disk, kept when a pod is moved or
# deleted, and in the nightly Proxmox backup of the VM. Empty StorageClass means the cluster's
# default. The sizes are requests only: the Local Path Provisioner doesn't enforce them, so the
# retention size is what keeps Prometheus inside its share of the disk.
k8s_observability_storage_class: ""
k8s_observability_prometheus_retention: 15d
k8s_observability_prometheus_retention_size: 16GB
k8s_observability_prometheus_volume_size: 20Gi
k8s_observability_loki_retention: 168h
k8s_observability_loki_volume_size: 20Gi
# Grafana's own database (users, dashboards made in the UI, sign-in sessions).
k8s_observability_grafana_volume_size: 1Gi

# Grafana at https://grafana.apps.c1.prod.<zone>/ through Gateway apps (tag route). Private, no
# default; the inventory template sets it to k8s_gateway_zone.
# k8s_observability_zone: <zone>
k8s_observability_grafana_name: grafana

# Sign-in to Grafana through the lab's identity provider (OIDC), once playbooks/k8s-identity.yml
# made the client and its Secret. Off: Grafana has only its own admin account (Secret
# monitoring/kube-prometheus-stack-grafana, made by the chart).
k8s_observability_grafana_sso: false
# The provider's three endpoints. The defaults are Keycloak's paths for realm `lab` (k8s_identity);
# swapping the provider means changing these three and the client in its role (RB-0087 M2 exit).
# The browser goes to the public name; Grafana's server calls the in-cluster Service.
k8s_observability_sso_auth_url: "https://sso.apps.c1.prod.{{ k8s_observability_zone }}/realms/lab/protocol/openid-connect/auth"
k8s_observability_sso_token_url: http://sso-service.identity.svc:8080/realms/lab/protocol/openid-connect/token
k8s_observability_sso_api_url: http://sso-service.identity.svc:8080/realms/lab/protocol/openid-connect/userinfo
k8s_observability_sso_client_id: grafana
k8s_observability_sso_secret: grafana-sso   # Secret in the metrics namespace, key client-secret
