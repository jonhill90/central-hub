---
argument_specs:
  main:
    short_description: Metrics and logs on c1, with Grafana through the shared Gateway (BUILD-PATH S15, TASK-0020)
    options:
      k8s_observability_metrics_server_version: {type: str, default: 3.14.0, description: "metrics-server chart version (STD-0003)."}
      k8s_observability_kps_version: {type: str, default: 92.3.1, description: "kube-prometheus-stack chart version (STD-0003)."}
      k8s_observability_loki_version: {type: str, default: 18.15.1, description: "grafana-community/loki chart version (STD-0003)."}
      k8s_observability_alloy_version: {type: str, default: 1.13.1, description: "grafana/alloy chart version (STD-0003)."}
      k8s_observability_metrics_server_by_argocd:
        type: bool
        default: false
        description: "True once Argo CD manages metrics-server; the role stops installing it."
      k8s_observability_logs_by_argocd: {type: bool, default: false, description: "True once Argo CD manages Loki and Alloy; the role stops installing them."}
      k8s_observability_metrics_by_argocd:
        type: bool
        default: false
        description: "True once Argo CD manages kube-prometheus-stack; the role stops installing it."
      k8s_observability_grafana_route_by_argocd:
        type: bool
        default: false
        description: "True once Argo CD's gateway app makes Grafana's route; the role stops making it."
      k8s_observability_metrics_namespace: {type: str, default: monitoring, description: Namespace for Prometheus and Grafana.}
      k8s_observability_logs_namespace: {type: str, default: logging, description: Namespace for Loki and Alloy.}
      k8s_observability_storage_class:
        type: str
        default: ""
        description: "StorageClass of the Prometheus, Loki and Grafana claims; empty means the cluster's default."
      k8s_observability_prometheus_retention: {type: str, default: 15d, description: How long Prometheus keeps samples.}
      k8s_observability_prometheus_retention_size: {type: str, default: 16GB, description: Most disk Prometheus keeps.}
      k8s_observability_prometheus_volume_size: {type: str, default: 20Gi, description: "Size asked for Prometheus's claim."}
      k8s_observability_loki_retention: {type: str, default: 168h, description: How long Loki keeps logs.}
      k8s_observability_loki_volume_size: {type: str, default: 20Gi, description: "Size asked for Loki's claim."}
      k8s_observability_grafana_volume_size: {type: str, default: 1Gi, description: "Size asked for Grafana's claim (its SQLite database)."}
      k8s_observability_firewall_zone: {type: str, default: lab, description: "firewalld zone of the lab NIC (k8s_node_firewall_zone)."}
      k8s_observability_node_ports:
        type: list
        elements: str
        default: [9100/tcp]
        description: "Ports opened in that zone on every node, for node-exporter's scrape."
      k8s_observability_zone: {type: str, required: true, description: "The DNS zone. Private; the inventory template sets it to k8s_gateway_zone."}
      k8s_observability_grafana_name: {type: str, default: grafana, description: "First label of Grafana's hostname."}
      k8s_observability_short_names: {type: bool, default: true, description: "Grafana's links on grafana.<zone>, sign-in at sso.<zone> (STD-0001 rule 5)."}
      k8s_observability_grafana_sso:
        type: bool
        default: false
        description: "Sign in to Grafana through the lab identity provider (needs playbooks/k8s-identity.yml first)."
      k8s_observability_sso_auth_url: {type: str, description: "The provider's authorization endpoint, public name. Default: Keycloak realm lab."}
      k8s_observability_sso_token_url: {type: str, description: "The provider's token endpoint, in-cluster. Default: Keycloak realm lab."}
      k8s_observability_sso_api_url: {type: str, description: "The provider's userinfo endpoint, in-cluster. Default: Keycloak realm lab."}
      k8s_observability_sso_client_id: {type: str, default: grafana, description: "Grafana's client ID at the provider."}
      k8s_observability_sso_secret:
        type: str
        default: grafana-sso
        description: "Secret in the metrics namespace holding key client-secret (made by k8s_identity)."
