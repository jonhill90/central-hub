---
- name: Private inputs are set
  ansible.builtin.assert:
    that: [k8s_observability_zone | length > 0]
    fail_msg: Set k8s_observability_zone in the filled-in inventory (the template sets it to k8s_gateway_zone).
    quiet: true
  tags: [always]

- name: metrics-server, so kubectl top works
  ansible.builtin.include_role:
    name: k8s_helm_release
    apply: {tags: [metrics_server]}
  vars:
    k8s_helm_release_name: metrics-server
    k8s_helm_release_namespace: kube-system
    k8s_helm_release_repo_name: metrics-server
    k8s_helm_release_repo_url: https://kubernetes-sigs.github.io/metrics-server/
    k8s_helm_release_chart: metrics-server
    k8s_helm_release_version: "{{ k8s_observability_metrics_server_version }}"
    k8s_helm_release_values: "{{ k8s_observability_metrics_server_values }}"
  when: not k8s_observability_metrics_server_by_argocd | bool
  tags: [metrics_server]

# Once Argo CD manages metrics-server (kubernetes/clusters/c1/apps/metrics-server/), Ansible stops
# installing it and removes Helm's old release records, which Argo CD does not use (it renders
# charts with `helm template`, D-0023). The objects stay: Argo CD owns them now.
- name: metrics-server's old Helm release records, once Argo CD manages it
  ansible.builtin.command: >-
    kubectl -n kube-system delete secret -l owner=helm,name=metrics-server
    --ignore-not-found -o name
  register: k8s_observability_metrics_server_helm_records
  changed_when: k8s_observability_metrics_server_helm_records.stdout | length > 0
  when: k8s_observability_metrics_server_by_argocd | bool
  tags: [metrics_server]

# node-exporter uses the host network, so the scrape from Prometheus on another node goes through
# that node's input filter.
- name: node-exporter's port in the lab zone on every node
  ansible.posix.firewalld:
    zone: "{{ k8s_observability_firewall_zone }}"
    port: "{{ item.1 }}"
    permanent: true
    immediate: true
    state: enabled
  delegate_to: "{{ item.0 }}"
  loop: "{{ groups['k8s_nodes'] | product(k8s_observability_node_ports) | list }}"
  loop_control:
    label: "{{ item.0 }} {{ item.1 }}"
  tags: [metrics]

# The claims ask for the cluster's default StorageClass (playbooks/k8s-storage.yml). Without one
# they stay Pending, Helm's --wait times out, and Loki would be down after the step below.
- name: A default StorageClass exists
  ansible.builtin.command: >-
    kubectl get storageclass -o
    jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{"\n"}{end}'
  register: k8s_observability_default_class
  changed_when: false
  check_mode: false
  failed_when: >-
    k8s_observability_default_class.rc != 0
    or (k8s_observability_storage_class | length == 0 and k8s_observability_default_class.stdout | trim | length == 0)
  tags: [metrics, logs]

# Grafana moves to strategy Recreate. The live Deployment carries the API server's defaulted
# rollingUpdate block, which a server-side apply from Helm doesn't own and so doesn't remove, and
# the API server refuses Recreate with rollingUpdate set. A merge patch with null removes it first.
- name: Grafana's Deployment now
  ansible.builtin.command: >-
    kubectl -n {{ k8s_observability_metrics_namespace }} get deployment kube-prometheus-stack-grafana
    --ignore-not-found -o jsonpath='{.spec.strategy.type}'
  register: k8s_observability_grafana_strategy
  changed_when: false
  check_mode: false
  tags: [metrics]

- name: Grafana's Deployment is switched to Recreate, without the rollingUpdate block
  ansible.builtin.command: >-
    kubectl -n {{ k8s_observability_metrics_namespace }} patch deployment kube-prometheus-stack-grafana
    --type merge -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
  when: k8s_observability_grafana_strategy.stdout | trim not in ['', 'Recreate']
  changed_when: true
  tags: [metrics]

# The chart installs its CRDs on the first install only; Helm never upgrades them (chart README).
# Raising k8s_observability_kps_version past a Prometheus Operator minor needs the new CRDs applied
# first (hosts/ansible/README.md "Metrics and logs on c1").
- name: Metrics (Prometheus Operator, Prometheus, Grafana)
  ansible.builtin.include_role:
    name: k8s_helm_release
    apply: {tags: [metrics]}
  vars:
    k8s_helm_release_name: kube-prometheus-stack
    k8s_helm_release_namespace: "{{ k8s_observability_metrics_namespace }}"
    k8s_helm_release_repo_name: prometheus-community
    k8s_helm_release_repo_url: https://prometheus-community.github.io/helm-charts
    k8s_helm_release_chart: kube-prometheus-stack
    k8s_helm_release_version: "{{ k8s_observability_kps_version }}"
    k8s_helm_release_values: "{{ k8s_observability_kps_values }}"
  tags: [metrics]

# Loki's chart makes a StatefulSet, and Kubernetes forbids changing a StatefulSet's volume claim
# templates, so a Helm upgrade from the emptyDir install to one with a claim fails. A StatefulSet
# without claim templates is the old emptyDir install: it is deleted, with its pod, and Helm makes
# it again with the claim. The logs it held in emptyDir are lost, once. Prometheus gets no such
# step: its operator makes its own StatefulSet and makes it again when the storage changes (the
# proof checks Prometheus's claim by name). Its emptyDir samples are lost once too.
- name: Loki's claim templates now
  ansible.builtin.command: >-
    kubectl -n {{ k8s_observability_logs_namespace }} get statefulset loki
    --ignore-not-found -o jsonpath='{.metadata.name} {.spec.volumeClaimTemplates[*].metadata.name}'
  register: k8s_observability_loki_sts
  changed_when: false
  check_mode: false
  tags: [logs]

- name: Loki's emptyDir StatefulSet is deleted, so Helm can make it again with a claim
  ansible.builtin.command: >-
    kubectl -n {{ k8s_observability_logs_namespace }} delete statefulset loki --wait=true --timeout=180s
  when: k8s_observability_loki_sts.stdout | trim == 'loki'
  changed_when: true
  tags: [logs]

- name: Logs store (Loki, monolithic)
  ansible.builtin.include_role:
    name: k8s_helm_release
    apply: {tags: [logs]}
  vars:
    k8s_helm_release_name: loki
    k8s_helm_release_namespace: "{{ k8s_observability_logs_namespace }}"
    k8s_helm_release_repo_name: grafana-community
    k8s_helm_release_repo_url: https://grafana-community.github.io/helm-charts
    k8s_helm_release_chart: loki
    k8s_helm_release_version: "{{ k8s_observability_loki_version }}"
    k8s_helm_release_values: "{{ k8s_observability_loki_values }}"
  tags: [logs]

- name: Log collector (Alloy)
  ansible.builtin.include_role:
    name: k8s_helm_release
    apply: {tags: [logs]}
  vars:
    k8s_helm_release_name: alloy
    k8s_helm_release_namespace: "{{ k8s_observability_logs_namespace }}"
    k8s_helm_release_repo_name: grafana
    k8s_helm_release_repo_url: https://grafana.github.io/helm-charts
    k8s_helm_release_chart: alloy
    k8s_helm_release_version: "{{ k8s_observability_alloy_version }}"
    k8s_helm_release_values: "{{ k8s_observability_alloy_values }}"
  tags: [logs]

- name: Grafana through the shared Gateway
  ansible.builtin.include_role:
    name: k8s_app_route
    apply: {tags: [route]}
  vars:
    k8s_app_route_name: "{{ k8s_observability_grafana_name }}"
    k8s_app_route_namespace: "{{ k8s_observability_metrics_namespace }}"
    k8s_app_route_service: kube-prometheus-stack-grafana
    k8s_app_route_port: 80
    k8s_app_route_path: /login
    k8s_app_route_expect: <title>Grafana</title>
    k8s_app_route_zone: "{{ k8s_observability_zone }}"
  tags: [route]

- name: Proof
  ansible.builtin.import_tasks: proof.yml
  tags: [proof]
