---
# BUILD-PATH S15 (TASK-0019): sign-in for lab apps on cluster c1. The owner said yes to the proposed
# Keycloak on 2026-10-28 (D-0025), after research batch RB-0087 (Research 01-notes/01r-research/0087-central-identity/):
# fully Apache-2.0, while authentik keeps agent accounts and mTLS client auth in its paid tier.
# Everything apps see is plain OIDC, so a swap changes this role and the three endpoint URLs in
# k8s_observability, nothing in the apps. How it is installed is listed in hosts/AGENT-PICKS.md. Every input is listed here (Red Hat CoP rule).

# Keycloak and its operator, the newest release at least two weeks old on 2026-10-27 (26.8.1, 13
# October 2026, STD-0003 rule 1). The upstream manifests are pinned by sha256 in vars/main.yml.
k8s_identity_version: 26.8.1
k8s_identity_namespace: identity

# The Keycloak object's name, also the first label of its hostname: https://sso.apps.c1.prod.<zone>/.
# Named by job, so the issuer URL can stay when the provider changes.
k8s_identity_name: sso
# Private, no default; the inventory template sets it to k8s_gateway_zone.
# k8s_identity_zone: <zone>

# The realm lab apps sign in to.
k8s_identity_realm: lab

# The owner's account in that realm, in group lab-admins. The user name is private, no default.
# Its password is in the values file below (key PASSWORD_<USER NAME>). The email is optional;
# without one, Grafana uses <user name>@lab.invalid (k8s_observability).
# k8s_identity_owner_username: <name>
k8s_identity_owner_email: ""

# More people in realm lab, beside the owner. Each item: username, optional email, and groups
# (lab-admins or lab-viewers). Every user's password is a line in the values file below.
k8s_identity_extra_users: []

# A second factor for admins (D-0037): every member of this group gets a TOTP seed, a line TOTP_<USER NAME>
# in the values file (base32, made like the passwords), imported as the user's OTP credential, so the
# seed survives each delete and import of the realm. Keycloak then asks admins for the code at every
# sign-in, Proxmox's included. The owner adds the seed to an authenticator app once, by scanning the QR code
# bootstrap/show-totp-qr.sh shows on the controller's screen.
k8s_identity_otp_group: lab-admins
k8s_identity_otp_digits: 6
k8s_identity_otp_period: 30

# The values file on the controller (the machine that runs Ansible), outside the repository next to
# c1's encryption key (~/.config/central-hub/): every password and client secret in realm lab, one
# KEY=value per line.
# The role adds a random value for any key that is missing and never changes one that is there, so
# the owner reads a password there and changes one by editing the file and running the role again.
k8s_identity_values_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/central-hub/identity.env"

# When the realm's code or a value in the file changes, delete realm lab and import it again
# (KeycloakRealmImport never updates a realm that exists). Sessions end; nothing else is lost,
# because every part of the realm comes from this role. false: only create the realm once.
k8s_identity_realm_replace: true
# Short aliases (STD-0001 rules 5 and 7): Keycloak's own name, and so the issuer, is sso.<zone>, and
# every client also accepts its app's short name <app>.<zone> next to the long one. Needs the
# short names in the lab DNS and on the Gateway first (docs/runbooks/set-up-short-app-names.md).
# Off: everything stays on <name>.apps.c1.prod.<zone>.
k8s_identity_short_names: true

# The sign-in pages' look: a Keycloak theme folder on the controller, outside this repository (for
# example in a clone of the owner's own branding repository). The folder's name is the theme's
# name; only its login/ part is used, without files of 500 KB or more (a ConfigMap holds at most
# 1 MiB). The role puts those files in ConfigMap keycloak-theme, the Keycloak pod mounts it under
# /opt/keycloak/themes/<name>, and the realm sets loginTheme to it. Private: the path and the
# theme's name can name the owner's domain (CLAUDE.md rule 4). Empty: Keycloak's own look.
k8s_identity_theme_dir: ""

# Grafana's client (k8s_observability). Its secret is copied to Secret <metrics ns>/grafana-sso.
k8s_identity_grafana_name: grafana
k8s_identity_grafana_namespace: monitoring
k8s_identity_grafana_deployment: kube-prometheus-stack-grafana

# Argo CD's clients (k8s_gitops): argocd for the web UI, argocd-cli (public, PKCE) for
# `argocd login --sso`. The secret is copied to Secret <argocd ns>/argocd-sso, key clientSecret,
# labelled part-of argocd so argocd-cm can name it as $argocd-sso:clientSecret.
k8s_identity_argocd_name: argocd
k8s_identity_argocd_namespace: argocd

# Jellyfin's client (k8s_jellyfin), for the SSO plugin; Jellyfin has no OIDC of its own. The secret
# is copied to Secret <media ns>/jellyfin-sso, key client-secret. The plugin's provider name is the
# last part of its redirect paths.
k8s_identity_jellyfin_name: jellyfin
k8s_identity_jellyfin_namespace: media
k8s_identity_jellyfin_provider: keycloak

# Proxmox VE's web UI (role proxmox_sso): its DNS names, the same as proxmox_cert_names. Private, from the
# inventory. The client allows https://<name> for each, because the UI sends its own origin as the redirect
# (pve-manager www/manager6/window/LoginWindow.js). Empty: realm lab has no proxmox client. Its secret,
# PROXMOX_CLIENT_SECRET in the values file, is in realm lab's Secret on c1 like every client secret, and role
# proxmox_sso reads it on the controller for the Proxmox host.
k8s_identity_proxmox_hosts: []

# The secrets store's web page (role openbao, the owner's sign-in, agent pick 233): the names the owner's
# browser uses for it. Private, from the inventory. The client allows the store's OIDC callback on each.
# Empty: realm lab has no openbao client and the values file needs no OPENBAO_CLIENT_SECRET, so adding the
# client is a realm change only when a name is set. Role openbao reads that secret from the same file.
k8s_identity_openbao_hosts: []

# Keycloak's database: PostgreSQL 18.6 (2026-08-13; Keycloak 26.8 tests 18), one pod. c1 has no
# StorageClass yet (storage is BUILD-PATH S17), so its data sits on a static local volume: a folder
# on one worker, kept when the pod or the volume object is deleted (reclaim policy Retain).
k8s_identity_postgres_image: docker.io/library/postgres:18.6
k8s_identity_db_host: "{{ groups['k8s_workers'] | first }}"
k8s_identity_db_path: /var/lib/central-hub/identity-postgres
k8s_identity_db_size: 2Gi
