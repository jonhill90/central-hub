---
# One Secret read from OpenBao (k8s_identity_secrets_store openbao, plan step 8a): an ExternalSecret through
# ClusterSecretStore openbao, each key of the Secret from one key of c1/identity, which the agent box's
# `secrets-store put-apps` writes from the values file (SOPS first, then OpenBao). External Secrets takes over a
# Secret this role made earlier, since it carries no owner (External Secrets v2.14.0 docs,
# guides/ownership-deletion-policy.md, line 43), so the move needs no delete. The ExternalSecret holds key names only.
# Input: __namespace, __name, __keys (dict: Secret key -> key of c1/identity), __labels (dict), __restart (optional: a
# workload in the same namespace that reads the Secret only at start, so it is restarted when the Secret changes; the
# Secret's resourceVersion last restarted for is kept in an annotation on the ExternalSecret, so a run with nothing new
# restarts nothing. The non-OpenBao path does this in secret.yml; without it Grafana kept an older client secret than
# the realm's and Keycloak refused its sign-in, seen on prod 2026-11-22.)
- name: "external secret | Namespace there, {{ __namespace }}"
  ansible.builtin.command: >-
    kubectl get namespace {{ __namespace }} -o name
  register: k8s_identity_es_ns
  changed_when: false
  failed_when: false
  check_mode: false

- name: "external secret | Hash on the ExternalSecret, {{ __namespace ~ '/' ~ __name }}"
  ansible.builtin.command: >-
    kubectl -n {{ __namespace }} get externalsecret {{ __name }} --ignore-not-found
    -o jsonpath={.metadata.annotations}
  register: k8s_identity_es_now
  changed_when: false
  check_mode: false
  when: k8s_identity_es_ns.rc == 0

- name: "external secret | Apply the ExternalSecret, {{ __namespace ~ '/' ~ __name }}"
  ansible.builtin.command: kubectl apply --server-side --field-manager=central-hub-k8s-identity -f -
  args:
    stdin: "{{ __manifest | to_json }}"
  vars:
    __manifest:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: "{{ __name }}"
        namespace: "{{ __namespace }}"
        labels: {app.kubernetes.io/managed-by: central-hub-k8s-identity}
        annotations: {central-hub/spec-sha256: "{{ __spec_hash }}"}
      spec:
        refreshInterval: 1h
        secretStoreRef: {kind: ClusterSecretStore, name: openbao}
        target:
          name: "{{ __name }}"
          creationPolicy: Owner
          template:
            type: Opaque
            metadata:
              labels: "{{ __labels | combine({'app.kubernetes.io/managed-by': 'central-hub-k8s-identity'}) }}"
        # One entry per Secret key: {secretKey: <Secret key>, remoteRef: {key: c1/identity, property: <KEY>}}.
        data: >-
          {{ __keys.keys() | map('community.general.dict_kv', 'secretKey')
          | zip(__keys.values() | map('community.general.dict_kv', 'property') | map('combine', {'key': 'c1/identity'})
                | map('community.general.dict_kv', 'remoteRef'))
          | map('combine') | list }}
    # Applied only when what it asks for changed, so a run with nothing new changes nothing.
    __spec_hash: "{{ [__keys, __labels] | to_json | hash('sha256') }}"
  when: >-
    k8s_identity_es_ns.rc == 0 and not ansible_check_mode
    and ((k8s_identity_es_now.stdout | default('', true) or '{}') | from_json).get('central-hub/spec-sha256') != __spec_hash
  changed_when: true

- name: "external secret | Synced, {{ __namespace ~ '/' ~ __name }}"
  ansible.builtin.command: >-
    kubectl -n {{ __namespace }} wait externalsecret/{{ __name }} --for=condition=Ready --timeout=120s
  changed_when: false
  when: k8s_identity_es_ns.rc == 0 and not ansible_check_mode

- name: "external secret | Version of the Secret, {{ __namespace ~ '/' ~ __name }}"
  ansible.builtin.command: >-
    kubectl -n {{ __namespace }} get secret {{ __name }} --ignore-not-found -o jsonpath={.metadata.resourceVersion}
  register: k8s_identity_es_rv
  changed_when: false
  check_mode: false
  when: >-
    k8s_identity_es_ns.rc == 0 and not ansible_check_mode and (__restart | default('')) | length > 0

- name: "external secret | Restart the app to read the new value, {{ __restart | default('') }}"
  ansible.builtin.command: kubectl -n {{ __namespace }} rollout restart {{ __restart }}
  when:
    - k8s_identity_es_rv is not skipped
    - k8s_identity_es_rv.stdout | length > 0
    - k8s_identity_es_rv.stdout != ((k8s_identity_es_now.stdout | default('', true) or '{}') | from_json).get('central-hub/restarted-for-version', '')
  changed_when: true

- name: "external secret | Restart finished, {{ __restart | default('') }}"
  ansible.builtin.command: kubectl -n {{ __namespace }} rollout status {{ __restart }} --timeout=300s
  changed_when: false
  when:
    - k8s_identity_es_rv is not skipped
    - k8s_identity_es_rv.stdout | length > 0
    - k8s_identity_es_rv.stdout != ((k8s_identity_es_now.stdout | default('', true) or '{}') | from_json).get('central-hub/restarted-for-version', '')

- name: "external secret | Note the version restarted for, {{ __namespace ~ '/' ~ __name }}"
  ansible.builtin.command: >-
    kubectl -n {{ __namespace }} annotate externalsecret {{ __name }}
    central-hub/restarted-for-version={{ k8s_identity_es_rv.stdout }} --overwrite
  when:
    - k8s_identity_es_rv is not skipped
    - k8s_identity_es_rv.stdout | length > 0
    - k8s_identity_es_rv.stdout != ((k8s_identity_es_now.stdout | default('', true) or '{}') | from_json).get('central-hub/restarted-for-version', '')
  changed_when: true

- name: "external secret | Skipped, no namespace yet, {{ __namespace }}"
  ansible.builtin.debug:
    msg: The app isn't installed yet; run this role again after it is, to give it its ExternalSecret.
  when: k8s_identity_es_ns.rc != 0
