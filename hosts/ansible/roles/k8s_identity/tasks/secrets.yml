---
# Random values made once, on the node, straight into Secrets: no value passes through Ansible's
# output or this repository. Anyone with cluster-admin can read them, agents included (they run
# kubectl as cluster-admin on the control plane); what limits the risk is that they live only in
# this lab cluster and the owner's password is temporary (changed at the first sign-in).
- name: secrets | Which Secrets exist
  ansible.builtin.command: >-
    kubectl get secret -A --field-selector type=Opaque
    -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'
  register: k8s_identity_secrets_now
  changed_when: false
  check_mode: false

- name: secrets | Database account
  ansible.builtin.shell: >-
    kubectl -n {{ k8s_identity_namespace }} create secret generic {{ k8s_identity_db_secret }}
    --from-literal=username=keycloak --from-literal=password="$(openssl rand -hex 24)"
  when: (k8s_identity_namespace ~ '/' ~ k8s_identity_db_secret) not in k8s_identity_secrets_now.stdout_lines
  changed_when: true
  no_log: true

- name: secrets | Realm placeholders (Grafana's client secret, the owner's first password)
  ansible.builtin.shell: >-
    kubectl -n {{ k8s_identity_namespace }} create secret generic {{ k8s_identity_realm_secret }}
    --from-literal=GRAFANA_CLIENT_SECRET="$(openssl rand -hex 32)"
    --from-literal=OWNER_INITIAL_PASSWORD="$(openssl rand -base64 18)"
  when: (k8s_identity_namespace ~ '/' ~ k8s_identity_realm_secret) not in k8s_identity_secrets_now.stdout_lines
  changed_when: true
  no_log: true

- name: secrets | Grafana's namespace
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl create namespace {{ k8s_identity_grafana_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  args: {executable: /bin/bash}
  register: k8s_identity_grafana_ns
  changed_when: "'created' in k8s_identity_grafana_ns.stdout"
  when: not ansible_check_mode

# The same client secret, copied into Grafana's namespace (k8s_observability reads key
# client-secret). The value goes from one kubectl to the other through a pipe on the node.
- name: secrets | Grafana's copy of its client secret
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl -n {{ k8s_identity_namespace }} get secret {{ k8s_identity_realm_secret }}
    -o jsonpath='{.data.GRAFANA_CLIENT_SECRET}' | base64 -d |
    kubectl -n {{ k8s_identity_grafana_namespace }} create secret generic grafana-sso --from-file=client-secret=/dev/stdin
  args: {executable: /bin/bash}
  when: >-
    not ansible_check_mode
    and (k8s_identity_grafana_namespace ~ '/grafana-sso') not in k8s_identity_secrets_now.stdout_lines
  changed_when: true
  no_log: true
