---
# Every password and client secret in realm lab comes from one values file on the controller,
# git-ignored, one KEY=value per line (k8s_identity_values_file). The owner reads a password there
# and changes one by editing the line and running the role again; the realm is then imported again
# (tasks/keycloak.yml). Rotating everything at a lab rebuild is deleting the file.
#
# Missing keys get a random value. These first four steps run with every tag (the realm's hash is
# part of its manifest, tag keycloak) and in check mode too, because nothing after them can be
# checked without the values; they write only the git-ignored file on the controller.
- name: secrets | Values file on the controller, with a random value for each missing key
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    file={{ k8s_identity_values_file | quote }}
    touch "$file"
    chmod 0600 "$file"
    for key in {{ k8s_identity_value_keys | map('quote') | join(' ') }}; do
      grep -q "^${key}=" "$file" && continue
      case $key in
        PASSWORD_*) value=$(openssl rand -base64 18 | tr '+/' '-_') ;;
        *) value=$(openssl rand -hex 32) ;;
      esac
      printf '%s=%s\n' "$key" "$value" >> "$file"
      echo "added $key"
    done
  args: {executable: /bin/bash}
  register: k8s_identity_values_made
  changed_when: "'added ' in k8s_identity_values_made.stdout"
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true
  tags: [always]

- name: secrets | Read the values
  ansible.builtin.set_fact:
    k8s_identity_values: >-
      {{ dict(__lines | map('regex_replace', '=.*$', '') | zip(__lines | map('regex_replace', '^[^=]*=', ''))) }}
  vars:
    __lines: >-
      {{ lookup('ansible.builtin.file', k8s_identity_values_file).splitlines() | select('match', '^[A-Z][A-Z0-9_]*=') | list }}
  no_log: true
  tags: [always]

- name: secrets | Every key has a value
  ansible.builtin.assert:
    that: k8s_identity_value_keys | difference(k8s_identity_values | dict2items | selectattr('value') | map(attribute='key')) | length == 0
    fail_msg: "{{ k8s_identity_values_file }} has an empty value for one of {{ k8s_identity_value_keys | join(', ') }}."
    quiet: true
  tags: [always]

# Only the keys the realm uses, so a stale line in the file doesn't reach the cluster; and a hash
# of them, which the realm import carries so a changed value starts a new import.

- name: secrets | The realm's values and their hash
  ansible.builtin.set_fact:
    k8s_identity_realm_values: "{{ dict(k8s_identity_value_keys | zip(k8s_identity_value_keys | map('extract', k8s_identity_values))) }}"
    k8s_identity_values_sha256: "{{ k8s_identity_value_keys | map('extract', k8s_identity_values) | join('\n') | hash('sha256') }}"
  no_log: true
  tags: [always]

- name: secrets | Database account (random, made on the node, never read back)
  ansible.builtin.shell: >-
    set -o pipefail &&
    if ! kubectl -n {{ k8s_identity_namespace }} get secret {{ k8s_identity_db_secret }} >/dev/null 2>&1; then
    kubectl -n {{ k8s_identity_namespace }} create secret generic {{ k8s_identity_db_secret }}
    --from-literal=username=keycloak --from-literal=password="$(openssl rand -hex 24)" && echo created; fi
  args: {executable: /bin/bash}
  register: k8s_identity_db_secret_made
  changed_when: "'created' in k8s_identity_db_secret_made.stdout"
  when: not ansible_check_mode
  no_log: true

- name: secrets | The realm's Secret
  ansible.builtin.include_tasks: secret.yml
  vars:
    __namespace: "{{ k8s_identity_namespace }}"
    __name: "{{ k8s_identity_realm_secret }}"
    __data: "{{ k8s_identity_realm_values }}"
    __labels: {}

# Each app's copy of its client secret, in the app's own namespace, in the shape the app reads.
# An app whose namespace isn't there yet is skipped; the next run after it is installed adds it.
- name: secrets | Each app's copy of its client secret
  ansible.builtin.include_tasks: secret.yml
  loop:
    - __namespace: "{{ k8s_identity_grafana_namespace }}"
      __name: grafana-sso
      __data: {client-secret: "{{ k8s_identity_values.GRAFANA_CLIENT_SECRET }}"}
      __labels: {}
      __restart: deployment/{{ k8s_identity_grafana_deployment }}
    - __namespace: "{{ k8s_identity_argocd_namespace }}"
      __name: argocd-sso
      __data: {clientSecret: "{{ k8s_identity_values.ARGOCD_CLIENT_SECRET }}"}
      __labels: {app.kubernetes.io/part-of: argocd}
    - __namespace: "{{ k8s_identity_jellyfin_namespace }}"
      __name: jellyfin-sso
      __data: {client-secret: "{{ k8s_identity_values.JELLYFIN_CLIENT_SECRET }}"}
      __labels: {}
  loop_control:
    loop_var: __copy
    label: "{{ __copy.__namespace }}/{{ __copy.__name }}"
  vars:
    __namespace: "{{ __copy.__namespace }}"
    __name: "{{ __copy.__name }}"
    __data: "{{ __copy.__data }}"
    __labels: "{{ __copy.__labels }}"
    __restart: "{{ __copy.__restart | default('') }}"
