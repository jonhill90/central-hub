---
# Every password and client secret in realm lab comes from one values file on the controller,
# outside the repository (k8s_identity_values_file, default ~/.config/central-hub/identity.env), one
# KEY=value per line. The owner reads a password there and changes one by editing the line and
# running the role again; the realm is then imported again (tasks/keycloak.yml). Rotating everything at a lab rebuild is deleting the file.
#
# Missing keys get a random value. These first four steps run with every tag (the realm's hash is
# part of its manifest, tag keycloak) and in check mode too, because nothing after them can be
# checked without the values; they write only that file on the controller.
- name: secrets | Values file on the controller, with a random value for each missing key
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    file={{ k8s_identity_values_file | quote }}
    mkdir -p "$(dirname "$file")"
    touch "$file"
    chmod 0600 "$file"
    for key in {{ k8s_identity_value_keys | map('quote') | join(' ') }}; do
      grep -q "^${key}=" "$file" && continue
      case $key in
        PASSWORD_*) value=$(openssl rand -base64 18 | tr '+/' '-_') ;;
        TOTP_*) value=$(python3 -I -c 'import base64, os; print(base64.b32encode(os.urandom(20)).decode())') ;;
        *) value=$(openssl rand -hex 32) ;;
      esac
      printf '%s=%s\n' "$key" "$value" >> "$file"
      echo "added $key"
    done
  args: {executable: /bin/bash}
  register: k8s_identity_values_made
  changed_when: "'added ' in k8s_identity_values_made.stdout"
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true
  tags: [always]

- name: secrets | Read the values
  ansible.builtin.set_fact:
    k8s_identity_values: >-
      {{ dict(__lines | map('regex_replace', '=.*$', '') | zip(__lines | map('regex_replace', '^[^=]*=', ''))) }}
  vars:
    __lines: >-
      {{ lookup('ansible.builtin.file', k8s_identity_values_file).splitlines() | select('match', '^[A-Z][A-Z0-9_]*=') | list }}
  no_log: true
  tags: [always]

- name: secrets | Every key has a value
  ansible.builtin.assert:
    that: k8s_identity_value_keys | difference(k8s_identity_values | dict2items | selectattr('value') | map(attribute='key')) | length == 0
    fail_msg: "{{ k8s_identity_values_file }} has an empty value for one of {{ k8s_identity_value_keys | join(', ') }}."
    quiet: true
  tags: [always]

# Only the keys the realm uses, so a stale line in the file doesn't reach the cluster; and a hash
# of them, which the realm import carries so a changed value starts a new import.

- name: secrets | The realm's values and their hash
  ansible.builtin.set_fact:
    k8s_identity_realm_values: "{{ dict(k8s_identity_value_keys | zip(k8s_identity_value_keys | map('extract', k8s_identity_values))) }}"
    k8s_identity_values_sha256: "{{ k8s_identity_value_keys | map('extract', k8s_identity_values) | join('\n') | hash('sha256') }}"
  no_log: true
  tags: [always]

- name: secrets | Database account (random, made on the node, never read back; with the store off)
  ansible.builtin.shell: >-
    set -o pipefail &&
    if ! kubectl -n {{ k8s_identity_namespace }} get secret {{ k8s_identity_db_secret }} >/dev/null 2>&1; then
    kubectl -n {{ k8s_identity_namespace }} create secret generic {{ k8s_identity_db_secret }}
    --from-literal=username=keycloak --from-literal=password="$(openssl rand -hex 24)" && echo created; fi
  args: {executable: /bin/bash}
  register: k8s_identity_db_secret_made
  changed_when: "'created' in k8s_identity_db_secret_made.stdout"
  # With the store openbao (plan step 8a) the account comes from OpenBao instead, in the task below.
  when: not ansible_check_mode and k8s_identity_secrets_store != 'openbao'
  no_log: true

# c1/identity-db holds the account the running cluster already had (`openbao-prod adopt` copied it: SOPS, then OpenBao, hash-checked),
# so the Secret's value does not change and Postgres and Keycloak need no restart. External Secrets takes over the Secret this role made
# (it carries no owner). A rebuild gets the same account from SOPS, which matches the database it restores.
- name: secrets | Database account, from OpenBao
  ansible.builtin.include_tasks: external-secret.yml
  when: k8s_identity_secrets_store == 'openbao'
  vars:
    __namespace: "{{ k8s_identity_namespace }}"
    __name: "{{ k8s_identity_db_secret }}"
    __keys: {username: username, password: password}
    __labels: {}
    __path: c1/identity-db

# With k8s_identity_secrets_store openbao (plan step 8a), realm lab's Secret and the three client secret copies
# come from OpenBao through an ExternalSecret each (tasks/external-secret.yml), not from this role. Going back
# means deleting those ExternalSecrets, and with them the Secrets External Secrets owns: a delete (D-0042 rule 6),
# so no task does it. Until they are gone, a run with the store off stops here rather than fight External Secrets.
- name: secrets | The secrets store is one this role knows
  ansible.builtin.assert:
    that: k8s_identity_secrets_store in ['', 'c1', 'openbao']
    fail_msg: k8s_identity_secrets_store must be empty, c1 or openbao.
    quiet: true

- name: secrets | No ExternalSecret of this role's is left while the store is off
  ansible.builtin.command: >-
    kubectl get externalsecrets -A -l app.kubernetes.io/managed-by=central-hub-k8s-identity -o name
  register: k8s_identity_es_left
  changed_when: false
  check_mode: false
  # A cluster without External Secrets' kinds has none left either.
  failed_when: >-
    (k8s_identity_es_left.rc != 0 and 'have a resource type' not in k8s_identity_es_left.stderr)
    or k8s_identity_es_left.stdout | trim | length > 0
  when: k8s_identity_secrets_store != 'openbao'

- name: secrets | The realm's Secret
  ansible.builtin.include_tasks: secret.yml
  when: k8s_identity_secrets_store != 'openbao'
  vars:
    __namespace: "{{ k8s_identity_namespace }}"
    __name: "{{ k8s_identity_realm_secret }}"
    __data: "{{ k8s_identity_realm_values }}"
    __labels: {}

- name: secrets | The realm's Secret, from OpenBao
  ansible.builtin.include_tasks: external-secret.yml
  when: k8s_identity_secrets_store == 'openbao'
  vars:
    __namespace: "{{ k8s_identity_namespace }}"
    __name: "{{ k8s_identity_realm_secret }}"
    __keys: "{{ dict(k8s_identity_value_keys | zip(k8s_identity_value_keys)) }}"
    __labels: {}

# Keycloak's first admin (spec.bootstrapAdmin of the Keycloak CR, templates/keycloak.yaml.j2) from c1/identity-admin: the account the
# running cluster already had, which `openbao-prod adopt` copied (SOPS, then OpenBao, hash-checked). A new Secret name, since the
# operator owns <name>-initial-admin and External Secrets cannot take over a Secret another controller owns.
- name: secrets | Keycloak's first admin, from OpenBao
  ansible.builtin.include_tasks: external-secret.yml
  when: k8s_identity_secrets_store == 'openbao'
  vars:
    __namespace: "{{ k8s_identity_namespace }}"
    __name: "{{ k8s_identity_name }}-bootstrap-admin"
    __keys: {username: username, password: password}
    __labels: {}
    __path: c1/identity-admin

- name: secrets | The lab root is a certificate
  ansible.builtin.assert:
    that: "'-----BEGIN CERTIFICATE-----' in lookup('ansible.builtin.file', k8s_identity_jellyfin_root_ca_file)"
    fail_msg: k8s_identity_jellyfin_root_ca_file must hold PEM certificates only.
    quiet: true
  when: k8s_identity_jellyfin_root_ca_file | length > 0

# Each app's copy of its client secret, in the app's own namespace, in the shape the app reads.
# An app whose namespace isn't there yet is skipped; the next run after it is installed adds it.
- name: secrets | Each app's copy of its client secret, from OpenBao
  ansible.builtin.include_tasks: external-secret.yml
  when: k8s_identity_secrets_store == 'openbao'
  loop:
    - {__namespace: "{{ k8s_identity_grafana_namespace }}", __name: grafana-sso, __keys: {client-secret: GRAFANA_CLIENT_SECRET}, __labels: {}}
    - __namespace: "{{ k8s_identity_argocd_namespace }}"
      __name: argocd-sso
      __keys: {clientSecret: ARGOCD_CLIENT_SECRET}
      __labels: {app.kubernetes.io/part-of: argocd}
    - {__namespace: "{{ k8s_identity_jellyfin_namespace }}", __name: jellyfin-sso, __keys: {client-secret: JELLYFIN_CLIENT_SECRET}, __labels: {}}
    - __namespace: "{{ k8s_identity_central_hub_app_namespace }}"
      __name: central-hub-app-sso
      __keys: {client-secret: CENTRAL_HUB_APP_CLIENT_SECRET}
      __labels: {}
  loop_control:
    loop_var: __es
    label: "{{ __es.__namespace }}/{{ __es.__name }}"
  vars:
    __namespace: "{{ __es.__namespace }}"
    __name: "{{ __es.__name }}"
    __keys: "{{ __es.__keys }}"
    __labels: "{{ __es.__labels }}"

- name: secrets | Each app's copy of its client secret
  ansible.builtin.include_tasks: secret.yml
  when:
    - not (__copy.__skip | default(false) | bool)
    - k8s_identity_secrets_store != 'openbao' or not (__copy.__secret | default(true) | bool)
  loop:
    - __namespace: "{{ k8s_identity_grafana_namespace }}"
      __name: grafana-sso
      __data: {client-secret: "{{ k8s_identity_values.GRAFANA_CLIENT_SECRET }}"}
      __labels: {}
      __restart: deployment/{{ k8s_identity_grafana_deployment }}
    - __namespace: "{{ k8s_identity_argocd_namespace }}"
      __name: argocd-sso
      __data: {clientSecret: "{{ k8s_identity_values.ARGOCD_CLIENT_SECRET }}"}
      __labels: {app.kubernetes.io/part-of: argocd}
    - __namespace: "{{ k8s_identity_jellyfin_namespace }}"
      __name: jellyfin-sso
      __data: {client-secret: "{{ k8s_identity_values.JELLYFIN_CLIENT_SECRET }}"}
      __labels: {}
    - __namespace: "{{ k8s_identity_central_hub_app_namespace }}"
      __name: central-hub-app-sso
      __data: {client-secret: "{{ k8s_identity_values.CENTRAL_HUB_APP_CLIENT_SECRET }}"}
      __labels: {}
    # Public names, not secrets: the realm's address and the origins the app answers on. The app reads them as
    # files at request time, so no restart is needed; made by this role whatever the secrets store is.
    - __namespace: "{{ k8s_identity_central_hub_app_namespace }}"
      __name: central-hub-app-oidc
      __data:
        issuer: "{{ k8s_identity_issuer }}"
        public-urls: "{{ k8s_identity_central_hub_app_hosts | map('regex_replace', '^(.*)$', 'https://\\1') | join(',') }}"
      __labels: {}
      __secret: false
    - __namespace: "{{ k8s_identity_jellyfin_namespace }}"
      __name: jellyfin-lab-root-ca
      __data:
        lab-root-ca.pem: >-
          {{ lookup('ansible.builtin.file', k8s_identity_jellyfin_root_ca_file)
          if k8s_identity_jellyfin_root_ca_file | length > 0 else '' }}
      __labels: {}
      __restart: deployment/{{ k8s_identity_jellyfin_name }}
      __skip: "{{ k8s_identity_jellyfin_root_ca_file | length == 0 }}"
      # A public certificate, not a secret: this role keeps making it with the store on.
      __secret: false
  loop_control:
    loop_var: __copy
    label: "{{ __copy.__namespace }}/{{ __copy.__name }}"
  vars:
    __namespace: "{{ __copy.__namespace }}"
    __name: "{{ __copy.__name }}"
    __data: "{{ __copy.__data }}"
    __labels: "{{ __copy.__labels }}"
    __restart: "{{ __copy.__restart | default('') }}"
