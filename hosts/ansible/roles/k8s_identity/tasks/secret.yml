---
# One Secret, made from values Ansible holds, never shown: it carries a hash of its values in an
# annotation, and is made again only when that hash differs (so a run with nothing new changes
# nothing). Deleting and making it again drops any key left from an earlier layout.
# Input: __namespace, __name, __data (dict), __labels (dict), __restart (optional: a workload in
# the same namespace to restart after a change, for apps that read the Secret only at start).
- name: "secret | Namespace there, {{ __namespace }}"
  ansible.builtin.command: >-
    kubectl get namespace {{ __namespace }} -o name
  register: k8s_identity_secret_ns
  changed_when: false
  failed_when: false
  check_mode: false

- name: "secret | Hash on the Secret, {{ __namespace ~ '/' ~ __name }}"
  ansible.builtin.command: >-
    kubectl -n {{ __namespace }} get secret {{ __name }} --ignore-not-found
    -o jsonpath={.metadata.annotations}
  register: k8s_identity_secret_now
  changed_when: false
  check_mode: false
  when: k8s_identity_secret_ns.rc == 0

- name: "secret | Make the Secret, {{ __namespace ~ '/' ~ __name }}"
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl -n {{ __namespace }} delete secret {{ __name }} --ignore-not-found &&
    kubectl create -f -
  args:
    executable: /bin/bash
    stdin: "{{ __manifest | to_json }}"
  vars:
    __hash: "{{ __data | to_json | hash('sha256') }}"
    __manifest:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ __name }}"
        namespace: "{{ __namespace }}"
        labels: "{{ __labels | combine({'app.kubernetes.io/managed-by': 'central-hub-k8s-identity'}) }}"
        annotations: {central-hub/values-sha256: "{{ __hash }}"}
      stringData: "{{ __data }}"
  when: >-
    k8s_identity_secret_ns.rc == 0
    and ((k8s_identity_secret_now.stdout | default('', true) or '{}') | from_json).get('central-hub/values-sha256') != __hash
  register: k8s_identity_secret_made
  changed_when: true
  no_log: true

- name: "secret | Restart the app to read the new value, {{ __restart | default('') }}"
  ansible.builtin.command: kubectl -n {{ __namespace }} rollout restart {{ __restart }}
  when:
    - __restart | default('') | length > 0
    - k8s_identity_secret_made is changed
    - not ansible_check_mode
  changed_when: true

- name: "secret | Skipped, no namespace yet, {{ __namespace }}"
  ansible.builtin.debug:
    msg: The app isn't installed yet; run this role again after it is, to give it its client secret.
  when: k8s_identity_secret_ns.rc != 0
