---
# The upstream operator files for k8s_identity_version, each checked against its sha256 (measured
# on the files at tag 26.8.1 of keycloak/keycloak-k8s-resources, 2026-10-27). Research:
# 01-notes/01r-research/0092-c1-observability/ (RB-0092) rows L21-L22.
# kubernetes.yml re-measured 2026-11-10: upstream rebuilt the tag on 2026-10-31 from the same
# Keycloak source (commit-id 24ed1dad, tag 26.8.1). The only change is the four
# app.quarkus.io/build-timestamp annotations (2026-10-23 09:44:51 to 2026-10-31 10:44:15 UTC).
k8s_identity_operator_base: https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/{{ k8s_identity_version }}/kubernetes
k8s_identity_operator_files:
  - {name: keycloaks.k8s.keycloak.org-v1.yml, sha256: 20c51247cb6cbc6158098caabeaf6b429dc8c016e35829f5ddd9c468b7582667}
  - {name: keycloakrealmimports.k8s.keycloak.org-v1.yml, sha256: 8d552e1864d78117a07e535479ddb36e16a42b2695726c875f44828e1323edd4}
  - {name: keycloakoidcclients.k8s.keycloak.org-v1.yml, sha256: 15d9199822d1918438bd1d093eee3ec8406e7f9d0837c4527fd6da99c63b058a}
  - {name: keycloaksamlclients.k8s.keycloak.org-v1.yml, sha256: 7c69d146f610f3c40acf4466518e89615b6fce7ee2a03d75cd93b7a9a7bf259e}
  - {name: kubernetes.yml, sha256: 18d4f940294bd9b2f73fe7a52c84d6b21e8fc6e5be771dce5453304c6923b28c}

# Derived values, not inputs.
k8s_identity_dir: /root/central-hub/identity
# Each app's names, the one it builds its links with first: the short alias <app>.<zone> with
# k8s_identity_short_names on (STD-0001 rule 7), then the service name <app>.apps.c1.prod.<zone>.
k8s_identity_host: "{{ k8s_identity_name ~ ('.' if k8s_identity_short_names | bool else '.apps.c1.prod.') ~ k8s_identity_zone }}"
k8s_identity_grafana_hosts: >-
  {{ ([k8s_identity_grafana_name ~ '.' ~ k8s_identity_zone] if k8s_identity_short_names | bool else [])
  + [k8s_identity_grafana_name ~ '.apps.c1.prod.' ~ k8s_identity_zone] }}
k8s_identity_argocd_hosts: >-
  {{ ([k8s_identity_argocd_name ~ '.' ~ k8s_identity_zone] if k8s_identity_short_names | bool else [])
  + [k8s_identity_argocd_name ~ '.apps.c1.prod.' ~ k8s_identity_zone] }}
k8s_identity_jellyfin_hosts: >-
  {{ ([k8s_identity_jellyfin_name ~ '.' ~ k8s_identity_zone] if k8s_identity_short_names | bool else [])
  + [k8s_identity_jellyfin_name ~ '.apps.c1.prod.' ~ k8s_identity_zone] }}
k8s_identity_issuer: https://{{ k8s_identity_host }}/realms/{{ k8s_identity_realm }}
# The sign-in theme (k8s_identity_theme_dir): its name, its files as ConfigMap entries (tasks/theme.yml
# fills them in; each is {key, path under the theme folder, b64}), and a hash that restarts the pod
# when a file changes.
k8s_identity_theme: "{{ k8s_identity_theme_dir | regex_replace('/+$', '') | basename if k8s_identity_theme_dir | length > 0 else '' }}"
k8s_identity_theme_files: []
k8s_identity_theme_sha256: "{{ k8s_identity_theme_files | map(attribute='b64') | join('\n') | hash('sha256') }}"
k8s_identity_db_secret: "{{ k8s_identity_name }}-db"
k8s_identity_realm_secret: realm-{{ k8s_identity_realm }}-secrets

# The groups in realm lab and the realm role each gives. Apps read both claims: `groups` (Argo CD,
# the Jellyfin plugin) and `roles` (Grafana).
k8s_identity_groups:
  - {name: lab-admins, role: admin}
  - {name: lab-viewers, role: viewer}

# Every user, the owner first. The password key is PASSWORD_ and the user name in capitals, with
# anything that is not a letter or digit as an underscore.
k8s_identity_users: >-
  {{ [{'username': k8s_identity_owner_username, 'email': k8s_identity_owner_email, 'groups': ['lab-admins']}]
  + k8s_identity_extra_users }}
k8s_identity_password_keys: >-
  {{ k8s_identity_users | map(attribute='username') | map('upper') | map('regex_replace', '[^A-Z0-9]', '_')
  | map('regex_replace', '^', 'PASSWORD_') | list }}

# Client secrets, one per confidential client, and every key the values file must hold.
# PROXMOX_CLIENT_SECRET is in realm lab's Secret on c1 like the others (Keycloak must hold it), and role
# proxmox_sso reads it from the values file on the controller for the Proxmox host; no app namespace gets a copy.
# OPENBAO_CLIENT_SECRET only with a store name, so a realm with no openbao client keeps today's values and hash.
k8s_identity_client_secret_keys: >-
  {{ ['GRAFANA_CLIENT_SECRET', 'ARGOCD_CLIENT_SECRET', 'JELLYFIN_CLIENT_SECRET', 'PROXMOX_CLIENT_SECRET']
  + (['OPENBAO_CLIENT_SECRET'] if k8s_identity_openbao_hosts | length > 0 else []) }}
# Each member of k8s_identity_otp_group has a TOTP seed: TOTP_ and the user name as for passwords.
k8s_identity_totp_keys: >-
  {{ k8s_identity_users | selectattr('groups', 'contains', k8s_identity_otp_group) | map(attribute='username')
  | map('upper') | map('regex_replace', '[^A-Z0-9]', '_') | map('regex_replace', '^', 'TOTP_') | list }}
k8s_identity_value_keys: "{{ k8s_identity_client_secret_keys + k8s_identity_password_keys + k8s_identity_totp_keys }}"
