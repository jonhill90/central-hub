---
# One manifest, written to the node, then the same diff-then-apply as k8s_identity: kubectl diff
# exits 0 with no difference, 1 with one, more on an error; a missing namespace also means "apply".
# A first --check run writes no manifest, so the diff is skipped and the apply counts as needed.
- name: provisioner | Folder for the manifest
  ansible.builtin.file: {path: "{{ k8s_storage_dir }}", state: directory, mode: "0700"}
  check_mode: false

- name: provisioner | Manifest
  ansible.builtin.template:
    src: local-path.yaml.j2
    dest: "{{ k8s_storage_dir }}/local-path.yaml"
    mode: "0600"

- name: provisioner | Manifest on the node?
  ansible.builtin.stat: {path: "{{ k8s_storage_dir }}/local-path.yaml"}
  register: k8s_storage_manifest_stat

- name: provisioner | Differs from the cluster?
  ansible.builtin.command: kubectl diff -f {{ k8s_storage_dir }}/local-path.yaml
  register: k8s_storage_diff
  changed_when: false
  failed_when: k8s_storage_diff.rc > 1 and 'namespaces' not in k8s_storage_diff.stderr
  check_mode: false
  when: k8s_storage_manifest_stat.stat.exists

- name: provisioner | Apply
  ansible.builtin.command: kubectl apply -f {{ k8s_storage_dir }}/local-path.yaml
  when: (k8s_storage_diff.rc | default(1)) != 0
  changed_when: true

- name: provisioner | Ready
  ansible.builtin.command: >-
    kubectl -n {{ k8s_storage_namespace }} rollout status deployment/local-path-provisioner --timeout=180s
  changed_when: false
  when: not ansible_check_mode
