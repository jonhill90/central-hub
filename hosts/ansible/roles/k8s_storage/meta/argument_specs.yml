---
argument_specs:
  disk:
    short_description: The node's empty data disk as an ext4 file system mounted for Kubernetes volumes (BUILD-PATH S17)
    options:
      k8s_storage_device:
        type: str
        default: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
        description: The data disk as the node sees it.
      k8s_storage_fstype: {type: str, default: ext4, description: File system made on an empty data disk.}
      k8s_storage_mount: {type: str, default: /var/lib/c1-data, description: Where the data disk is mounted.}
  main:
    short_description: Local Path Provisioner on c1 with a default StorageClass on the data disks, and a proof (BUILD-PATH S17)
    options:
      k8s_storage_mount: {type: str, default: /var/lib/c1-data, description: Where the data disk is mounted on the nodes.}
      k8s_storage_version: {type: str, default: v0.0.37, description: "Local Path Provisioner version (STD-0003)."}
      k8s_storage_image:
        type: str
        default: docker.io/rancher/local-path-provisioner:v0.0.37@sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
        description: The provisioner's image, pinned by digest.
      k8s_storage_helper_image:
        type: str
        default: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        description: The helper pod's image, pinned by digest.
      k8s_storage_namespace: {type: str, default: local-path-storage, description: The provisioner's namespace.}
      k8s_storage_class: {type: str, default: local-path, description: The StorageClass's name.}
      k8s_storage_class_default: {type: bool, default: true, description: Make it the cluster's default StorageClass.}
      k8s_storage_reclaim_policy:
        type: str
        default: Retain
        choices: [Retain, Delete]
        description: What happens to a volume's folder when its claim is deleted.
