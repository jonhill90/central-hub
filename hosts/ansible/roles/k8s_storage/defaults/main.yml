---
# Persistent volumes for cluster c1 (BUILD-PATH S17, TASK-0030): an empty data disk on each node that
# has one (Terraform home/k8s, data_disk_gb) becomes an ext4 file system mounted at
# k8s_storage_mount, and the Local Path Provisioner makes each volume a folder under it. Every part
# is an agent pick, listed in hosts/AGENT-PICKS.md; the research is batch RB-0082 (Research
# 01-notes/01r-research/0082-local-storage/, Area 4). A volume lives on one node and is lost with that disk, so the
# Proxmox backup job (proxmox_backup) is its copy. Exit path: NFS CSI or Proxmox CSI later, data
# moved by hand (RB-0082 L53, L55, L57). Every input is listed here (Red Hat CoP rule).

# The data disk as the node sees it: Proxmox's scsi1 on the VirtIO SCSI controller.
k8s_storage_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
k8s_storage_fstype: ext4
k8s_storage_mount: /var/lib/c1-data

# Local Path Provisioner, the newest release at least two weeks old on 2026-10-29 (v0.0.37,
# 2026-08-05, STD-0003 rule 1), from its upstream deploy file, with the images pinned by digest.
k8s_storage_version: v0.0.37
k8s_storage_image: docker.io/rancher/local-path-provisioner:v0.0.37@sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
# The helper pod that makes and removes each volume's folder. Upstream leaves it at busybox
# "latest"; pinned here.
k8s_storage_helper_image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
k8s_storage_namespace: local-path-storage

# The kubectl the role runs on the first control plane: a name looked up on the PATH that the
# role's commands get under become, or a full path. The bare name works where kubectl is in
# /usr/bin, as on c1 and the R1 rehearsals (kubeadm by this repo's roles). Kubespray installs it in
# /usr/local/bin, which was not on that PATH in lab rehearsal R3 runs 3 and 4, so pass
# -e k8s_storage_kubectl=/usr/local/bin/kubectl there.
k8s_storage_kubectl: kubectl

# The StorageClass every claim without one gets. Retain keeps a volume's folder when its claim is
# deleted, so removing an app never removes its data; the folder is cleaned up by hand.
k8s_storage_class: local-path
k8s_storage_class_default: true
k8s_storage_reclaim_policy: Retain
# Each volume's folder under the path: <namespace>/<claim>, not upstream's pvc-<uid>_<namespace>_<claim>,
# so a volume keeps its folder's name across rebuilds and clusters, and dev can restore prod's
# backup before the claims exist (TASK-0240, agent pick 205). The provisioner's own example
# (README at v0.0.37, "pathPattern"); v0.0.37 refuses a pattern that doesn't start with
# <namespace>/<claim>/. A StorageClass's parameters can't change in place: a running cluster
# deletes the StorageClass once (docs/runbooks/rebuild-k8s-layer-with-one-command.md, "Move c1's
# volumes to the new folder names").
k8s_storage_path_pattern: !unsafe "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"

# Argo CD manages the provisioner and the StorageClass from hosts/kubernetes/home/c1/apps/local-path/
# (spec 2026-11-c1-apps-under-argo-cd, step 2). True once its Application is Synced; the role then
# leaves them alone. False keeps Ansible in charge, which is also the way back.
k8s_storage_provisioner_by_argocd: false
