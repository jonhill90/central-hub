---
- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true

- name: Reload sshd
  ansible.builtin.systemd: {name: sshd, state: reloaded}

- name: Restart containerd
  ansible.builtin.systemd: {name: containerd, state: restarted}

# Before kubeadm init or join the kubelet only restarts in a loop, so this is harmless on a new node.
- name: Restart kubelet
  ansible.builtin.systemd: {name: kubelet, state: restarted}
