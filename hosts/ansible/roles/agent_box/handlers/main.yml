---
- name: Rebuild the trust store
  ansible.builtin.command: update-ca-trust extract
  changed_when: true

- name: Reload the lifeline filter
  # reload-or-restart: reloads a running unit (the table is replaced in one transaction, so the NIC is never
  # unfiltered), and starts one that is not running yet. daemon-reload ran in the task that enables the unit.
  ansible.builtin.command: systemctl reload-or-restart lifeline-nft.service  # noqa: command-instead-of-module
  changed_when: true

- name: Reload the OPNsense proof filter
  ansible.builtin.command: systemctl reload-or-restart opnsense-test-nft.service  # noqa: command-instead-of-module
  changed_when: true
  when: not ansible_check_mode

- name: Reload the agent-browser filter
  # reload-or-restart: replaces the table in one transaction, or starts the unit if it is not running yet.
  ansible.builtin.command: systemctl reload-or-restart agent-browser-nft.service  # noqa: command-instead-of-module
  changed_when: true
