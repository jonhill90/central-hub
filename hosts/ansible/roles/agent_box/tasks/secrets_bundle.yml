---
# One encrypted bundle a day of the box's private files (proposed D-0038 rule 10, pick 228,
# docs/runbooks/make-the-box-secrets-bundle.md). SOPS encrypts it to two age recipients: the box's own identity,
# made here as the keys user and never printed, and the owner's Mac, whose public recipient comes from the
# inventory. Either machine alone can decrypt it. The off-box send is a later step.

- name: The bundle's settings hold
  ansible.builtin.assert:
    that:
      - agent_box_secrets_bundle.mac_recipient | default('') is match('^age1[0-9a-z]{58}$')
      - agent_box_secrets_bundle.keep | default(14) | int >= 1
      - agent_box_secrets_bundle.keep | default(14) | int <= 60
    fail_msg: >-
      agent_box_secrets_bundle needs mac_recipient, the Mac's age public key (age1...), and keep, if set, 1 to 60.
    quiet: true

# --- SOPS and age ------------------------------------------------------------------------------------

- name: Download SOPS and age, checked against their SHA-256
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ agent_box_libexec_dir }}/downloads/{{ item.dest }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - url: "https://github.com/getsops/sops/releases/download/v{{ agent_box_sops_version }}/sops-v{{ agent_box_sops_version }}.linux.amd64"
      dest: "sops-{{ agent_box_sops_version }}"
      sha256: "{{ agent_box_sops_sha256 }}"
    - url: "https://github.com/FiloSottile/age/releases/download/v{{ agent_box_age_version }}/age-v{{ agent_box_age_version }}-linux-amd64.tar.gz"
      dest: "age-{{ agent_box_age_version }}.tar.gz"
      sha256: "{{ agent_box_age_sha256 }}"
  loop_control:
    label: "{{ item.dest }}"
  when: not (ansible_check_mode and agent_box_downloads_dir | default({}) is changed)

- name: Install SOPS {{ agent_box_sops_version }}
  ansible.builtin.copy:
    src: "{{ agent_box_libexec_dir }}/downloads/sops-{{ agent_box_sops_version }}"
    dest: "{{ agent_box_libexec_dir }}/sops-{{ agent_box_sops_version }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Unpack age and age-keygen only, version {{ agent_box_age_version }}
  ansible.builtin.shell:
    cmd: >-
      set -euo pipefail;
      t=$(mktemp -d);
      tar -xzf {{ agent_box_libexec_dir }}/downloads/age-{{ agent_box_age_version }}.tar.gz -C "$t" age/age age/age-keygen;
      install -o root -g root -m 0755 "$t/age/age" {{ agent_box_libexec_dir }}/age-{{ agent_box_age_version }};
      install -o root -g root -m 0755 "$t/age/age-keygen" {{ agent_box_libexec_dir }}/age-keygen-{{ agent_box_age_version }};
      rm -rf "$t"
    executable: /bin/bash
    creates: "{{ agent_box_libexec_dir }}/age-keygen-{{ agent_box_age_version }}"
  when: not ansible_check_mode

- name: sops, age and age-keygen point at those versions
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ agent_box_libexec_dir }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - {src: "sops-{{ agent_box_sops_version }}", dest: sops}
    - {src: "age-{{ agent_box_age_version }}", dest: age}
    - {src: "age-keygen-{{ agent_box_age_version }}", dest: age-keygen}
  when: not ansible_check_mode

- name: The bundle's script, root-owned
  ansible.builtin.copy:
    src: secrets-bundle.sh
    dest: "{{ agent_box_libexec_dir }}/secrets-bundle.sh"
    owner: root
    group: root
    mode: "0755"

# --- The keys user's folder, identity and settings -------------------------------------------------------

- name: The bundle's key folder, the keys user's
  ansible.builtin.file:
    path: "{{ agent_box_keys_dir }}/secrets-bundle"
    state: directory
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0700"
  register: agent_box_bundle_dir

# Made once, as the keys user, and never printed or replaced: a new identity could not read older bundles.
- name: The box's age identity
  ansible.builtin.command:
    argv: [runuser, -u, "{{ agent_box_keys_user }}", --, "{{ agent_box_libexec_dir }}/age-keygen",
           -o, "{{ agent_box_keys_dir }}/secrets-bundle/age-identity.txt"]
    creates: "{{ agent_box_keys_dir }}/secrets-bundle/age-identity.txt"
  no_log: true
  when: not ansible_check_mode

- name: The bundle's settings (no secret in them)
  ansible.builtin.template:
    src: secrets-bundle-settings.env.j2
    dest: "{{ agent_box_keys_dir }}/secrets-bundle/settings.env"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  when: not (ansible_check_mode and agent_box_bundle_dir is changed)

# --- The daily timer ------------------------------------------------------------------------------------

- name: The bundle's units
  ansible.builtin.template:
    src: "secrets-bundle.{{ item }}.j2"
    dest: "/etc/systemd/system/secrets-bundle.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: agent_box_bundle_units

- name: The bundle's timer runs
  ansible.builtin.systemd_service:
    name: secrets-bundle.timer
    enabled: true
    state: started
    daemon_reload: "{{ agent_box_bundle_units is changed }}"
  when: not (ansible_check_mode and agent_box_bundle_units is changed)
