---
# The agent box's base setup (Library plans/agent-workstation/PLAN.md step 4): sessions run as
# agent_box_user, keys belong to agent_box_keys_user, and the only bridge between them is a set of
# root-owned wrappers that sudo runs with fixed arguments. File modes, not deny rules, keep the
# keys from sessions; the deny rules in the managed settings are the floor for everything else.
# Order and proofs: docs/runbooks/set-up-the-agent-box.md.

# box-apply writes its baseline only if this ran, so a run that started part way (--start-at-task) writes none.
- name: Note that this run starts at the role's first task
  ansible.builtin.set_fact:
    agent_box_box_apply_from_start: true
  tags: [always]

- name: Install what the wrappers need
  ansible.builtin.package:
    name: [git, sudo, unzip, bzip2, openssl, openssh-clients, python3, ansible-core]
    state: present
  tags: [users, wrappers]

# --- Hostname ------------------------------------------------------------------------------

- name: Check the hostname against STD-0001 (at most 15 characters, a-z and 0-9, starts with a letter)
  ansible.builtin.assert:
    that: agent_box_hostname is match('^[a-z][a-z0-9]{10,14}$')
    fail_msg: "{{ agent_box_hostname }} is not a STD-0001 hostname."
    quiet: true
  tags: [hostname]

- name: The box's OS hostname
  ansible.builtin.hostname:
    name: "{{ agent_box_hostname }}"
  tags: [hostname]

# Proxmox makes the cloud-init instance-id from a hash of the user-data and network-data it
# generates, and the user-data holds the VM's name. So a rename (or a change to the user, SSH
# keys or addresses) looks like a new instance, and cloud-init runs its first-boot steps again:
# new SSH host keys, among others. manual_cache_clean makes cloud-init trust the instance it
# already has. Per-boot steps (growing the partition after a disk resize) still run.
# Proxmox's user-data sets manage_etc_hosts: true, which outranks this file, so /etc/hosts is
# left to cloud-init and checked under the verify tag instead.
- name: Keep the hostname, and the first boot's keys, across renames and reboots (cloud-init)
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-keep-hostname.cfg
    content: |
      # Managed by the agent_box role (central-hub hosts/ansible): keep the STD-0001 hostname,
      # and never treat a Proxmox rename as a new instance.
      preserve_hostname: true
      manual_cache_clean: true
    owner: root
    group: root
    mode: "0644"
  tags: [hostname]

# --- Tailscale -----------------------------------------------------------------------------
# The client only. Joining (tailscale up --advertise-tags=tag:agent-box --ssh) needs a login
# link an admin opens once, so it is a runbook step, not a task.

# Written from the repository, not downloaded: pkgs.tailscale.com sends no Last-Modified, so get_url in check
# mode reported a change on every run, and the package and service checks below were always skipped. The text is
# what https://pkgs.tailscale.com/stable/rhel/<major>/tailscale.repo served on 2026-11-14.
- name: Tailscale's package repository (RHEL family)
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/tailscale.repo
    content: |
      [tailscale-stable]
      name=Tailscale stable
      baseurl=https://pkgs.tailscale.com/stable/rhel/{{ agent_box_rhel_major }}/$basearch
      enabled=1
      type=rpm
      repo_gpgcheck=1
      gpgcheck=1
      gpgkey=https://pkgs.tailscale.com/stable/rhel/{{ agent_box_rhel_major }}/repo.gpg
    owner: root
    group: root
    mode: "0644"
  register: agent_box_tailscale_repo
  tags: [tailscale]

# In check mode on a fresh box the repository isn't there yet, so the package and its service
# can't be checked; they are skipped rather than failing.

- name: Tailscale client, at the pinned version
  ansible.builtin.dnf:
    name: "tailscale-{{ agent_box_tailscale_version }}"
    state: present
  when: not (ansible_check_mode and agent_box_tailscale_repo is changed)
  register: agent_box_tailscale_pkg
  tags: [tailscale]

- name: Tailscale daemon on at boot
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  when: not (ansible_check_mode and (agent_box_tailscale_repo is changed or agent_box_tailscale_pkg is changed))
  tags: [tailscale]

# --- Users ---------------------------------------------------------------------------------

- name: Session user, with no extra groups (no wheel, no sudo group)
  ansible.builtin.user:
    name: "{{ agent_box_user }}"
    shell: /bin/bash
    groups: ""
    append: false
  tags: [users]

- name: Runner user for the redeploy workflow, no extra groups and no login key (only when agent_box_runner_user is set)
  ansible.builtin.user:
    name: "{{ agent_box_runner_user }}"
    shell: /bin/bash
    groups: ""
    append: false
  when: agent_box_runner_user | length > 0
  tags: [users]

- name: Keys user, a system user that can't log in
  ansible.builtin.user:
    name: "{{ agent_box_keys_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ agent_box_work_dir }}"
    create_home: false
  tags: [users]

- name: Key folder and the keys user's work folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0700"
  loop:
    - "{{ agent_box_keys_dir }}"
    - "{{ agent_box_work_dir }}"
    - "{{ agent_box_work_dir }}/state"
    - "{{ agent_box_work_dir }}/tofu-data"
    # One checkout per wrapper, made by the wrapper on its first run.
    - "{{ agent_box_work_dir }}/checkouts"
  tags: [users]

# The role never writes a key. It only makes sure every file already in the key folder belongs to
# the keys user and is readable by it alone.
- name: Find the key files
  ansible.builtin.find:
    paths: "{{ agent_box_keys_dir }}"
    file_type: file
    hidden: true
  register: agent_box_key_files
  tags: [users]

- name: Every key file is the keys user's, mode 0600
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  loop: "{{ agent_box_key_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags: [users]

# --- Private CAs ---------------------------------------------------------------------------
# The Proxmox API's certificate comes from the lab CA, which the box does not trust, so tofu
# would refuse it. Trust that CA rather than turn certificate checks off.
# Only public certificates go to the box. The owner's CA folder also holds private keys, so each
# entry must be one named file, checked on the controller before anything is copied.
- name: Check each CA entry is one named file, not a folder or a pattern
  ansible.builtin.assert:
    that:
      - item is match('^/')
      - item is not search('[*?\\[\\]{}]')
    fail_msg: "agent_box_ca_files takes absolute file paths only: {{ item }}"
    quiet: true
  loop: "{{ agent_box_ca_files }}"
  tags: [ca]

- name: Look at each CA file on the controller
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ agent_box_ca_files }}"
  register: agent_box_ca_stat
  delegate_to: localhost
  become: false
  tags: [ca]

- name: Check each CA file is a regular file
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isreg
    fail_msg: "{{ item.item }} is not a regular file (missing, a folder or a link)."
    quiet: true
  loop: "{{ agent_box_ca_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [ca]

- name: Check each CA file holds no private key
  ansible.builtin.command:
    argv: [grep, -c, PRIVATE KEY, "{{ item }}"]
  loop: "{{ agent_box_ca_files }}"
  register: agent_box_ca_keys
  failed_when: agent_box_ca_keys.rc != 1
  changed_when: false
  delegate_to: localhost
  become: false
  tags: [ca]

- name: Check each CA file parses as a certificate
  ansible.builtin.command:
    argv: [openssl, x509, -noout, -in, "{{ item }}"]
  loop: "{{ agent_box_ca_files }}"
  changed_when: false
  delegate_to: localhost
  become: false
  tags: [ca]

- name: Add each private CA to the trust store
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/pki/ca-trust/source/anchors/agent-box-{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ agent_box_ca_files }}"
  notify: Rebuild the trust store
  tags: [ca]

# Now, not at the end of the play, so the verify tag's TLS proof sees the new store.
- name: Rebuild the trust store now if a CA changed
  ansible.builtin.meta: flush_handlers
  tags: [ca]

# --- Wrappers ------------------------------------------------------------------------------

- name: Wrapper folder, root's
  ansible.builtin.file:
    path: "{{ agent_box_libexec_dir }}/downloads"
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: agent_box_downloads_dir
  tags: [wrappers]

# In check mode on a fresh box the folders above only report "would create", so the steps that
# write into them are skipped there rather than failing. A check never writes to the box.

- name: Download OpenTofu, checked against its SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/opentofu/opentofu/releases/download/v{{ agent_box_tofu_version }}/tofu_{{ agent_box_tofu_version }}_linux_amd64.zip"
    dest: "{{ agent_box_libexec_dir }}/downloads/tofu_{{ agent_box_tofu_version }}.zip"
    checksum: "sha256:{{ agent_box_tofu_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: not (ansible_check_mode and agent_box_downloads_dir is changed)
  tags: [wrappers]

- name: OpenTofu's folder
  ansible.builtin.file:
    path: "{{ agent_box_libexec_dir }}/tofu-{{ agent_box_tofu_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: agent_box_tofu_dir
  tags: [wrappers]

- name: Unpack OpenTofu
  ansible.builtin.unarchive:
    src: "{{ agent_box_libexec_dir }}/downloads/tofu_{{ agent_box_tofu_version }}.zip"
    dest: "{{ agent_box_libexec_dir }}/tofu-{{ agent_box_tofu_version }}"
    remote_src: true
    include: [tofu]
    creates: "{{ agent_box_libexec_dir }}/tofu-{{ agent_box_tofu_version }}/tofu"
    owner: root
    group: root
  when: not (ansible_check_mode and (agent_box_downloads_dir is changed or agent_box_tofu_dir is changed))
  tags: [wrappers]

- name: Put tofu on the path
  ansible.builtin.file:
    src: "{{ agent_box_libexec_dir }}/tofu-{{ agent_box_tofu_version }}/tofu"
    dest: /usr/local/bin/tofu
    state: link
    force: true
  tags: [wrappers]

- name: Download kubectl, checked against its SHA-256
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v{{ agent_box_kubectl_version }}/bin/linux/amd64/kubectl"
    dest: "{{ agent_box_libexec_dir }}/downloads/kubectl-{{ agent_box_kubectl_version }}"
    checksum: "sha256:{{ agent_box_kubectl_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  when: not (ansible_check_mode and agent_box_downloads_dir is changed)
  tags: [wrappers]

- name: Put kubectl on the path
  ansible.builtin.file:
    src: "{{ agent_box_libexec_dir }}/downloads/kubectl-{{ agent_box_kubectl_version }}"
    dest: /usr/local/bin/kubectl
    state: link
    force: true
  when: not (ansible_check_mode and agent_box_downloads_dir is changed)
  tags: [wrappers]

# The wrappers each clone their own checkout from this one's origin (checkouts/<wrapper>) and move
# it to origin/main on each run; this one gives the Ansible collections' requirements file.
- name: The keys user's checkout of central-hub
  ansible.builtin.git:
    repo: "{{ agent_box_repo_url }}"
    dest: "{{ agent_box_work_dir }}/central-hub"
    version: main
    update: false
  tags: [wrappers]

- name: The checkout belongs to the keys user
  ansible.builtin.file:
    path: "{{ agent_box_work_dir }}/central-hub"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    recurse: true
  tags: [wrappers]

# --- Ansible for the rebuild wrapper -----------------------------------------------------------

- name: Python's pip, for the Ansible virtual environment
  ansible.builtin.package:
    name: [python3-pip]
    state: present
  tags: [wrappers]

- name: Ansible, in its own virtual environment so the system Python stays as it is
  ansible.builtin.pip:
    name:
      - "ansible-core=={{ agent_box_ansible_core_version }}"
      - "httpx=={{ agent_box_httpx_version }}"
    virtualenv: "{{ agent_box_libexec_dir }}/ansible-venv"
    virtualenv_command: python3 -m venv
  when: not ansible_check_mode
  tags: [wrappers]

- name: The Ansible collections the playbooks pin, from the keys user's checkout
  ansible.builtin.command:
    cmd: >-
      {{ agent_box_libexec_dir }}/ansible-venv/bin/ansible-galaxy collection install
      -r {{ agent_box_work_dir }}/central-hub/hosts/ansible/requirements.yml
      -p {{ agent_box_libexec_dir }}/collections
  register: agent_box_collections
  changed_when: "'was installed successfully' in agent_box_collections.stdout"
  when: not ansible_check_mode
  tags: [wrappers]

- name: Wrappers, root-owned
  ansible.builtin.copy:
    src: "{{ item.name }}.sh"
    dest: "{{ agent_box_libexec_dir }}/{{ item.name }}.sh"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ agent_box_wrappers }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [wrappers]

- name: Front scripts that sessions run
  ansible.builtin.template:
    src: front.sh.j2
    dest: "{{ agent_box_front_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ agent_box_wrappers }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [wrappers]

- name: The ci-runner wrapper's private settings, from the inventory (no keys)
  ansible.builtin.copy:
    dest: "{{ agent_box_work_dir }}/ci-runner.json"
    content: "{{ agent_box_ci_runner | to_nice_json }}\n"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  when: agent_box_ci_runner | length > 0
  tags: [wrappers]

- name: The rebuild wrapper's short-node pick, from the inventory (no keys)
  ansible.builtin.copy:
    dest: "{{ agent_box_work_dir }}/short-node"
    content: "{{ agent_box_short_node }}\n"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  when: agent_box_short_node | length > 0
  tags: [wrappers]

- name: No short-node pick in the inventory, so no file
  ansible.builtin.file:
    path: "{{ agent_box_work_dir }}/short-node"
    state: absent
  when: agent_box_short_node | length == 0
  tags: [wrappers]

- name: The desktop wrapper's private settings, from the inventory (no keys)
  ansible.builtin.copy:
    dest: "{{ agent_box_work_dir }}/desktop.json"
    content: "{{ agent_box_desktop | to_nice_json }}\n"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  when: agent_box_desktop | length > 0
  tags: [wrappers]

- name: The secrets-store wrapper's guarded restore onto a rebuilt store, root-owned (pick 238)
  ansible.builtin.copy:
    src: secrets-store-restore-rebuilt.sh
    dest: "{{ agent_box_libexec_dir }}/secrets-store-restore-rebuilt.sh"
    owner: root
    group: root
    mode: "0755"
  when: agent_box_secrets_store | length > 0
  tags: [wrappers]

- name: The secrets-store wrapper's private settings, from the inventory (no keys)
  ansible.builtin.copy:
    dest: "{{ agent_box_work_dir }}/secrets-store.json"
    content: "{{ agent_box_secrets_store | to_nice_json }}\n"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  when: agent_box_secrets_store | length > 0
  tags: [wrappers]

- name: Weekly CI runner service and timer (pick 208)
  ansible.builtin.template:
    src: "ci-runner-weekly.{{ item }}.j2"
    dest: "/etc/systemd/system/ci-runner-weekly.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: agent_box_ci_runner_units
  when: agent_box_ci_runner | length > 0
  tags: [wrappers]

- name: Weekly CI runner timer on
  ansible.builtin.systemd_service:
    name: ci-runner-weekly.timer
    enabled: true
    state: started
    daemon_reload: "{{ agent_box_ci_runner_units is changed }}"
  when: agent_box_ci_runner | length > 0 and not (ansible_check_mode and agent_box_ci_runner_units is changed)
  tags: [wrappers]

- name: The tailnet cleanup's limits hold (pick 214)
  ansible.builtin.assert:
    that:
      - agent_box_tailnet_cleanup.tags | default([]) | length > 0
      - agent_box_tailnet_cleanup.tags | select('match', '^tag:[a-z0-9-]+$') | list | length == agent_box_tailnet_cleanup.tags | length
      - agent_box_tailnet_cleanup.keep | default([]) | length > 0
      - agent_box_tailnet_cleanup.days | default(7) | int >= 7
      - agent_box_tailnet_cleanup.max_deletes | default(5) | int >= 1
      - agent_box_tailnet_cleanup.max_deletes | default(5) | int <= 20
    fail_msg: >-
      agent_box_tailnet_cleanup needs tags (tag:<name>), a keep list naming at least one device,
      days of 7 or more and max_deletes from 1 to 20.
    quiet: true
  when: agent_box_tailnet_cleanup | length > 0
  tags: [wrappers]

- name: The tailnet cleanup's settings, from the inventory (no keys)
  ansible.builtin.copy:
    dest: "{{ agent_box_work_dir }}/tailnet-cleanup.json"
    content: >-
      {{ {'tags': agent_box_tailnet_cleanup.tags, 'keep': agent_box_tailnet_cleanup.keep,
          'days': agent_box_tailnet_cleanup.days | default(7) | int,
          'max_deletes': agent_box_tailnet_cleanup.max_deletes | default(5) | int} | to_nice_json }}
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  when: agent_box_tailnet_cleanup | length > 0
  tags: [wrappers]

- name: Daily tailnet cleanup service and timer (pick 214)
  ansible.builtin.template:
    src: "tailnet-cleanup.{{ item }}.j2"
    dest: "/etc/systemd/system/tailnet-cleanup.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: agent_box_tailnet_cleanup_units
  when: agent_box_tailnet_cleanup | length > 0
  tags: [wrappers]

- name: Daily tailnet cleanup timer on
  ansible.builtin.systemd_service:
    name: tailnet-cleanup.timer
    enabled: true
    state: started
    daemon_reload: "{{ agent_box_tailnet_cleanup_units is changed }}"
  when: agent_box_tailnet_cleanup | length > 0 and not (ansible_check_mode and agent_box_tailnet_cleanup_units is changed)
  tags: [wrappers]

- name: The runner's job-started hook, root's (refuses every job but the dev redeploy workflow on main)
  ansible.builtin.copy:
    src: runner-job-started.sh
    dest: "{{ agent_box_libexec_dir }}/runner-job-started.sh"
    owner: root
    group: root
    mode: "0755"
  when: agent_box_runner_user | length > 0
  tags: [wrappers]

- name: One sudoers line per wrapper, checked by visudo before it is written
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/agent-box
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  tags: [wrappers]

- name: box-apply, so the box applies this role to itself from reviewed main (only when agent_box_self_apply is true)
  ansible.builtin.include_tasks:
    file: self_apply.yml
    apply:
      tags: [wrappers, box_apply]
  when: agent_box_self_apply | bool
  tags: [wrappers, box_apply]

# --- Claude Code managed settings ----------------------------------------------------------

- name: Managed settings folder, root's
  ansible.builtin.file:
    path: /etc/claude-code
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [settings]

- name: Managed settings, root-owned, readable by sessions
  ansible.builtin.template:
    src: managed-settings.json.j2
    dest: /etc/claude-code/managed-settings.json
    owner: root
    group: root
    mode: "0644"
    backup: true
  vars:
    agent_box_managed_settings: >-
      {{ {'permissions': {'disableBypassPermissionsMode': 'disable',
                          'allow': agent_box_allow, 'deny': agent_box_deny},
          'autoMode': agent_box_auto_mode} | combine(agent_box_managed_settings_extra, recursive=true) }}
  tags: [settings]

# --- Proofs --------------------------------------------------------------------------------
# The proofs read the box as it is, so they mean nothing in check mode, where nothing was written.
- name: Proofs, after a real run
  when: not ansible_check_mode
  tags: [verify]
  block:

    - name: Proof, the session user can't open the key folder
      ansible.builtin.command:
        argv: [runuser, -u, "{{ agent_box_user }}", --, test, -x, "{{ agent_box_keys_dir }}"]
      register: agent_box_key_read
      changed_when: false
      failed_when: agent_box_key_read.rc == 0
      tags: [verify]

    - name: Proof, sudo lets the session user run the wrappers and nothing else
      ansible.builtin.command:
        argv: [sudo, -l, -U, "{{ agent_box_user }}"]
      register: agent_box_sudo_list
      changed_when: false
      tags: [verify]

    # The one root line allowed is box-apply's, with plan and apply only (D-0036 rule 2).
    - name: Check the sudo list
      vars:
        agent_box_box_apply_line: >-
          (root) NOPASSWD: {{ agent_box_libexec_dir }}/box-apply.py plan, {{ agent_box_libexec_dir }}/box-apply.py apply
        agent_box_sudo_list_rest: >-
          {{ agent_box_sudo_list.stdout_lines | map('trim')
             | reject('equalto', agent_box_box_apply_line if agent_box_self_apply | bool else '')
             | join(' | ') }}
      ansible.builtin.assert:
        that:
          - agent_box_sudo_list.stdout is search('\(' ~ agent_box_keys_user ~ '\) NOPASSWD')
          - agent_box_sudo_list_rest is not search('\((root|ALL)(\s*:\s*ALL)?\)')
        fail_msg: "{{ agent_box_user }} may run more than the wrappers as {{ agent_box_keys_user }}: {{ agent_box_sudo_list.stdout }}"
        quiet: true
      tags: [verify]

    - name: Read /etc/hosts
      ansible.builtin.slurp:
        src: /etc/hosts
      register: agent_box_etc_hosts
      tags: [verify]

    - name: Check /etc/hosts names the box once per address (127.0.0.1 and ::1), with no repeated lines
      vars:
        agent_box_hosts_lines: >-
          {{ (agent_box_etc_hosts.content | b64decode).splitlines()
             | map('regex_replace', '#.*$', '') | map('trim') | select | list }}
        agent_box_hosts_own: "{{ agent_box_hosts_lines | select('search', '(^|[ \t.])' ~ agent_box_hostname ~ '([ \t.]|$)') | list }}"
        agent_box_hosts_addrs: "{{ agent_box_hosts_own | map('split') | map('first') | list }}"
      ansible.builtin.assert:
        that:
          - agent_box_hosts_lines | length == agent_box_hosts_lines | unique | length
          - agent_box_hosts_addrs | length == agent_box_hosts_addrs | unique | length
          - agent_box_hosts_own | length >= 1
        fail_msg: "/etc/hosts repeats a line or an address for {{ agent_box_hostname }}: {{ agent_box_hosts_own }}"
        quiet: true
      tags: [verify]

    - name: Proof, the Proxmox API's certificate is trusted, with normal certificate checks
      ansible.builtin.uri:
        url: "{{ agent_box_tls_check_url }}"
        validate_certs: true
        status_code: [200, 401]
      when: agent_box_tls_check_url | length > 0
      changed_when: false
      tags: [verify]

# --- Prod files from the controller ----------------------------------------------------------

- name: Copy the controller's private lab files to the box (only when agent_box_copy_prod_files is true)
  ansible.builtin.include_tasks:
    file: prod_files.yml
    apply:
      tags: [prod_files]
  when: agent_box_copy_prod_files | bool
  tags: [prod_files]

# --- OPNsense configuration backup (pick 220) -----------------------------------------------------

- name: The OPNsense backup's settings hold
  ansible.builtin.assert:
    that:
      - agent_box_opnsense_backup.host | default('') | length > 0
      - agent_box_opnsense_backup.keep | default(14) | int >= 3
      - agent_box_opnsense_backup.keep | default(14) | int <= 60
    fail_msg: agent_box_opnsense_backup needs host (OPNsense's name or address) and, optionally, keep from 3 to 60.
    quiet: true
  when: agent_box_opnsense_backup | length > 0
  tags: [wrappers]

- name: The OPNsense backup's script, root-owned
  ansible.builtin.copy:
    src: opnsense-backup.sh
    dest: "{{ agent_box_libexec_dir }}/opnsense-backup.sh"
    owner: root
    group: root
    mode: "0755"
  when: agent_box_opnsense_backup | length > 0
  tags: [wrappers]

- name: The OPNsense backup's settings, from the inventory (no keys)
  ansible.builtin.copy:
    dest: "{{ agent_box_work_dir }}/opnsense-backup.json"
    content: >-
      {{ {'host': agent_box_opnsense_backup.host, 'keep': agent_box_opnsense_backup.keep | default(14) | int} | to_nice_json }}
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  when: agent_box_opnsense_backup | length > 0
  tags: [wrappers]

- name: Daily OPNsense backup service and timer
  ansible.builtin.template:
    src: "opnsense-backup.{{ item }}.j2"
    dest: "/etc/systemd/system/opnsense-backup.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: agent_box_opnsense_backup_units
  when: agent_box_opnsense_backup | length > 0
  tags: [wrappers]

- name: Daily OPNsense backup timer on
  ansible.builtin.systemd_service:
    name: opnsense-backup.timer
    enabled: true
    state: started
    daemon_reload: "{{ agent_box_opnsense_backup_units is changed }}"
  when: agent_box_opnsense_backup | length > 0 and not (ansible_check_mode and agent_box_opnsense_backup_units is changed)
  tags: [wrappers]

# --- Off-box copy of those configurations (pick 222) ----------------------------------------------------

- name: Copy the OPNsense backups off the box (only when agent_box_opnsense_offbox is set)
  ansible.builtin.include_tasks:
    file: opnsense_offbox.yml
    apply:
      tags: [wrappers, opnsense_offbox]
  when: agent_box_opnsense_offbox | length > 0
  tags: [wrappers, opnsense_offbox]

# --- Encrypted bundle of the box's private files (pick 228) ------------------------------------------

- name: Make the daily encrypted bundle (only when agent_box_secrets_bundle is set)
  ansible.builtin.include_tasks:
    file: secrets_bundle.yml
    apply:
      tags: [wrappers, secrets_bundle]
  when: agent_box_secrets_bundle | length > 0
  tags: [wrappers, secrets_bundle]

# --- The dev secrets store's hourly snapshot off the box (pick 237) -------------------------------------

- name: Send the dev secrets store's snapshots off the box (only when the store's wrapper and the off-box copy are set)
  ansible.builtin.include_tasks:
    file: secrets_store_offbox.yml
    apply:
      tags: [wrappers, secrets_store_offbox]
  when: agent_box_secrets_store | length > 0 and agent_box_opnsense_offbox | length > 0
  tags: [wrappers, secrets_store_offbox]

# --- The lifeline NIC (pick 220) ---------------------------------------------------------------------

- name: Filter and set up the lifeline NIC (only when agent_box_lifeline_interface is set)
  ansible.builtin.include_tasks:
    file: lifeline.yml
    apply:
      tags: [lifeline]
  when: agent_box_lifeline_interface | length > 0
  tags: [lifeline]

# --- box-apply's baseline, last, so only a run that got this far writes it -----------------------------

- name: box-apply's baseline (only when agent_box_self_apply is true)
  ansible.builtin.include_tasks:
    file: self_apply_baseline.yml
    apply:
      tags: [wrappers, box_apply]
  when: agent_box_self_apply | bool
  tags: [wrappers, box_apply]
