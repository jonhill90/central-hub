---
# The off-box send's tools and scripts, installed by the box's own self-apply as well as the controller's run (tags: wrappers, not
# opnsense_offbox). They were in opnsense_offbox.yml, a controller-only tag the self-apply skips, so a change to
# opnsense-offbox.sh never reached the box and the first prod rebuild stopped at step 4 on the old copy.
# What stays controller-only (opnsense_offbox.yml): the settings, the box's certificate and its first upload.
# Included only when agent_box_opnsense_offbox is set. secrets-bundle-offbox.sh is installed with it, whatever the bundle's
# own offbox switch says: the script alone sends nothing (its units are gated by that switch), and rebuild-prod.sh runs it.

- name: Download restic, checked against its SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/restic/restic/releases/download/v{{ agent_box_restic_version }}/restic_{{ agent_box_restic_version }}_linux_amd64.bz2"
    dest: "{{ agent_box_libexec_dir }}/downloads/restic_{{ agent_box_restic_version }}.bz2"
    checksum: "sha256:{{ agent_box_restic_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: not (ansible_check_mode and agent_box_downloads_dir | default({}) is changed)

- name: Unpack restic {{ agent_box_restic_version }}
  ansible.builtin.shell:
    cmd: >-
      bunzip2 -c {{ agent_box_libexec_dir }}/downloads/restic_{{ agent_box_restic_version }}.bz2
      > {{ agent_box_libexec_dir }}/restic-{{ agent_box_restic_version }}.new &&
      chmod 0755 {{ agent_box_libexec_dir }}/restic-{{ agent_box_restic_version }}.new &&
      mv {{ agent_box_libexec_dir }}/restic-{{ agent_box_restic_version }}.new {{ agent_box_libexec_dir }}/restic-{{ agent_box_restic_version }}
    creates: "{{ agent_box_libexec_dir }}/restic-{{ agent_box_restic_version }}"
  when: not ansible_check_mode

- name: restic points at that version
  ansible.builtin.file:
    src: restic-{{ agent_box_restic_version }}
    dest: "{{ agent_box_libexec_dir }}/restic"
    state: link
    force: true
  when: not ansible_check_mode

- name: The off-box copy's script and the certificate script, root-owned
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ agent_box_libexec_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: opnsense-offbox.sh, dest: opnsense-offbox.sh}
    - {src: opnsense-escrow.py, dest: opnsense-escrow.py}
    - {src: host-escrow.sh, dest: host-escrow.sh}
    # The same script the c1 nodes run (pick 189), so one copy of the certificate code is tested and kept.
    - {src: "{{ role_path }}/../k8s_backup/files/c1-backup-azure-cert.py", dest: azure-cert.py}
  loop_control:
    label: "{{ agent_box_libexec_dir }}/{{ item.dest }}"

- name: The secrets bundle's off-box send script, root-owned
  ansible.builtin.copy:
    src: secrets-bundle-offbox.sh
    dest: "{{ agent_box_libexec_dir }}/secrets-bundle-offbox.sh"
    owner: root
    group: root
    mode: "0755"

# What box-prove and rebuild-prod.sh compare the installed scripts with (the two sends and the two escrow scripts they call):
# written from this role's own files in this same run, so a script left behind differs from it.
- name: The sha256 of the off-box scripts this role ships
  ansible.builtin.copy:
    content: |
      {{ lookup('ansible.builtin.file', 'opnsense-offbox.sh', rstrip=false) | hash('sha256') }}  opnsense-offbox.sh
      {{ lookup('ansible.builtin.file', 'secrets-bundle-offbox.sh', rstrip=false) | hash('sha256') }}  secrets-bundle-offbox.sh
      {{ lookup('ansible.builtin.file', 'host-escrow.sh', rstrip=false) | hash('sha256') }}  host-escrow.sh
      {{ lookup('ansible.builtin.file', 'opnsense-escrow.py', rstrip=false) | hash('sha256') }}  opnsense-escrow.py
    dest: "{{ agent_box_libexec_dir }}/backend-files.sha256"
    owner: root
    group: root
    mode: "0644"
