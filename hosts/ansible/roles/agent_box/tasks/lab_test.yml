---
# The lab-test wrapper's needs (docs/runbooks/build-the-lab-test-copy.md), unless agent_box_lab_test_enabled is false:
# proxmox-auto-install-assistant bakes the answer file into the Proxmox VE ISO, and it calls xorriso to do so
# (https://pve.proxmox.com/wiki/Automated_Installation, "Assistant Tool"). The assistant ships only as a Debian
# package. Its binary links glibc 2.39 or newer, libcrypt.so.1, libcrypto.so.3, libzstd.so.1 and libgcc_s.so.1
# (the package's Depends line and the binary's NEEDED entries, read 2026-11-18); AlmaLinux 10 has glibc 2.39,
# openssl-libs 3.5, libzstd 1.5.5 and libgcc 14, and libcrypt.so.1 comes from libxcrypt-compat in AppStream
# (repo.almalinux.org, read 2026-11-18). So the role takes the binary out of the pinned .deb and installs it here.
- name: lab_test | The settings are the role's default with the inventory's agent_box_lab_test over it
  ansible.builtin.set_fact:
    agent_box_lab_test_effective: "{{ agent_box_lab_test_default | combine(agent_box_lab_test) }}"

# hostvars holds the inventory's variables and not the role's defaults, so this tells the two apart.
- name: lab_test | Say where agent_box_lab_test came from
  ansible.builtin.debug:
    msg: >-
      {% if 'agent_box_lab_test' not in hostvars[inventory_hostname] -%}
      lab_test settings: agent_box_lab_test is not set in the inventory, so the role's default is used
      {%- elif agent_box_lab_test | length == 0 -%}
      lab_test settings: the inventory sets agent_box_lab_test to an empty value, so the role's default is used
      {%- else -%}
      lab_test settings: the inventory sets agent_box_lab_test ({{ agent_box_lab_test.keys() | sort | join(', ') }}) over the role's default
      {%- endif %}
      ; the Proxmox node name
      {{ 'comes from the inventory' if agent_box_lab_test_effective.proxmox_node_name is defined
      else 'is read from the API at run time' }}

- name: lab_test | Check the settings
  ansible.builtin.assert:
    that:
      - agent_box_lab_test_effective.address is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - agent_box_lab_test_effective.name is match('^[a-z][a-z0-9]{10,14}$')
      - agent_box_lab_test_effective.domain | default('') | length > 0
      - agent_box_lab_test_effective.memory_mb | int >= 7168
      - agent_box_lab_test_effective.disk_gb | int >= 32
      - agent_box_lab_test_effective.cores | int >= 2
    fail_msg: >-
      agent_box_lab_test needs name (STD-0001), domain, address (the copy's dev address), cores (2 or more),
      memory_mb (7168 or more) and disk_gb (32 or more); proxmox_node_name is optional (docs/specs/2026-11-lab-test-copy.md)

- name: lab_test | The ISO tool and the assistant's libcrypt.so.1
  ansible.builtin.package:
    name: [xorriso, libxcrypt-compat]
    state: present

- name: lab_test | Download proxmox-auto-install-assistant, checked against its SHA-256
  ansible.builtin.get_url:
    url: "{{ agent_box_pve_assistant_base }}/proxmox-auto-install-assistant_{{ agent_box_pve_assistant_version }}_amd64.deb"
    dest: "{{ agent_box_libexec_dir }}/downloads/proxmox-auto-install-assistant_{{ agent_box_pve_assistant_version }}_amd64.deb"
    checksum: "sha256:{{ agent_box_pve_assistant_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode or agent_box_downloads_dir is not changed

# A .deb is an ar archive that holds data.tar.xz; Python's standard library reads both, so no dpkg is needed.
- name: lab_test | Take the assistant's binary out of the package
  ansible.builtin.command:
    argv:
      - python3
      - -I
      - -c
      - |
        import io, sys, tarfile
        deb, out = sys.argv[1], sys.argv[2]
        with open(deb, "rb") as f:
            assert f.read(8) == b"!<arch>\n", "not an ar archive"
            while True:
                head = f.read(60)
                if len(head) < 60:
                    sys.exit("no data.tar.xz in " + deb)
                name, size = head[:16].decode().strip().rstrip("/"), int(head[48:58])
                body = f.read(size)
                f.read(size % 2)
                if name == "data.tar.xz":
                    break
        with tarfile.open(fileobj=io.BytesIO(body), mode="r:xz") as t:
            m = t.getmember("./usr/bin/proxmox-auto-install-assistant")
            data = t.extractfile(m).read()
        with open(out, "wb") as f:
            f.write(data)
      - "{{ agent_box_libexec_dir }}/downloads/proxmox-auto-install-assistant_{{ agent_box_pve_assistant_version }}_amd64.deb"
      - "{{ agent_box_libexec_dir }}/proxmox-auto-install-assistant-{{ agent_box_pve_assistant_version }}"
    creates: "{{ agent_box_libexec_dir }}/proxmox-auto-install-assistant-{{ agent_box_pve_assistant_version }}"
  when: not ansible_check_mode

- name: lab_test | The assistant's binary, root-owned
  ansible.builtin.file:
    path: "{{ agent_box_libexec_dir }}/proxmox-auto-install-assistant-{{ agent_box_pve_assistant_version }}"
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: lab_test | The wrapper calls the assistant by one name
  ansible.builtin.file:
    src: "{{ agent_box_libexec_dir }}/proxmox-auto-install-assistant-{{ agent_box_pve_assistant_version }}"
    dest: "{{ agent_box_libexec_dir }}/proxmox-auto-install-assistant"
    state: link
    force: true
  when: not ansible_check_mode

- name: lab_test | The wrapper's helper, root-owned
  ansible.builtin.copy:
    src: lab-test-answer.py
    dest: "{{ agent_box_libexec_dir }}/lab-test-answer.py"
    owner: root
    group: root
    mode: "0755"

- name: lab_test | The wrapper's serial-console driver, root-owned
  ansible.builtin.copy:
    src: lab-test-console.py
    dest: "{{ agent_box_libexec_dir }}/lab-test-console.py"
    owner: root
    group: root
    mode: "0755"

- name: lab_test | The WAN safety check's capture, run on the copy, root-owned
  ansible.builtin.copy:
    src: lab-test-wan-watch.py
    dest: "{{ agent_box_libexec_dir }}/lab-test-wan-watch.py"
    owner: root
    group: root
    mode: "0755"

# `lab-test signin` runs opnsense-test's prover against a throwaway Keycloak on this box, as `opnsense-test prove` does:
# podman, rootless as the keys user with its subordinate IDs, and opnsense-test's helpers. The same lines as
# tasks/opnsense_test.yml, so either role part leaves them the same. The proof's Keycloak listens on loopback only, so it
# needs no packet filter of its own.
- name: lab_test | Container tool for the sign-in proof's Keycloak
  ansible.builtin.package:
    name: podman
    state: present

- name: lab_test | The keys user's subordinate IDs, for rootless podman
  ansible.builtin.lineinfile:
    path: "/etc/{{ item }}"
    regexp: "^{{ agent_box_keys_user }}:"
    line: "{{ agent_box_keys_user }}:{{ agent_box_opnsense_test_subid_start }}:65536"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop: [subuid, subgid]
  loop_control:
    label: "/etc/{{ item }}"

- name: lab_test | opnsense-test's realm helper and prover, which signin shares, root-owned
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ agent_box_libexec_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [opnsense-test-seed.py, opnsense-test-prove.py]
  loop_control:
    label: "{{ agent_box_libexec_dir }}/{{ item }}"

- name: lab_test | The wrapper's private settings, from the default and the inventory (no keys)
  ansible.builtin.copy:
    dest: "{{ agent_box_work_dir }}/lab-test.json"
    content: "{{ agent_box_lab_test_effective | to_nice_json }}\n"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
