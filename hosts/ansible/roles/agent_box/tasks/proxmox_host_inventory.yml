---
# The Proxmox host job's inventory and the key's public half: a run from the controller only (tag
# proxmox_host_inventory, which self-applies skip). The inventory holds private values (D-0036 rule 7): the
# host's lifeline-side address, its public host key and the certificate's names. The public half of the box's key
# is fetched to the controller for the host's key line (playbooks/proxmox-host-key.yml).

- name: proxmox_host_inventory | The certificate's names, from the Proxmox host's own inventory entry
  ansible.builtin.set_fact:
    agent_box_host_cert_names: >-
      {{ (hostvars[groups['proxmox'][0]]['proxmox_cert_names'] | default([]))
         if (groups['proxmox'] | default([]) | length) > 0 else [] }}

- name: proxmox_host_inventory | The settings are complete
  ansible.builtin.assert:
    that:
      - agent_box_proxmox_host.address | default('') is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - agent_box_proxmox_host.hostkey | default('') is match('^ssh-ed25519 [A-Za-z0-9+/=]+$')
      - agent_box_host_cert_names | length > 0
      - >-
        agent_box_lifeline_allow | selectattr('address', 'equalto', agent_box_proxmox_host.address | default(''))
        | selectattr('uid', 'defined') | selectattr('uid', 'equalto', agent_box_host_user)
        | selectattr('ports', 'contains', 22) | list | length == 1
    fail_msg: >-
      agent_box_proxmox_host needs address and hostkey, the proxmox host needs proxmox_cert_names, and agent_box_lifeline_allow
      needs one entry for that address with ports [22] and uid {{ agent_box_host_user }}
    quiet: true

- name: proxmox_host_inventory | The host's public key, pinned
  ansible.builtin.copy:
    dest: "{{ agent_box_host_dir }}/known_hosts"
    content: "{{ agent_box_proxmox_host.address }} {{ agent_box_proxmox_host.hostkey }}\n"
    owner: "{{ agent_box_host_user }}"
    group: "{{ agent_box_host_user }}"
    mode: "0600"

- name: proxmox_host_inventory | The job's inventory
  ansible.builtin.template:
    src: proxmox-host-inventory.yml.j2
    dest: "{{ agent_box_host_dir }}/inventory/hosts.yml"
    owner: "{{ agent_box_host_user }}"
    group: "{{ agent_box_host_user }}"
    mode: "0600"

# The sso job's secret: one line of the controller's identity.env, in a file only the job's user reads. The
# controller's other client secrets stay out of the host job's folder. Never printed (no_log).
- name: proxmox_host_inventory | The sso settings are complete
  ansible.builtin.assert:
    that: agent_box_proxmox_host_sso.issuer | default('') is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?/realms/[A-Za-z0-9_-]+$')
    fail_msg: agent_box_proxmox_host_sso needs issuer, https://sso.<zone>/realms/lab
    quiet: true
  when: agent_box_proxmox_host_sso | length > 0

- name: proxmox_host_inventory | The proxmox client's secret line, from the controller's identity.env
  ansible.builtin.set_fact:
    agent_box_host_sso_line: >-
      {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') ~ '/.config/central-hub/identity.env').splitlines()
         | select('match', '^PROXMOX_CLIENT_SECRET=.{32,}$') | first | default('') }}
  no_log: true
  when: agent_box_proxmox_host_sso | length > 0

- name: proxmox_host_inventory | The secret is there
  ansible.builtin.assert:
    that: agent_box_host_sso_line | length > 0
    fail_msg: >-
      The controller's identity.env has no PROXMOX_CLIENT_SECRET line of 32 characters or more. Run
      playbooks/k8s-identity.yml --tags secrets first (docs/runbooks/sign-in-to-proxmox-through-keycloak.md step 2).
    quiet: true
  when: agent_box_proxmox_host_sso | length > 0

- name: proxmox_host_inventory | The sso job's secret file
  ansible.builtin.copy:
    dest: "{{ agent_box_host_dir }}/proxmox-sso.env"
    content: "{{ agent_box_host_sso_line }}\n"
    owner: "{{ agent_box_host_user }}"
    group: "{{ agent_box_host_user }}"
    mode: "0600"
  no_log: true
  when: agent_box_proxmox_host_sso | length > 0

# The firewall's sign-in (job opnsense-sso) needs no inventory value: Keycloak's issuer is derived from what the inventory already
# holds, as the identity role builds it (roles/k8s_identity/vars/main.yml: https://<name>.<zone>/realms/<realm>, with the role's
# defaults sso and lab and short names): the zone is the first plain one of k8s_identity_zone, k8s_gateway_zone on the first
# k8s_nodes host. agent_box_proxmox_host_opnsense_sso.issuer overrides it. With no zone and no override the job gets no setting.
- name: proxmox_host_inventory | Keycloak's issuer for the firewall's sign-in
  ansible.builtin.set_fact:
    agent_box_host_opnsense_issuer: >-
      {%- set __n = hostvars[groups['k8s_nodes'][0]] if (groups['k8s_nodes'] | default([]) | length) > 0 else {} -%}
      {%- set __zone = (__n.k8s_identity_zone | default('')) or (__n.k8s_gateway_zone | default('')) -%}
      {{ agent_box_proxmox_host_opnsense_sso.issuer
         | default(('https://' ~ (__n.k8s_identity_name | default('sso')) ~ '.' ~ __zone ~ '/realms/' ~ (__n.k8s_identity_realm | default('lab')))
                   if __zone | length > 0 else '') }}

- name: proxmox_host_inventory | The opnsense-sso settings are complete
  ansible.builtin.assert:
    that: agent_box_host_opnsense_issuer is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?/realms/[A-Za-z0-9_-]+$')
    fail_msg: >-
      agent_box_proxmox_host_opnsense_sso.issuer is set but is not https://sso.<zone>/realms/lab
    quiet: true
  when: agent_box_host_opnsense_issuer | length > 0

# The client's secret is not written here: the job's own run asks the keys user's opnsense-sso-secret wrapper for it (the box's
# prod identity.env holds it, made by c1-ansible's identity-values), so nothing needs the Mac.

- name: proxmox_host_inventory | Read the key's public half
  ansible.builtin.slurp:
    src: "{{ agent_box_host_dir }}/id_ed25519.pub"
  register: agent_box_host_pubkey

- name: proxmox_host_inventory | Save the public half on the controller, for the host's key line
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../inventories/home/id_ed25519-proxmox-host.pub"   # git-ignored (id_ed25519*)
    content: "{{ agent_box_host_pubkey.content | b64decode }}"
    mode: "0644"
  delegate_to: localhost
  become: false
