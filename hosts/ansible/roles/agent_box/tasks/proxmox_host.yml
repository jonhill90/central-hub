---
# The Proxmox host job (wrapper proxmox-host; Library plans/r1-host-job/DESIGN.md v3.1). Its own user, its own
# folders and the key that logs in to the Proxmox host as root. Everything here is a box limit (D-0036 rule 3 (c)
# and (d)). The key is made only when agent_box_proxmox_host_job is true, the owner's tap (D-0042 rule 6).

- name: proxmox_host | The job's user, a system user that can't log in and has no other groups than the handoff group
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    shell: /sbin/nologin
    home: "{{ agent_box_host_work_dir }}"
    create_home: false
    groups: "{{ agent_box_devaddr_group }}"   # only the handoff group, which carries one private address
    append: false
  # One item, so that a check run names the user in the result (box-apply reads it from the loop label).
  loop: ["{{ agent_box_host_user }}"]
  loop_control:
    label: "{{ item }}"
  register: box_host_user_res
  # In a check run the group task above reports changed but does not create the group, so this task would fail
  # with "Group ... does not exist" for a group the real run creates first. That one message, in a check run
  # only, counts as a change; any other failure still fails.
  failed_when: >-
    box_host_user_res.failed | default(false)
    and not (ansible_check_mode and ('Group ' ~ agent_box_devaddr_group ~ ' does not exist') in (box_host_user_res.msg | default('')))
  changed_when: >-
    box_host_user_res.changed | default(false)
    or (box_host_user_res.failed | default(false) and ansible_check_mode
    and ('Group ' ~ agent_box_devaddr_group ~ ' does not exist') in (box_host_user_res.msg | default('')))

- name: proxmox_host | The folder where it publishes the host's public host key, for the keys user to read through the handoff group
  ansible.builtin.file:
    path: "{{ agent_box_hostkey_dir }}"
    state: directory
    owner: "{{ agent_box_host_user }}"
    group: "{{ agent_box_devaddr_group }}"
    mode: "2750"   # setgid: what the job writes there gets the devaddr group, so the keys user can read it

- name: proxmox_host | Its key folder and its work folder, its own only
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agent_box_host_user }}"
    group: "{{ agent_box_host_user }}"
    mode: "0700"
  loop:
    - "{{ agent_box_host_dir }}"
    - "{{ agent_box_host_dir }}/inventory"
    - "{{ agent_box_host_work_dir }}"

# Made on the box as the job's user; the private half never leaves it. A key already there is kept. A check run
# before the install has no such user yet, and become to a missing user fails even in check mode, so a check skips it.
- name: proxmox_host | The host key, ed25519 (only when the job is switched on)
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N '' -C central-hub-r1 -f {{ (agent_box_host_dir ~ '/id_ed25519') | quote }}
    creates: "{{ agent_box_host_dir }}/id_ed25519"
  become: true
  become_user: "{{ agent_box_host_user }}"
  when: agent_box_proxmox_host_job | bool and not ansible_check_mode
