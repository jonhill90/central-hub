---
# Copy the controller's private lab files onto the agent box, into {{ agent_box_keys_dir }}/prod
# (owner {{ agent_box_keys_user }}, folders 0700, files 0600), so agents can rebuild the lab with no
# Mac in the loop (D-0035). Only runs when `agent_box_copy_prod_files` is true. A file the controller lacks is
# skipped and named; no content is ever printed (no_log). Left out on purpose: the Proxmox
# apply token, the Cloudflare bootstrap token and the nodes' SSH keys.

- name: Name the controller's folders
  ansible.builtin.set_fact:
    agent_box_pf_clone: "{{ agent_box_prod_files_clone if agent_box_prod_files_clone | length > 0 else playbook_dir ~ '/../../..' }}"
    agent_box_pf_config: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/central-hub"
    agent_box_pf_state: "{{ lookup('ansible.builtin.env', 'HOME') }}/.local/state/central-hub"

- name: Prod folders on the box, the keys user's
  ansible.builtin.file:
    path: "{{ agent_box_keys_dir }}/{{ item }}"
    state: directory
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0700"
  loop: [prod, prod/state, prod/tfvars, prod/identity-theme, prod/lab-ca]

# The OpenTofu state files: the box's runs (rebuild-prod) change prod's state on the box, so the controller's copy goes
# stale after one. Before anything is copied, each state file the box already holds is compared with the controller's
# by OpenTofu's own marks: the same lineage, and a serial no higher than the controller's. Otherwise the run stops,
# naming the file and both serials, and nothing is copied: a copy would put back an older state over the box's and the
# next run would plan from it. Take the box's state to the controller first (rebuild-k8s-layer-with-one-command.md).
- name: Find the controller's OpenTofu state files
  ansible.builtin.find:
    paths: "{{ agent_box_pf_state }}"
    patterns: "*.tfstate"
  delegate_to: localhost
  become: false
  register: agent_box_pf_tfstates

- name: Look for the box's copy of each state file
  ansible.builtin.stat:
    path: "{{ agent_box_keys_dir }}/prod/state/{{ item.path | basename }}"
    get_checksum: false
  loop: "{{ agent_box_pf_tfstates.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: agent_box_pf_box_stats

- name: Read the box's copies that exist
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ agent_box_pf_box_stats.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.stat.path | basename }}"
  register: agent_box_pf_box_reads
  no_log: true

- name: Pair each box copy's lineage and serial with the controller's (names and marks only)
  ansible.builtin.set_fact:
    agent_box_pf_ages: >-
      {{ agent_box_pf_names | zip(agent_box_pf_box_json | map(attribute='lineage', default=''),
                                  agent_box_pf_box_json | map(attribute='serial', default=0),
                                  agent_box_pf_ctl_json | map(attribute='lineage', default=''),
                                  agent_box_pf_ctl_json | map(attribute='serial', default=0)) | list }}
  vars:
    agent_box_pf_names: "{{ agent_box_pf_box_reads.results | map(attribute='item.item.path') | map('basename') | list }}"
    agent_box_pf_box_json: "{{ agent_box_pf_box_reads.results | map(attribute='content') | map('b64decode') | map('from_json') | list }}"
    agent_box_pf_ctl_json: >-
      {{ (query('ansible.builtin.file', *(agent_box_pf_box_reads.results | map(attribute='item.item.path') | list))
          if agent_box_pf_box_reads.results | length > 0 else []) | map('from_json') | list }}
  no_log: true

- name: Refuse a controller state older than the box's, or another state under the same name
  ansible.builtin.fail:
    msg: >-
      prod files: nothing copied. {{ item[0] }}:
      {{ 'the box holds another state (another lineage) than the controller'
         if item[1] != item[3] else
         'the box is at serial ' ~ item[2] ~ ' and the controller at ' ~ item[4] ~ ', so the controller copy is older' }}.
      Take the box's state to the controller first.
  loop: "{{ agent_box_pf_ages }}"
  loop_control:
    label: "{{ item[0] }}"
  when: item[1] != item[3] or (item[2] | int) > (item[4] | int)

- name: Look for each file on the controller
  ansible.builtin.stat:
    path: "{{ agent_box_pf_clone if item.from == 'clone' else agent_box_pf_config }}/{{ item.path }}"
  delegate_to: localhost
  become: false
  loop: "{{ agent_box_prod_files }}"
  loop_control:
    label: "{{ item.dest }}"
  register: agent_box_pf_stats

- name: Copy the files that exist
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ agent_box_keys_dir }}/prod/{{ item.item.dest }}"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  loop: "{{ agent_box_pf_stats.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ agent_box_keys_dir }}/prod/{{ item.item.dest }}"
  no_log: true

- name: Copy the state files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ agent_box_keys_dir }}/prod/state/{{ item.path | basename }}"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
  loop: "{{ agent_box_pf_tfstates.files }}"
  loop_control:
    label: "{{ agent_box_keys_dir }}/prod/state/{{ item.path | basename }}"
  no_log: true

# The sign-in theme folder (c1-ansible reads it as k8s_identity_theme_dir, remapped to <keys>/prod/identity-theme/<its name>):
# copied whole, so the branded files stay on prod when the box runs the identity playbook. Only when the inventory names it
# (agent_box_prod_theme_src, a path on the controller); no content is printed.
- name: The sign-in theme folder on the controller
  ansible.builtin.stat:
    path: "{{ agent_box_prod_theme_src }}/login/theme.properties"
  delegate_to: localhost
  become: false
  register: agent_box_pf_theme
  when: agent_box_prod_theme_src | length > 0

- name: Copy the sign-in theme folder
  ansible.builtin.copy:
    src: "{{ agent_box_prod_theme_src | regex_replace('/+$', '') }}/"
    dest: "{{ agent_box_keys_dir }}/prod/identity-theme/{{ agent_box_prod_theme_src | regex_replace('/+$', '') | basename }}"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"
    directory_mode: "0700"
  when: agent_box_prod_theme_src | length > 0 and agent_box_pf_theme.stat.exists | default(false)
  no_log: true

- name: Say which files were copied and which were missing (names only)
  ansible.builtin.debug:
    msg:
      copied: "{{ agent_box_pf_stats.results | selectattr('stat.exists') | map(attribute='item.dest') | list }}"
      missing: "{{ agent_box_pf_stats.results | rejectattr('stat.exists') | map(attribute='item.dest') | list }}"
      state_files: "{{ agent_box_pf_tfstates.files | map(attribute='path') | map('basename') | list }}"
