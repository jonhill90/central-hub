---
# The box's second NIC sits on the Proxmox host's own subnet (hosts/terraform/home/jumpbox, variable
# lifeline), so the box keeps its route to the Proxmox API when OPNsense is gone. That subnet is the
# home LAN, so it is closed both ways (least privilege) by one nftables table, `inet lifeline`, which
# touches that NIC only (the box runs no firewalld, and turning it on would change the whole box's
# inbound posture, tailscale0 included: the owner's pick, 2026-11-14):
#   input:   drop everything on the NIC except replies to the box's own connections;
#   output:  accept only the addresses and TCP ports in agent_box_lifeline_allow and replies, reject the rest;
#   forward: drop anything to or from the NIC.
# A root-owned unit, lifeline-nft.service, loads it before NetworkManager starts, so the NIC is never up
# unfiltered, at the first apply or after a reboot.
# This role owns the NIC's one NetworkManager connection, `lifeline`: a static address, no gateway, never
# a default route, no DNS, no IPv6, autoconnect off
# (lifeline-up.service, which requires the filter unit, brings it up). cloud-init's network config applies only at first boot,
# so a NIC added to a running VM would otherwise come up on DHCP (measured on the first apply,
# 2026-11-14). `connection up` also brings the link up, and runs last: the order is the filter, the
# lifeline profile, deleting the stale profiles, managed yes, then up, so no leftover DHCP profile ever
# autoconnects. Other profiles on the NIC, such as "Wired connection 1", are deleted.
# Only runs when agent_box_lifeline_interface is set.

- name: lifeline | The allowed destinations are plain IPv4 addresses and TCP ports
  ansible.builtin.assert:
    that:
      - item.address is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - item.ports | length > 0
      - item.ports | map('string') | select('match', '^[0-9]{1,5}$') | list | length == item.ports | length
    fail_msg: "agent_box_lifeline_allow entries need an IPv4 address and a list of TCP ports"
    quiet: true
  loop: "{{ agent_box_lifeline_allow }}"

- name: lifeline | The lifeline address is an IPv4 address with a prefix
  ansible.builtin.assert:
    that: agent_box_lifeline_address is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
    fail_msg: "agent_box_lifeline_address must be the box's address and prefix on the host's subnet, for example 192.0.2.50/24"
    quiet: true

# The filter is loaded BEFORE anything brings the link up, so a failure here leaves the NIC down, never open.
- name: lifeline | The installed packages
  ansible.builtin.package_facts:
    manager: rpm

- name: lifeline | nftables is installed, at the pinned version, only if it was missing
  ansible.builtin.dnf:
    name: "nftables-{{ agent_box_nftables_version }}"
    state: present
  when: "'nftables' not in ansible_facts.packages"

- name: lifeline | Folder for the filter
  ansible.builtin.file:
    path: /etc/nftables
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: lifeline | The filter lists only the allowed destinations
  ansible.builtin.template:
    src: lifeline.nft.j2
    dest: /etc/nftables/lifeline.nft
    owner: root
    group: root
    mode: "0600"
    validate: "{{ agent_box_nft_bin }} -c -f %s"
  notify: Reload the lifeline filter

- name: lifeline | The unit that loads the filter before the network
  ansible.builtin.template:
    src: lifeline-nft.service.j2
    dest: /etc/systemd/system/lifeline-nft.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload the lifeline filter

- name: lifeline | The unit that brings the NIC up only behind the filter
  ansible.builtin.template:
    src: lifeline-up.service.j2
    dest: /etc/systemd/system/lifeline-up.service
    owner: root
    group: root
    mode: "0644"

# The distro's nftables.service runs `flush ruleset` on stop and reload, which would take this table (and
# tailscale's) with it. Nothing on the box uses it, so it is masked, not just left disabled.
- name: lifeline | The distro nftables service is masked
  ansible.builtin.systemd_service:
    name: nftables.service
    masked: true
    enabled: false

- name: lifeline | The units are enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: [lifeline-nft.service, lifeline-up.service]

- name: lifeline | Load the filter now
  ansible.builtin.meta: flush_handlers

- name: lifeline | The filter is loaded
  ansible.builtin.systemd_service:
    name: lifeline-nft.service
    state: started

- name: lifeline | The firewalld policy a first attempt wrote is removed
  ansible.builtin.file:
    path: /etc/firewalld/policies/lifeline-egress.xml
    state: absent

- name: lifeline | Its folders are removed when they are empty
  ansible.builtin.command: rmdir /etc/firewalld/policies /etc/firewalld
  register: agent_box_lifeline_rmdir
  changed_when: agent_box_lifeline_rmdir.rc == 0
  failed_when: false

- name: lifeline | The connection's settings now, in a fixed order
  ansible.builtin.command: >-
    nmcli -g ipv4.method,ipv4.addresses,ipv4.gateway,ipv4.never-default,ipv4.dns,ipv4.ignore-auto-dns,ipv6.method,
    connection.autoconnect,connection.interface-name connection show lifeline
  register: agent_box_lifeline_nm_now
  changed_when: false
  failed_when: false
  check_mode: false

- name: lifeline | The connection is made once
  ansible.builtin.command: >-
    nmcli connection add type ethernet con-name lifeline ifname {{ agent_box_lifeline_interface | quote }}
    ipv4.method manual ipv4.addresses {{ agent_box_lifeline_address | quote }}
  when: agent_box_lifeline_nm_now.rc != 0
  changed_when: true

- name: lifeline | The connection is static, never the default route, without DNS or IPv6
  ansible.builtin.command: >-
    nmcli connection modify lifeline
    ipv4.method manual ipv4.addresses {{ agent_box_lifeline_address | quote }} ipv4.gateway ""
    ipv4.never-default yes ipv4.dns "" ipv4.ignore-auto-dns yes ipv6.method disabled
    connection.autoconnect no connection.interface-name {{ agent_box_lifeline_interface | quote }}
  when: agent_box_lifeline_nm_now.rc != 0 or (agent_box_lifeline_nm_now.stdout_lines | default([]) != agent_box_lifeline_wanted)
  vars:
    # nmcli -g prints one value per line, in the order asked; an empty value is an empty line.
    agent_box_lifeline_wanted:
      - manual
      - "{{ agent_box_lifeline_address }}"
      - ""
      - "yes"
      - ""
      - "yes"
      - disabled
      - "no"
      - "{{ agent_box_lifeline_interface }}"
  register: agent_box_lifeline_nm_modified
  changed_when: true

# A profile is stale if it is active on this NIC, or if it is a leftover "Wired connection 1" that is bound to
# this NIC or to no NIC at all. A profile bound to another NIC (the primary's) is never touched.
- name: lifeline | Other profiles for this NIC
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      nic={{ agent_box_lifeline_interface | quote }}
      nmcli -t -f NAME,DEVICE connection show | while IFS=: read -r name device; do
        [ "$name" = lifeline ] && continue
        bound=$(nmcli -g connection.interface-name connection show "$name")
        if [ "$device" = "$nic" ]; then
          echo "$name"
        elif [ "$name" = "Wired connection 1" ] && [ -z "$device" ] && { [ -z "$bound" ] || [ "$bound" = "$nic" ]; }; then
          echo "$name"
        fi
      done
    executable: /bin/bash
  register: agent_box_lifeline_stale
  changed_when: false
  check_mode: false

- name: lifeline | The other profiles are deleted
  ansible.builtin.command: nmcli connection delete {{ item | quote }}
  loop: "{{ agent_box_lifeline_stale.stdout_lines }}"
  changed_when: true

- name: lifeline | Whether NetworkManager manages the NIC
  ansible.builtin.command: nmcli -g GENERAL.NM-MANAGED device show {{ agent_box_lifeline_interface | quote }}
  register: agent_box_lifeline_managed
  changed_when: false
  check_mode: false

- name: lifeline | The NIC is managed by NetworkManager (a containment may have set it unmanaged)
  ansible.builtin.command: nmcli device set {{ agent_box_lifeline_interface | quote }} managed yes
  when: agent_box_lifeline_managed.stdout | trim != 'yes'
  changed_when: true

- name: lifeline | The connection is up on the NIC
  ansible.builtin.command: nmcli connection up lifeline
  when: agent_box_lifeline_nm_now.rc != 0 or agent_box_lifeline_nm_modified is changed or agent_box_lifeline_stale.stdout_lines | length > 0
  changed_when: true

# From here the up unit owns the link: it needs the filter unit, so a stopped or failed filter takes the NIC down.
- name: lifeline | The unit that holds the NIC up behind the filter is running
  ansible.builtin.systemd_service:
    name: lifeline-up.service
    state: started

# The proof: what the owner's pick 220 promises, measured on the box after the run.
- name: lifeline | The filter as nftables reports it
  ansible.builtin.command: "{{ agent_box_nft_bin }} list table inet lifeline"
  register: agent_box_lifeline_table
  changed_when: false
  check_mode: false

- name: lifeline | Default routes on the NIC
  ansible.builtin.shell:
    cmd: awk -v dev={{ agent_box_lifeline_interface | quote }} '$1 == dev && $2 == "00000000"' /proc/net/route
  register: agent_box_lifeline_default_route
  changed_when: false
  check_mode: false

- name: lifeline | No default route over the NIC, and the filter drops, rejects and forwards nothing else
  ansible.builtin.assert:
    that:
      - agent_box_lifeline_default_route.stdout | trim | length == 0
      - agent_box_lifeline_table.stdout is search('iifname "' ~ agent_box_lifeline_interface ~ '" drop')
      - agent_box_lifeline_table.stdout is search('oifname "' ~ agent_box_lifeline_interface ~ '" reject')
      - agent_box_lifeline_table.stdout is search('oifname "' ~ agent_box_lifeline_interface ~ '" drop')
      - >-
        agent_box_lifeline_table.stdout_lines | select('search', 'ip daddr') | list | length
        == (agent_box_lifeline_allow | map(attribute='ports') | map('length') | sum)
    fail_msg: >-
      the lifeline is not closed as picked: a default route over it, a missing drop or reject, or a filter
      that allows more or less than agent_box_lifeline_allow
    quiet: true

- name: lifeline | Each allowed destination is in the filter
  ansible.builtin.assert:
    that:
      - agent_box_lifeline_table.stdout is search('ip daddr ' ~ item.0.address ~ ' tcp dport ' ~ item.1 ~ ' accept')
    fail_msg: "{{ item.0.address }}:{{ item.1 }} is not in the lifeline filter"
    quiet: true
  loop: "{{ agent_box_lifeline_allow | subelements('ports') }}"

- name: lifeline | Both units are active
  ansible.builtin.command: systemctl is-active lifeline-nft.service lifeline-up.service  # noqa: command-instead-of-module
  register: agent_box_lifeline_active
  changed_when: false
  check_mode: false
