---
# The box's second NIC sits on the Proxmox host's own subnet (hosts/terraform/home/jumpbox, variable
# lifeline), so the box keeps its route to the Proxmox API when OPNsense is gone. That subnet is the
# home LAN, so it is closed both ways (least privilege):
#   inbound:  the interface is in firewalld's `drop` zone, which accepts no inbound connection;
#   outbound: a firewalld policy from the box itself (HOST) to that zone accepts only the addresses and
#             TCP ports in agent_box_lifeline_allow and rejects everything else, so a connected route
#             does not let a session reach other home LAN devices.
# The zone is also set on the NetworkManager connection, because NetworkManager puts an interface back
# into its own zone whenever it reconnects. Only runs when agent_box_lifeline_interface is set.

- name: lifeline | The allowed destinations are plain IPv4 addresses and TCP ports
  ansible.builtin.assert:
    that:
      - item.address is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - item.ports | length > 0
      - item.ports | map('string') | select('match', '^[0-9]{1,5}$') | list | length == item.ports | length
    fail_msg: "agent_box_lifeline_allow entries need an IPv4 address and a list of TCP ports"
    quiet: true
  loop: "{{ agent_box_lifeline_allow }}"

- name: lifeline | Which NetworkManager connection owns the interface
  ansible.builtin.command: nmcli -g GENERAL.CONNECTION device show {{ agent_box_lifeline_interface | quote }}
  register: agent_box_lifeline_connection
  changed_when: false
  check_mode: false

- name: lifeline | The interface has a NetworkManager connection
  ansible.builtin.assert:
    that: agent_box_lifeline_connection.stdout | trim | length > 0
    fail_msg: "{{ agent_box_lifeline_interface }} has no NetworkManager connection: is the NIC up?"
    quiet: true

- name: lifeline | The connection's zone now
  ansible.builtin.command: nmcli -g connection.zone connection show {{ agent_box_lifeline_connection.stdout | trim | quote }}
  register: agent_box_lifeline_nm_zone
  changed_when: false
  check_mode: false

- name: lifeline | The connection is in the drop zone (kept across reconnects and reboots)
  ansible.builtin.command: nmcli connection modify {{ agent_box_lifeline_connection.stdout | trim | quote }} connection.zone drop
  when: agent_box_lifeline_nm_zone.stdout | trim != 'drop'
  changed_when: true

- name: lifeline | The outbound policy lists only the allowed destinations
  ansible.builtin.template:
    src: firewalld-lifeline-egress.xml.j2
    dest: /etc/firewalld/policies/lifeline-egress.xml
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld

- name: lifeline | Apply the policy now
  ansible.builtin.meta: flush_handlers

- name: lifeline | The interface is in the drop zone now
  ansible.posix.firewalld:
    zone: drop
    interface: "{{ agent_box_lifeline_interface }}"
    permanent: true
    immediate: true
    state: enabled
