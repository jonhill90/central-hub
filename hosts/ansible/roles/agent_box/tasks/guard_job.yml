---
# The guard jobs (D-0063): their own user and folders. Everything here is a box limit (D-0036 rule 3 (c) and (d)).
# The role writes no key here; guard_files.yml copies them from the controller.

- name: guard_job | The jobs' user, a system user that can't log in and has no other groups than the handoff group
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    shell: /sbin/nologin
    home: "{{ agent_box_guard_work_dir }}"
    create_home: false
    groups: "{{ agent_box_devaddr_group }}"   # only the handoff group, which carries one private address
    append: false
  # One item, so that a check run names the user in the result (box-apply reads it from the loop label).
  loop: ["{{ agent_box_guard_user }}"]
  loop_control:
    label: "{{ item }}"
  register: box_guard_user_res
  # In a check run the group task above reports changed but does not create the group, so this task would fail
  # with "Group ... does not exist" for a group the real run creates first. That one message, in a check run
  # only, counts as a change; any other failure still fails.
  failed_when: >-
    box_guard_user_res.failed | default(false)
    and not (ansible_check_mode and ('Group ' ~ agent_box_devaddr_group ~ ' does not exist') in (box_guard_user_res.msg | default('')))
  changed_when: >-
    box_guard_user_res.changed | default(false)
    or (box_guard_user_res.failed | default(false) and ansible_check_mode
    and ('Group ' ~ agent_box_devaddr_group ~ ' does not exist') in (box_guard_user_res.msg | default('')))

- name: guard_job | Its key folder and its work folder, its own only
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agent_box_guard_user }}"
    group: "{{ agent_box_guard_user }}"
    mode: "0700"
  loop:
    - "{{ agent_box_guard_dir }}"
    - "{{ agent_box_guard_dir }}/inventory"
    - "{{ agent_box_guard_work_dir }}"
