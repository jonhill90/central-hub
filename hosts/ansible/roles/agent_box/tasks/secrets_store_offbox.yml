---
# The dev secrets store's hourly snapshot off the box (pick 237, proposed D-0038 rule 8): a script and an hourly timer
# as the keys user. It reuses pick 222's settings, sign-in, container, restic password and vault, in a repository of
# its own, and the secrets-store wrapper's snapshot step. Included only when both of those are set up.

- name: The snapshot send's settings hold
  ansible.builtin.assert:
    that:
      - agent_box_secrets_store_offbox.repository is match('^azure:[a-z0-9-]+:/[A-Za-z0-9._-]+$')
      - (agent_box_secrets_store_offbox.repository | regex_replace('/$', '')) != __opnsense_repo
      - not (agent_box_secrets_store_offbox.repository | regex_replace('/$', '')).startswith(__opnsense_repo + '/')
      - not __opnsense_repo.startswith((agent_box_secrets_store_offbox.repository | regex_replace('/$', '')) + '/')
      - agent_box_secrets_store_offbox.keep_hourly | int >= 1
      - agent_box_secrets_store_offbox.keep_daily | int >= 0
      - agent_box_secrets_store_offbox.keep_monthly | int >= 0
      - agent_box_secrets_store_offbox.prune_after_hour | int >= 0
      - agent_box_secrets_store_offbox.prune_after_hour | int <= 23
    fail_msg: >-
      agent_box_secrets_store_offbox needs repository (azure:<container>:/<path>, not the OPNsense repository, nor inside it),
      keep_hourly at least 1, keep_daily, keep_monthly, and prune_after_hour 0-23.
    quiet: true
  vars:
    __opnsense_repo: "{{ agent_box_opnsense_offbox.repository | default('azure:opnsense-backup:/opnsense') | regex_replace('/$', '') }}"

- name: The snapshot send's script, root-owned
  ansible.builtin.copy:
    src: secrets-store-offbox.sh
    dest: "{{ agent_box_libexec_dir }}/secrets-store-offbox.sh"
    owner: root
    group: root
    mode: "0755"

- name: The snapshot send's settings (no secret in them)
  ansible.builtin.template:
    src: secrets-store-offbox.env.j2
    dest: "{{ agent_box_work_dir }}/secrets-store-offbox.env"
    owner: "{{ agent_box_keys_user }}"
    group: "{{ agent_box_keys_user }}"
    mode: "0600"

- name: The snapshot send's units
  ansible.builtin.template:
    src: "secrets-store-offbox.{{ item }}.j2"
    dest: "/etc/systemd/system/secrets-store-offbox.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: agent_box_store_offbox_units

- name: The snapshot send's timer runs
  ansible.builtin.systemd_service:
    name: secrets-store-offbox.timer
    enabled: true
    state: started
    daemon_reload: "{{ agent_box_store_offbox_units is changed }}"
  when: not (ansible_check_mode and agent_box_store_offbox_units is changed)
