---
# Inputs of the agent_box role. The check is tagged always, so it runs with any --tags.
argument_specs:
  main:
    short_description: Users, key folder, key wrappers, sudoers and Claude Code managed settings on the agent box
    options:
      # Required, private (a real machine name), through the inventory.
      agent_box_hostname:
        type: str
        required: true
        description: >-
          The box's OS hostname by STD-0001, for example daldtdemo01 (made up). Proxmox shows the
          VM under this name too, so the VM's name in OpenTofu must match it.
      agent_box_user: {type: str, default: claude, description: The user that runs Claude Code sessions.}
      agent_box_keys_user: {type: str, default: keys, description: The user that owns the lab keys.}
      agent_box_runner_user:
        type: str
        default: ""
        description: >-
          The user the GitHub Actions runner runs as; sudo only for wrappers marked runner: true.
          Empty does nothing.
      agent_box_keys_dir: {type: path, default: /etc/agent-keys, description: "Key folder, owned by the keys user, mode 0700; every file in it 0600."}
      agent_box_work_dir: {type: path, default: /var/lib/agent-box, description: "The keys user's home: the central-hub checkout, tofu state and data."}
      agent_box_libexec_dir: {type: path, default: /usr/local/libexec/agent-box, description: Where the root-owned wrappers go.}
      agent_box_front_dir: {type: path, default: /usr/local/bin, description: Where the front scripts sessions run go.}
      agent_box_repo_url: {type: str, description: The public central-hub repository the wrappers run from.}
      agent_box_wrappers:
        type: list
        elements: dict
        description: One entry per wrapper; files/<name>.sh must exist in the role.
        options:
          name: {type: str, required: true, description: Wrapper name.}
          args: {type: list, elements: str, required: true, description: The only first arguments sudo allows.}
          session_args:
            type: list
            elements: str
            required: false
            description: >-
              The first arguments the session user may run, when that is fewer than args (the runner user gets args).
              An empty list gives the session user no line. Default: args. D-0041 uses it so only the workflow can run an apply.
          runner: {type: bool, required: false, default: false, description: "Also let the runner user run it (agent_box_runner_user)."}
      agent_box_tofu_version: {type: str, description: OpenTofu version for the wrappers.}
      agent_box_tofu_sha256: {type: str, description: SHA-256 of the linux_amd64 zip of that version.}
      agent_box_kubectl_version: {type: str, description: "kubectl version for the c1-read wrapper, the one c1 runs."}
      agent_box_kubectl_sha256: {type: str, description: SHA-256 of that version's linux amd64 kubectl.}
      agent_box_ansible_core_version: {type: str, description: ansible-core version in the rebuild wrapper's virtual environment.}
      agent_box_httpx_version: {type: str, description: httpx version in that environment (the OPNsense modules need it).}
      agent_box_tailscale_version: {type: str, description: Tailscale client version.}
      agent_box_rhel_major: {type: int, description: "RHEL-family major version, for the Tailscale repository path."}
      agent_box_deny: {type: list, elements: str, description: permissions.deny in the managed settings.}
      agent_box_allow: {type: list, elements: str, default: [], description: permissions.allow in the managed settings; private.}
      agent_box_auto_mode: {type: dict, default: {}, description: The autoMode block in the managed settings; private.}
      agent_box_ca_files:
        type: list
        elements: path
        default: []
        description: "Absolute paths of public CA certificate files on the controller (no folders, no patterns, no keys), each trusted on the box; private."
      agent_box_tls_check_url: {type: str, default: "", description: "HTTPS URL the verify tag fetches with certificate checks on; private; empty skips it."}
      agent_box_managed_settings_extra: {type: dict, default: {}, description: "Other top-level managed settings, merged over the rest."}
      agent_box_opnsense_backup:
        type: dict
        default: {}
        description: >-
          Private. host (OPNsense's name or address) and keep (copies kept, 3 to 60, default 14) for the daily
          configuration backup on the box. Empty does nothing.
      agent_box_opnsense_backup_daily: {type: str, default: "*-*-* 14:30:00 UTC", description: "systemd OnCalendar for the daily OPNsense backup."}
      agent_box_opnsense_offbox:
        type: dict
        default: {}
        description: >-
          Private. account, client_id, tenant_id, app_object_id and vault_url (tofu outputs of hosts/terraform/azure/backup)
          and, optionally, repository, vault_secret, keep_daily (default 30) and keep_monthly (default 12) for the daily
          off-box copy of the OPNsense backups (pick 222). Needs agent_box_opnsense_backup. Empty does nothing.
      agent_box_opnsense_offbox_daily: {type: str, default: "*-*-* 15:00:00 UTC", description: "systemd OnCalendar for the daily off-box copy."}
      agent_box_opnsense_offbox_cert_days: {type: int, default: 90, description: "Days the box's certificate for the copy app is valid."}
      agent_box_opnsense_offbox_cert_renew_days: {type: int, default: 30, description: "Days left when the daily run rolls that certificate."}
      agent_box_az: {type: str, default: az, description: "The Azure CLI on the controller, signed in as agent-azure, for the first certificate upload."}
      agent_box_restic_version: {type: str, description: "restic version for the off-box copy."}
      agent_box_restic_sha256: {type: str, description: "SHA-256 of that version's linux_amd64 .bz2."}
      agent_box_lifeline_interface:
        type: str
        default: ""
        description: >-
          The box's lifeline NIC inside the VM (for example eth1), packet-filtered by the role's
          nftables table (inbound dropped, outbound only agent_box_lifeline_allow). Private. Empty does nothing.
      agent_box_nftables_version:
        type: str
        default: "1:1.1.5-6.el10_2"
        description: The nftables package version (epoch:version-release) installed only if the package is missing.
      agent_box_nft_bin:
        type: path
        default: /usr/sbin/nft
        description: The nft binary the lifeline filter unit and the proof use.
      agent_box_lifeline_address:
        type: str
        default: ""
        description: >-
          Private. The box's IPv4 address and prefix on the lifeline NIC (for example 192.0.2.50/24).
          Required when the interface is set; the role owns the NIC's NetworkManager connection.
      agent_box_lifeline_allow:
        type: list
        elements: dict
        default: []
        description: >-
          Private. What the box may reach over the lifeline NIC, the rest is rejected: entries of
          address (IPv4) and ports (TCP ports), normally the Proxmox host and 8006.
        options:
          address: {type: str, required: true, description: "IPv4 address."}
          ports: {type: list, elements: int, required: true, description: "TCP ports."}
      agent_box_copy_prod_files:
        type: bool
        default: false
        description: >-
          Copy the controller's private lab files to the box in this run (the prod_files tasks).
          Off by default.
      agent_box_prod_files_clone:
        type: str
        default: ""
        description: >-
          Absolute path on the controller of its private clone of this repo, where the git-ignored files
          are. Private, through the inventory. Empty means the checkout the playbook runs from.
      agent_box_self_apply:
        type: bool
        default: false
        description: >-
          Install box-apply and its one sudo line (D-0036), so a session can apply this role to the box itself
          from reviewed main, stopping on any change to the box's limits. Private, through the inventory.
      agent_box_self_apply_skip_tags:
        type: list
        elements: str
        default: [ca, prod_files, opnsense_offbox, lifeline, verify]
        description: The tags a self-apply skips.
      agent_box_self_apply_commit:
        type: str
        default: ""
        description: >-
          The commit the controller's copy was made from, when it is not a git checkout, so a full run can write
          box-apply's baseline. Pass it with -e.
      agent_box_self_applying:
        type: bool
        default: false
        description: Set by box-apply on its own runs; the box-apply tasks then write nothing.
      agent_box_prod_files:
        type: list
        elements: dict
        default: []
        description: "The controller files the prod_files tasks copy to the box: from (clone or config), path, dest. Names only are ever printed."
      agent_box_ci_runner:
        type: dict
        default: {}
        description: >-
          Private settings for the ci-runner wrapper, written to <work_dir>/ci-runner.json (0600, the keys user's):
          the runner VM (name, vm_id, address, cores, memory_mb, disk_gb), where it goes (proxmox_node_name,
          vnet, template_vm_id) and the GitHub App and repository it registers with (github_app_id,
          repo_owner, repo_name). No key goes in it. Empty skips the file.
      agent_box_desktop:
        type: dict
        default: {}
        description: >-
          Private settings for the desktop wrapper, written to <work_dir>/desktop.json (0600, the keys user's):
          the VM (name, vm_id, address, cores, memory_mb, disk_gb), where it goes (proxmox_node_name, vnet,
          template_vm_id), rdp_source (the tailnet connector's address, where RDP arrives from) and optionally admin_user. No key and no
          password goes in it. Empty skips the file.
      agent_box_tailnet_cleanup:
        type: dict
        default: {}
        description: >-
          Private settings for the daily tailnet cleanup (pick 214), written to <work_dir>/tailnet-cleanup.json
          (0600, the keys user's): tags (tag:<name> list whose devices may be removed), keep (device names never
          removed, at least one), days (offline at least this long, 7 or more) and max_deletes (1 to 20). The
          OAuth client is not in it; it is /etc/agent-keys/tailnet-cleanup.env. Empty skips the file and the timer.
      agent_box_tailnet_cleanup_daily: {type: str, default: "*-*-* 15:30:00 UTC", description: "systemd OnCalendar for the daily tailnet cleanup run."}
