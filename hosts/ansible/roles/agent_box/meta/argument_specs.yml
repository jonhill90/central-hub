---
# Inputs of the agent_box role. The check is tagged always, so it runs with any --tags.
argument_specs:
  main:
    short_description: Users, key folder, key wrappers, sudoers and Claude Code managed settings on the agent box
    options:
      # Required, private (a real machine name), through the inventory.
      agent_box_hostname:
        type: str
        required: true
        description: >-
          The box's OS hostname by STD-0001, for example daldtdemo01 (made up). Proxmox shows the
          VM under this name too, so the VM's name in OpenTofu must match it.
      agent_box_user: {type: str, default: claude, description: The user that runs Claude Code sessions.}
      agent_box_keys_user: {type: str, default: keys, description: The user that owns the lab keys.}
      agent_box_devaddr_group:
        type: str
        default: devaddr
        description: "The group through which the keys user hands dev's worker address to the host and firewall jobs."
      agent_box_hostkey_dir:
        type: path
        default: /var/lib/agent-box-hostkey
        description: "The folder where the host job publishes the Proxmox host's public host key (hostops:devaddr, 2750)."
      agent_box_guard_applied_dir:
        type: path
        default: /var/lib/agent-box-guard-applied
        description: "Where the firewall job says its last apply held the dev worker's rule (guardops:devaddr, 2750)."
      agent_box_handoff_dir: {type: path, default: /var/lib/agent-box-handoff, description: "The folder of that one handoff file (keys:devaddr, 0750)."}
      agent_box_runner_user:
        type: str
        default: ""
        description: >-
          The user the GitHub Actions runner runs as; sudo only for wrappers marked runner: true.
          Empty does nothing.
      agent_box_keys_dir: {type: path, default: /etc/agent-keys, description: "Key folder, owned by the keys user, mode 0700; every file in it 0600."}
      agent_box_work_dir: {type: path, default: /var/lib/agent-box, description: "The keys user's home: the central-hub checkout, tofu state and data."}
      agent_box_libexec_dir: {type: path, default: /usr/local/libexec/agent-box, description: Where the root-owned wrappers go.}
      agent_box_front_dir: {type: path, default: /usr/local/bin, description: Where the front scripts sessions run go.}
      agent_box_repo_url: {type: str, description: The public central-hub repository the wrappers run from.}
      agent_box_wrappers:
        type: list
        elements: dict
        description: One entry per wrapper; files/<name>.sh must exist in the role.
        options:
          name: {type: str, required: true, description: Wrapper name.}
          args: {type: list, elements: str, required: true, description: The only first arguments sudo allows.}
          session_args:
            type: list
            elements: str
            required: false
            description: >-
              The first arguments the session user may run, when that is fewer than args (the runner user gets args).
              An empty list gives the session user no line. Default: args. D-0041 uses it so only the workflow can run an apply.
          runner: {type: bool, required: false, default: false, description: "Also let the runner user run it (agent_box_runner_user)."}
          run_as:
            type: str
            required: false
            description: "The user the wrapper's sudo line runs it as, instead of the keys user (the proxmox-host job's own user)."
          callers:
            type: list
            elements: dict
            required: false
            description: >-
              Other users (another wrapper's own user) that may run this wrapper as its run_as user, each with its own
              arguments only. D-0063 uses it so the firewall's wrapper can arm and confirm the host's guard.
            options:
              user: {type: str, required: true, description: The calling user.}
              args: {type: list, elements: str, required: true, description: The only first arguments sudo allows that user.}
      agent_box_tofu_version: {type: str, description: OpenTofu version for the wrappers.}
      agent_box_tofu_sha256: {type: str, description: SHA-256 of the linux_amd64 zip of that version.}
      agent_box_kubectl_version: {type: str, description: "kubectl version for the c1-read wrapper, the one c1 runs."}
      agent_box_kubectl_sha256: {type: str, description: SHA-256 of that version's linux amd64 kubectl.}
      agent_box_ansible_core_version: {type: str, description: ansible-core version in the rebuild wrapper's virtual environment.}
      agent_box_httpx_version: {type: str, description: httpx version in that environment (the OPNsense modules need it).}
      agent_box_tailscale_version: {type: str, description: Tailscale client version.}
      agent_box_rhel_major: {type: int, description: "RHEL-family major version, for the Tailscale repository path."}
      agent_box_deny: {type: list, elements: str, description: permissions.deny in the managed settings.}
      agent_box_allow: {type: list, elements: str, default: [], description: permissions.allow in the managed settings; private.}
      agent_box_auto_mode: {type: dict, default: {}, description: The autoMode block in the managed settings; private.}
      agent_box_ca_files:
        type: list
        elements: path
        default: []
        description: "Absolute paths of public CA certificate files on the controller (no folders, no patterns, no keys), each trusted on the box; private."
      agent_box_tls_check_url: {type: str, default: "", description: "HTTPS URL the verify tag fetches with certificate checks on; private; empty skips it."}
      agent_box_managed_settings_extra: {type: dict, default: {}, description: "Other top-level managed settings, merged over the rest."}
      agent_box_opnsense_backup:
        type: dict
        default: {}
        description: >-
          Private. host (OPNsense's name or address) and keep (copies kept, 3 to 60, default 14) for the daily
          configuration backup on the box. Empty does nothing.
      agent_box_opnsense_backup_daily: {type: str, default: "*-*-* 14:30:00 UTC", description: "systemd OnCalendar for the daily OPNsense backup."}
      agent_box_opnsense_cert_check_daily:
        type: str
        default: "*-*-* 16:00:00 UTC"
        description: "systemd OnCalendar for the daily check of the certificate the firewall serves."
      agent_box_opnsense_offbox:
        type: dict
        default: {}
        description: >-
          Private. account, client_id, tenant_id, app_object_id and vault_url (tofu outputs of hosts/terraform/azure/backup)
          and, optionally, repository, vault_secret, keep_daily (default 30) and keep_monthly (default 12) for the daily
          off-box copy of the OPNsense backups (pick 222). Needs agent_box_opnsense_backup. Empty does nothing.
      agent_box_opnsense_offbox_daily: {type: str, default: "*-*-* 15:00:00 UTC", description: "systemd OnCalendar for the daily off-box copy."}
      agent_box_opnsense_offbox_cert_days: {type: int, default: 90, description: "Days the box's certificate for the copy app is valid."}
      agent_box_opnsense_offbox_cert_renew_days: {type: int, default: 30, description: "Days left when the daily run rolls that certificate."}
      agent_box_az: {type: str, default: az, description: "The Azure CLI on the controller, signed in as agent-azure, for the first certificate upload."}
      agent_box_secrets_bundle:
        type: dict
        default: {}
        description: >-
          All optional, for the daily SOPS-encrypted bundle of the box's private files (picks 228 and 236):
          mac_recipient (the Mac's age public key), keep (1 to 60, default 14), and for the off-box send
          vault_secret, offbox_keep_daily (default 14) and offbox_keep_monthly (default 6), and offbox (default false;
          true turns the off-box send on, only with the owner's secrets card). Empty does nothing.
      agent_box_secrets_bundle_daily: {type: str, default: "*-*-* 15:30:00 UTC", description: "systemd OnCalendar for the daily bundle."}
      agent_box_secrets_bundle_offbox_daily: {type: str, default: "*-*-* 16:15:00 UTC", description: "systemd OnCalendar for the bundle's off-box send."}
      agent_box_sops_version: {type: str, description: "SOPS version for the bundle."}
      agent_box_sops_sha256: {type: str, description: "SHA-256 of that version's linux.amd64 binary."}
      agent_box_age_version: {type: str, description: "age version for the bundle."}
      agent_box_age_sha256: {type: str, description: "SHA-256 of that version's linux-amd64 tarball."}
      agent_box_restic_version: {type: str, description: "restic version for the off-box copy."}
      agent_box_restic_sha256: {type: str, description: "SHA-256 of that version's linux_amd64 .bz2."}
      agent_box_lifeline_interface:
        type: str
        default: ""
        description: >-
          The box's lifeline NIC inside the VM (for example eth1), packet-filtered by the role's
          nftables table (inbound dropped, outbound only agent_box_lifeline_allow). Private. Empty does nothing.
      agent_box_nftables_version:
        type: str
        default: "1:1.1.5-6.el10_2"
        description: The nftables package version (epoch:version-release) installed only if the package is missing.
      agent_box_browser_cdp_port:
        type: int
        default: 9222
        description: agent-browser's DevTools port on 127.0.0.1. A packet filter lets only agent_box_user's sockets connect to it.
      agent_box_nft_bin:
        type: path
        default: /usr/sbin/nft
        description: The nft binary the lifeline filter unit and the proof use.
      agent_box_lifeline_address:
        type: str
        default: ""
        description: >-
          Private. The box's IPv4 address and prefix on the lifeline NIC (for example 192.0.2.50/24).
          Required when the interface is set; the role owns the NIC's NetworkManager connection.
      agent_box_lifeline_allow:
        type: list
        elements: dict
        default: []
        description: >-
          Private. What the box may reach over the lifeline NIC, the rest is rejected: entries of
          address (IPv4) and ports (TCP ports), normally the Proxmox host and 8006.
        options:
          address: {type: str, required: true, description: "IPv4 address."}
          ports: {type: list, elements: int, required: true, description: "TCP ports."}
          uid: {type: str, required: false, description: "A user name: only that user's sockets get out to this address."}
      agent_box_copy_prod_files:
        type: bool
        default: false
        description: >-
          Copy the controller's private lab files to the box in this run (the prod_files tasks).
          Off by default.
      agent_box_prod_files_clone:
        type: str
        default: ""
        description: >-
          Absolute path on the controller of its private clone of this repo, where the git-ignored files
          are. Private, through the inventory. Empty means the checkout the playbook runs from.
      agent_box_self_apply:
        type: bool
        default: false
        description: >-
          Install box-apply and its one sudo line (D-0036), so a session can apply this role to the box itself
          from reviewed main, stopping on any change to the box's limits. Private, through the inventory.
      agent_box_self_apply_skip_tags:
        type: list
        elements: str
        default: [ca, prod_files, opnsense_offbox, lifeline, verify, proxmox_host_inventory, guard_files]
        description: The tags a self-apply skips.
      agent_box_self_apply_commit:
        type: str
        default: ""
        description: >-
          The commit the controller's copy was made from, when it is not a git checkout, so a full run can write
          box-apply's baseline. Pass it with -e.
      agent_box_self_applying:
        type: bool
        default: false
        description: Set by box-apply on its own runs; the box-apply tasks then write nothing.
      agent_box_limit_apply:
        type: bool
        default: false
        description: >-
          Set by box-apply, with agent_box_self_applying, on an approved limit apply (pick 232); the box-apply tasks
          then write box-apply, its settings and its limits, never its inventory.
      agent_box_self_apply_timer:
        type: bool
        default: true
        description: >-
          With agent_box_self_apply, a root systemd timer that runs `box-apply apply` every
          agent_box_self_apply_interval, so merged work reaches the box with no session running it.
      agent_box_self_apply_interval: {type: str, default: 10min, description: "systemd OnUnitActiveSec between box-apply runs."}
      agent_box_copy_guard_files:
        type: bool
        default: false
        description: >-
          Copy the controller's guard files (the firewall's API key, the tailnet policy's OAuth client, the private
          inventory and the lab root) to the guard user's folder in this run (the guard_files tasks, D-0063).
      agent_box_guard_files:
        type: list
        elements: dict
        description: >-
          The controller files the guard_files tasks copy to the guard user's folder: from (clone or config), path,
          dest. Names only are ever printed.
      agent_box_prod_files:
        type: list
        elements: dict
        default: []
        description: "The controller files the prod_files tasks copy to the box: from (clone or config), path, dest. Names only are ever printed."
      agent_box_ci_runner:
        type: dict
        default: {}
        description: >-
          Private settings for the ci-runner wrapper, written to <work_dir>/ci-runner.json (0600, the keys user's):
          the runner VM (name, vm_id, address, cores, memory_mb, disk_gb), where it goes (proxmox_node_name,
          vnet, template_vm_id) and the GitHub App and repository it registers with (github_app_id,
          repo_owner, repo_name). No key goes in it. Empty skips the file.
      agent_box_short_node:
        type: str
        default: ""
        choices: ["", ephemeral-dev, keep-dev]
        description: >-
          The owner's pick for a dev run on a node short of memory, written to <work_dir>/short-node (0600, the keys
          user's) for the rebuild wrapper. ephemeral-dev stops the CI runner, tears dev down at the end of the run, then
          starts the runner. keep-dev stops the runner and leaves dev up (the notebook's queued jobs fail or are cancelled after
          24 hours queued, so if dev stays up for more than a day its daily access-expiry check does not run, and
          whether its alert e-mail goes out is not measured). Empty is no pick: a short node refuses before it stops anything.
      agent_box_openbao_in_cluster:
        type: bool
        default: false
        description: >-
          true writes <work_dir>/openbao-in-cluster (0600, the keys user's), and the rebuild wrapper then turns the
          secrets store on in the dev cluster (D-0058, dev first) and puts its seal key, made once in the dev keys
          folder, on the first worker before Argo CD makes the store. false removes the file.
      agent_box_desktop:
        type: dict
        default: {}
        description: >-
          Private settings for the desktop wrapper, written to <work_dir>/desktop.json (0600, the keys user's):
          the VM (name, vm_id, address, cores, memory_mb, disk_gb), where it goes (proxmox_node_name, vnet,
          template_vm_id), rdp_source (the tailnet connector's address, where RDP arrives from) and optionally admin_user. No key and no
          password goes in it. Empty skips the file.
      agent_box_checkpoint_note:
        type: dict
        default: {repo: agent-notebook, number: 729}
        description: >-
          The one pull request the checkpoint-note wrapper comments on, written to <work_dir>/checkpoint-note.json:
          repo, one the App is installed on, and number. No other wrapper names the file. The wrapper
          takes no pull request as an argument. Empty skips the file, and the wrapper refuses.
      agent_box_checkpoint_scan:
        type: bool
        default: true
        description: >-
          Install and start checkpoint-scan.timer, which runs `checkpoint-scan.sh run` as the keys user. It reads only and
          posts through checkpoint-note on a new finding. False stops and disables the timer.
      agent_box_checkpoint_scan_on_calendar: {type: str, default: "*-*-* *:07:00 UTC", description: "systemd OnCalendar for the checkpoint scan."}
      agent_box_pickup_scan:
        type: bool
        default: true
        description: >-
          Install and start pickup-scan.timer, which runs `pickup-scan.sh <agent_box_pickup_mode>` as the keys user every
          10 minutes. It reads only. False stops and disables the timer.
      agent_box_pickup_mode:
        type: str
        default: dry-run
        choices: [dry-run, run]
        description: >-
          dry-run prints what the scan would post and posts nothing; run posts a fixed comment for each newly ready
          task on its project's standing pull request.
      agent_box_pickup_scan_on_calendar: {type: str, default: "*-*-* *:00/10:00 UTC", description: "systemd OnCalendar for the pickup scan."}
      agent_box_pickup_projects:
        type: dict
        default: {agent-notebook: {repo: agent-notebook}}
        description: >-
          The projects the pickup scan lists, written to <work_dir>/pickup.json: project name to repo (one the App is
          installed on) and number (the project's standing draft pull request, which pickup-note comments on; left out
          until that pull request exists). Empty skips the file, and the scan reports that as a finding.
      agent_box_opnsense_test:
        type: dict
        default: {}
        description: >-
          Private settings for the opnsense-test wrapper, written to <work_dir>/opnsense-test.json (0600, the keys
          user's): name, address (the test VM's dev address), keycloak_address (the box's address the VM reaches),
          cores, memory_mb, disk_gb and proxmox_node_name. No key or password goes in it: the wrapper makes the
          proof's own and removes them at destroy. Empty skips the wrapper's tools, filter and file.
      agent_box_opnsense_test_subid_start:
        type: int
        default: 300000
        description: The keys user's first subordinate UID and GID (65536 of each), for the proof's rootless Keycloak.
      agent_box_lab_test_default:
        type: dict
        description: >-
          The lab-test wrapper's made-up settings (name in the STD-0001 form, a .invalid domain, one dev address, cores,
          memory_mb, disk_gb). The node name is not in it; the wrapper reads the node from the Proxmox API at run time.
      agent_box_lab_test:
        type: dict
        default: {}
        description: >-
          The inventory's lab-test settings, merged key by key over agent_box_lab_test_default and written with it to
          <work_dir>/lab-test.json (0600, the keys user's): name, domain, address, cores, memory_mb, disk_gb and,
          optionally, proxmox_node_name. No key or password goes in it.
      agent_box_lab_test_enabled:
        type: bool
        default: true
        description: false skips the wrapper's assistant, helper and settings file.
      agent_box_pve_assistant_version: {type: str, description: "proxmox-auto-install-assistant version for the lab-test wrapper."}
      agent_box_pve_assistant_base: {type: str, description: "The package pool folder the assistant's .deb is downloaded from."}
      agent_box_pve_assistant_sha256: {type: str, description: "SHA-256 of that version's .deb, from pve-no-subscription's Packages index."}
      agent_box_vps_host:
        type: dict
        default: {}
        description: >-
          Private settings for the vps-host wrapper (D-0046), written to <work_dir>/vps-host.json (0600, the keys
          user's): name, the VPS's name on the tailnet. No key goes in it; the box signs in by Tailscale SSH.
      agent_box_secrets_store:
        type: dict
        default: {}
        description: >-
          Private settings for the secrets-store wrapper, written to <work_dir>/secrets-store.json (0600, the
          keys user's), for the store inside the dev cluster (D-0058). address: the store's name as the box reaches
          it; every action refuses unless it equals the dev inventory's k8s_gitops_source_openbao_store_host
          (D-0058 rule 10). snapshot_box: true (agent pick 240) makes snapshot sign in as AppRole snapshot-box; it is
          set only by the owner's install tap, an access right and a box limit. sops_copies: true lets put, compare
          and reseed keep SOPS copies and turns on the weekly compare; it is set only by the owner's access-right tap
          (D-0058 rule 9). Anything but true is false. box_cidr: the box's own address as a /32, which the dev
          rebuild passes to stage openbao-handover (k8s_gitops_source_openbao_box_cidr); empty until the box's path
          to the store is set. admin_address: the store's admin address, one address of dev's load-balancer pool,
          which needs box_cidr; the dev rebuild passes it on (k8s_gitops_source_openbao_admin_address) and every
          call goes there (D-0062). Without it, every dev call goes to dev's Gateway by the dev inventory's
          k8s_gitops_source_gateway_address. offbox: true installs the dev store's hourly off-box snapshot send
          (pick 237) when agent_box_opnsense_offbox is set too; it is set only by the owner's tap, since the send's
          daily prune is a delete (D-0042 rule 6). Anything but true is false, and a left send timer is turned off.
          No key goes in it; the wrapper makes the keys in the keys folder.
          Empty skips the file.
      agent_box_secrets_store_prod:
        type: dict
        default: {}
        description: >-
          The same settings for the store inside prod's c1, written to <work_dir>/secrets-store-prod.json for the
          secrets-store-prod wrapper. address must equal k8s_gitops_source_openbao_store_host in the prod inventory the
          openbao-prod wrapper builds (agent_box_openbao_prod.store_host); snapshot_box and sops_copies as for the dev settings, each set only by its own
          tap. It makes no recovery shares (D-0038 rule 5: prod gets none). Empty skips the file.
      agent_box_openbao_prod:
        type: dict
        default: {}
        description: >-
          Private settings for the openbao-prod wrapper, written to <work_dir>/openbao-prod.json (0600, the keys user's):
          seal_node (the prod k8s_nodes host for the seal key, its Kubernetes node name), store_host (the store's name as the
          box reaches it), box_cidr (the box's address as a /32; empty until the box's path to the store is set) and
          admin_address (the store's admin address, one address of prod's load-balancer pool, which needs box_cidr;
          secrets-store-prod then calls it, D-0062). No key goes in it. Empty skips the file.
      agent_box_secrets_store_compare_on_calendar:
        type: str
        default: "Mon *-*-* 05:00:00"
        description: systemd OnCalendar for the weekly compare of the store with its SOPS copy (only with sops_copies true).
      agent_box_secrets_store_offbox:
        type: dict
        default:
          repository: azure:opnsense-backup:/openbao-dev
          keep_hourly: 48
          keep_daily: 14
          keep_monthly: 6
          prune_after_hour: 3
        description: >-
          The dev store's hourly snapshot off the box (pick 237): repository (azure:<container>:/<path>, its own, not
          the OPNsense one), keep_hourly, keep_daily, keep_monthly, and prune_after_hour (UTC; the first run from then
          prunes, once a day). Set up only when agent_box_secrets_store and agent_box_opnsense_offbox are both set.
      agent_box_secrets_store_offbox_on_calendar: {type: str, default: hourly, description: "systemd OnCalendar for the snapshot send."}
      agent_box_tailnet_cleanup:
        type: dict
        default: {}
        description: >-
          Private settings for the daily tailnet cleanup (pick 214), written to <work_dir>/tailnet-cleanup.json
          (0600, the keys user's): tags (tag:<name> list whose devices may be removed), keep (device names never
          removed, at least one), days (offline at least this long, 7 or more) and max_deletes (1 to 20). The
          OAuth client is not in it; it is /etc/agent-keys/tailnet-cleanup.env. Empty skips the file and the timer.
      agent_box_merge_sweep:
        type: bool
        default: false
        description: >-
          Install the merge sweep (D-0042 rule 2): a timer that runs pr-merge.sh sweep as the keys user. It merges only a head
          with four recorded passes (pass-record) and checks the halt flag first. Private, through the inventory; installing it is a box-limit change.
      agent_box_merge_sweep_interval: {type: str, default: 5min, description: "systemd OnUnitActiveSec between sweeps."}
      agent_box_tailnet_cleanup_daily: {type: str, default: "*-*-* 15:30:00 UTC", description: "systemd OnCalendar for the daily tailnet cleanup run."}
