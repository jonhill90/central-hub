---
# Not private. The agent box (VM 258, docs/runbooks/set-up-the-agent-box.md): user `claude` runs
# the sessions, user `keys` owns the lab keys, and the sessions use a key only through a root-owned
# wrapper that sudo lets `claude` run as `keys` with fixed arguments. Agent picks, Library
# plans/agent-workstation/PLAN.md sections 3 and 4.

agent_box_user: claude
agent_box_keys_user: keys
# The user the GitHub Actions runner runs as (docs/runbooks/set-up-the-lab-redeploy-workflow.md). It gets
# sudo only for the wrappers marked `runner: true`, with their args as listed. Empty does nothing.
agent_box_runner_user: ""
agent_box_keys_dir: /etc/agent-keys
agent_box_work_dir: /var/lib/agent-box
agent_box_libexec_dir: /usr/local/libexec/agent-box
agent_box_front_dir: /usr/local/bin
agent_box_repo_url: https://github.com/jonhill90/central-hub.git

# One entry per wrapper: files/<name>.sh is installed as <libexec>/<name>.sh, a front script
# <front_dir>/<name> calls it through sudo, and sudoers allows exactly these first arguments.
agent_box_wrappers:
  - name: dev-vms
    args: [plan, apply, destroy]
  # bump opens a PR moving the runner pin; `weekly` (configure, then bump) is the timer's only, so
  # sessions can't start it through sudo.
  - name: ci-runner
    args: [plan, apply, configure, destroy, bump]
  # The owner's desktop VM (docs/runbooks/set-up-the-desktop.md). Not applied until the owner says so.
  - name: desktop
    args: [plan, apply, configure, destroy]
  # The `*` lets sudo pass the repository, number and head; the wrapper checks each one itself.
  - name: pr-merge
    args: ["check *", "merge *"]
  # The dev rebuild (hosts/rebuild-k8s.sh), dev VMs 250-257 only.
  - name: rebuild
    args: [up, rebuild, teardown, log, diag]
    runner: true   # the dev redeploy workflow (.github/workflows/lab-redeploy-dev.yml)
  # Lists what the daily timer would remove from the tailnet; `run` is the timer's only (pick 214).
  - name: tailnet-cleanup
    args: [plan]
  # Reads c1 with the read-only kubeconfig from app agent-read; read verbs only, and the wrapper
  # refuses flags that pick other credentials or open a local file.
  - name: c1-read
    args: ["get *", "describe *", "logs *", "top *", events, "events *", "explain *", api-resources,
           "api-resources *", api-versions, version, "version *", "auth can-i *"]

# OpenTofu for the wrappers, the same version CI uses (.github/hosts-check/install-tools.sh),
# checked against the release's SHA256SUMS.
agent_box_tofu_version: 1.13.1
agent_box_tofu_sha256: 8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80

# kubectl for the c1-read wrapper, the version c1 runs (k8s_node_kubernetes_version, pick 33),
# checked against the release's kubectl.sha256. Bump it with the cluster.
agent_box_kubectl_version: 1.37.1
agent_box_kubectl_sha256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8

# Ansible for the rebuild wrapper, in its own virtual environment so the box's system Python stays
# as it is. The version is the one hosts/ansible/requirements.txt pins; the collections come from
# hosts/ansible/requirements.yml of the keys user's checkout.
agent_box_ansible_core_version: 2.21.5
agent_box_httpx_version: 0.28.1

# Tailscale client from pkgs.tailscale.com (installed 2026-11-10 on VM 258, AlmaLinux 10).
agent_box_tailscale_version: 1.104.5
agent_box_rhel_major: 10

# Hard floor for every session on the box, in /etc/claude-code/managed-settings.json. A deny rule
# blocks a call before auto mode's classifier is asked and can't be overridden. Mapped from what
# the Mac's guard blocks today (PLAN.md section 4).
agent_box_deny:
  # Branch deletes. A refspec delete (`git push origin :branch`) can't be matched by a prefix rule
  # without blocking every push; the classifier and the repo rulesets cover it.
  - "Bash(git push --delete:*)"
  - "Bash(git push -d:*)"
  - "Bash(git push origin --delete:*)"
  - "Bash(git push origin -d:*)"
  - "Bash(ssh root@:*)"
  - "Bash(kubectl patch:*)"
  - "Bash(kubectl --context c1 apply:*)"
  - "Bash(kubectl --context c1 delete:*)"
  - "Bash(kubectl --context c1 edit:*)"
  - "Bash(az storage blob delete-batch:*)"
  - "Bash(curl:* | bash)"
  - "Bash(curl:* | sh)"
  # Raw applies; applies go only through the wrappers.
  - "Bash(tofu apply:*)"
  - "Bash(tofu destroy:*)"
  # A `*` in the middle needs the plain trailing `*`: mixed with `:*` it is matched as literal text.
  - "Bash(tofu -chdir=* apply*)"
  - "Bash(tofu -chdir=* destroy*)"
  - "Bash(gh pr merge:*)"
  - "Bash(gh api:*)"
  # Keys: sessions reach `keys` only through the front scripts, which call sudo themselves.
  - "Bash(sudo:*)"
  - "Read(//etc/agent-keys/**)"
  # The OPNsense configuration backups hold password hashes and keys.
  - "Read(//var/lib/agent-box/opnsense-backup/**)"
  # The settings themselves.
  # Only Edit rules match file writes (an Edit rule covers every file-editing tool, Write included).
  - "Edit(//etc/claude-code/**)"
  - "Edit(~/.claude/settings.json)"

# Private, through the inventory: the allow rules and auto mode's environment lines copied from
# the Mac's settings (they name private paths). Empty lists are fine.
agent_box_allow: []
agent_box_auto_mode: {}
# Public CA certificates the box must trust, for example the lab root that issues the Proxmox
# API's certificate: absolute paths of single PEM files on the controller, never a folder or a
# pattern. Each is checked (a certificate, no private key) and added to the trust store.
agent_box_ca_files: []
# An HTTPS URL the verify tag fetches with normal certificate checks, for example the Proxmox
# API's version path. Private. Empty skips the check.
agent_box_tls_check_url: ""
# A daily copy of OPNsense's configuration on the box (pick 220). Private, through the inventory: host (OPNsense's
# name or address, over HTTPS with the lab CA the box trusts) and keep (copies to keep, 3 to 60, default 14). The API key
# is /etc/agent-keys/prod/opnsense-api.txt, which the prod files copy puts there. Empty does nothing.
agent_box_opnsense_backup: {}
# When the daily OPNsense backup starts (systemd OnCalendar).
agent_box_opnsense_backup_daily: "*-*-* 14:30:00 UTC"
# The off-box copy of those configurations (pick 222, docs/runbooks/copy-opnsense-backup-off-box.md): restic sends them
# daily to their own container in the Azure backup account (hosts/terraform/azure/backup), signed in as their own app
# with a certificate made on the box. Private, through the inventory, from that folder's tofu outputs: account
# (storage_account_name), client_id (opnsense_client_id), tenant_id, app_object_id (opnsense_app_object_id),
# vault_url (opnsense_vault_url), and optionally repository (opnsense_restic_repository, default
# azure:opnsense-backup:/opnsense), vault_secret (default opnsense-offbox-restic-password), keep_daily (default 30)
# and keep_monthly (default 12). The box makes the repository password itself and writes its one off-box copy
# into that Key Vault. Needs agent_box_opnsense_backup. Empty does nothing.
agent_box_opnsense_offbox: {}
# When the daily off-box copy starts (systemd OnCalendar), after the backup's 14:30 and its random delay.
agent_box_opnsense_offbox_daily: "*-*-* 15:00:00 UTC"
# The box's certificate for that app: days it is valid, and days left when the daily run rolls it.
agent_box_opnsense_offbox_cert_days: 90
agent_box_opnsense_offbox_cert_renew_days: 30
# The Azure CLI on the controller, signed in as agent-azure (the app's owner), for the first certificate upload.
agent_box_az: az
# restic for the off-box copy, the same release role k8s_backup puts on the nodes, checked against its SHA-256.
agent_box_restic_version: 0.19.1
agent_box_restic_sha256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
# The box's second NIC on the Proxmox host's own subnet (pick 220, docs/runbooks/set-up-the-box-lifeline.md):
# its interface name inside the VM (for example eth1). Private, through the inventory. Empty does nothing.
agent_box_lifeline_interface: ""
# What the box may reach over that NIC, and nothing else (the rest is rejected): a list of
# {address: IPv4, ports: [TCP ports]}, normally the Proxmox host's own address and 8006 (and 22 if needed).
# Private, through the inventory. Empty with the interface set rejects everything over the lifeline.
agent_box_lifeline_allow: []
# Any other top-level settings, merged over the rest (for example autoUpdatesChannel).
agent_box_managed_settings_extra: {}
# When the weekly `ci-runner weekly` run starts (systemd OnCalendar): it reinstalls the merged pin on
# the runner, then opens a PR for a newer release (pick 208). Only set up when agent_box_ci_runner is.
agent_box_ci_runner_weekly: "Mon *-*-* 14:00:00 UTC"
# The daily tailnet cleanup (pick 214, docs/runbooks/set-up-the-agent-box.md, "Remove old tailnet
# devices"). Private, through the inventory: tags (the tag:<name> list whose devices may go), keep
# (device names never removed; at least one), days (offline at least this long, 7 or more) and
# max_deletes (a run that would remove more removes none, 1 to 20). Empty leaves the timer unset up.
agent_box_tailnet_cleanup: {}
# When the daily `tailnet-cleanup run` starts (systemd OnCalendar).
agent_box_tailnet_cleanup_daily: "*-*-* 15:30:00 UTC"
# The notebook's CI runner VM that the ci-runner wrapper builds (docs/runbooks/set-up-the-ci-runner.md).
# Private, through the inventory: name, vm_id, address, cores, memory_mb, disk_gb, proxmox_node_name,
# vnet, template_vm_id, github_app_id, repo_owner, repo_name. Empty leaves the wrapper unset up.
agent_box_ci_runner: {}
# The owner's desktop VM that the desktop wrapper builds (docs/runbooks/set-up-the-desktop.md).
# Private, through the inventory: name, vm_id (400-499), address, cores, memory_mb, disk_gb,
# proxmox_node_name, vnet, template_vm_id, rdp_source (the tailnet connector's address, where RDP arrives from) and optionally
# admin_user (default admin). Empty leaves the wrapper unset up.
agent_box_desktop: {}
# The controller's private files the prod_files tasks copy to <keys_dir>/prod (D-0035; paths from
# docs/runbooks/rebuild-home-lab-from-scratch.md). from: clone (the controller's checkout of this
# repo) or config (~/.config/central-hub). A missing file is skipped and named. Not listed on purpose:
# the Proxmox apply token, the Cloudflare bootstrap token, the nodes' SSH keys and the lab CA.
agent_box_prod_files:
  - {from: clone, path: hosts/.env, dest: hosts.env}
  - {from: clone, path: hosts/ansible/inventories/home/hosts.yml, dest: inventory-hosts.yml}
  - {from: config, path: identity.env, dest: identity.env}
  - {from: clone, path: hosts/terraform/home/certificates/home.tfvars, dest: tfvars/certificates.tfvars}
  - {from: clone, path: hosts/terraform/home/dns-token/home.tfvars, dest: tfvars/dns-token.tfvars}
  - {from: clone, path: hosts/terraform/home/dns/home.tfvars, dest: tfvars/dns.tfvars}
  - {from: clone, path: hosts/terraform/home/jumpbox/home.tfvars, dest: tfvars/jumpbox.tfvars}
  - {from: clone, path: hosts/terraform/home/k8s/home.tfvars, dest: tfvars/k8s.tfvars}
  - {from: clone, path: hosts/terraform/home/tailnet-policy/home.tfvars, dest: tfvars/tailnet-policy.tfvars}
  - {from: clone, path: hosts/terraform/home/tailnet/home.tfvars, dest: tfvars/tailnet.tfvars}
  - {from: clone, path: hosts/terraform/home/dns/home.records.tfvars.json, dest: tfvars/dns.records.tfvars.json}
  - {from: config, path: opnsense-api.txt, dest: opnsense-api.txt}
  - {from: config, path: secret-source.env, dest: secret-source.env}
  - {from: config, path: c1-secrets-encryption.key, dest: c1-secrets-encryption.key}
  - {from: config, path: cloudflare-dns.token, dest: cloudflare-dns01-token.txt}
  - {from: config, path: pve-root-ca.pem, dest: pve-root-ca.pem}
# Switch for the prod_files tasks, which copy the controller's private lab files to the box. Off: a
# run that copies them is a decision (docs/runbooks/set-up-the-agent-box.md, "Copy the controller's
# private files to the box"), so it is turned on for one run and off again.
agent_box_copy_prod_files: false
# Where the controller's private clone of this repo is (the one that holds the git-ignored hosts/.env,
# the filled-in inventory and the home.tfvars files), as an absolute path on the controller. Private:
# set it in the inventory. Empty means the checkout the playbook runs from, which has none of them when
# the controller runs from a pinned copy.
agent_box_prod_files_clone: ""

# box-apply (D-0036; docs/runbooks/apply-the-agent-box-from-itself.md): when true, the role installs the
# root-owned box-apply wrapper and its one sudo line, so a session can apply this role to the box itself from
# reviewed main, stopping on any change to the box's limits. Turned on in the private inventory.
agent_box_self_apply: false
# Tags a self-apply skips: tasks that read the controller's files (ca, prod_files, and the off-box copy's
# certificate upload), the lifeline's firewall (D-0036 rule 8) and the proofs. A limit itself (defaults key).
agent_box_self_apply_skip_tags: [ca, prod_files, opnsense_offbox, lifeline, verify]
# The commit a controller's pinned copy was made from, when that copy is not a git checkout (-e only).
agent_box_self_apply_commit: ""
# Set by box-apply on its own runs (-e); the box-apply tasks then write nothing.
agent_box_self_applying: false
