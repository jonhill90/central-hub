---
# Not private. The agent box (VM 258, docs/runbooks/set-up-the-agent-box.md): user `claude` runs
# the sessions, user `keys` owns the lab keys, and the sessions use a key only through a root-owned
# wrapper that sudo lets `claude` run as `keys` with fixed arguments. Agent picks, Library
# plans/agent-workstation/PLAN.md sections 3 and 4.

agent_box_user: claude
agent_box_keys_user: keys
# The user the GitHub Actions runner runs as (docs/runbooks/set-up-the-lab-redeploy-workflow.md). It gets
# sudo only for the wrappers marked `runner: true`, with their args as listed. Empty does nothing.
agent_box_runner_user: ""
agent_box_keys_dir: /etc/agent-keys
agent_box_work_dir: /var/lib/agent-box
agent_box_libexec_dir: /usr/local/libexec/agent-box
agent_box_front_dir: /usr/local/bin
agent_box_repo_url: https://github.com/jonhill90/central-hub.git

# One entry per wrapper: files/<name>.sh is installed as <libexec>/<name>.sh, a front script
# <front_dir>/<name> calls it through sudo, and sudoers allows exactly these first arguments.
agent_box_wrappers:
  - name: dev-vms
    args: [plan, apply, destroy]
  # bump opens a PR moving the runner pin; `weekly` (configure, then bump) is the timer's only, so
  # sessions can't start it through sudo. c1-token writes the notebook runner pod's one-hour
  # registration token to prod's store.
  - name: ci-runner
    args: [plan, apply, configure, destroy, bump, c1-token]
  # The owner's desktop VM (docs/runbooks/set-up-the-desktop.md). Not applied until the owner says so.
  - name: desktop
    args: [plan, apply, configure, destroy]
  # The lab's secrets store, OpenBao, inside the dev cluster (docs/runbooks/set-up-the-secrets-store.md, D-0058). The `*`
  # on put lets sudo pass the path and key; the value comes on stdin, and the wrapper checks both arguments itself.
  - name: secrets-store
    args: [recovery, status, snapshot, restore, restore-rebuilt, "restore-rebuilt *", clear-hold, "put *", put-apps, compare, reseed]
  # The same wrapper for the store inside prod's c1 (D-0058): prod's keys folder, settings and inventory only.
  - name: secrets-store-prod
    args: [recovery, status, snapshot, restore, restore-rebuilt, "restore-rebuilt *", clear-hold, "put *", put-apps, compare, reseed]
  # Turns that store on in prod's c1 with the box's own prod node key (files/openbao-prod.sh). The `*` on seal,
  # seal-copy, reset-failed-start, drop-box-path and admin-firewall passes the owner's tap id, which the wrapper checks; key prints only the public half.
  - name: openbao-prod
    args: [key, check, "seal *", "seal-copy *", l2-policy, gitops, ca, handover, "reset-failed-start *", "drop-box-path *", admin-firewall-check, "admin-firewall *", log]
  # Applies one named Ansible playbook to prod's c1 with the box's own prod node key (files/c1-ansible.sh). check is
  # read-only; the `*` on apply passes the clearance id, which the wrapper checks. The names are identity, gateway, gitops, observability and users.
  - name: c1-ansible
    args: [list, "check *", "apply *", log]
  # The three scripted sign-in checks (Jellyfin, Argo CD, Proxmox) against prod with the test user (files/signin-check.sh). It runs as
  # the keys user, because the test user's password and seed are lines in identity.env. run makes nothing in any app; it reads
  # signin-check.json, which the controller's prod-files run copies, and prints only the checks' numbered lines.
  - name: signin-check
    args: [run, log]
  # Prod's teardown and rebuild under D-0035 (files/rebuild-prod.sh). check is read-only; the `*` on rebuild passes
  # the owner's tap id and the commit the go names, which the wrapper checks (7 to 40 hex digits, on main); the run
  # needs dev to have passed at that same commit first.
  - name: rebuild-prod
    args: [check, "rebuild *", log]
  # The `*` lets sudo pass the repository, number and head; the wrapper checks each one itself. Sessions get the
  # read-only `check` only: `merge` and `sweep` have no sudo line, the timer's unit runs the sweep as the keys user.
  - name: pr-merge
    args: ["check *"]
  # Makes one empty public repository under the owner's account as the GitHub App, with a token narrowed to Repository
  # creation (files/repo-create.sh). The `*` passes the name, which the wrapper checks; it refuses a name that exists.
  - name: repo-create
    args: ["create *", log]
  # Posts one fixed-format comment, as the GitHub App, on the one pull request agent_box_checkpoint_note names, so a session
  # that watches it wakes on a box finding (files/checkpoint-note.sh). The `*` passes `test` or a count, which the wrapper
  # checks; the pull request is never an argument.
  - name: checkpoint-note
    args: ["post *", log]
  # The hourly checkpoint as a box script (files/checkpoint-scan.sh and .py): run scans once and posts through
  # checkpoint-note only on a new finding; show prints the last report. The timer runs `run` as the keys user.
  - name: checkpoint-scan
    args: [run, show]
  # The box pickup scan (files/pickup-scan.sh and .py): reads the notebook's task board and posts through pickup-note only
  # when a project has a new ready task. Sessions may dry-run (post nothing) and show; `run` is the timer's, as the keys user.
  - name: pickup-scan
    args: [dry-run, run, show]
    session_args: [dry-run, show]
  # Posts one fixed comment, as the GitHub App, on a project's standing pull request (files/pickup-note.sh), called by the
  # scan as the keys user. `post *` passes the project and the label, which the wrapper checks; the pull request is never an
  # argument. The scan also calls `post-stale` (not matched by `post *`, which needs a space; the scan runs as the keys user, no sudo).
  # A session gets no `post`: only the scan wakes the project.
  - name: pickup-note
    args: ["post *", log]
    session_args: [log]
  # Reads the certificate the firewall's web UI serves and says how many days it has left (files/opnsense-cert-check.sh). It
  # holds no key and writes nothing to the firewall; the daily timer (opnsense-cert-check.timer) runs `check` as the keys user.
  - name: opnsense-cert-check
    args: [check, status]
  # The pass ledger the merge sweep reads (D-0042 rule 2) and its stop switch (rule 8). The wrapper checks every argument.
  - name: pass-record
    args: ["add *", "show *", "halt *", "resume *"]
  # The dev rebuild (hosts/rebuild-k8s.sh), dev VMs 250-257 only.
  - name: rebuild
    # up and rebuild may name the commit to build (`*`); the wrapper takes only 7 to 40 hex digits on main.
    args: [up, "up *", rebuild, "rebuild *", teardown, identity, log, diag, fit]
    runner: true   # the dev redeploy workflow (.github/workflows/lab-redeploy-dev.yml)
  # The tailnet stack's pipeline job (D-0041): plan, then apply the saved plan the owner's card named. The
  # workflow lab-tailnet.yml calls it on the runner; the card ID and the plan hash are required arguments.
  - name: tailnet-stack
    args: [plan, "apply *", log]
    session_args: [plan, log]   # a session cannot apply; only the workflow's runner can (D-0041 rules 2 and 3)
    runner: true
  # The Proxmox host's proxy playbook as a pipeline job (D-0041; Library plans/r1-host-job/DESIGN.md v3.1):
  # check, then apply the check whose hash has the agents' pass. It runs as agent_box_host_user, not the keys
  # user, so no other wrapper can read the host key. Sessions may check and read the log; only the workflow's
  # runner (lab-proxmox-host.yml) may apply. The box's own apply (`apply-recorded`) is open to sessions because the wrapper
  # decides: it refuses unless the check hash matches, the ledger holds a reviewer pass for it and a go for the job and
  # commit; `pass`, `go` and `ledger` write and read that ledger (the wrapper's header says what each line proves).
  - name: proxmox-host
    args: [check, "check *", "apply *", "apply-recorded *", "pass *", "go *", ledger, "ledger *", log]
    session_args: [check, "check *", "apply-recorded *", "pass *", "go *", ledger, "ledger *", log]
    runner: true
    run_as: hostops   # the same name as agent_box_host_user
  # The tailnet policy file's pipeline job (D-0041, D-0046 rule 4): the same shape as tailnet-stack, for
  # hosts/terraform/home/tailnet-policy, which until now only the owner's Mac applied.
  - name: tailnet-policy
    args: [plan, "apply *", log]
    session_args: [plan, log]   # a session cannot apply; only the workflow's runner can
    runner: true
  # The VPS apps host (D-0046): bootstrap once as root, then apply and secrets as user deploy through the VPS's
  # own vps-apply. Only the workflow lab-vps-host.yml runs the changing actions; a session may read only.
  - name: vps-host
    args: [bootstrap, apply, secrets, "secrets rotate", status, log]
    session_args: [status, log]
    runner: true
  # A throwaway OPNsense on dev, VM 257, for the sign-in proof (docs/runbooks/prove-opnsense-sign-in-on-dev.md).
  # Built and destroyed only while dev is down; it runs a Keycloak container on this box during `prove`.
  - name: opnsense-test
    args: [plan, apply, configure, prove, destroy, log]
  # The lab test copy, VM 256, a nested Proxmox VE on dev (docs/runbooks/build-the-lab-test-copy.md). Built and
  # destroyed only while dev is down and VM 257 is gone; check reads the copy over SSH and changes nothing; host
  # runs the fresh-host steps inside the copy; lab builds its own SDN, VM 100 and CT 900 and puts it on mgmt;
  # firstboot sets up the copy's VM 100 over its serial console; opnsense runs opnsense.yml against it; wancheck runs
  # the WAN safety check on the copy's portless WAN bridge; connector sets up CT 900's tailnet client, never joined;
  # safety turns the copy's host firewall on; prove runs every step, then destroy.
  - name: lab-test
    args: [plan, apply, check, host, lab, firstboot, opnsense, wancheck, connector, safety, prove, destroy, log]
  # Lists what the daily timer would remove from the tailnet; `run` is the timer's only (pick 214).
  - name: tailnet-cleanup
    args: [plan]
  # Reads c1 with the read-only kubeconfig from app agent-read; read verbs only, and the wrapper
  # refuses flags that pick other credentials or open a local file.
  - name: c1-read
    args: ["get *", "describe *", "logs *", "top *", events, "events *", "explain *", api-resources,
           "api-resources *", api-versions, version, "version *", "auth can-i *"]

# OpenTofu for the wrappers, the same version CI uses (.github/hosts-check/install-tools.sh),
# checked against the release's SHA256SUMS.
agent_box_tofu_version: 1.13.1
agent_box_tofu_sha256: 8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80

# kubectl for the c1-read wrapper, the version c1 runs (k8s_node_kubernetes_version, pick 33),
# checked against the release's kubectl.sha256. Bump it with the cluster.
agent_box_kubectl_version: 1.37.1
agent_box_kubectl_sha256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8

# Ansible for the rebuild wrapper, in its own virtual environment so the box's system Python stays
# as it is. The version is the one hosts/ansible/requirements.txt pins; the collections come from
# hosts/ansible/requirements.yml of the keys user's checkout.
agent_box_ansible_core_version: 2.21.5
agent_box_httpx_version: 0.28.1

# Tailscale client from pkgs.tailscale.com (installed 2026-11-10 on VM 258, AlmaLinux 10).
agent_box_tailscale_version: 1.104.5
agent_box_rhel_major: 10

# Hard floor for every session on the box, in /etc/claude-code/managed-settings.json. A deny rule
# blocks a call before auto mode's classifier is asked and can't be overridden. Mapped from what
# the Mac's guard blocks today (PLAN.md section 4).
agent_box_deny:
  # Branch deletes. A refspec delete (`git push origin :branch`) can't be matched by a prefix rule
  # without blocking every push; the classifier and the repo rulesets cover it.
  - "Bash(git push --delete:*)"
  - "Bash(git push -d:*)"
  - "Bash(git push origin --delete:*)"
  - "Bash(git push origin -d:*)"
  - "Bash(ssh root@:*)"
  - "Bash(kubectl patch:*)"
  - "Bash(kubectl --context c1 apply:*)"
  - "Bash(kubectl --context c1 delete:*)"
  - "Bash(kubectl --context c1 edit:*)"
  - "Bash(az storage blob delete-batch:*)"
  - "Bash(curl:* | bash)"
  - "Bash(curl:* | sh)"
  # Raw applies; applies go only through the wrappers.
  - "Bash(tofu apply:*)"
  - "Bash(tofu destroy:*)"
  # A `*` in the middle needs the plain trailing `*`: mixed with `:*` it is matched as literal text.
  - "Bash(tofu -chdir=* apply*)"
  - "Bash(tofu -chdir=* destroy*)"
  - "Bash(gh pr merge:*)"
  - "Bash(gh api:*)"
  # Keys: sessions reach `keys` only through the front scripts, which call sudo themselves.
  - "Bash(sudo:*)"
  - "Read(//etc/agent-keys/**)"
  # The OPNsense configuration backups hold password hashes and keys.
  - "Read(//var/lib/agent-box/opnsense-backup/**)"
  # The settings themselves.
  # Only Edit rules match file writes (an Edit rule covers every file-editing tool, Write included).
  - "Edit(//etc/claude-code/**)"
  - "Edit(~/.claude/settings.json)"

# Private, through the inventory: the allow rules and auto mode's environment lines copied from
# the Mac's settings (they name private paths). Empty lists are fine.
agent_box_allow: []
agent_box_auto_mode: {}
# Public CA certificates the box must trust, for example the lab root that issues the Proxmox
# API's certificate: absolute paths of single PEM files on the controller, never a folder or a
# pattern. Each is checked (a certificate, no private key) and added to the trust store.
agent_box_ca_files: []
# An HTTPS URL the verify tag fetches with normal certificate checks, for example the Proxmox
# API's version path. Private. Empty skips the check.
agent_box_tls_check_url: ""
# A daily copy of OPNsense's configuration on the box (pick 220). Private, through the inventory: host (OPNsense's
# name or address, over HTTPS with the lab CA the box trusts) and keep (copies to keep, 3 to 60, default 14). The API key
# is /etc/agent-keys/prod/opnsense-backup-api.txt, the box's own read-only key (user box-backup, made by
# hosts/ansible/bootstrap/opnsense-backup-user.sh), which the prod files copy puts there. Empty does nothing.
agent_box_opnsense_backup: {}
# When the daily OPNsense backup starts (systemd OnCalendar).
agent_box_opnsense_backup_daily: "*-*-* 14:30:00 UTC"
# The daily check of the certificate the firewall serves (needs agent_box_opnsense_backup, whose host it reads).
agent_box_opnsense_cert_check_daily: "*-*-* 16:00:00 UTC"
# The off-box copy of those configurations (pick 222, docs/runbooks/copy-opnsense-backup-off-box.md): restic sends them
# daily to their own container in the Azure backup account (hosts/terraform/azure/backup), signed in as their own app
# with a certificate made on the box. Private, through the inventory, from that folder's tofu outputs: account
# (storage_account_name), client_id (opnsense_client_id), tenant_id, app_object_id (opnsense_app_object_id),
# vault_url (opnsense_vault_url), and optionally repository (opnsense_restic_repository, default
# azure:opnsense-backup:/opnsense), vault_secret (default opnsense-offbox-restic-password), keep_daily (default 30)
# and keep_monthly (default 12). The box makes the repository password itself and writes its one off-box copy
# into that Key Vault. Needs agent_box_opnsense_backup. Empty does nothing.
agent_box_opnsense_offbox: {}
# When the daily off-box copy starts (systemd OnCalendar), after the backup's 14:30 and its random delay.
agent_box_opnsense_offbox_daily: "*-*-* 15:00:00 UTC"
# The box's certificate for that app: days it is valid, and days left when the daily run rolls it.
agent_box_opnsense_offbox_cert_days: 90
agent_box_opnsense_offbox_cert_renew_days: 30
# The Azure CLI on the controller, signed in as agent-azure (the app's owner), for the first certificate upload.
agent_box_az: az
# One SOPS-encrypted bundle a day of the box's private files, to the box's own identity and, when set, the owner's
# Mac (proposed D-0038 rule 10, picks 228 and 236, docs/runbooks/make-the-box-secrets-bundle.md). Through the
# inventory, all optional: mac_recipient (the Mac's age public key, age1..., not a secret), keep (bundles kept on
# the box, 1 to 60, default 14), and for the off-box send, which runs only with agent_box_opnsense_offbox set and offbox: true:
# vault_secret (default secrets-bundle-age-identity), offbox_keep_daily (default 14) and offbox_keep_monthly
# (default 6). Empty does nothing.
agent_box_secrets_bundle: {}
# When the daily bundle is made (systemd OnCalendar).
agent_box_secrets_bundle_daily: "*-*-* 15:30:00 UTC"
# The off-box send (pick 236), after the bundle and its randomized delay.
agent_box_secrets_bundle_offbox_daily: "*-*-* 16:15:00 UTC"
# SOPS (MPL-2.0) and age (BSD-3-Clause) for that bundle, each checked against its SHA-256: SOPS from the release's
# checksums file, age from the release tarball as downloaded on 2026-11-14. No age checksums file was found: the
# release workflow at tag v1.3.2 (.github/workflows/build.yml) uploads only the age-* archives with a build
# provenance attestation, and SHA256SUMS, SHA256SUMS.txt and checksums.txt under that release's downloads
# return 404 (checked 2026-11-14). The release page's asset list itself could not be read from here.
agent_box_sops_version: 3.13.3
agent_box_sops_sha256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
agent_box_age_version: 1.3.2
agent_box_age_sha256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
# restic for the off-box copy, the same release role k8s_backup puts on the nodes, checked against its SHA-256.
agent_box_restic_version: 0.19.1
agent_box_restic_sha256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
# The box's second NIC on the Proxmox host's own subnet (pick 220, docs/runbooks/set-up-the-box-lifeline.md):
# its interface name inside the VM (for example eth1). Private, through the inventory. Empty does nothing.
agent_box_lifeline_interface: ""
# The box's address and prefix on that NIC, for example 192.0.2.50/24 (the host's subnet; no gateway is set). The role
# makes the NIC's one NetworkManager connection from it, because cloud-init sets a NIC up at first boot only.
# Private, through the inventory. Required when the interface is set. Pick one the home router's DHCP
# pool does not hand out: a static address inside the pool can clash with a lease.
agent_box_lifeline_address: ""
# nftables for the lifeline NIC's packet filter. The role installs it only if the package is missing, at this
# version (epoch:version-release, the newest in the AlmaLinux 10 BaseOS when it was read, 2026-11-14).
agent_box_nftables_version: "1:1.1.5-6.el10_2"
# The nft binary the filter's unit and the proof use.
agent_box_nft_bin: /usr/sbin/nft
# What the box may reach over that NIC, and nothing else (the rest is rejected): a list of
# {address: IPv4, ports: [TCP ports]}, normally the Proxmox host's own address and 8006. An entry may add
# uid: <user>, so only that user's sockets get out to it: the host job's tcp 22 is
# {address: <host>, ports: [22], uid: hostops}.
# Private, through the inventory. Empty with the interface set rejects everything over the lifeline.
agent_box_lifeline_allow: []
# The Proxmox host job (wrapper proxmox-host). Its own system user holds the only key that logs in to the
# host as root, in its own folder, so the keys user's wrappers can't read it. The key is made only when
# agent_box_proxmox_host_job is true: the owner's tap (access rights and box limits, D-0042 rule 6). The job's
# inventory (agent_box_proxmox_host) is private and written only by a run from the controller, under the
# `proxmox_host_inventory` tag, which self-applies skip (D-0036 rule 7).
agent_box_host_user: hostops
agent_box_host_dir: /etc/agent-keys-host
agent_box_host_work_dir: /var/lib/agent-box-host
agent_box_proxmox_host_job: false
# Private, through the controller's inventory: {address: the host's lifeline-side IPv4 (the same as its
# agent_box_lifeline_allow entry), hostkey: the host's "ssh-ed25519 AAAA..." public host key}. The certificate's
# names come from proxmox_cert_names. Empty: the inventory is not written and the job refuses to run.
agent_box_proxmox_host: {}
# Private, through the controller's inventory, for the host job's `sso` job (role proxmox_sso): {issuer: Keycloak's
# https://sso.<zone>/realms/lab, address: c1's Gateway IPv4 for the host's /etc/hosts line, optional}. Set, a run from the
# controller also writes {{ agent_box_host_dir }}/proxmox-sso.env, the one PROXMOX_CLIENT_SECRET line of the controller's
# identity.env, owner agent_box_host_user, mode 0600. Empty: no such file, and the sso job refuses to run.
agent_box_proxmox_host_sso: {}
# Any other top-level settings, merged over the rest (for example autoUpdatesChannel).
agent_box_managed_settings_extra: {}
# When the weekly `ci-runner weekly` run starts (systemd OnCalendar): it reinstalls the merged pin on
# the runner, then opens a PR for a newer release (pick 208). Only set up when agent_box_ci_runner is.
agent_box_ci_runner_weekly: "Mon *-*-* 14:00:00 UTC"
# The daily tailnet cleanup (pick 214, docs/runbooks/set-up-the-agent-box.md, "Remove old tailnet
# devices"). Private, through the inventory: tags (the tag:<name> list whose devices may go), keep
# (device names never removed; at least one), days (offline at least this long, 7 or more) and
# max_deletes (a run that would remove more removes none, 1 to 20). Empty leaves the timer unset up.
agent_box_tailnet_cleanup: {}
# When the daily `tailnet-cleanup run` starts (systemd OnCalendar).
agent_box_tailnet_cleanup_daily: "*-*-* 15:30:00 UTC"
# The notebook's CI runner VM that the ci-runner wrapper builds (docs/runbooks/set-up-the-ci-runner.md).
# Private, through the inventory: name, vm_id, address, cores, memory_mb, disk_gb, proxmox_node_name,
# vnet, template_vm_id, github_app_id, repo_owner, repo_name. Empty leaves the wrapper unset up.
agent_box_ci_runner: {}
# The owner's desktop VM that the desktop wrapper builds (docs/runbooks/set-up-the-desktop.md).
# Private, through the inventory: name, vm_id (400-499), address, cores, memory_mb, disk_gb,
# proxmox_node_name, vnet, template_vm_id, rdp_source (the tailnet connector's address, where RDP arrives from) and optionally
# admin_user (default admin). Empty leaves the wrapper unset up.
agent_box_desktop: {}
# The one pull request the checkpoint-note wrapper comments on, written to <work_dir>/checkpoint-note.json:
# repo (one the App is installed on) and number. A session subscribed to it wakes on each comment. Empty leaves the
# file out, and the wrapper refuses.
agent_box_checkpoint_note: {repo: agent-notebook, number: 729}
# The hourly checkpoint scan (files/checkpoint-scan.py): a systemd timer that runs `checkpoint-scan.sh run` as the keys
# user. It reads only, with a token narrowed to Contents and Pull requests read; false leaves the timer off.
agent_box_checkpoint_scan: true
agent_box_checkpoint_scan_on_calendar: "*-*-* *:07:00 UTC"
# The box pickup scan (files/pickup-scan.py): a systemd timer that runs `pickup-scan.sh <mode>` as the keys user every 10
# minutes. It reads only, with a token narrowed to the notebook with Contents and Pull requests read; false leaves the timer off.
# The mode is dry-run (print what it would post, post nothing) or run (post). Dry-run is the default until the owner's
# pick turns posting on, which takes a standing pull request number under the project below. Turned on for agent-notebook on
# 2026-11-19 (standing draft #753), agent-notebook being the first project (Jon, 05:02:30 UTC).
agent_box_pickup_scan: true
agent_box_pickup_mode: run
agent_box_pickup_scan_on_calendar: "*-*-* *:00/10:00 UTC"
# The projects the scan lists, written to <work_dir>/pickup.json: each project's name, as in the task notes' `project` and
# `pickup` fields, with the repository and the number of its standing draft pull request that pickup-note comments on. A
# project with no number can be scanned but not posted for. Only agent-notebook is listed for now.
agent_box_pickup_projects: {agent-notebook: {repo: agent-notebook, number: 753}}
# The owner's pick for a dev run on a node short of memory (docs/runbooks/rebuild-k8s-layer-with-one-command.md): ephemeral-dev
# (the run stops the CI runner, tears dev down at its end, then the runner starts) or keep-dev (the runner stops and dev stays up; the
# notebook's queued jobs fail or are cancelled after 24 hours queued, so if dev stays up for more than a day its daily access-expiry
# check does not run, and whether its alert e-mail goes out is not measured). Empty is no pick: a short node then refuses before it stops anything.
agent_box_short_node: ""
# The secrets store inside the dev cluster (D-0058, dev first; docs/runbooks/set-up-the-secrets-store.md). true writes
# <work_dir>/openbao-in-cluster, and the rebuild wrapper then turns the store on in the dev cluster and puts its seal
# key on the first worker (stage openbao-seal). The wrapper keeps that key as a SOPS copy, so true needs
# agent_box_secrets_bundle set (the box's age identity). false (the default) removes the file: dev runs as before.
agent_box_openbao_in_cluster: false
# The secrets-store wrapper's settings for the store inside the dev cluster (docs/runbooks/set-up-the-secrets-store.md,
# D-0058). Private, through the inventory: address (the store's name as the box reaches it; it must equal the dev
# inventory's k8s_gitops_source_openbao_store_host, D-0058 rule 10), and optionally snapshot_box (default false; true only
# by the owner's install tap of pick 240) and sops_copies (default false; true only by the owner's access-right tap,
# D-0058 rule 9: put, compare and reseed keep SOPS copies, and the weekly compare runs), and box_cidr (the box's own address
# as a /32, which the dev rebuild passes to stage openbao-handover; empty until the box's path to the store is set), and
# admin_address (the store's admin address, one address of dev's load-balancer pool, which needs box_cidr; the dev rebuild
# passes it on and every call goes there, D-0062), and offbox (default false; true only by the owner's tap, since the
# hourly send below holds a delete, its daily prune, D-0042 rule 6). Empty leaves the wrapper unset up.
agent_box_secrets_store: {}
# The same settings for the store inside prod's c1, written to <work_dir>/secrets-store-prod.json for the secrets-store-prod
# wrapper. address must equal the prod inventory's k8s_gitops_source_openbao_store_host (the box's copy,
# <work_dir>/openbao-prod/inventory/hosts.yml, which the openbao-prod wrapper builds from agent_box_openbao_prod.store_host);
# snapshot_box and sops_copies as above, each set only by its own tap. It makes no recovery shares (D-0038 rule 5: prod
# gets none). Empty leaves it unset up.
agent_box_secrets_store_prod: {}
# The openbao-prod wrapper's settings, private, written to <work_dir>/openbao-prod.json: seal_node (the prod k8s_nodes host
# that holds the seal key, by its Kubernetes node name), store_host (the store's name as the box reaches it) and box_cidr
# (the box's address as a /32, empty until the box's path to the store is set), and admin_address (the store's admin
# address, one address of prod's load-balancer pool, which needs box_cidr; secrets-store-prod then calls it, D-0062; set
# it only once the firewall lets the box reach it, D-0036 rule 8). Empty leaves the file out.
agent_box_openbao_prod: {}
# When the weekly compare of the store with its SOPS copy runs (systemd OnCalendar), once sops_copies is true.
agent_box_secrets_store_compare_on_calendar: "Mon *-*-* 05:00:00"
# The dev store's hourly snapshot off the box (pick 237, docs/runbooks/set-up-the-secrets-store.md), set up only when
# agent_box_secrets_store and agent_box_opnsense_offbox are both set and agent_box_secrets_store.offbox is true. Its own
# restic repository in pick 222's container, with pick 222's password; keeps 48 hourly, 14 daily and 6 monthly;
# prunes once a day, on the first run from 03:00 UTC.
agent_box_secrets_store_offbox:
  repository: azure:opnsense-backup:/openbao-dev
  keep_hourly: 48
  keep_daily: 14
  keep_monthly: 6
  prune_after_hour: 3
agent_box_secrets_store_offbox_on_calendar: hourly
# Private settings for the vps-host wrapper (D-0046), written to <work_dir>/vps-host.json: name (the VPS's name on
# the tailnet). Empty does nothing.
agent_box_vps_host: {}
# Private settings for the opnsense-test wrapper, written to <work_dir>/opnsense-test.json: name (STD-0001), address
# (the test VM's dev address), keycloak_address (this box's address the test VM reaches), cores, memory_mb (3072 or
# more), disk_gb (16 or more) and proxmox_node_name. The VM ID is fixed at 257. Empty leaves the wrapper's tools,
# filter and settings unset up.
agent_box_opnsense_test: {}
# The first subordinate UID and GID of the keys user, for the proof's rootless Keycloak container (65536 of each).
agent_box_opnsense_test_subid_start: 300000
# Settings for the lab-test wrapper, written to <work_dir>/lab-test.json: name (STD-0001), domain (the copy's search
# domain), address (its dev address), cores (2 or more), memory_mb (7168 or more), disk_gb (32 or more) and, only if
# the inventory sets it, proxmox_node_name. The VM ID is fixed at 256 (docs/specs/2026-11-lab-test-copy.md). The copy
# is a throwaway on dev's VLAN, so these defaults are made up: a name in the STD-0001 form that no real host has, a
# .invalid domain (RFC 6761: it never resolves) and one address in dev's 10.1.30.0/24 below the load-balancer pool
# (docs/standards/0002-ip-address-plan.md). Without a proxmox_node_name the wrapper reads the node at run time from the
# Proxmox API (GET /nodes) with the agents' token, so no node name is written into the repository.
agent_box_lab_test_default:
  name: ddehvlabtest01
  domain: lab-test.invalid
  address: 10.1.30.199
  cores: 2
  memory_mb: 7168
  disk_gb: 32
# The inventory's own settings, merged over the default key by key. Empty uses the default as it is.
agent_box_lab_test: {}
# false skips the wrapper's assistant, helper and settings file.
agent_box_lab_test_enabled: true
# proxmox-auto-install-assistant for the lab-test wrapper, matching the Proxmox VE 9.2 ISO it prepares; the sha256 is
# the package's line in pve-no-subscription's trixie Packages index (read 2026-11-18). Its download is plain http,
# so the pin is the only integrity check.
agent_box_pve_assistant_version: 9.2.8
agent_box_pve_assistant_base: http://download.proxmox.com/debian/pve/dists/trixie/pve-no-subscription/binary-amd64
agent_box_pve_assistant_sha256: 94b562ac026bf9a989e0a5834538ad24e38606f8858367af0e665af0bcbdc2e2
# The controller's private files the prod_files tasks copy to <keys_dir>/prod (D-0035; paths from
# docs/runbooks/rebuild-home-lab-from-scratch.md). from: clone (the controller's checkout of this
# repo) or config (~/.config/central-hub). A missing file is skipped and named. Not listed on purpose:
# the Proxmox apply token, the Cloudflare bootstrap token, the nodes' SSH keys, and the lab root CA's key and
# passphrase (lab-ca/root.key, lab-ca/lab-ca.env), needed only to sign the next intermediate.
# The lab CA files listed are the three rebuild-prod.sh points the prod inventory at (k8s_certs_lab_ca_cert_file,
# k8s_certs_lab_ca_key_file, k8s_gitops_sso_root_ca_file): c1's intermediate chain, its key and the public root.
agent_box_prod_files:
  - {from: clone, path: hosts/.env, dest: hosts.env}
  - {from: clone, path: hosts/ansible/inventories/home/hosts.yml, dest: inventory-hosts.yml}
  - {from: config, path: identity.env, dest: identity.env}
  - {from: config, path: signin-check.json, dest: signin-check.json}
  - {from: clone, path: hosts/terraform/home/certificates/home.tfvars, dest: tfvars/certificates.tfvars}
  - {from: clone, path: hosts/terraform/home/dns-token/home.tfvars, dest: tfvars/dns-token.tfvars}
  - {from: clone, path: hosts/terraform/home/dns/home.tfvars, dest: tfvars/dns.tfvars}
  - {from: clone, path: hosts/terraform/home/jumpbox/home.tfvars, dest: tfvars/jumpbox.tfvars}
  - {from: clone, path: hosts/terraform/home/k8s/home.tfvars, dest: tfvars/k8s.tfvars}
  - {from: clone, path: hosts/terraform/home/tailnet-policy/home.tfvars, dest: tfvars/tailnet-policy.tfvars}
  - {from: clone, path: hosts/terraform/home/tailnet/home.tfvars, dest: tfvars/tailnet.tfvars}
  - {from: clone, path: hosts/terraform/home/dns/home.records.tfvars.json, dest: tfvars/dns.records.tfvars.json}
  - {from: config, path: opnsense-api.txt, dest: opnsense-api.txt}
  - {from: config, path: opnsense-backup-api.txt, dest: opnsense-backup-api.txt}
  - {from: config, path: secret-source.env, dest: secret-source.env}
  - {from: config, path: c1-secrets-encryption.key, dest: c1-secrets-encryption.key}
  - {from: config, path: cloudflare-dns.token, dest: cloudflare-dns01-token.txt}
  - {from: config, path: pve-root-ca.pem, dest: pve-root-ca.pem}
  - {from: config, path: lab-ca/root.crt, dest: lab-ca/root.crt}
  - {from: config, path: lab-ca/c1-intermediate-chain.crt, dest: lab-ca/c1-intermediate-chain.crt}
  - {from: config, path: lab-ca/c1-intermediate.key, dest: lab-ca/c1-intermediate.key}
# Switch for the prod_files tasks, which copy the controller's private lab files to the box. Off: a
# run that copies them is a decision (docs/runbooks/set-up-the-agent-box.md, "Copy the controller's
# private files to the box"), so it is turned on for one run and off again.
agent_box_copy_prod_files: false
# Where the sign-in theme folder is on the controller (the same value as k8s_identity_theme_dir in its inventory), for the
# prod_files tasks, which copy it to <keys_dir>/prod/identity-theme/<its name>. Private: set it in the inventory. Empty: not
# copied, and c1-ansible refuses to run identity when the inventory names a theme folder the box does not hold.
agent_box_prod_theme_src: ""
# Where the controller's private clone of this repo is (the one that holds the git-ignored hosts/.env,
# the filled-in inventory and the home.tfvars files), as an absolute path on the controller. Private:
# set it in the inventory. Empty means the checkout the playbook runs from, which has none of them when
# the controller runs from a pinned copy.
agent_box_prod_files_clone: ""

# box-apply (D-0036; docs/runbooks/apply-the-agent-box-from-itself.md): when true, the role installs the
# root-owned box-apply wrapper and its one sudo line, so a session can apply this role to the box itself from
# reviewed main, stopping on any change to the box's limits. Turned on in the private inventory.
agent_box_self_apply: false
# Tags a self-apply skips: tasks that read the controller's files (ca, prod_files, and the off-box copy's
# certificate upload), the lifeline's firewall (D-0036 rule 8) and the proofs. A limit itself (defaults key).
agent_box_self_apply_skip_tags: [ca, prod_files, opnsense_offbox, lifeline, verify, proxmox_host_inventory]
# The commit a controller's pinned copy was made from, when that copy is not a git checkout (-e only).
agent_box_self_apply_commit: ""
# Set by box-apply on its own runs (-e); the box-apply tasks then write nothing.
agent_box_self_applying: false
# Set by box-apply, with agent_box_self_applying, on an approved limit apply (-e; pick 232): the box-apply tasks
# then write box-apply, its settings and its limits, never its inventory.
agent_box_limit_apply: false
# A root timer that runs `box-apply apply` on its own, so a merged change reaches the box without a session
# remembering to run it. It does no more than a session's run: it stops on any limit change with no approval line.
agent_box_self_apply_timer: true
agent_box_self_apply_interval: 10min

# The dev rebuild's timer run (files/rebuild.sh auto, TASK-0291 row 2b): every interval it builds main's newest commit on
# dev, but only when no rebuild run is going, the newest full run did not already build that commit, a file under hosts/
# changed since the newest full pass, and the memory preflight fits without stopping the owner's desktop VM. Each run
# that starts stops VM 300 for its length under ephemeral-dev, as a hand run does.
agent_box_rebuild_auto: true
agent_box_rebuild_auto_interval: 2h

# The merge sweep (D-0042 rule 2): a systemd timer that runs `pr-merge.sh sweep` as the keys user. Off until the inventory
# turns it on, because installing it is a change to the box's limits (D-0042 rule 6).
agent_box_merge_sweep: false
agent_box_merge_sweep_interval: 5min
