---
# The VPS apps host (D-0046). Order: packages, users, deploy and vps-apply, Valkey's settings, then the check
# that nothing new listens on a public address. No secret is made here: `vps-apply secrets` makes them (S5).

- name: Read the OS release
  ansible.builtin.slurp:
    src: /etc/os-release
  register: vps_app_host_os_release

- name: Refuse anything but AlmaLinux 10, the release the package list was measured on
  vars:
    vps_app_host_os: "{{ vps_app_host_os_release.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - vps_app_host_os is search('^ID="?almalinux"?$', multiline=True)
      - vps_app_host_os is search('^VERSION_ID="?10(\\.[0-9]+)?"?$', multiline=True)
    fail_msg: The VPS apps host role is written for AlmaLinux 10 only.
    quiet: true

- name: Packages from AlmaLinux's own repositories
  ansible.builtin.dnf:
    name: "{{ vps_app_host_packages }}"
    state: present

- name: One user per app, with no password and no login shell
  ansible.builtin.user:
    name: "{{ item }}"
    system: false
    shell: /sbin/nologin
    password: "!"
    create_home: true
  loop: "{{ vps_app_host_app_users }}"

- name: Read the subordinate IDs rootless Podman needs
  ansible.builtin.command: cat /etc/subuid /etc/subgid
  register: vps_app_host_subids
  changed_when: false

- name: Check each app user has subordinate user and group IDs
  ansible.builtin.assert:
    that: (vps_app_host_subids.stdout_lines | select('match', '^' ~ item ~ ':') | list | length) == 2
    fail_msg: "{{ item }} has no line in /etc/subuid or /etc/subgid; rootless Podman cannot run for it."
    quiet: true
  loop: "{{ vps_app_host_app_users }}"

# Linger lets each app user's systemd units run with no one signed in.
- name: Let each app user's own services run with no session
  ansible.builtin.command: loginctl enable-linger {{ item }}
  args:
    creates: /var/lib/systemd/linger/{{ item }}
  loop: "{{ vps_app_host_app_users }}"

- name: User deploy, the box's only way in after the narrowing, with no password
  ansible.builtin.user:
    name: "{{ vps_app_host_deploy_user }}"
    system: false
    shell: /bin/bash
    password: "!"
    create_home: true

- name: vps-apply, which applies this role from reviewed main and makes the host's secrets
  ansible.builtin.copy:
    src: vps-apply.py
    dest: "{{ vps_app_host_apply_path }}"
    owner: root
    group: root
    mode: "0755"

- name: vps-apply's folder, root only
  ansible.builtin.file:
    path: "{{ vps_app_host_apply_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Sudo for deploy, vps-apply with fixed first arguments only, checked with visudo
  ansible.builtin.template:
    src: sudoers-vps-apply.j2
    dest: /etc/sudoers.d/vps-apply
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Valkey listens on loopback only
  ansible.builtin.lineinfile:
    path: "{{ vps_app_host_valkey_conf }}"
    regexp: '^bind '
    line: bind 127.0.0.1 -::1
  notify: Restart Valkey if it runs

- name: Valkey's port
  ansible.builtin.lineinfile:
    path: "{{ vps_app_host_valkey_conf }}"
    regexp: '^port '
    line: port {{ vps_app_host_valkey_port }}
  notify: Restart Valkey if it runs

- name: Valkey refuses clients from other addresses even if bind changes
  ansible.builtin.lineinfile:
    path: "{{ vps_app_host_valkey_conf }}"
    regexp: '^protected-mode '
    line: protected-mode yes
  notify: Restart Valkey if it runs

- name: Valkey reads its password from the file vps-apply writes
  ansible.builtin.lineinfile:
    path: "{{ vps_app_host_valkey_conf }}"
    regexp: '^include {{ vps_app_host_valkey_secret_conf }}$'
    line: include {{ vps_app_host_valkey_secret_conf }}
  notify: Restart Valkey if it runs

- name: Look for Valkey's password file
  ansible.builtin.stat:
    path: "{{ vps_app_host_valkey_secret_conf }}"
  register: vps_app_host_valkey_secret

# Valkey stays off until `vps-apply secrets` has made its password (S5): with no password file it would
# not start, and without a password it must not.
- name: Valkey runs once its password exists
  ansible.builtin.systemd_service:
    name: valkey
    enabled: true
    state: started
  when: vps_app_host_valkey_secret.stat.exists

- name: Read the listening TCP sockets
  ansible.builtin.command: ss -Htln
  register: vps_app_host_listeners
  changed_when: false

# Not public: loopback, and the tailnet's own ranges, 100.64.0.0/10 and fd7a:115c:a1e0::/48 (Tailscale's address ranges).
- name: Check nothing new listens on a public address
  vars:
    vps_app_host_public: >-
      {{ vps_app_host_listeners.stdout_lines
         | map('split') | map(attribute=3)
         | reject('match', '^(127\.|\[::1\]|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.|\[fd7a:115c:a1e0:)')
         | map('regex_replace', '^.*:', '') | map('int') | unique
         | difference(vps_app_host_public_ports_allowed) | list }}
  ansible.builtin.assert:
    that: vps_app_host_public | length == 0
    fail_msg: "Ports listening on a public address that D-0046 does not allow: {{ vps_app_host_public | join(', ') }}"
    quiet: true
