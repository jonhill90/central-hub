---
# Not private. The VPS apps host (D-0046, docs/runbooks/set-up-the-vps-app-host.md): one Linux user per app,
# each with its own rootless Podman; user `deploy`, whose sudo allows `vps-apply` and nothing else; Valkey on
# loopback for OmniRoute. This role makes no secret: `vps-apply secrets` makes them after the tailnet's SSH
# logins are narrowed (D-0046 rule 4, S5).

# AlmaLinux 10 appstream packages (D-0046 evidence, finding 6). Node 24 comes with OpenClaw's own change.
vps_app_host_packages: [podman, catatonit, valkey, git-core, ansible-core, sudo]

# One user per app. Normal users, not system users, so useradd gives each its subordinate IDs for rootless
# Podman (login.defs SUB_UID_COUNT). No password, no login shell.
vps_app_host_app_users: [omniroute, openclaw, hermes]

# The user the box's wrapper signs in as after the narrowing (S4). Its sudo allows vps-apply only.
vps_app_host_deploy_user: deploy

# vps-apply: the VPS applies this role to itself from reviewed main, as the agent box does (D-0036).
vps_app_host_apply_path: /usr/local/sbin/vps-apply
vps_app_host_apply_dir: /var/lib/vps-apply
vps_app_host_repo_url: https://github.com/jonhill90/central-hub.git

# Valkey, OmniRoute's Redis-protocol store, on loopback only, with the password vps-apply makes.
vps_app_host_valkey_conf: /etc/valkey/valkey.conf
vps_app_host_valkey_secret_conf: /etc/valkey/vps-secret.conf
vps_app_host_valkey_port: 6379

# Ports allowed to listen on an address that is not loopback or the tailnet's. 22 is the owner's sshd,
# which this role does not change (D-0046, Consequences). Anything else fails the run.
vps_app_host_public_ports_allowed: [22]

# F144: close the public SSH door and turn the host firewall on. Off until the owner's card for it
# (D-0042 rule 6). See tasks/harden.yml.
vps_app_host_harden: false
vps_app_host_tailnet_interface: tailscale0
# With hardening on, whether the public zone still lets in port 22 (the owner's sshd from the internet). false closes it:
# sshd is then reached only over the tailnet, whose interface is trusted, and Tailscale SSH does not use sshd at all.
# Jon, 2026-11-19 04:40:35 UTC: "make sure that VPS is setup and on the tailnet and not available to ssh to over internet."
# The provider's own web console stays the way back if the tailnet is down.
vps_app_host_public_ssh: false

# The apps' Quadlet unit files (D-0046 rule 11): hosts/vps-apps/<app>/<app>.container. The playbook runs from a
# checkout of reviewed main, so they are read from there. Each lands in its user's ~/.config/containers/systemd/.
vps_app_host_units_dir: "{{ playbook_dir }}/../../vps-apps"
