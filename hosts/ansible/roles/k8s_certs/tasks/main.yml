---
# argument_specs accepts an empty string, and the inventory template has "" blanks for these.
- name: Check that the private values are not blank
  ansible.builtin.assert:
    that:
      - lookup('vars', item, default='') | length > 0
    fail_msg: "{{ item }} is a private value; fill it from the secret store."
    quiet: true
  loop: >-
    {{ ['k8s_certs_zone']
       + (['k8s_certs_acme_email', 'k8s_certs_cloudflare_token_file', 'k8s_certs_gateway_address']
          if k8s_certs_issue else []) }}
  tags: [always]

# Skipped once Argo CD manages cert-manager (app cert-manager); the issuers and the certificate
# below stay with this role until the lab PKI work moves them.
- name: cert-manager
  ansible.builtin.import_tasks: install.yml
  when: not k8s_certs_cert_manager_by_argocd | bool
  tags: [certmanager]

- name: cert-manager's old Helm release records, once Argo CD manages it
  ansible.builtin.command: >-
    kubectl -n {{ k8s_certs_namespace }} delete secret -l owner=helm,name=cert-manager
    --ignore-not-found -o name
  register: k8s_certs_helm_records
  changed_when: k8s_certs_helm_records.stdout | length > 0
  when: k8s_certs_cert_manager_by_argocd | bool
  tags: [certmanager]

- name: Issuers and the certificate, or their removal while issuing is off
  ansible.builtin.import_tasks: issue.yml
  tags: [issue]

- name: Smoke test
  ansible.builtin.import_tasks: smoke.yml
  tags: [smoke]
