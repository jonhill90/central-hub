---
# Reader mode (dev, TASK-0240, agent pick 205): restore prod's newest volume snapshot into this env's
# data disk, before Argo CD makes the claims. The work is c1-restore-volumes.sh on each node, which
# stops at the first mismatch; it prints the snapshot ID and each folder's file count and bytes, and
# those lines are shown here so the rebuild's log keeps them. Runbook:
# docs/runbooks/rebuild-k8s-layer-with-one-command.md, "Restore on dev".

- name: restore | The prod node whose snapshot comes back is set
  ansible.builtin.assert:
    that:
      - k8s_backup_restore_source_host | length > 0
      - k8s_backup_restore_path is match('^/')
    fail_msg: >-
      Set k8s_backup_restore_source_host (the short host name of prod's node that holds the
      volumes, as `restic snapshots` lists it) in this env's inventory. Nothing was changed.
    quiet: true

- name: restore | Restore and check each folder
  ansible.builtin.command:
    argv: ["{{ k8s_backup_bin_dir }}/c1-restore-volumes.sh", restore]
  environment:
    CENTRAL_HUB_BACKUP_ENV: "{{ k8s_backup_node_env_file }}"
    BACKUP_STATE: "{{ k8s_backup_state_dir }}"
    RESTIC_CACHE_DIR: /var/cache/central-hub-backup
    RESTORE_SOURCE_HOST: "{{ k8s_backup_restore_source_host }}"
    RESTORE_PATH: "{{ k8s_backup_restore_path }}"
    RESTORE_SNAPSHOT: "{{ k8s_backup_restore_snapshot }}"
  register: k8s_backup_restore
  changed_when: "'RESTORED' in k8s_backup_restore.stdout"
  when: not ansible_check_mode

- name: restore | What came back (snapshot, then folder, files, bytes)
  ansible.builtin.debug:
    msg: "{{ k8s_backup_restore.stdout_lines | select('match', '^(snapshot|folder|canary|PASS|RESTORED|ALREADY|SKIP)') | list }}"
  when: not ansible_check_mode

# A node without the data disk restores nothing (SKIP). At least one node in the run must have
# restored, or the env has no data and the run must say so.
- name: restore | At least one node holds the restored volumes
  ansible.builtin.assert:
    that: >-
      ansible_play_hosts | map('extract', hostvars, ['k8s_backup_restore', 'stdout'])
      | select('search', '(?m)^PASS') | list | length > 0
    fail_msg: No node in this run restored anything (every node said SKIP, so none has its data disk mounted).
    quiet: true
  run_once: true
  when: not ansible_check_mode
