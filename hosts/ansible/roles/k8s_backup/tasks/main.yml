---
# Off-box backups of c1 (TASK-0194, TASK-0094). Runs on every node (playbooks/k8s-backup.yml): the
# control plane backs up etcd, every node backs up the volume folders it holds. Tags: install
# (tools and scripts), timers (env file and systemd timers), drill (back up now, then run the
# restore tests). In reader mode (k8s_backup_reader, dev) also restore (bring prod's newest volume
# snapshot back into this env) and restore_check (prove it, after the apps synced).

# A reader must never write to the repository, so it never runs the backup timers.
- name: install | Reader mode and backups are not both on
  ansible.builtin.assert:
    that: not (k8s_backup_enabled and k8s_backup_reader)
    fail_msg: >-
      k8s_backup_enabled and k8s_backup_reader are both true. A reader (dev) restores only and must
      never back up into prod's repository. Nothing was changed.
    quiet: true
  tags: [install, timers, drill, restore, restore_check]

- name: install | Settings are complete when backups are on
  ansible.builtin.assert:
    that:
      - k8s_backup_env_file | length > 0
    fail_msg: >-
      k8s_backup_enabled is true but k8s_backup_env_file is empty. Make the env file on the
      controller first (docs/runbooks/back-up-c1-off-box.md, step 1).
    quiet: true
  when: k8s_backup_enabled or k8s_backup_reader
  tags: [install, timers, drill, restore]

- name: install | The env file on the controller
  ansible.builtin.stat:
    path: "{{ k8s_backup_env_file }}"
  register: k8s_backup_env_stat
  delegate_to: localhost
  become: false
  run_once: true
  when: k8s_backup_enabled or k8s_backup_reader
  tags: [install, timers, drill, restore]

# The file holds the repository password, so only its owner may read it.
- name: install | Stop if the env file is missing or readable by others
  ansible.builtin.assert:
    that:
      - k8s_backup_env_stat.stat.exists
      - k8s_backup_env_stat.stat.size > 0
      - k8s_backup_env_stat.stat.mode in ['0600', '0400']
    fail_msg: >-
      {{ k8s_backup_env_file }} must exist on the controller, not be empty, and be mode 0600 or
      0400. Nothing was changed.
    quiet: true
  when: k8s_backup_enabled or k8s_backup_reader
  tags: [install, timers, drill, restore]

- name: install | bzip2 for the restic release file, openssl for the Azure certificate
  ansible.builtin.dnf:
    name: [bzip2, openssl]
    state: present
  tags: [install]

- name: install | Folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ k8s_backup_bin_dir }}"
    - "{{ k8s_backup_bin_dir }}/downloads"
    - "{{ k8s_backup_node_env_file | dirname }}"
    - "{{ k8s_backup_state_dir }}"
  # Made in --check too, so the downloads into them can be checked (empty, root-only folders).
  check_mode: false
  tags: [install]

- name: install | restic release file, checked against its SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/restic/restic/releases/download/v{{ k8s_backup_restic_version }}/restic_{{ k8s_backup_restic_version }}_linux_amd64.bz2"
    dest: "{{ k8s_backup_bin_dir }}/downloads/restic_{{ k8s_backup_restic_version }}.bz2"
    checksum: "sha256:{{ k8s_backup_restic_sha256 }}"
    mode: "0600"
  tags: [install]

# One file per version, so a version change never leaves a half-written binary in use.
- name: install | restic {{ k8s_backup_restic_version }}
  ansible.builtin.shell: >-
    set -o pipefail &&
    bunzip2 -c {{ k8s_backup_bin_dir }}/downloads/restic_{{ k8s_backup_restic_version }}.bz2
    > {{ k8s_backup_bin_dir }}/restic-{{ k8s_backup_restic_version }}.new &&
    chmod 0755 {{ k8s_backup_bin_dir }}/restic-{{ k8s_backup_restic_version }}.new &&
    mv {{ k8s_backup_bin_dir }}/restic-{{ k8s_backup_restic_version }}.new {{ k8s_backup_bin_dir }}/restic-{{ k8s_backup_restic_version }}
  args:
    executable: /bin/bash
    creates: "{{ k8s_backup_bin_dir }}/restic-{{ k8s_backup_restic_version }}"
  tags: [install]

- name: install | restic points at that version
  ansible.builtin.file:
    src: restic-{{ k8s_backup_restic_version }}
    dest: "{{ k8s_backup_bin_dir }}/restic"
    state: link
    force: "{{ not ansible_check_mode }}"
  tags: [install]

- name: install | etcd release file, checked against its SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/v{{ k8s_backup_etcd_version }}/etcd-v{{ k8s_backup_etcd_version }}-linux-amd64.tar.gz"
    dest: "{{ k8s_backup_bin_dir }}/downloads/etcd-v{{ k8s_backup_etcd_version }}.tar.gz"
    checksum: "sha256:{{ k8s_backup_etcd_sha256 }}"
    mode: "0600"
  when: k8s_backup_is_control_plane
  tags: [install]

# Only the control plane needs them. They go in the role's own folder, not on the PATH, so nothing
# else runs this etcd.
- name: install | etcd, etcdctl and etcdutl {{ k8s_backup_etcd_version }}
  ansible.builtin.unarchive:
    src: "{{ k8s_backup_bin_dir }}/downloads/etcd-v{{ k8s_backup_etcd_version }}.tar.gz"
    dest: "{{ k8s_backup_bin_dir }}"
    remote_src: true
    creates: "{{ k8s_backup_bin_dir }}/etcd-v{{ k8s_backup_etcd_version }}-linux-amd64/etcdutl"
    owner: root
    group: root
  when: k8s_backup_is_control_plane
  tags: [install]

- name: install | etcd tools point at that version
  ansible.builtin.file:
    src: etcd-v{{ k8s_backup_etcd_version }}-linux-amd64/{{ item }}
    dest: "{{ k8s_backup_bin_dir }}/{{ item }}"
    state: link
    force: "{{ not ansible_check_mode }}"
  loop: [etcd, etcdctl, etcdutl]
  when: k8s_backup_is_control_plane
  tags: [install]

- name: install | Scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ k8s_backup_bin_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - c1-backup-lib.sh
    - c1-backup-etcd.sh
    - c1-backup-volumes.sh
    - c1-restore-test-etcd.sh
    - c1-restore-test-volumes.sh
    - c1-backup-azure-cert.py
    - c1-restore-volumes.sh
  # Also with --tags restore or restore_check alone, so a check run gets the script it calls.
  tags: [install, restore, restore_check]

# restic uses an account key or SAS when one is set, before any other sign-in, so neither may come
# from the controller's env file once the nodes have their own identity.
- name: timers | No Azure key or SAS in the controller's env file
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.file', k8s_backup_env_file) is not search('(?m)^\\s*(export\\s+)?AZURE_ACCOUNT_(KEY|SAS)=')
    fail_msg: >-
      {{ k8s_backup_env_file }} sets AZURE_ACCOUNT_KEY or AZURE_ACCOUNT_SAS. Remove the line: the
      nodes sign in with their own certificate. Nothing was changed.
    quiet: true
  no_log: true
  when: (k8s_backup_enabled or k8s_backup_reader) and k8s_backup_azure_identity
  tags: [timers]

- name: timers | Azure sign-in for the nodes
  ansible.builtin.include_tasks:
    file: azure_identity.yml
    apply:
      tags: [timers]
  when: (k8s_backup_enabled or k8s_backup_reader) and k8s_backup_azure_identity
  tags: [timers]

# The controller's env file, plus the Azure sign-in lines when the identity is on.
- name: timers | The env file on the node
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', k8s_backup_env_file) }}\n{{ k8s_backup_azure_env_lines | default('') }}"
    dest: "{{ k8s_backup_node_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: k8s_backup_enabled or k8s_backup_reader
  tags: [timers]

- name: timers | No env file on the node when backups are off
  ansible.builtin.file:
    path: "{{ k8s_backup_node_env_file }}"
    state: absent
  when: not (k8s_backup_enabled or k8s_backup_reader)
  tags: [timers]

# The repository is made here, once, from one node, before any timer or drill can start a backup.
# When every node made it on its first backup, two nodes ran `restic init` at the same second
# (c1, 2026-11-09 04:11:25 UTC): each wrote its own key, and the repository failed with
# "ciphertext verification failed". The scripts still make a missing repository (for CI's local
# one), but on the cluster it already exists by then.
- name: timers | Make the restic repository once, if it is not there
  ansible.builtin.shell: >-
    set -o pipefail &&
    set -a && . {{ k8s_backup_node_env_file }} && set +a &&
    if {{ k8s_backup_bin_dir }}/restic cat config >/dev/null 2>&1; then echo exists;
    else {{ k8s_backup_bin_dir }}/restic init >/dev/null && echo made; fi
  args:
    executable: /bin/bash
  environment:
    RESTIC_CACHE_DIR: /var/cache/central-hub-backup
  register: k8s_backup_repo_init
  changed_when: k8s_backup_repo_init.stdout == 'made'
  run_once: true
  when: k8s_backup_enabled and not ansible_check_mode
  tags: [timers, drill]

- name: timers | systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: /etc/systemd/system/{{ item.dest }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ k8s_backup_units }}"
  loop_control:
    label: "{{ item.dest }}"
  register: k8s_backup_units_written
  tags: [timers]

- name: timers | Timers on or off
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: "{{ k8s_backup_enabled }}"
    state: "{{ 'started' if k8s_backup_enabled else 'stopped' }}"
    daemon_reload: "{{ k8s_backup_units_written is changed }}"
  loop: "{{ k8s_backup_timers }}"
  tags: [timers]

# apply: a tag on include_tasks is not passed to the tasks it includes, so without it
# `--tags drill` ran nothing (measured on c1, 2026-11-09).
- name: drill | Back up now, then run the restore tests
  ansible.builtin.include_tasks:
    file: drill.yml
    apply:
      tags: [drill]
  when: k8s_backup_enabled and k8s_backup_drill
  tags: [drill]

# Reader mode only (dev, playbooks/k8s-restore.yml). restore runs before Argo CD exists in the env,
# so the provisioner later finds each volume's folder already there (agent pick 205).
- name: restore | Bring prod's newest volume snapshot back into this env
  ansible.builtin.include_tasks:
    file: restore.yml
    apply:
      tags: [restore]
  when: k8s_backup_reader
  tags: [restore]

# Only when asked for (tag restore_check), from the rebuild's checks stage, after the apps synced.
- name: restore_check | Prove the restored folders are the apps' volumes
  ansible.builtin.include_tasks:
    file: restore_check.yml
    apply:
      tags: [restore_check]
  when: k8s_backup_reader
  tags: [restore_check, never]
