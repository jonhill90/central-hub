---
# Tag drill, with k8s_backup_drill: true. Runs the same services the timers run, so the drill tests
# what runs every night; then shows each test's last lines.
- name: drill | Back up now
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop: "{{ k8s_backup_backup_services }}"
  changed_when: true
  # One node at a time: starting a oneshot service waits until it ends, so no two backups write to
  # the repository at once.
  throttle: 1

- name: drill | Run the restore tests
  ansible.builtin.systemd_service:
    name: c1-restore-test.service
    state: started
  changed_when: true
  throttle: 1

- name: drill | What the restore tests said
  ansible.builtin.command: journalctl -u c1-restore-test.service --since -30min --no-pager -o cat
  register: k8s_backup_drill_log
  changed_when: false

- name: drill | Restore tests passed
  ansible.builtin.assert:
    that:
      - "k8s_backup_drill_log.stdout_lines | select('search', ' PASS: ') | list | length >= k8s_backup_drill_expected | int"
    fail_msg: "{{ k8s_backup_drill_log.stdout_lines[-15:] }}"
    success_msg: "{{ k8s_backup_drill_log.stdout_lines | select('search', 'PASS: ') | list }}"
