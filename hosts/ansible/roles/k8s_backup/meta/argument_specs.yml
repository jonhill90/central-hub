---
argument_specs:
  main:
    short_description: >-
      Off-box backups of c1's etcd and volumes with restic, and weekly restore tests (TASK-0194, TASK-0094)
    options:
      k8s_backup_enabled:
        type: bool
        default: false
        description: >-
          Copy the env file to the nodes and run the timers. With false, tools and scripts are
          installed and the timers are off.
      k8s_backup_env_file:
        type: str
        default: ""
        description: >-
          The 0600 env file on the controller with RESTIC_REPOSITORY, RESTIC_PASSWORD and the
          target's credentials. Private, no default; needed when k8s_backup_enabled is true.
      k8s_backup_azure_identity:
        type: bool
        default: false
        description: >-
          Sign in to Azure Blob as the backup app with a certificate made on each node, uploaded
          once by the controller and rolled by a daily timer on the node; adds the sign-in lines to
          the node env file.
      k8s_backup_azure_account: {type: str, default: "", description: "Storage account name (tofu output storage_account_name). Private."}
      k8s_backup_azure_client_id: {type: str, default: "", description: "The backup app's client ID (tofu output client_id)."}
      k8s_backup_azure_tenant_id: {type: str, default: "", description: "The Entra ID tenant (tofu output tenant_id)."}
      k8s_backup_azure_app_object_id: {type: str, default: "", description: "The backup app's object ID (tofu output app_object_id)."}
      k8s_backup_azure_cert_file: {type: str, default: /etc/central-hub/azure/backup.pem, description: "The node's key and certificate, one 0600 PEM file."}
      k8s_backup_azure_fixed_cert_file:
        type: str
        default: ""
        description: "Reader only: controller path of a PEM (key and certificate) the read-only app knows; the nodes copy it. Empty: each node makes its own."
      k8s_backup_azure_cert_days: {type: int, default: 90, description: Days each certificate lasts.}
      k8s_backup_azure_cert_renew_days: {type: int, default: 30, description: Days left at which the node rolls its certificate.}
      k8s_backup_azure_cert_schedule: {type: str, default: "*-*-* 01:40:00", description: systemd OnCalendar for the daily renewal check.}
      k8s_backup_az: {type: str, default: az, description: The Azure CLI on the controller.}
      k8s_backup_bin_dir: {type: str, default: /usr/local/libexec/central-hub-backup, description: Where the tools and scripts go on the nodes.}
      k8s_backup_node_env_file: {type: str, default: /etc/central-hub/backup.env, description: The env file's path on the nodes.}
      k8s_backup_state_dir: {type: str, default: /var/lib/central-hub-backup, description: Local state on the nodes (the canary record).}
      k8s_backup_restic_version: {type: str, default: 0.19.1, description: "restic release (STD-0003)."}
      k8s_backup_restic_sha256:
        type: str
        default: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
        description: SHA-256 of that release's linux_amd64 file.
      k8s_backup_etcd_version:
        type: str
        default: 3.7.2
        description: "etcd release for etcdctl, etcdutl and etcd; same minor as c1's etcd (STD-0003)."
      k8s_backup_etcd_sha256:
        type: str
        default: 3a3679bc51a4ee9d30bccea1da7cd4fe62c6fc1d2ca1255068d2c53bf3026135
        description: SHA-256 of that release's linux-amd64 tarball.
      k8s_backup_etcd_schedule: {type: str, default: "*-*-* 02:10:00", description: systemd OnCalendar for the etcd backup.}
      k8s_backup_volumes_schedule: {type: str, default: "*-*-* 02:25:00", description: systemd OnCalendar for the volume backup.}
      k8s_backup_restore_test_schedule: {type: str, default: "Sun *-*-* 04:30:00", description: systemd OnCalendar for the restore tests.}
      k8s_backup_volume_paths:
        type: list
        elements: str
        default: [/var/lib/c1-data/local-path, /var/lib/central-hub/identity-postgres]
        description: Folders backed up on each node; missing ones are skipped.
      k8s_backup_keep_daily: {type: int, default: 7, description: Daily snapshots kept per host and tag.}
      k8s_backup_keep_weekly: {type: int, default: 4, description: Weekly snapshots kept per host and tag.}
      k8s_backup_keep_monthly: {type: int, default: 6, description: Monthly snapshots kept per host and tag.}
      k8s_backup_drill:
        type: bool
        default: false
        description: With tag drill, back up now and run the restore tests, and fail unless they pass.
      k8s_backup_reader:
        type: bool
        default: false
        description: >-
          Reader mode for dev: tools, sign-in and env file, no timers, no repository made, restic
          with --no-lock. Never together with k8s_backup_enabled.
      k8s_backup_azure_cert_group:
        type: str
        default: k8s_nodes
        description: Inventory group whose nodes all hold a certificate on the app (orphan removal).
      k8s_backup_restore_source_host:
        type: str
        default: ""
        description: Short host name of the prod node whose newest volume snapshot a reader restores. Private.
      k8s_backup_restore_path: {type: str, default: /var/lib/c1-data/local-path, description: The folder a reader restores.}
      k8s_backup_restore_snapshot: {type: str, default: latest, description: A snapshot ID instead of the newest one.}
      k8s_backup_restore_check_namespace: {type: str, default: media, description: Namespace of the app-level restore check.}
      k8s_backup_restore_check_deployment: {type: str, default: jellyfin, description: Deployment of the app-level restore check.}
      k8s_backup_restore_check_claim: {type: str, default: jellyfin-config, description: Claim of the app-level restore check.}
      k8s_backup_restore_check_identity:
        type: bool
        default: true
        description: In the restore check, also load prod's Keycloak database dump into a throwaway PostgreSQL and start the pinned Keycloak on it.
      k8s_backup_restore_check_identity_namespace:
        type: str
        default: restore-check-identity
        description: The throwaway namespace of the Keycloak database check, deleted at its end.
      k8s_backup_restore_identity_dump:
        type: str
        default: /var/lib/central-hub-backup/db-dumps/identity_sso-postgres-0.sql
        description: The path of Keycloak's database dump in prod's snapshot.
      k8s_backup_restore_check_postgres_image:
        type: str
        default: docker.io/library/postgres:18.6
        description: PostgreSQL image of the Keycloak database check (role k8s_identity's).
      k8s_backup_restore_check_keycloak_image:
        type: str
        default: quay.io/keycloak/keycloak:26.8.1
        description: Keycloak image of the Keycloak database check (the one k8s_identity's operator runs).
