---
# Off-box backups of c1 and the tests that prove they restore (TASK-0194 volumes, TASK-0094 etcd).
# Every part is an agent pick, listed in hosts/AGENT-PICKS.md (picks 144-152); runbooks
# docs/runbooks/back-up-c1-off-box.md and docs/runbooks/test-etcd-restore.md.
#
# restic writes encrypted, deduplicated snapshots to one repository off the Proxmox box. Where that
# repository is (RESTIC_REPOSITORY) and its password are private: they live only in a 0600 env file
# on the controller, copied to each node. Exit path: restic's repository format is open and
# documented; `restic restore` or `restic mount` gets every file back without this role.
# Every input is listed here (Red Hat CoP rule).

# false (the default): tools and scripts are installed, the timers are off and no env file is
# needed. true: the env file is copied to the nodes and the timers run.
k8s_backup_enabled: false

# The env file on the controller, mode 0600, for example ~/.config/central-hub/c1-backup.env. No
# default: it is private. Its lines are KEY=value: RESTIC_REPOSITORY, RESTIC_PASSWORD, and the
# target's own credentials (restic's docs, "Preparing a new repository").
k8s_backup_env_file: ""

# Azure Blob target with no stored secret (agent pick 189). true: each node makes its own key and
# certificate (never leaving the node), the controller uploads the public certificate to the backup
# app the first time (the Azure CLI, signed in as agent-azure), a daily timer on the node rolls it
# before it expires, and the node env file gets the sign-in lines restic reads
# (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_CERTIFICATE_PATH). The controller's env file then
# holds only RESTIC_REPOSITORY and RESTIC_PASSWORD. The IDs are the tofu outputs of
# hosts/terraform/azure/backup; none of them is a secret, but they stay out of this repository.
k8s_backup_azure_identity: false
k8s_backup_azure_account: ""
k8s_backup_azure_client_id: ""
k8s_backup_azure_tenant_id: ""
k8s_backup_azure_app_object_id: ""
k8s_backup_azure_cert_file: /etc/central-hub/azure/backup.pem
# A certificate lasts 90 days and is rolled once 30 or fewer are left, so a node that is off for up
# to 60 days still rolls it by itself; after longer, the timers tag uploads a new one.
k8s_backup_azure_cert_days: 90
k8s_backup_azure_cert_renew_days: 30
k8s_backup_azure_cert_schedule: "*-*-* 01:40:00"
k8s_backup_az: az

# Where the tools and scripts go on the nodes, apart from the PATH so nothing else picks up this
# etcd binary.
k8s_backup_bin_dir: /usr/local/libexec/central-hub-backup
k8s_backup_node_env_file: /etc/central-hub/backup.env
k8s_backup_state_dir: /var/lib/central-hub-backup

# restic, the newest release at least two weeks old on 2026-11-08 (v0.19.1, 2026-07-05, STD-0003
# rule 1), from its GitHub release, checked against the release's SHA256SUMS.
k8s_backup_restic_version: 0.19.1
k8s_backup_restic_sha256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c

# etcdctl, etcdutl and etcd from one etcd release. Same minor as the etcd c1 runs (3.7.0-0 after
# runbook step 17), because a snapshot restores only within its minor; v3.7.2 (2026-09-22) is the
# newest 3.7 release at least two weeks old on 2026-11-08 (STD-0003 rule 1). CI restores a
# snapshot taken by etcd 3.7.0 with these tools.
k8s_backup_etcd_version: 3.7.2
k8s_backup_etcd_sha256: 3a3679bc51a4ee9d30bccea1da7cd4fe62c6fc1d2ca1255068d2c53bf3026135

# Times (systemd OnCalendar, the node's local time), before the Proxmox job nightly-guests at
# 03:00 so the two don't read the disks at once. Persistent=true runs a missed one at boot.
k8s_backup_etcd_schedule: "*-*-* 02:10:00"
k8s_backup_volumes_schedule: "*-*-* 02:25:00"
k8s_backup_restore_test_schedule: "Sun *-*-* 04:30:00"

# Folders backed up on each node; a node that has none backs up nothing.
k8s_backup_volume_paths:
  - /var/lib/c1-data/local-path
  - /var/lib/central-hub/identity-postgres

# Retention per host and tag: restic forget --keep-daily/--keep-weekly/--keep-monthly, then prune.
k8s_backup_keep_daily: 7
k8s_backup_keep_weekly: 4
k8s_backup_keep_monthly: 6

# Run the restore tests at the end of a playbook run (tag drill). They need k8s_backup_enabled and
# at least one backup.
k8s_backup_drill: false

# Reader mode, for dev (TASK-0240, agent pick 202; playbooks/k8s-restore.yml). true: the node gets
# the tools, its Azure sign-in and the env file, as above, but no timer runs, the repository is never
# made, and restic runs with --no-lock, so nothing is written to the repository. With Azure, the
# sign-in is the read-only app (tofu outputs reader_client_id and reader_app_object_id of
# hosts/terraform/azure/backup), which can't write either. Never true together with
# k8s_backup_enabled.
k8s_backup_reader: false

# The inventory group whose nodes all hold a certificate on the app. A run over every node of it
# removes the app's certificates no node holds (agent pick 193). playbooks/k8s-restore.yml sets
# k8s_workers, since only the nodes with a data disk sign in there.
k8s_backup_azure_cert_group: k8s_nodes

# What a reader restores (tag restore): the newest volume snapshot of this host name, the prod node
# that holds the volumes. Its short host name, so private: no default.
k8s_backup_restore_source_host: ""
# The local-path folder to bring back. Only this folder: not Keycloak's database folder, not the
# database dumps (the identity stage doesn't run on dev, D-0028).
k8s_backup_restore_path: /var/lib/c1-data/local-path
# A snapshot ID instead of the newest one.
k8s_backup_restore_snapshot: latest
# The app-level proof (tag restore_check): this Deployment is Ready with this claim mounted, the
# claim's volume is the restored folder <path>/<namespace>/<claim>, and the folder belongs to the
# Deployment's runAsUser.
k8s_backup_restore_check_namespace: media
k8s_backup_restore_check_deployment: jellyfin
k8s_backup_restore_check_claim: jellyfin-config
