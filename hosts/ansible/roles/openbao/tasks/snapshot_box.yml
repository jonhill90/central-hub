---
# The AppRole snapshot-box (proposed D-0038 rule 8, agent pick 240; docs/runbooks/set-up-the-secrets-store.md):
# the box's hourly snapshot pull signs in with it instead of the admin, on dev first (rule 12), then on prod.
# Policy snapshot-box: read sys/storage/raft/snapshot, create and update kv/data/<env>/snapshot-mark, nothing
# else; its tokens also carry the default policy (token_no_default_policy stays false). From the box only.
# The proof reads the token's exact rights from sys/capabilities-self, not by live probes, and writes nothing.
# Run from the agent box through the admin token clients.yml made. No secret is printed.

- name: The box's snapshot login, set from the box through the admin AppRole
  delegate_to: localhost
  become: false
  run_once: true
  vars:
    openbao_api: "https://{{ openbao_address }}:{{ openbao_port }}/v1"
    openbao_snapshot_box_policy: "{{ lookup('ansible.builtin.template', 'policy-snapshot-box.hcl.j2') }}"
    openbao_mark_path: "kv/data/{{ openbao_mark_env }}/snapshot-mark"
    # Paths the login must hold nothing on: the forced restore, any secret, any key listing, the admin policy,
    # and its own role.
    openbao_snapshot_box_denied:
      - sys/storage/raft/snapshot-force
      - kv/data/c1/check
      - kv/metadata/
      - sys/policies/acl/admin
      - auth/approle/role/snapshot-box
    # The answer has the paths at its top level and, as other answers do, may carry them under data too.
    openbao_snapshot_box_rights: "{{ openbao_snapshot_box_caps.json.data | default(openbao_snapshot_box_caps.json, true) }}"
  block:
    - name: The AppRole snapshot-box's IDs, made once in the box's keys folder (never printed)
      ansible.builtin.shell: set -o pipefail && umask 077 && openssl rand -hex 24 | tr -d '\n' > {{ item }}
      args:
        executable: /bin/bash
        creates: "{{ item }}"
      loop:
        - "{{ openbao_snapshot_box_role_id_dest }}"
        - "{{ openbao_snapshot_box_secret_id_dest }}"

    - name: Read the policy snapshot-box
      ansible.builtin.uri:
        url: "{{ openbao_api }}/sys/policies/acl/snapshot-box"
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_admin_headers }}"
        status_code: [200, 404]
      register: openbao_snapshot_box_policy_now
      no_log: true

    - name: Policy snapshot-box, take a snapshot and write its mark only
      ansible.builtin.uri:
        url: "{{ openbao_api }}/sys/policies/acl/snapshot-box"
        method: POST
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_admin_headers }}"
        body_format: json
        body:
          policy: "{{ openbao_snapshot_box_policy }}"
        status_code: [200, 204]
      when: >-
        openbao_snapshot_box_policy_now.status == 404 or
        (openbao_snapshot_box_policy_now.json.data.policy | default('') | trim) != (openbao_snapshot_box_policy | trim)
      changed_when: true
      no_log: true

    - name: Read the AppRole snapshot-box
      ansible.builtin.uri:
        url: "{{ openbao_api }}/auth/approle/role/snapshot-box"
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_admin_headers }}"
        status_code: [200, 404]
      register: openbao_snapshot_box_role_now
      no_log: true

    # OpenBao may hand a /32 back as the bare address, so both sides drop it before comparing (as for rebuild).
    - name: AppRole snapshot-box, from the box only, with policy snapshot-box
      ansible.builtin.uri:
        url: "{{ openbao_api }}/auth/approle/role/snapshot-box"
        method: POST
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_admin_headers }}"
        body_format: json
        body:
          token_policies: [snapshot-box]
          token_ttl: 300
          token_max_ttl: 600
          secret_id_bound_cidrs: ["{{ openbao_box_address }}/32"]
          token_bound_cidrs: ["{{ openbao_box_address }}/32"]
        status_code: [200, 204]
      vars:
        openbao_snapshot_box_now: "{{ openbao_snapshot_box_role_now.json.data | default({}) }}"
      when: >-
        openbao_snapshot_box_role_now.status == 404 or
        openbao_snapshot_box_now.token_policies != ['snapshot-box'] or
        openbao_snapshot_box_now.token_ttl != 300 or
        openbao_snapshot_box_now.token_max_ttl != 600 or
        (openbao_snapshot_box_now.secret_id_bound_cidrs | default([], true) | map('regex_replace', '/32$', '') | list) != [openbao_box_address] or
        (openbao_snapshot_box_now.token_bound_cidrs | default([], true) | map('regex_replace', '/32$', '') | list) != [openbao_box_address]
      changed_when: true
      no_log: true

    - name: Read the AppRole snapshot-box's role ID
      ansible.builtin.uri:
        url: "{{ openbao_api }}/auth/approle/role/snapshot-box/role-id"
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_admin_headers }}"
      register: openbao_snapshot_box_role_id_now
      no_log: true

    - name: The AppRole snapshot-box's role ID is the box's
      ansible.builtin.uri:
        url: "{{ openbao_api }}/auth/approle/role/snapshot-box/role-id"
        method: POST
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_admin_headers }}"
        body_format: json
        body:
          role_id: "{{ lookup('ansible.builtin.file', openbao_snapshot_box_role_id_dest) }}"
        status_code: [200, 204]
      when: openbao_snapshot_box_role_id_now.json.data.role_id != lookup('ansible.builtin.file', openbao_snapshot_box_role_id_dest)
      changed_when: true
      no_log: true

    # A secret ID can't be read back (as for rebuild in clients.yml), so the box's IDs are tried.
    - name: Try the box's snapshot-box IDs
      ansible.builtin.uri:
        url: "{{ openbao_api }}/auth/approle/login"
        method: POST
        ca_path: "{{ openbao_cacert_dest }}"
        body_format: json
        body:
          role_id: "{{ lookup('ansible.builtin.file', openbao_snapshot_box_role_id_dest) }}"
          secret_id: "{{ lookup('ansible.builtin.file', openbao_snapshot_box_secret_id_dest) }}"
        status_code: [200, 400, 403]
      register: openbao_snapshot_box_try
      no_log: true

    - name: The box's snapshot-box secret ID, given to the store
      ansible.builtin.uri:
        url: "{{ openbao_api }}/auth/approle/role/snapshot-box/custom-secret-id"
        method: POST
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_admin_headers }}"
        body_format: json
        body:
          secret_id: "{{ lookup('ansible.builtin.file', openbao_snapshot_box_secret_id_dest) }}"
        status_code: [200, 204]
      when: openbao_snapshot_box_try.status != 200
      changed_when: true
      no_log: true

    - name: The box's snapshot-box IDs sign in after that
      ansible.builtin.uri:
        url: "{{ openbao_api }}/auth/approle/login"
        method: POST
        ca_path: "{{ openbao_cacert_dest }}"
        body_format: json
        body:
          role_id: "{{ lookup('ansible.builtin.file', openbao_snapshot_box_role_id_dest) }}"
          secret_id: "{{ lookup('ansible.builtin.file', openbao_snapshot_box_secret_id_dest) }}"
      register: openbao_snapshot_box_login
      when: openbao_snapshot_box_try.status != 200
      no_log: true

    - name: The proof's token
      ansible.builtin.set_fact:
        openbao_snapshot_box_headers:
          X-Vault-Token: >-
            {{ (openbao_snapshot_box_try if openbao_snapshot_box_try.status == 200 else openbao_snapshot_box_login).json.auth.client_token }}
      no_log: true

    - name: The token holds exactly the default and snapshot-box policies
      ansible.builtin.uri:
        url: "{{ openbao_api }}/auth/token/lookup-self"
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_snapshot_box_headers }}"
      register: openbao_snapshot_box_self
      failed_when: (openbao_snapshot_box_self.json.data.policies | sort) != ['default', 'snapshot-box']
      no_log: true

    - name: The token's rights, from sys/capabilities-self
      ansible.builtin.uri:
        url: "{{ openbao_api }}/sys/capabilities-self"
        method: POST
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_snapshot_box_headers }}"
        body_format: json
        body:
          paths: "{{ [openbao_snapshot_path, openbao_mark_path] + openbao_snapshot_box_denied }}"
      vars:
        openbao_snapshot_path: sys/storage/raft/snapshot
      register: openbao_snapshot_box_caps
      no_log: true

    # Exact sets: snapshot [read] (a restore needs update, so it is out), mark [create, update] (reading it is
    # out). Every other path holds no capability but `deny`, whatever form the denial takes.
    - name: The rights are exactly the two paths', and nothing elsewhere
      ansible.builtin.assert:
        that:
          - (openbao_snapshot_box_rights['sys/storage/raft/snapshot'] | default(['missing']) | sort) == ['read']
          - (openbao_snapshot_box_rights[openbao_mark_path] | default(['missing']) | sort) == ['create', 'update']
          - openbao_snapshot_box_denied | difference(openbao_snapshot_box_rights.keys() | list) | length == 0
          - openbao_snapshot_box_denied | map('extract', openbao_snapshot_box_rights) | flatten | reject('equalto', 'deny') | list | length == 0
        # Rights are not secrets: the answer holds path names and capability words only.
        fail_msg: "snapshot-box's rights are not the two paths' exactly: {{ openbao_snapshot_box_rights }}"
        quiet: true

    - name: PASS line for the snapshot login
      ansible.builtin.debug:
        msg: >-
          PASS: AppRole snapshot-box holds default and snapshot-box only; capabilities-self: snapshot [read],
          {{ openbao_mark_path }} [create, update], and nothing on {{ openbao_snapshot_box_denied | join(', ') }}

    - name: The proof's token is revoked
      ansible.builtin.uri:
        url: "{{ openbao_api }}/auth/token/revoke-self"
        method: POST
        ca_path: "{{ openbao_cacert_dest }}"
        headers: "{{ openbao_snapshot_box_headers }}"
        status_code: [200, 204]
      no_log: true
