---
# The shared Helm task (role k8s_helm_release), which upgrades only when the chart version or a
# value differs. The values are the same ones the old `--set installCRDs=true` gave.
- name: eso | Install or upgrade ESO
  ansible.builtin.include_role:
    name: k8s_helm_release
  vars:
    k8s_helm_release_name: external-secrets
    k8s_helm_release_namespace: "{{ k8s_secrets_eso_namespace }}"
    k8s_helm_release_repo_name: external-secrets
    k8s_helm_release_repo_url: https://charts.external-secrets.io
    k8s_helm_release_chart: external-secrets
    k8s_helm_release_version: "{{ k8s_secrets_eso_version }}"
    k8s_helm_release_values: "{{ k8s_secrets_eso_values }}"
    k8s_helm_release_timeout: 5m
