---
argument_specs:
  main:
    short_description: External Secrets Operator and one Kubernetes-provider ClusterSecretStore (BUILD-PATH S14)
    options:
      k8s_secrets_eso_version: {type: str, default: 2.14.0, description: "ESO Helm chart version (STD-0003)."}
      k8s_secrets_eso_not_before:
        type: str
        default: "2026-11-06"
        description: "First date the pinned chart is two weeks old (STD-0003 rule 1); the role stops before it."
      k8s_secrets_eso_namespace: {type: str, default: external-secrets, description: Namespace ESO runs in.}
      k8s_secrets_store_name: {type: str, default: c1, description: "Name of the one ClusterSecretStore."}
      k8s_secrets_source_namespace:
        type: str
        default: secret-source
        description: "Namespace the store reads from, seeded by hand from the password manager."
