---
# Not private. The private values (proxmox_vmbr1_mac, proxmox_host_mgmt_address) have no
# default here on purpose: they come from the secret store through the inventory.
proxmox_network_interfaces_file: /etc/network/interfaces
proxmox_network_bridge: vmbr1
proxmox_network_bridge_vids: "2-4094"
# The SDN VNet that carries the mgmt VLAN (50); Terraform creates it.
proxmox_network_mgmt_vnet: mgmt
proxmox_network_mgmt_prefix_len: 24
