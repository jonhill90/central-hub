# Settings for runs from this folder (hosts/ansible/). No inventory is set here on purpose:
# save the filled-in copy of inventories/<place>/hosts.example.yml as hosts.yml in that folder
# (git-ignored) and pass the folder with -i, so its group_vars/ load too.
[defaults]
roles_path = ./roles
collections_path = ./collections
interpreter_python = auto_silent
retry_files_enabled = false
