---
# The Proxmox host's backup store for the agent box's own copies (the OPNsense configuration and the secrets bundle), which used to
# go to Azure: one more locked-down user, `boxbackup`, served by the same OpenSSH internal-sftp as c1's backups and the read-only
# restore user (roles/proxmox_restic_sftp, playbooks/proxmox-restic-reader.yml). The agent box's host job `box-writer` runs this.
# It does not use that role: the role refuses root from every address in a keys file, and the box is where the host jobs reach this
# host as root from (over its lifeline NIC, from another address), so the box's address must stay out of that list. This play never
# touches root's sign-in, and says so by asking sshd's own answer for root from the box's address at the end.
#   - The user has no shell and no home, one key that works only from the box's address (handed over with the key, never written in the
#     repository: the source address the box's traffic to the host's mgmt address comes from, through the firewall), and sees only the
#     store's folder /box: internal-sftp, chroot
#     to the same root as c1's repository, files made 0600. The /box folder is 0700, so c1's writer and reader cannot read it, and
#     /c1 is 0750 for c1's group, so this user cannot read that.
#   - sftp cannot give "write only": the key can read and write the one folder it owns, which restic needs to check what it wrote.
#   - The key's public half and the address come from the box (dev-worker-address.sh box-key, handed over by proxmox-host.sh in a vars
#     file of its own, never on a command line). A play run without them stops.
# The controller can run it the same way: ansible-playbook -i inventories/home/ playbooks/proxmox-restic-box.yml
#   -e proxmox_restic_box_key='ssh-ed25519 ...' -e proxmox_restic_box_from=<the box's address>
- name: Proxmox host, the agent box's backup user
  hosts: proxmox
  become: false
  gather_facts: false
  vars:
    proxmox_restic_box_user: boxbackup
    proxmox_restic_box_folder: box
    proxmox_restic_box_mount: /mnt/hdd-backup
    proxmox_restic_box_root: /mnt/hdd-backup/restic
    proxmox_restic_box_keys_dir: /etc/ssh/central-hub-restic
    proxmox_restic_box_sshd_conf: /etc/ssh/sshd_config.d/41-central-hub-restic-box.conf
  tasks:
    - name: box-writer | The key is one ssh-ed25519 line
      ansible.builtin.assert:
        that:
          - proxmox_restic_box_key | default('') is match('^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5[A-Za-z0-9+/]{48}$')
        fail_msg: "proxmox_restic_box_key is missing or is not exactly one ssh-ed25519 line (two fields). Nothing was changed."
        quiet: true

    - name: box-writer | The backup disk is mounted where the store goes
      ansible.builtin.command: findmnt --noheadings --output TARGET --mountpoint {{ proxmox_restic_box_mount | quote }}
      register: box_findmnt
      changed_when: false
      failed_when: box_findmnt.stdout | trim != proxmox_restic_box_mount
      check_mode: false

    - name: box-writer | The chroot and the keys folder are there, made by c1's play (this play never makes either)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: ["{{ proxmox_restic_box_root }}", "{{ proxmox_restic_box_keys_dir }}"]
      register: box_dirs
      failed_when: not box_dirs.stat.exists or box_dirs.stat.pw_name != 'root' or box_dirs.stat.mode not in ['0755', '0750']
      check_mode: false

    - name: box-writer | The address is one IPv4 address
      ansible.builtin.assert:
        that: proxmox_restic_box_from | default('') is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        fail_msg: "proxmox_restic_box_from is missing or is not one IPv4 address. Nothing was changed."
        quiet: true

    - name: box-writer | The user, with no shell and no home
      ansible.builtin.user:
        name: "{{ proxmox_restic_box_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false
        password: "!"

    - name: box-writer | The store's folder, the user's alone
      ansible.builtin.file:
        path: "{{ proxmox_restic_box_root }}/{{ proxmox_restic_box_folder }}"
        state: directory
        owner: "{{ proxmox_restic_box_user }}"
        group: "{{ proxmox_restic_box_user }}"
        mode: "0700"

    - name: box-writer | The key, only from the box's address
      ansible.builtin.copy:
        content: |
          restrict,from="{{ proxmox_restic_box_from }}" {{ proxmox_restic_box_key }}
        dest: "{{ proxmox_restic_box_keys_dir }}/{{ proxmox_restic_box_user }}"
        owner: root
        group: root
        mode: "0644"

    # Checked on its own first, then with the whole config, before sshd reloads; a reload keeps open sessions.
    - name: box-writer | The sshd settings for the user
      ansible.builtin.copy:
        content: |
          # Managed by Ansible: central-hub playbooks/proxmox-restic-box.yml. The agent box's own backups reach this host over sftp
          # as one user that gets nothing but internal-sftp inside {{ proxmox_restic_box_root }}. Nothing here touches root.
          Match User {{ proxmox_restic_box_user }}
          	AuthorizedKeysFile {{ proxmox_restic_box_keys_dir }}/%u
          	AuthenticationMethods publickey
          	PasswordAuthentication no
          	KbdInteractiveAuthentication no
          	ChrootDirectory {{ proxmox_restic_box_root }}
          	AllowTcpForwarding no
          	AllowAgentForwarding no
          	AllowStreamLocalForwarding no
          	PermitListen none
          	PermitOpen none
          	PermitTunnel no
          	PermitTTY no
          	X11Forwarding no
          	ForceCommand internal-sftp -u 0077 -d /{{ proxmox_restic_box_folder }}

          # Ends the Match block above, so the lines that come after this file in sshd_config apply to everyone again.
          Match all
        dest: "{{ proxmox_restic_box_sshd_conf }}"
        owner: root
        group: root
        mode: "0644"
        validate: sshd -t -f %s
      register: box_sshd

    - name: box-writer | The whole sshd config still loads
      ansible.builtin.command: sshd -t
      changed_when: false
      when: box_sshd is changed and not ansible_check_mode

    - name: box-writer | sshd reloads
      ansible.builtin.systemd_service:
        name: ssh.service
        state: reloaded
      when: box_sshd is changed and not ansible_check_mode

    # The proof that sshd took the settings, and that the box can still reach this host as root (the host jobs do).
    - name: box-writer | sshd's answer for the user, coming from the box's address
      ansible.builtin.command: >-
        sshd -T -C {{ ('user=' ~ proxmox_restic_box_user ~ ',host=box,addr=' ~ proxmox_restic_box_from) | quote }}
      register: box_effective
      changed_when: false
      check_mode: false
      failed_when: >-
        ('chrootdirectory ' ~ proxmox_restic_box_root) not in box_effective.stdout_lines
        or ('forcecommand internal-sftp -u 0077 -d /' ~ proxmox_restic_box_folder) not in box_effective.stdout_lines
        or 'permittty no' not in box_effective.stdout_lines
        or 'passwordauthentication no' not in box_effective.stdout_lines
      when: not ansible_check_mode

    - name: box-writer | sshd's answer for root from the same address (it must not be a refusal)
      ansible.builtin.command: sshd -T -C {{ ('user=root,host=box,addr=' ~ proxmox_restic_box_from) | quote }}
      register: box_root
      changed_when: false
      check_mode: false
      failed_when: "'permitrootlogin no' in box_root.stdout_lines"
      when: not ansible_check_mode
