---
# The Proxmox web UI on the standard ports: a reverse proxy (Apache httpd, role proxmox_proxy) on 443 and a
# redirect on 80, in front of pveproxy on 8006 (the owner's rule, 2026-11-14: no non-standard ports for any lab
# web page; docs/runbooks/serve-proxmox-on-443.md). Run after playbooks/proxmox-cert.yml: the proxy serves the
# certificate that role sets. Re-run it after each renewal (at least every 30 days) so the proxy reloads it.
# The first run moves 443 and 80 from nginx to Apache httpd, once, and rolls back by itself if a proof fails.
#   ansible-playbook -i inventories/home/ playbooks/proxmox-proxy.yml --check --diff
#   ansible-playbook -i inventories/home/ playbooks/proxmox-proxy.yml
- name: Proxmox web UI on 443 through the proxy
  hosts: proxmox
  become: false
  gather_facts: true
  roles:
    - role: proxmox_proxy
      tags: [proxy]
