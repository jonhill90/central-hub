---
# The secrets layer on cluster c1 (BUILD-PATH S14): External Secrets Operator and one
# ClusterSecretStore on ESO's Kubernetes provider. No secret values come from this repo; seed
# namespace secret-source by hand from the password manager.
#   ansible-playbook -i inventories/home/ playbooks/k8s-secrets.yml --tags eso
#   ansible-playbook -i inventories/home/ playbooks/k8s-secrets.yml --tags store
- name: Secrets layer
  hosts: k8s_control_plane[0]
  become: true
  roles:
    - role: k8s_secrets
