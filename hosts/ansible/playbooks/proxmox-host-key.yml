---
# The agent box's Proxmox host job key: one line in root's authorized keys on the Proxmox host (Library
# plans/r1-host-job/DESIGN.md v3.1, section 6). A run from the controller, listed in docs/runbooks/serve-proxmox-on-443.md
# (D-0041 rule 3), after the agent_box role has made the key and fetched its public half (tag proxmox_host_inventory).
# The line takes the key only from the box's lifeline address, and `restrict` turns off forwarding, a terminal and
# ~/.ssh/rc. On Proxmox VE, root's authorized_keys is a link to /etc/pve/priv/authorized_keys, the cluster's copy.
#   ansible-playbook -i inventories/home/ playbooks/proxmox-host-key.yml --check --diff
#   ansible-playbook -i inventories/home/ playbooks/proxmox-host-key.yml
# Take the reach away: run it with -e proxmox_host_key_state=absent.
- name: The agent box's Proxmox host job key
  hosts: proxmox
  become: false
  gather_facts: false
  vars:
    proxmox_host_key_file: "{{ playbook_dir }}/../inventories/home/id_ed25519-proxmox-host.pub"
    proxmox_host_key_path: /etc/pve/priv/authorized_keys
    proxmox_host_key_state: present
    proxmox_host_key_box: "{{ groups['agent_box'][0] }}"
    proxmox_host_key_from: "{{ (hostvars[proxmox_host_key_box]['agent_box_lifeline_address'] | default('')).split('/')[0] }}"
  tasks:
    - name: The box's lifeline address and the key's public half are there
      ansible.builtin.assert:
        that:
          - proxmox_host_key_from is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - proxmox_host_key_state == 'absent' or lookup('ansible.builtin.file', proxmox_host_key_file) is match('^ssh-ed25519 [A-Za-z0-9+/=]+ central-hub-r1$')
        fail_msg: >-
          set agent_box_lifeline_address on the agent box, and run the agent_box role with the tag
          proxmox_host_inventory first, so {{ proxmox_host_key_file }} holds the key's public half
        quiet: true

    - name: Root's authorized keys hold the job's key, narrowed to the box's lifeline address
      ansible.builtin.lineinfile:
        path: "{{ proxmox_host_key_path }}"
        regexp: ' central-hub-r1$'
        line: >-
          {{ omit if proxmox_host_key_state == 'absent' else
             'restrict,from="' ~ proxmox_host_key_from ~ '" '
             ~ ((lookup('ansible.builtin.file', proxmox_host_key_file) | split(' '))[0:2] | join(' ')) ~ ' central-hub-r1' }}
        state: "{{ proxmox_host_key_state }}"
        create: false
