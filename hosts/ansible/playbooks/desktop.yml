---
# The owner's desktop VM (hosts/terraform/home/desktop/, docs/runbooks/set-up-the-desktop.md): GNOME and
# its remote desktop on AlmaLinux 10, so the owner can sign in by RDP or VNC client and log in to apps by hand.
# desktop_rdp_source (the tailnet connector's address) and desktop_admin_user come from the private inventory.
# The role removes the admin user's SSH key at its end, so later changes are a rebuild from teardown.
#   ansible-playbook -i inventories/home/ playbooks/desktop.yml
- name: Desktop
  hosts: desktop
  become: true
  roles:
    # The lab root in the desktop's trust store (AlmaLinux ca-trust), so Firefox and curl there open
    # the apps' names with no certificate warning (ask 275). The box's wrapper passes the switch and
    # the chain file; run by hand without them, it stays off and removes any root an earlier run put
    # there. Before the desktop role, whose last task removes the admin user's SSH key.
    - role: k8s_node_trust
    - role: desktop
