#   ansible-playbook -i inventories/home/ playbooks/opnsense-sso.yml --check --diff
- name: OPNsense sign-in through Keycloak
  hosts: proxmox
  become: false
  gather_facts: false
  roles:
    - role: opnsense_sso
      tags: [opnsense_sso]
