---
# OPNsense lab settings through the OPNsense API, run from the controller.
# Needs the console bootstrap first: root password, mgmt VLAN 50 as LAN with its address, and an
# API key (see README.md).
- name: OPNsense lab settings
  hosts: opnsense
  gather_facts: false
  # Apply what changed even if a later task fails (measured: a failed DNS task left rule and
  # interface changes saved but not applied).
  force_handlers: true
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_api_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_tls_verify }}"
      ssl_ca_file: "{{ opnsense_lab_ssl_ca_file | expanduser }}"
  pre_tasks:
    - name: The API's TLS check (pick 30)
      ansible.builtin.import_tasks: tasks/opnsense-tls.yml
      tags: [always]
  roles:
    - role: opnsense_lab
