---
# Seeds namespace secret-source on a cluster from a file on the machine that runs the playbook
# (docs/runbooks/seed-secret-source.md). One line `<name>=<value>` is one Secret `<name>` with the key
# `value`. The values pass through stdin and are never printed. The rebuild's `secrets` stage runs this
# after gitops, once Argo CD has made the namespace, and before apps, which wait on the ExternalSecrets.
#   ansible-playbook -i inventories/home/ playbooks/k8s-secret-source.yml -e secret_source_file=/path/to/secret-source.env
- name: Seed namespace secret-source
  hosts: k8s_control_plane[0]
  become: true
  gather_facts: false
  vars:
    secret_source_kubeconfig: /etc/kubernetes/admin.conf
  tasks:
    - name: secret-source | The file is named
      ansible.builtin.assert:
        that: secret_source_file is defined and secret_source_file | length > 0
        fail_msg: set secret_source_file to the file of <name>=<value> lines on the machine running this playbook
        quiet: true

    - name: secret-source | The names, from the file (values stay in it)
      ansible.builtin.set_fact:
        secret_source_lines: "{{ lookup('ansible.builtin.file', secret_source_file).splitlines() | reject('match', '^\\s*(#|$)') | list }}"
      no_log: true

    - name: secret-source | Wait for the namespace (Argo CD makes it)
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ secret_source_kubeconfig }}", get, namespace, secret-source]
      register: secret_source_ns
      until: secret_source_ns.rc == 0
      retries: 60
      delay: 10
      changed_when: false

    - name: secret-source | Make each Secret (the value goes in on stdin)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail; kubectl --kubeconfig {{ secret_source_kubeconfig }} create secret generic "$SS_NAME" -n secret-source
          --from-file=value=/dev/stdin --dry-run=client -o yaml
          | kubectl --kubeconfig {{ secret_source_kubeconfig }} apply -f -
        stdin: "{{ item.split('=', 1)[1] }}"
        stdin_add_newline: false
      environment:
        SS_NAME: "{{ item.split('=', 1)[0] }}"
      loop: "{{ secret_source_lines }}"
      loop_control:
        label: "{{ item.split('=', 1)[0] }}"
      no_log: true
      changed_when: true
