---
# The Proxmox host's network: vmbr1 with a fixed MAC, and the host's address on VNet mgmt.
# Order with Terraform (see README.md):
#   1. ansible-playbook -i <inventory> playbooks/proxmox-host.yml --tags vmbr1
#   2. tofu apply in hosts/terraform/home/network/, then home/firewall/ and home/remote-access/
#   3. ansible-playbook -i <inventory> playbooks/proxmox-host.yml --tags mgmt
- name: Proxmox host network
  hosts: proxmox
  become: false
  gather_facts: false
  roles:
    - role: proxmox_network
