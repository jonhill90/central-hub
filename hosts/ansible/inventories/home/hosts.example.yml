---
# Inventory template. Every blank is a private value, filled from the secret store at run time.
# Save the filled-in copy as hosts.yml in this folder (git-ignored) and pass this folder with -i,
# so Ansible also loads group_vars/ here.
all:
  vars:
    # The c1 Gateway's address (playbooks/k8s-gateway.yml): one address from VLAN 10's .224/27
    # load-balancer pool (STD-0002). Set once here, so the Gateway and its DNS override match.
    k8s_gateway_address: ""
    # The same address for the certificate smoke test (playbooks/k8s-certs.yml).
    k8s_certs_gateway_address: "{{ k8s_gateway_address }}"
  children:
    proxmox:
      hosts:
        proxmox_host:
          ansible_host: ""   # host address on the home LAN
          ansible_user: root
          proxmox_vmbr1_mac: ""   # fixed MAC for vmbr1
          proxmox_host_mgmt_address: ""   # host address in VNet mgmt, without /24
          proxmox_network_lab_supernet: 10.1.0.0/16   # STD-0002 home prefix; routed via the mgmt gateway
          # playbooks/proxmox-safety.yml (README "Host safety net")
          proxmox_firewall_home_lan_cidr: ""   # the home router's LAN range, a.b.c.d/nn
          proxmox_backup_disk: ""   # the empty HDD, /dev/disk/by-id/<id> (whole disk)
          proxmox_firewall_enable: false   # true only after the first run's ruleset was read
          proxmox_firewall_extra_rules: []   # more host IN rules, private; each one needs the owner's words, e.g.
          #   - { action: ACCEPT, source: "<agent box address>/32", proto: tcp, dport: "8006", comment: "agent box to the Proxmox API (owner's words pending)" }
          proxmox_notify_ntfy_url: ""   # errors (failed backups) to ntfy on c1: https://ntfy.apps.c1.prod.<zone>/c1-alerts; private
          # Proxmox's send-only ntfy token (pick 171), read from the controller's secret-source file:
          # proxmox_notify_ntfy_token: "{{ lookup('ansible.builtin.ini', 'ntfy-proxmox-token', type='properties', file=lookup('ansible.builtin.env', 'HOME') ~ '/.config/central-hub/secret-source.env') }}"
          # The host's resolver doesn't know lab names: one /etc/hosts line for the URL's name (pick 215).
          # proxmox_notify_ntfy_address: "{{ k8s_gateway_address }}"
          # or proxmox_notify_endpoint: {type: <smtp|gotify|webhook|sendmail>, options: {...}}, not both
          # playbooks/controller-trust.yml (README "Proxmox CA on the controller")
          controller_trust_ca_file: ""   # path on the controller, e.g. ~/.config/central-hub/pve-root-ca.pem
          # playbooks/proxmox-cert.yml (D-0028): the web UI certificate from the lab CA on c1
          proxmox_cert_names: []   # e.g. ["<host>.<zone>"]; private
          # playbooks/tailnet-connector.yml (docs/runbooks/set-up-lab-dns.md): CT 900 advertises
          # every lab VLAN plus these; the same list as home/tailnet's connector_extra_routes.
          tailnet_connector_extra_routes: [""]   # the host's home LAN address as a /32, as advertised today
          tailnet_connector_lab_supernet: "{{ proxmox_network_lab_supernet }}"
    agent_box:
      hosts:
        agent_box_vm:   # VM 258 (playbooks/agent-box.yml, docs/runbooks/set-up-the-agent-box.md)
          ansible_host: ""   # its address on VNet dev
          ansible_user: ""   # its admin user (the clone's cloud-init user), which has sudo
          agent_box_hostname: ""   # its STD-0001 name, the same as the VM's name in home/jumpbox
          agent_box_allow: []   # permissions.allow copied from the Mac's settings; private
          agent_box_auto_mode: {}   # autoMode block copied from the Mac's settings; private
          agent_box_ca_files: []   # controller paths of PEM CAs to trust, the public lab root only, by full path, never a key file; private
          agent_box_tls_check_url: ""   # e.g. https://<Proxmox API name>:8006/api2/json/version; private
          agent_box_ci_runner: {}   # the CI runner VM the ci-runner wrapper builds; private; shape:
          #   { name: dalapdemo01, vm_id: 300, address: "", cores: 1, memory_mb: 2048, disk_gb: 20,
          #     proxmox_node_name: "", vnet: dev, template_vm_id: 9001,
          #     github_app_id: "", repo_owner: jonhill90, repo_name: agent-notebook }
          agent_box_secrets_store: {}   # the secrets store's dev VM the secrets-store wrapper builds; private; shape:
          #   { name: daldapdemo01, vm_id: 550, address: "", cores: 2, memory_mb: 2048, disk_gb: 20,
          #     proxmox_node_name: "", vnet: dev, template_vm_id: 9001, box_address: "" }
    opnsense:
      hosts:
        opnsense_fw:
          ansible_connection: local   # the modules call the OPNsense API from the controller
          ansible_python_interpreter: ""   # a controller Python that has httpx (requirements.txt)
          opnsense_api_host: ""   # the firewall's name, opnsense.<zone>; never an address (pick 30)
          opnsense_lab_ssl_ca_file: ""   # the lab root's PEM file on the controller; the API's certificate must chain to it
          # opnsense_lab_tls_bootstrap: true   # a rebuilt firewall's first run only (set-opnsense-gui-certificate.md)
          opnsense_api_key: ""   # secret
          opnsense_api_secret: ""   # secret
          opnsense_home_lan_cidr: ""   # the home router's LAN range
          opnsense_dns_zone: ""   # DNS zone for the opnsense.<zone> override
          opnsense_cert_names: []   # playbooks/opnsense-cert.yml (D-0028): e.g. ["opnsense.<zone>"]; private
          # The VLAN list itself is in group_vars/all/vlans.yml (the one shared VLAN file).
          # These are this firewall's own settings (Red Hat CoP rule, the owner, 2026-10-26 00:35 UTC).
          opnsense_lab_mgmt_tag: 50
          opnsense_lab_dhcp_first: 100
          opnsense_lab_dhcp_last: 199   # ends before the .224/27 load-balancer reserve
          # The agent box's two pass rules into the lab (owner's yes 2026-11-10 05:16 UTC); private.
          # Remove the whole block to remove the rules. The Proxmox API is reached on its mgmt
          # address: the dev VLAN's own rule blocks the home LAN, and pve.<zone> points at mgmt.
          opnsense_lab_agent_box:
            source: ""   # VM 258's address on VNet dev
            vlan: 30
            targets:
              - { name: Proxmox API, address: "", port: 8006 }   # the host's mgmt address
              - { name: c1 API, address: "", port: 6443 }   # c1's control-plane node
              # SSH to prod's nodes for the box's prod rebuild; add only on the owner's typed go.
              # - { name: prod node 200 SSH, address: "", port: 22 }   # VM 200's address
              # - { name: prod node 201 SSH, address: "", port: 22 }   # VM 201's address
              # The firewall's own API, for the box's daily OPNsense backup (pick 220); add only on the owner's go.
              # - { name: OPNsense API, address: "", port: 443 }   # the address opnsense.<zone> resolves to (mgmt)
          opnsense_lab_host_overrides:   # lab-only DNS names; addresses are private
            - { hostname: api.c1.prod, address: "", description: "Kubernetes c1 API (control-plane node)" }
            - { hostname: pve, address: "", description: "Proxmox host GUI (its mgmt address)" }
            # The owner's desktop VM (pick 219), so the RDP client uses a name, not an address; its dev address.
            # - { hostname: <desktop-name>, address: "", description: "Owner's desktop VM (RDP)" }
            # Wildcard: every name under apps.c1.prod.<zone> answers with the c1 Gateway.
            - { hostname: "*", subdomain: apps.c1.prod, address: "{{ k8s_gateway_address }}", description: "Kubernetes c1 Gateway apps (*.apps.c1.prod)" }
            # Short aliases <app>.<zone> (STD-0001 rule 5), each on its own so the rest of the zone
            # stays public; the same list as the tailnet's split_dns_names.
            - { hostname: grafana, address: "{{ k8s_gateway_address }}", description: "Short alias, Grafana on c1" }
            - { hostname: argocd, address: "{{ k8s_gateway_address }}", description: "Short alias, Argo CD on c1" }
            - { hostname: sso, address: "{{ k8s_gateway_address }}", description: "Short alias, Keycloak on c1" }
            - { hostname: jellyfin, address: "{{ k8s_gateway_address }}", description: "Short alias, Jellyfin on c1" }
            - { hostname: ntfy, address: "{{ k8s_gateway_address }}", description: "Short alias, ntfy on c1" }
          opnsense_lab_vlan_settings:
            prod: { ifname: opt1, dhcp: true, bootstrap: false }
            qa: { ifname: opt2, dhcp: false, bootstrap: false }
            dev: { ifname: opt3, dhcp: true, bootstrap: false }
            mgmt: { ifname: lan, dhcp: false, bootstrap: true }
    # Kubernetes cluster c1 (BUILD-PATH S06-S08). Hostnames follow STD-0001; the real ones and
    # their addresses go only in the filled-in copy. Reached through the Proxmox host, which has an
    # address on VNet mgmt (OPNsense routes mgmt to prod).
    k8s_nodes:
      children:
        k8s_control_plane:
          hosts:
            palcpdemo01:
              ansible_host: ""   # the node's address on VNet prod
        k8s_workers:
          hosts:
            palwkdemo01:
              ansible_host: ""
      vars:
        ansible_user: almalinux
        ansible_ssh_private_key_file: ""   # the key whose public half terraform/home/k8s put on the nodes
        ansible_ssh_common_args: ""        # for example -o ProxyJump=root@<Proxmox host address>
        k8s_control_plane_endpoint: ""     # api.c1.prod.<zone>
        k8s_gateway_zone: ""               # <zone>; the Gateway takes *.apps.c1.prod.<zone>
        # Runbook step 8a: the secretbox key for Secrets at rest, a 0600 file on the controller,
        # for example ~/.config/central-hub/c1-secrets-encryption.key (hosts/ansible/README.md).
        k8s_control_plane_encryption_key_file: ""
        # BUILD-PATH S12 (playbooks/k8s-certs.yml, hosts/ansible/README.md "Certificates on c1").
        k8s_certs_zone: "{{ k8s_gateway_zone }}"
        k8s_certs_acme_email: ""             # the ACME account's contact address
        k8s_certs_cloudflare_token_file: ""  # 0600 file with the zone's API token, written by terraform/home/certificates
        k8s_certs_issue: false               # true talks to Let's Encrypt; staging first
        k8s_certs_issuer: letsencrypt-staging   # or lab-ca once k8s_certs_lab_ca is true (D-0028)
        # The lab CA (D-0028, runbook restore-c1-intermediate-ca): files on the controller, from the
        # ~/.config/central-hub/lab-ca/ (docs/runbooks/create-lab-root-ca.md).
        k8s_certs_lab_ca: false
        k8s_certs_lab_ca_cert_file: ""       # c1's intermediate with the root appended
        k8s_certs_lab_ca_key_file: ""        # its key, mode 0600
        k8s_gateway_https: false             # true once the certificate is issued (HTTPS on 443)
        # The GitOps engine (playbooks/k8s-gitops.yml, BUILD-PATH S13): the owner said yes to the
        # proposed Argo CD with its web UI on 2026-10-27 at 02:23 UTC. Not private.
        k8s_gitops_engine: argocd
        # The Argo CD web UI at https://argocd.apps.c1.prod.<zone>/ through Gateway apps (tag ui).
        k8s_gitops_ui_route: false           # true once k8s_gateway_https is true
        k8s_gitops_ui_zone: "{{ k8s_gateway_zone }}"
        # Argo CD reads central-hub (D-0027): turn on with the first component in hosts/kubernetes/home/c1/.
        k8s_gitops_source_enabled: false
        k8s_gitops_source_zone: "{{ k8s_gateway_zone }}"
        k8s_gitops_source_gateway_address: "{{ k8s_gateway_address }}"
        k8s_gitops_sso: false                # true after playbooks/k8s-identity.yml made argocd/argocd-sso
        k8s_gitops_ui_gateway_https: "{{ k8s_gateway_https }}"
        # Metrics and logs (playbooks/k8s-observability.yml, BUILD-PATH S15): Grafana at
        # https://grafana.apps.c1.prod.<zone>/ through Gateway apps.
        k8s_observability_zone: "{{ k8s_gateway_zone }}"
        k8s_observability_grafana_sso: false   # true after playbooks/k8s-identity.yml
        # Sign-in for lab apps (playbooks/k8s-identity.yml): https://sso.apps.c1.prod.<zone>/.
        k8s_identity_zone: "{{ k8s_gateway_zone }}"
        k8s_identity_owner_username: ""      # the owner's account in realm lab
        k8s_identity_owner_email: ""         # optional
        # Jellyfin (playbooks/k8s-jellyfin.yml, BUILD-PATH S17): https://jellyfin.apps.c1.prod.<zone>/.
        k8s_jellyfin_zone: "{{ k8s_gateway_zone }}"
        # Off-box backups (playbooks/k8s-backup.yml, TASK-0194, TASK-0094): restic to the repository in
        # a 0600 env file on the controller, for example ~/.config/central-hub/c1-backup.env
        # (docs/runbooks/back-up-c1-off-box.md). false installs the tools with the timers off.
        k8s_backup_enabled: false
        k8s_backup_env_file: ""
        # Azure Blob with the nodes' own certificate (tofu outputs of terraform/azure/backup).
        k8s_backup_azure_identity: false
        k8s_backup_azure_account: ""
        k8s_backup_azure_client_id: ""
        k8s_backup_azure_tenant_id: ""
        k8s_backup_azure_app_object_id: ""
        # Never set the Kubernetes versions here (k8s_node_kubernetes_minor,
        # k8s_node_kubernetes_version, k8s_control_plane_kubernetes_version): the role defaults
        # are the versions the cluster runs, bumped by PR, and playbooks/k8s-upgrade.yml stops on
        # an override (hosts/AGENT-PICKS.md pick 33).
