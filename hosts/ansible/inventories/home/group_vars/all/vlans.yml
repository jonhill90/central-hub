---
# Home lab VLANs from STD-0002 (home = 10.1.0.0/16, third number = VLAN ID). The ONE place
# these live (the owner, 2026-10-26 06:08 UTC): Ansible loads this file for every host in the home
# inventory, and terraform/home/network reads it with yamldecode(file(var.vlans_file)).
# Ranges only, no single host addresses (CLAUDE.md rule 4).
lab_vlans:
  - { id: 10, name: prod, alias: prod, cidr: 10.1.10.0/24 }
  - { id: 20, name: qa, alias: qa and stage, cidr: 10.1.20.0/24 }
  - { id: 30, name: dev, alias: dev, cidr: 10.1.30.0/24 }
  - { id: 50, name: mgmt, alias: management, cidr: 10.1.50.0/24 }
