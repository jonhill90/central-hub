# promtool unit tests for c1's own alert rules (PrometheusRule c1-lab in
# hosts/kubernetes/home/c1/apps/monitoring-extras/). run.sh renders the chart, writes its rule
# groups to c1-lab.rules.yml next to a copy of this file, and runs `promtool test rules`.
rule_files: [c1-lab.rules.yml]
evaluation_interval: 1m
tests:
  - name: an Application out of sync for 30 minutes fires; a synced one doesn't
    interval: 1m
    input_series:
      - series: 'argocd_app_info{name="jellyfin", sync_status="OutOfSync", health_status="Healthy"}'
        values: '1x40'
      - series: 'argocd_app_info{name="loki", sync_status="Synced", health_status="Healthy"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: C1ArgoAppNotSynced
        exp_alerts: []
      - eval_time: 35m
        alertname: C1ArgoAppNotSynced
        exp_alerts:
          - exp_labels: {name: jellyfin, severity: warning}
            exp_annotations:
              summary: Argo CD Application jellyfin has not matched git for 30 minutes
              runbook: docs/runbooks/README.md (the component's move-*-to-argo-cd.md)

  - name: a Degraded Application fires after 15 minutes; Progressing doesn't
    interval: 1m
    input_series:
      - series: 'argocd_app_info{name="loki", sync_status="Synced", health_status="Degraded"}'
        values: '1x20'
      - series: 'argocd_app_info{name="alloy", sync_status="Synced", health_status="Progressing"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: C1ArgoAppUnhealthy
        exp_alerts:
          - exp_labels: {name: loki, health_status: Degraded, severity: critical}
            exp_annotations:
              summary: Argo CD Application loki is Degraded

  - name: the data disk under 15% free fires; other mounts don't count
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="w1", mountpoint="/var/lib/c1-data"}'
        values: '10x40'
      - series: 'node_filesystem_size_bytes{instance="w1", mountpoint="/var/lib/c1-data"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="w1", mountpoint="/"}'
        values: '1x40'
      - series: 'node_filesystem_size_bytes{instance="w1", mountpoint="/"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: C1DataDiskFillingUp
        exp_alerts:
          - exp_labels: {instance: w1, mountpoint: /var/lib/c1-data, severity: warning}
            exp_annotations:
              summary: The data disk on w1 has less than 15% free; every volume lives there

  - name: Jellyfin with no ready pod for 10 minutes fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="media", deployment="jellyfin"}'
        values: '1 0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: C1JellyfinDown
        exp_alerts:
          - exp_labels: {namespace: media, deployment: jellyfin, severity: warning}
            exp_annotations:
              summary: Jellyfin has no ready pod

  - name: Argo CD not scraped fires when its target is missing
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 16m
        alertname: C1ArgoCDNotScraped
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Prometheus can't read Argo CD's metrics, so the two alerts above can't fire

  - name: a certificate 2 days past its renewal time fires after an hour; one not yet due doesn't
    interval: 1m
    input_series:
      # Renewal times in seconds since the epoch; the test clock starts at 0.
      - series: 'certmanager_certificate_renewal_timestamp_seconds{exported_namespace="gateway", name="apps", issuer_name="letsencrypt-prod"}'
        values: '-180000x80'
      - series: 'certmanager_certificate_renewal_timestamp_seconds{exported_namespace="gateway", name="fresh", issuer_name="letsencrypt-prod"}'
        values: '2000000x80'
    alert_rule_test:
      - eval_time: 30m
        alertname: C1CertificateRenewalOverdue
        exp_alerts: []
      - eval_time: 65m
        alertname: C1CertificateRenewalOverdue
        exp_alerts:
          - exp_labels: {exported_namespace: gateway, name: apps, severity: warning}
            exp_annotations:
              summary: Certificate gateway/apps should have renewed more than 2 days ago; check its CertificateRequest and the Cloudflare token's address limit
              runbook: docs/runbooks/issue-c1-app-certificate.md

  - name: a certificate not Ready for an hour fires; a Ready one doesn't
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{exported_namespace="gateway", name="apps", condition="False"}'
        values: '1x80'
      - series: 'certmanager_certificate_ready_status{exported_namespace="gateway", name="apps", condition="True"}'
        values: '0x80'
      - series: 'certmanager_certificate_ready_status{exported_namespace="gateway", name="ok", condition="True"}'
        values: '1x80'
      - series: 'certmanager_certificate_ready_status{exported_namespace="gateway", name="ok", condition="False"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 65m
        alertname: C1CertificateNotReady
        exp_alerts:
          - exp_labels: {exported_namespace: gateway, name: apps, severity: warning}
            exp_annotations:
              summary: Certificate gateway/apps has not been Ready for an hour

  - name: cert-manager not scraped fires when its target is missing
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 16m
        alertname: C1CertManagerNotScraped
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Prometheus can't read cert-manager's metrics, so the two certificate alerts above can't fire

  # OpenBao inside the cluster (rendered with openbao.inCluster=true, run.sh). The seal gauge keeps a
  # stale cluster="" series at 0 from before the unseal (measured on OpenBao 2.7.2, 2026-11-18), so
  # the rule takes the max: one unsealed series means unsealed.
  - name: OpenBao with no ready pod for 10 minutes fires; a ready one doesn't
    interval: 1m
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="openbao", statefulset="openbao"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: C1OpenBaoNotReady
        exp_alerts: []
      - eval_time: 11m
        alertname: C1OpenBaoNotReady
        exp_alerts:
          - exp_labels: {namespace: openbao, statefulset: openbao, severity: critical}
            exp_annotations:
              summary: OpenBao has no ready pod for 10 minutes, so it is sealed or down and apps can't read their secrets
              runbook: docs/runbooks/set-up-the-secrets-store.md

  - name: OpenBao sealed fires; the stale pre-unseal series next to an unsealed one doesn't
    interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="openbao", cluster=""}'
        values: '0x20'
      - series: 'vault_core_unsealed{namespace="openbao", cluster="c"}'
        values: '1x9 0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: C1OpenBaoSealed
        exp_alerts: []
      - eval_time: 16m
        alertname: C1OpenBaoSealed
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: OpenBao answers but is sealed
              runbook: docs/runbooks/set-up-the-secrets-store.md

  - name: OpenBao not scraped fires when its target is missing
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 16m
        alertname: C1OpenBaoNotScraped
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Prometheus can't read OpenBao's metrics, so the seal and audit alerts can't fire

  - name: an audit log write failure fires at once
    interval: 1m
    input_series:
      - series: 'vault_audit_log_request_failure{namespace="openbao", pod="openbao-0"}'
        values: '0x5 1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: C1OpenBaoAuditFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: C1OpenBaoAuditFailing
        exp_alerts:
          - exp_labels: {namespace: openbao, pod: openbao-0, severity: critical}
            exp_annotations:
              summary: OpenBao failed to write its audit log; it refuses requests it can't audit

  - name: no successful snapshot for over 3 hours fires; a recent one doesn't
    interval: 1m
    input_series:
      # The last success at time 0 (seconds since the epoch, the test clock's start).
      - series: 'kube_cronjob_status_last_successful_time{namespace="openbao", cronjob="openbao-snapshot"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 170m
        alertname: C1OpenBaoSnapshotStale
        exp_alerts: []
      - eval_time: 200m
        alertname: C1OpenBaoSnapshotStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: OpenBao's hourly snapshot has not succeeded for more than 3 hours
              runbook: docs/runbooks/set-up-the-secrets-store.md

  - name: Jellyfin not scraped fires when its target is missing
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 16m
        alertname: C1JellyfinNotScraped
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Prometheus can't read Jellyfin's /metrics; check that the setup Job turned EnableMetrics on
              runbook: docs/runbooks/move-jellyfin-to-argo-cd.md

  - name: Jellyfin server errors above 0.05 a second for 15 minutes fire; a few don't
    interval: 1m
    input_series:
      # 6 errors a minute (0.1 a second), then a client error count that never counts.
      - series: 'http_requests_received_total{namespace="media", code="500", method="GET", controller="Items", action="GetItems", endpoint=""}'
        values: '0+6x40'
      - series: 'http_requests_received_total{namespace="media", code="404", method="GET", controller="Items", action="GetItems", endpoint=""}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: C1JellyfinErrors
        exp_alerts: []
      - eval_time: 35m
        alertname: C1JellyfinErrors
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Jellyfin has answered with server errors (5xx) for 15 minutes
              runbook: docs/runbooks/move-jellyfin-to-argo-cd.md
