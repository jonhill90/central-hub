# Hosts checks (STD-0005): lints and offline tests for the code under hosts/. Read-only token, no
# secrets, every action pinned to a full commit SHA, every tool pinned to a version: Go tools are
# built from source checked by the Go checksum database, Python tools come with hashes, providers
# are checked against each run folder's lock file, and schemas against their SHA-256.
name: hosts
on:
  pull_request:            # never pull_request_target (CLAUDE.md rule 5)
permissions:
  contents: read
jobs:
  terraform:               # STD-0004 check, fmt, validate, tflint, tofu test with mocked providers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned tofu and tflint
        run: |
          .github/hosts-check/install-tools.sh "$RUNNER_TEMP/bin" tofu tflint
          echo "TOOLS=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      - run: .github/hosts-check/run.sh terraform

  ansible:                 # syntax check of every playbook, ansible-lint production profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh ansible

  manifests:               # Kubernetes templates and root charts rendered and checked with kubeconform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build pinned kubeconform and helm
        run: |
          .github/hosts-check/install-tools.sh "$RUNNER_TEMP/bin" kubeconform helm
          echo "TOOLS=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      # The upstream charts parity.py renders, kept between runs: one key per set of root values, so
      # a new chart version downloads once and an upstream outage doesn't fail the check.
      - name: Cache the upstream charts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/charts
          key: parity-charts-${{ hashFiles('hosts/kubernetes/clusters/*/root/values.yaml') }}
          restore-keys: parity-charts-
      - run: .github/hosts-check/run.sh manifests
        env:
          PARITY_CHART_CACHE: ${{ runner.temp }}/charts

  scripts:                 # shellcheck on every shell script, actionlint on every workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh scripts
