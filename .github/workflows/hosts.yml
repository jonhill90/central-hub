# Hosts checks (STD-0005): lints and offline tests for the code under hosts/. Read-only token, no
# secrets, every action pinned to a full commit SHA, every tool pinned to a version: Go tools are
# built from source checked by the Go checksum database, Python tools come with hashes, providers
# are checked against each run folder's lock file, and schemas against their SHA-256.
name: hosts
on:
  pull_request:            # never pull_request_target (CLAUDE.md rule 5)
permissions:
  contents: read
jobs:
  terraform:               # STD-0004 check, fmt, validate, tflint, tofu test with mocked providers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The built tools, kept between runs: building them from source took 220 s of the manifests job. The key holds the
      # install script, which holds every pinned version, so a new pin builds again; a cache hit skips the build only.
      - name: Restore the built tools
        id: tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/bin
          key: hosts-tools-tofu-tflint-${{ runner.os }}-${{ hashFiles('.github/hosts-check/install-tools.sh') }}
      - name: Build pinned tofu and tflint
        if: steps.tools.outputs.cache-hit != 'true'
        run: .github/hosts-check/install-tools.sh "$RUNNER_TEMP/bin" tofu tflint
      - run: echo "TOOLS=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      - run: .github/hosts-check/run.sh terraform

  ansible-shard:           # the ansible checks split over two runners (run.sh ansible K/2); the job `ansible` below joins them
    name: ansible-shard (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh ansible ${{ matrix.shard }}/2

  ansible:                 # syntax check of every playbook, ansible-lint production profile: passes only when both shards passed
    needs: ansible-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          SHARDS: ${{ needs.ansible-shard.result }}
        run: test "$SHARDS" = success

  manifests:               # Kubernetes templates and root charts rendered and checked with kubeconform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # The built tools, kept between runs: building them from source took 220 s of the manifests job. The key holds the
      # install script, which holds every pinned version, so a new pin builds again; a cache hit skips the build only.
      - name: Restore the built tools
        id: tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/bin
          key: hosts-tools-kubeconform-helm-promtool-${{ runner.os }}-${{ hashFiles('.github/hosts-check/install-tools.sh') }}
      - name: Build pinned kubeconform, helm and promtool
        if: steps.tools.outputs.cache-hit != 'true'
        run: .github/hosts-check/install-tools.sh "$RUNNER_TEMP/bin" kubeconform helm promtool
      - run: echo "TOOLS=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      # The upstream charts parity.py renders, kept between runs, so a new chart version downloads
      # once and an upstream outage doesn't fail the check. Restore and save are separate steps and
      # the save runs even when the check fails, so the charts that did download are kept for the
      # next run (on 2026-11-08 GitHub release downloads returned 504 for hours). A cache key can't
      # be overwritten, so each run saves under its own key and restores the newest by prefix.
      - name: Restore the upstream charts
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/charts
          key: parity-charts-${{ hashFiles('hosts/kubernetes/*/*/root/values.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parity-charts-${{ hashFiles('hosts/kubernetes/*/*/root/values.yaml') }}-
            parity-charts-
      - run: mkdir -p "$PARITY_CHART_CACHE" && .github/hosts-check/run.sh manifests
        env:
          PARITY_CHART_CACHE: ${{ runner.temp }}/charts
      - name: Save the upstream charts
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/charts
          key: parity-charts-${{ hashFiles('hosts/kubernetes/*/*/root/values.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

  identity:                # realm lab imported into a real Keycloak 26.8.2 and checked
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh identity

  scripts:                 # shellcheck on every shell script, actionlint on every workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh scripts

  backup-shard:            # the backup checks split over three runners (run.sh backup K/3); the job `backup` below joins them
    name: backup-shard (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh backup ${{ matrix.shard }}/3

  backup:                  # c1 backup and restore-test scripts end to end: etcd 3.7.0, restic, local repository; passes only when all three shards passed
    needs: backup-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          SHARDS: ${{ needs.backup-shard.result }}
        run: test "$SHARDS" = success

  proxy-shard:             # the proxy checks split over three runners (run.sh proxy K/3); the job `proxy` below joins them
    name: proxy-shard (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh proxy ${{ matrix.shard }}/3

  proxy:                   # role proxmox_proxy against a stand-in Proxmox host (Debian trixie, systemd, nginx); needs all three shards
    needs: proxy-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          SHARDS: ${{ needs.proxy-shard.result }}
        run: test "$SHARDS" = success

  plugin-pin:              # the OPNsense proof's os-openid-connect package: pinned SHA-256 and gh attestation verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/hosts-check/run.sh plugin-pin
        env:
          GH_TOKEN: ${{ github.token }}   # read-only; gh needs a token to fetch the public attestations
