# Hosts checks (STD-0005): lints and offline tests for the code under hosts/. Read-only token, no
# secrets, every action pinned to a full commit SHA, every tool pinned to a version: Go tools are
# built from source checked by the Go checksum database, Python tools come with hashes, providers
# are checked against each run folder's lock file, and schemas against their SHA-256.
name: hosts
on:
  pull_request:            # never pull_request_target (CLAUDE.md rule 5)
permissions:
  contents: read
jobs:
  terraform:               # STD-0004 check, fmt, validate, tflint, tofu test with mocked providers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned tofu and tflint
        run: |
          .github/hosts-check/install-tools.sh "$RUNNER_TEMP/bin" tofu tflint
          echo "TOOLS=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      - run: .github/hosts-check/run.sh terraform

  ansible:                 # syntax check of every playbook, ansible-lint production profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh ansible

  manifests:               # Kubernetes templates and root charts rendered and checked with kubeconform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build pinned kubeconform, helm and promtool
        run: |
          .github/hosts-check/install-tools.sh "$RUNNER_TEMP/bin" kubeconform helm promtool
          echo "TOOLS=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      # The upstream charts parity.py renders, kept between runs, so a new chart version downloads
      # once and an upstream outage doesn't fail the check. Restore and save are separate steps and
      # the save runs even when the check fails, so the charts that did download are kept for the
      # next run (on 2026-11-08 GitHub release downloads returned 504 for hours). A cache key can't
      # be overwritten, so each run saves under its own key and restores the newest by prefix.
      - name: Restore the upstream charts
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/charts
          key: parity-charts-${{ hashFiles('hosts/kubernetes/*/*/root/values.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parity-charts-${{ hashFiles('hosts/kubernetes/*/*/root/values.yaml') }}-
            parity-charts-
      - run: mkdir -p "$PARITY_CHART_CACHE" && .github/hosts-check/run.sh manifests
        env:
          PARITY_CHART_CACHE: ${{ runner.temp }}/charts
      - name: Save the upstream charts
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/charts
          key: parity-charts-${{ hashFiles('hosts/kubernetes/*/*/root/values.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

  identity:                # realm lab imported into a real Keycloak 26.8.1 and checked
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh identity

  scripts:                 # shellcheck on every shell script, actionlint on every workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh scripts

  backup:                  # c1 backup and restore-test scripts end to end: etcd 3.7.0, restic, local repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/hosts-check/run.sh backup
