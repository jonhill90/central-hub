# The VPS apps host's pipeline job (D-0046, D-0041 rules 2 and 8). It runs only when started by hand
# (workflow_dispatch), only from main, on the box's own runner; the box's `vps-host` wrapper does the work and
# signs in to the VPS by Tailscale SSH. No pull_request trigger of any kind.
#   bootstrap       once, as root, before the tailnet narrows the box to user deploy (S3)
#   apply           the VPS applies main's commit to itself through vps-apply
#   secrets         makes the host's secrets that don't exist yet, only after the narrowing (S5)
#   secrets-rotate  makes them all again
#   status          what is applied and which secrets exist, never a value
# GitHub's run log is public, so the wrapper prints only the action, the commit and pass or fail.
name: lab-vps-host
on:
  workflow_dispatch:
    inputs:
      action:
        description: "bootstrap (once, before the narrowing), apply, secrets (after the narrowing), secrets-rotate or status"
        type: choice
        default: status
        options: [bootstrap, apply, secrets, secrets-rotate, status]
permissions:
  contents: read
concurrency:
  group: lab-vps-host
  cancel-in-progress: false
jobs:
  vps-host:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, central-hub-box]
    timeout-minutes: 30
    steps:
      - name: Run the vps-host wrapper
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            secrets-rotate) /usr/local/bin/vps-host secrets rotate ;;
            bootstrap|apply|secrets|status) /usr/local/bin/vps-host "$ACTION" ;;
            *) echo "unknown action" >&2; exit 2 ;;
          esac
