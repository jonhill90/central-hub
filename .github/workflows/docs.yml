# Docs checks (D-0019). Read-only token, no secrets, every action pinned to a full commit SHA,
# every downloaded binary pinned to a version and checksum (D-0019 rule 2).
name: docs
on:
  pull_request:            # never pull_request_target (CLAUDE.md rule 5)
  schedule:
    - cron: "17 6 * * 1"   # weekly outside-link report, Mondays 06:17 UTC
permissions:
  contents: read
env:
  LYCHEE_VERSION: "0.24.2"
  LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
  VALE_VERSION: "3.25.1"
  VALE_SHA256: "4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182"
jobs:
  front-matter:            # check 1, gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/docs-check/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: .github/docs-check/run.sh front-matter

  links:                   # check 2, gate: links inside the repo only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee (pinned version and checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tgz" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lychee.tgz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "LYCHEE=$RUNNER_TEMP/lychee" >> "$GITHUB_ENV"
      - run: .github/docs-check/run.sh links

  markdown:                # check 3, gate: files this PR adds or changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2     # the PR merge commit and its first parent, the base
      - name: Install pinned Node packages
        run: npm ci --ignore-scripts --prefix .github/docs-check
      - run: .github/docs-check/run.sh markdown
        env:
          DOCS_BASE: HEAD^1

  words:                   # check 4: glossary words report only; owner-quote and owner-name rules gate changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2     # the PR merge commit and its first parent, the base
      - name: Install Vale (pinned version and checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vale.tgz" "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vale.tgz" -C "$RUNNER_TEMP" vale
          echo "VALE=$RUNNER_TEMP/vale" >> "$GITHUB_ENV"
      - run: .github/docs-check/run.sh words
        env:
          DOCS_BASE: HEAD^1

  outside-links:           # report only, never a gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee (pinned version and checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tgz" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lychee.tgz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
      - name: Check outside links and write the report
        run: |
          "$RUNNER_TEMP/lychee" --no-progress --format markdown --output report.md './**/*.md' || true
          cat report.md >> "$GITHUB_STEP_SUMMARY"
