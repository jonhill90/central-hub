# FOSS check (STD-0006): every outside source has a complete component register row, and every
# component that fails the test has a named exception. Read-only token, no secrets, every action
# pinned to a full commit SHA, Python packages installed with hashes.
name: foss
on:
  pull_request:            # never pull_request_target (CLAUDE.md rule 5)
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # GitHub release downloads (actionlint-py fetches its binary from one) can return 504
          # for a while, so the install is tried 5 times with a growing wait.
          for try in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r .github/hosts-check/requirements.txt && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 15))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python3 -I .github/foss-check/check_components.py .
      - run: bash .github/foss-check/tests/test_check_components.sh
