# The Proxmox host job (D-0041 rules 2, 4, 6 and 7; Library plans/r1-host-job/DESIGN.md v3.1). It runs only when
# started by hand (workflow_dispatch), only from main, on the box's own runner; the box's `proxmox-host` wrapper
# does the work as its own user, with a key this workflow never sees. It runs one of the wrapper's named
# playbooks (input `job`: proxy, sso, opnsense-sso, agent-access, firewall, guests or restore-reader) and nothing else. No pull_request trigger of any kind.
#   check  runs the playbook with --check --diff and prints the commit, the hash and counts of tasks.
#   apply  checks again, refuses unless the hash is the one the agents passed, then runs the playbook.
# GitHub's run log is public, so the wrapper prints only the commit, the hash, counts and pass or fail.
name: lab-proxmox-host
on:
  workflow_dispatch:
    inputs:
      job:
        description: "which playbook: proxy (the Proxmox web UI on 443), sso (sign-in through Keycloak), opnsense-sso (the firewall's sign-in through Keycloak, installed by the guest agent), agent-access (the agents' Proxmox rights), firewall (the host firewall, D-0063) guests (read-only: which guests exist) or restore-reader (the read-only backup user's keys); the same names as the wrapper's"
        type: choice
        default: proxy
        options: [proxy, sso, opnsense-sso, agent-access, firewall, guests, restore-reader]
      action:
        description: "check prints a hash; apply runs the playbook when the check gives the hash the agents passed"
        type: choice
        default: check
        options: [check, apply]
      pass_id:
        description: "apply only: the message ID (cmsg_...) that records the agents' pass of the hash"
        type: string
        default: ""
      check_hash:
        description: "apply only: the first 12 hex digits of the check's hash, as the pass names it"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: lab-proxmox-host
  cancel-in-progress: false
jobs:
  proxmox-host:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, central-hub-box]
    timeout-minutes: 30
    steps:
      - name: Check or apply one of the Proxmox host's playbooks
        env:
          JOB: ${{ inputs.job }}
          ACTION: ${{ inputs.action }}
          PASS_ID: ${{ inputs.pass_id }}
          CHECK_HASH: ${{ inputs.check_hash }}
        run: |
          if [ "$ACTION" = check ]; then
            /usr/local/bin/proxmox-host check "$JOB"
          else
            /usr/local/bin/proxmox-host apply "$JOB" "$PASS_ID" "$CHECK_HASH"
          fi
