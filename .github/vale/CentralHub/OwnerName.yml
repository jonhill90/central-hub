# Gate on changed files under docs/ (D-0019 check 4): records, standards, evidence files, runbooks
# and READMEs name the owner by role, "the owner", never by first name (D-0016 rule 5).
# The rule ignores case, so it also catches "jon" (it does not match the jonhill90 handle).
# AGENTS.md and CLAUDE.md name him on purpose, so vale.ini turns this rule on for docs/ only.
extends: existence
message: "First name '%s' in docs/: write 'the owner' (D-0016 rule 5)."
level: error
scope: raw
ignorecase: true
tokens:
  - '\bJon\b'
