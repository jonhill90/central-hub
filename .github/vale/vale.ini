# Word check (D-0019 check 4). Run with .github/docs-check/run.sh words.
# StylesPath is relative to this file. Run Vale with --config .github/vale/vale.ini (run.sh does).
StylesPath = .
MinAlertLevel = suggestion
Vocab = CentralHub

[*.md]
BasedOnStyles = Vale, CentralHub
# Spelling is off: 84 unknown words on main, mostly IDs and names (RB-0076).
Vale.Spelling = NO
CentralHub.OwnerName = NO

[docs/**/*.md]
CentralHub.OwnerName = YES

