<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" width="1220" height="720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img" aria-labelledby="t d">
<title id="t">How c1 keeps its data</title><desc id="d">The Proxmox VM disk is formatted ext4 and mounted on the worker VM, where each volume is a folder. In Kubernetes a pod mounts a claim; the default StorageClass local-path and the Local Path Provisioner make the folder and bind a volume to the claim. Backups of the VM and restic snapshots protect the folders.</desc>
