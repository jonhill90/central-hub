<text x="28" y="40" font-size="20" font-weight="700" style="fill:var(--ink)">How c1 keeps its data</text>
<text x="28" y="62" font-size="13" style="fill:var(--sub)">An app asks for a volume. The volume is a plain folder on the worker&#x27;s data disk. Copies are the backups.</text>
