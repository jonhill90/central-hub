<text x="28" y="40" font-size="20" font-weight="700" style="fill:var(--ink)">How Keycloak&#x27;s realms are laid out</text>
<text x="28" y="62" font-size="13" style="fill:var(--sub)">Each environment has its own Keycloak. Each has one realm for people and apps, with a client for every app.</text>
