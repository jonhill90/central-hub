<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img" aria-labelledby="t d">
<title id="t">How Keycloak&#x27;s realms are laid out</title><desc id="d">Prod&#x27;s Keycloak has a master realm for break-glass admin and the lab realm with users, the groups lab-admins and lab-viewers, and clients for Grafana, Argo CD, Jellyfin, Proxmox, OPNsense, OpenBao, the Central Hub app, Mealie and Home Assistant. Dev&#x27;s Keycloak has its own master and lab realm. Nothing is shared between them.</desc>
