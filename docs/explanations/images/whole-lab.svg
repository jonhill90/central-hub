<title id="t">Where one failure stops a lot</title><desc id="d">The same lab as connected blocks. Four parts are marked as having no second copy: 1 the one Proxmox host, 2 the worker&#x27;s data disk, 3 the backup HDD in the same machine, 4 c1&#x27;s single control plane.</desc>
