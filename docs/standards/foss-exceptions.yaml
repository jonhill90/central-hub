# Named exceptions to STD-0006. Only the owner's go, typed or a card tap, extends this list (STD-0006 rule 5).
# A pull request that adds or changes an entry is owner-only: it merges after the owner's go,
# named in the entry. The one case without the owner's go: the pull request that removes a component's
# register row, because the lab no longer runs it, also removes its entry, with the agents' pass (STD-0006 rule 5).
#
#   component   the register row's name, exactly
#   state       kept: the owner chose to keep it, for now
#               pending: it fails the test and waits for the owner's call; the check passes but reports it
#   decided     for kept: the owner's message, its time in UTC and where it was written
#   listed      for pending: when and why it was put on this list
exceptions:
  - component: OPNsense
    state: kept
    decided: the owner kept OPNsense for now, 2026-11-14 05:11:29 UTC, project chat message cmsg_01X43rfNYp4H1dL1V2dkfkwNUCNWkCsmp5t7rH58x9gsJH; its sign-in goes through a free route (D-0037)
  - component: Tailscale
    state: kept
    decided: the owner chose to keep Tailscale for now, as long as it stays swappable and nothing new depends on it in a way that can't be swapped, by a card tap on 2026-11-10 19:09 UTC, card cmsg_01X43rfNYp4H1dL1V2dkfkwN94SWGX6ssfCizqji4VUhLp; asked again before the lab is built for real
  - component: Cilium
    state: pending
    listed: 2026-11-14, from the FOSS check of every central-hub piece
  - component: Grafana, Loki and Alloy
    state: pending
    listed: 2026-11-14, from the FOSS check of every central-hub piece
  - component: nginx
    state: pending
    listed: 2026-11-14, from the FOSS check of every central-hub piece
