# Component register (STD-0006). One row per outside component the lab's code pulls in or runs on.
# The FOSS check (.github/foss-check/) fails a pull request when a source the code pulls in matches no
# row, when a row is incomplete, or when a row fails the test and has no entry in foss-exceptions.yaml.
#
# Fields:
#   name                 the component
#   kind                 software (we run it) or hosted (a service someone else runs for us)
#   used-for             what the lab uses it for
#   licence              the licence of what we run, or "closed service"
#   licence-source       the page or licence file opened for it
#   paid-edition         what a paid edition or plan holds back, or "none found" and where looked
#   paid-edition-source  the page opened for it
#   verdict              pass, fail (STD-0006 rule 1 or 2 broken) or hosted (rule 3: judged by exit path)
#   exit-path            required for hosted and fail: what we would move to, and how
#   sources              prefixes of the references the scanner prints (scan.py); a reference matches
#                        every row with a prefix it starts with
#   carries              hosted rows only: prefixes of what the service hosts for other components
#                        (release downloads, registries). A reference these match still needs a row
#                        of its own in sources, so a new download from github.com or a new docker.io
#                        image fails until its software has a row.
#   not-detected         required when sources and carries are both empty: how it is installed, and why
#                        the scanner can't see it
#   checked              the date the pages were opened
components:
  # Networking first (STD-0006 "Order").
  - name: OPNsense
    kind: software
    used-for: the lab router, firewall and lab DNS
    licence: BSD-2-Clause
    licence-source: https://raw.githubusercontent.com/opnsense/core/master/LICENSE
    paid-edition: Deciso's Business Edition has OpenID Connect sign-in and other features the community edition lacks
    paid-edition-source: https://docs.opnsense.org/vendor/deciso/oidc.html
    verdict: fail
    exit-path: a FOSS router (OpenWrt, IPFire, or Debian with nftables and Unbound); its config backup is exported daily
    sources: [collection:oxlorg.opnsense]
    checked: 2026-11-14
  - name: Unbound
    kind: software
    used-for: DNS resolver inside OPNsense
    licence: BSD-3-Clause
    licence-source: https://nlnetlabs.nl/unbound
    paid-edition: none; "All functionality is available in the open-source project"
    paid-edition-source: https://nlnetlabs.nl/unbound
    verdict: pass
    sources: []
    not-detected: part of OPNsense, installed with it
    checked: 2026-11-14
